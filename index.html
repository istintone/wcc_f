<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="wcc_f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>wcc_f</title>
<style>
/* wcc_f — 基本スタイル。スマホ縦持ち前提(上=試合映像 / 下=カード盤面) */
:root{
  --bg:#0a0d16; --surface:#0e1320; --panel:#161d2e; --line:#2a3550;
  --text:#eef1f6; --dim:#8b97b0; --accent:#f2c14e;
  --pitch1:#1f7a43; --pitch2:#1b6e3c; --chalk:rgba(255,255,255,.55);
  --gk:#d9a521; --df:#2f7fe0; --mf:#2fa866; --fw:#d8493c;
  --good:#7ee08f; --mid:#f2c14e; --bad:#ff7a6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;background:var(--surface);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* ---- スコアボード ---- */
#hud{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#hud .tm{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.06em;width:32%}
#hud .tm-a{justify-content:flex-end}
#hud .chip{width:10px;height:18px;border-radius:2px;display:block}
#hud .sc{display:flex;flex-direction:column;align-items:center;line-height:1}
#hudScore{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
#hudClock{font-size:11px;color:var(--accent);margin-top:3px;font-variant-numeric:tabular-nums}

/* ---- 試合映像 ---- */
#viewWrap{position:relative;flex:0 0 auto;width:100%;aspect-ratio:105/66;background:var(--pitch1)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:900;letter-spacing:.08em;color:#fff;pointer-events:none;opacity:0;
  text-shadow:0 3px 0 rgba(0,0,0,.45);background:rgba(0,0,0,.28);transition:opacity .18s}
#flash.on{opacity:1}

#ticker{flex:0 0 28px;line-height:28px;padding:0 12px;font-size:12.5px;color:var(--text);
  background:#0b0f1a;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker.goal{color:var(--accent);font-weight:700}

/* ---- カード盤面 ---- */
#board{position:relative;flex:1 1 auto;min-height:150px;touch-action:none;overflow:hidden;
  background:repeating-linear-gradient(90deg,var(--pitch1) 0 12.5%,var(--pitch2) 12.5% 25%)}
#boardLines{position:absolute;inset:6px;border:2px solid var(--chalk);pointer-events:none}
#boardLines::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--chalk)}
/* ペナルティエリア。位置は board.js が TUNING.rule から決める(判定と同じ値) */
.pa{position:absolute;border:2px solid var(--chalk);pointer-events:none}
#paOwn{left:6px;border-left:0;background:rgba(255,255,255,.06)}
#paOpp{right:6px;border-right:0}
#cards{position:absolute;inset:0}
#board.kpmode .cd{box-shadow:0 0 0 2px var(--accent),0 2px 5px rgba(0,0,0,.45)}
#board.kpmode{outline:2px solid var(--accent);outline-offset:-2px}
.cd{position:absolute;width:40px;height:52px;margin:-26px 0 0 -20px;border-radius:5px;
  background:var(--mf);border:1.5px solid rgba(255,255,255,.85);color:#fff;text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,.45);touch-action:none;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;will-change:left,top}
.cd.gk{background:var(--gk)} .cd.df{background:var(--df)} .cd.mf{background:var(--mf)} .cd.fw{background:var(--fw)}
.cd.drag{z-index:5;transform:scale(1.14);box-shadow:0 8px 16px rgba(0,0,0,.55)}
.cd.hasball{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 2px 5px rgba(0,0,0,.45)}
.cd.drop{box-shadow:0 0 0 3px #fff,0 2px 5px rgba(0,0,0,.45)}
.cd .rl{font-size:9.5px;font-weight:800;line-height:13px;width:100%;background:rgba(0,0,0,.42);font-style:normal}
.cd .rl.a0{color:var(--good)} .cd .rl.a1{color:var(--mid)} .cd .rl.a2{color:var(--bad)}
.cd .no{font-size:17px;font-weight:800;line-height:19px;font-style:normal}
.cd .nm{font-size:8px;line-height:10px;text-decoration:none;white-space:nowrap;max-width:38px;overflow:hidden}
.cd .stm{position:absolute;left:3px;right:3px;bottom:2px;height:5px;background:rgba(0,0,0,.45);border-radius:2px}
.cd .stm em{display:block;height:100%;background:var(--good);border-radius:2px}
.cd .stm em.low{background:var(--bad)} .cd .stm em.midv{background:var(--mid)}

/* ---- 控え ---- */
#bench{flex:0 0 60px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--panel);border-top:1px solid var(--line);touch-action:none}
#bench .cd{position:relative;margin:0;left:auto;top:auto;flex:0 0 40px}
#bench .cd.used{opacity:.25;filter:grayscale(1)}
#bench .lbl{font-size:10px;color:var(--dim);writing-mode:vertical-rl;letter-spacing:.2em}

/* ---- 盤面のカードの印 ---- */
.cd.tired{filter:saturate(.45) brightness(.82)}
.cd.tired .stm{outline:1px solid var(--bad)}
.cd .kpm{display:none;position:absolute;right:-1px;top:13px;font-size:7.5px;line-height:10px;padding:0 2px;
  background:var(--accent);color:#201400;border-radius:2px 0 0 2px}
.cd.iskp .kpm{display:block}
.cd.iskp{border-color:var(--accent)}
.cd .ycm{display:none;position:absolute;left:2px;top:15px;width:6px;height:9px;background:#ffd84a;border-radius:1px}
.cd.booked .ycm{display:block}

/* ---- カードの詳細 ---- */
/* 重ね(#ov)より上に出す。キックオフ前のダイアログが出ていても詳細とKPを触れる */
#info{position:absolute;inset:0;display:none;flex-direction:column;justify-content:space-between;
  padding:10px 12px;background:rgba(10,14,24,.96);z-index:30;font-size:12px}
#info .roles b.hi{color:var(--good)} #info .roles b.md{color:var(--mid)} #info .roles b.lo{color:var(--bad)}
#info.on{display:flex}
#info h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:6px}
#info .pos{font-size:10px;padding:2px 6px;border-radius:3px;color:#fff}
#info .pos.gk{background:var(--gk)} #info .pos.df{background:var(--df)}
#info .pos.mf{background:var(--mf)} #info .pos.fw{background:var(--fw)}
#info .kpt{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--accent);color:#201400}
#info .yct{font-size:10px;padding:2px 6px;border-radius:3px;background:#ffd84a;color:#201400}
#info .roles{color:var(--dim);margin-bottom:6px}
#info .sts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px 8px}
#info .st{display:grid;grid-template-columns:1fr;justify-items:start}
#info .st i{font-style:normal;color:var(--dim);font-size:9px;white-space:nowrap}
#info .st b{font-size:14px;font-variant-numeric:tabular-nums}
#info .st em{width:100%;height:3px;background:#263049;border-radius:2px}
#info .st u{display:block;height:100%;background:var(--accent);border-radius:2px}
#info .skl{margin-top:5px;line-height:1.4;color:var(--text)}
#info .skl b{color:var(--accent)}
#info .row{display:flex;gap:8px;justify-content:flex-end}
#info .btn{height:34px;font-size:13px}
#info .btn:disabled{opacity:.45}

/* ---- 連携の線 ---- */
#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lk{stroke:rgba(255,255,255,.55);stroke-width:1.5;stroke-linecap:round}
.lk2{stroke:rgba(255,255,255,.9);stroke-width:3}
.lk3{stroke:#f2c14e;stroke-width:4.5}

/* ---- いま有効なスタイル ---- */
#stylebar{flex:0 0 22px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:0 10px;font-size:10.5px;color:var(--dim);background:#101726;white-space:nowrap;overflow:hidden}
#stylebar span{overflow:hidden;text-overflow:ellipsis}
#stylebar #styH{color:var(--text)}
.rk{display:inline-block;min-width:14px;padding:0 3px;border-radius:3px;text-align:center;
  font-weight:800;font-size:10px;color:#101726;background:#8b97b0}
.rkB{background:#7ec8e0} .rkA{background:#f2c14e} .rkS{background:#ff8a5c}
#info .sty{margin-top:4px;line-height:1.5}
#info .sty i{font-style:normal;color:var(--dim);font-size:10.5px}
#info .sty .get{color:var(--good)} #info .sty .lose{color:var(--bad)}

/* ---- 監督の指示 ---- */
#tac{flex:0 0 46px;display:flex;gap:4px;padding:5px 10px 0;background:#0b0f1a;border-top:1px solid var(--line)}
.btn-ins{flex:1;min-width:0;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11.5px;line-height:1.15;padding:0;white-space:nowrap}
.btn-ins small{font-size:8px;color:var(--dim);font-weight:400}
.btn-ins.on{background:var(--accent);color:#201400;border-color:#fff}
.btn-ins.on small{color:#4a3600}
.btn-kp{border-color:var(--accent);color:var(--accent)}

/* ---- 操作 ---- */
#ctl{flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#0b0f1a}
.btn{height:40px;min-width:48px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:15px;font-weight:700;font-family:inherit}
.btn:active{filter:brightness(1.3)}
.btn-shoot{margin-left:auto;min-width:112px;background:#b3261e;border-color:#e2584f;letter-spacing:.1em}
.btn-shoot.armed{background:#f2c14e;color:#201400;border-color:#fff}
.btn-main{background:var(--accent);color:#201400;border:0;min-width:180px;height:46px;font-size:16px}
#subInfo{font-size:12px;color:var(--dim)}

/* ---- クラブハウス ---- */
#club{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;z-index:40;overflow-y:auto;
  -webkit-overflow-scrolling:touch;background:var(--surface);
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px)}
#club.on{display:flex}
#club .chd{display:flex;align-items:flex-end;gap:14px;padding:4px 2px 8px;border-bottom:1px solid var(--line)}
#club .chd>div:first-child{flex:1;min-width:0}
#club .chd b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#club .chd small{display:block;font-size:10.5px;color:var(--dim)}
#club .chd .num{text-align:right}
#club .chd .num b{font-size:20px;font-variant-numeric:tabular-nums}
#club .chd .num i{font-style:normal;font-size:11px;color:var(--dim)}
#club .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
#club h3{margin:0 0 8px;font-size:13px;color:var(--accent);display:flex;align-items:baseline;gap:8px}
#club h3 small{font-size:11px;color:var(--text);font-weight:400}
#club p{margin:4px 0;font-size:12.5px}
#club .dim{color:var(--dim);font-size:11.5px}
#club ul{margin:6px 0 0;padding-left:18px;font-size:12px;line-height:1.6}
#club .sc2{font-size:15px;text-align:center;margin:2px 0 4px}
#club .sc2 b{font-size:26px;font-variant-numeric:tabular-nums;margin:0 8px}
#club .opp{display:flex;gap:10px;align-items:center;margin:6px 0 10px}
#club .opp .chip{flex:0 0 12px;height:44px;border-radius:3px}
#club .opp b{display:block;font-size:17px}
#club .opp small{display:block;font-size:11px;color:var(--dim)}
#club .btn-main{display:block;width:100%;margin-top:6px}
.btn-sub{display:block;width:100%;height:36px;margin-top:8px;font-size:12.5px;font-weight:400;color:var(--dim)}
#club .tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
#club .tbl th{font-weight:400;color:var(--dim);font-size:10.5px;text-align:right;padding:2px 3px}
#club .tbl td{text-align:right;padding:4px 3px;border-top:1px solid var(--line)}
#club .tbl .nm2{text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#club .tbl tr.me td{color:var(--accent);font-weight:700}
#club .cups td:first-child{text-align:left;width:26px}
#club .cups tr.st-won td{color:var(--accent)} #club .cups tr.st-out td,#club .cups tr.st-quit td{color:var(--dim)}
#club .cups tr.st-in td{color:var(--good)}
.gr{display:inline-block;min-width:16px;padding:0 4px;margin-right:4px;border-radius:3px;text-align:center;
  font-size:10px;font-weight:800;color:#101726;background:#8b97b0}
.grC{background:#7ec8e0} .grB{background:#7ee08f} .grA{background:#f2c14e} .grS{background:#ff8a5c}
#club .cft{padding-top:4px}
#club .set .btn-sub{text-align:center}
#club .file{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
#club .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
#club .lnk{background:none;border:0;color:var(--dim);font-size:11px;text-decoration:underline;font-family:inherit}
#club .cp{width:100%;height:90px;margin-top:6px;font-size:10px;background:#0b0f1a;color:var(--text);
  border:1px solid var(--line);border-radius:6px}
/* ---- カード ---- */
#club .tabs.t5 .tab{height:32px;font-size:12px}
#club .kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.kc{position:relative;border-radius:7px;padding:4px 4px 5px;overflow:hidden;cursor:pointer;
  border:1.5px solid #9aa4b8;background:#eef1f6;color:#1a2030;line-height:1.2}
.kc .kr{font-size:8px;font-weight:800;letter-spacing:.05em;opacity:.8}
.kc .kp{position:absolute;right:3px;top:3px;font-size:8px;font-weight:800;padding:0 3px;border-radius:2px;color:#fff;background:var(--mf)}
.kc .kp.gk{background:var(--gk)} .kc .kp.df{background:var(--df)} .kc .kp.fw{background:var(--fw)}
.kc .kn{font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .kn b{margin-right:3px}
.kc .kcl{font-size:8px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .ksk{font-size:8.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .kcnt{position:absolute;right:3px;bottom:2px;font-style:normal;font-size:9px;font-weight:800}
.kc.on{box-shadow:0 0 0 2px var(--accent)}
.kc.r-B{background:#1b1f28;color:#e8ebf2;border-color:#b9c0cc}
.kc.r-K{background:linear-gradient(135deg,#2b2347,#1d3a4a 40%,#463062 70%,#1f2a4a);color:#f2eefc;border-color:#c6a8ff}
.kc.r-L{background:linear-gradient(160deg,#3a2c08,#151006 60%,#3a2c08);color:#ffe7a3;border-color:#f2c14e}
.kc.r-K .kr{color:#c6a8ff} .kc.r-L .kr{color:#f2c14e}
.kc-m{padding:8px 9px 9px}
.kc-m .kr{font-size:10px} .kc-m .kn{font-size:16px} .kc-m .kcl{font-size:10px}
.kc-m .kst{display:flex;gap:8px;margin-top:5px;font-size:9.5px;opacity:.85}
.kc-m .kst b{margin-left:2px;font-size:12px}
.kc-m .ksk{font-size:11px;margin-top:4px} .kc-m .ksy{font-size:10px;opacity:.8}
#club .pay{margin:8px 0}
#club .pay small{display:block;font-size:10.5px;color:var(--dim);margin-bottom:4px}
#club .pay .new{color:#201400;background:var(--accent);padding:0 4px;border-radius:3px;font-size:9px}
#club .kdet{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:8px 0}
#club .kdet .kst{display:none}
#club .kinfo{font-size:11px}
#club .kinfo .sts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px 8px}
#club .kinfo .st{display:grid;grid-template-columns:1fr auto;align-items:baseline}
#club .kinfo .st i{font-style:normal;color:var(--dim);font-size:9px}
#club .kinfo .st b{font-size:12px}
#club .kinfo .st em{grid-column:1/3;height:2px;background:#263049}
#club .kinfo .st u{display:block;height:100%;background:var(--accent)}
#club .kinfo p{margin:5px 0;font-size:11px}
#club .kinfo .get{color:var(--good)} #club .kinfo .lose{color:var(--bad)}
#club .hint{color:var(--accent);font-size:12px}
#club .sq tr{cursor:pointer} #club .sq tr.sel td{background:#2a2412}
#club .tend .ttl{text-align:center;margin:6px 0 10px;padding:12px 8px;border-radius:10px;
  background:linear-gradient(180deg,#2a2412,#161d2e);border:1px solid var(--accent)}
#club .tend .ttl small{display:block;font-size:10px;color:var(--dim)}
#club .tend .ttl b{display:block;font-size:26px;color:var(--accent);letter-spacing:.08em;margin:2px 0}
#club .tend .ttl i{display:block;font-style:normal;font-size:10.5px;color:var(--dim)}
#club .tend .sal{display:flex;gap:8px;margin:8px 0}
#club .tend .sal div{flex:1;text-align:center;padding:6px;border-radius:8px;background:#101726}
#club .tend .sal small{display:block;font-size:10px;color:var(--dim)}
#club .tend .sal b{font-size:18px;font-variant-numeric:tabular-nums}
#club .tend .sal i{font-style:normal;font-size:10px;color:var(--dim)}
#club .tend .sal .up{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;background:var(--good);color:#101726;font-size:9px}
#club h4{margin:10px 0 4px;font-size:12px;color:var(--accent)}
#club .fol{list-style:none;padding:0;margin:0}
#club .fol li{padding:5px 0;border-top:1px solid var(--line);font-size:12px}
#club .fol li b{margin-right:6px}
#club .fol small{color:var(--dim)}

/* ---- 育成 ---- */
#club .btn-main:disabled{opacity:.45}
#club .trs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#club .tr{display:block;text-align:left;padding:9px 10px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-family:inherit}
#club .tr b{display:block;font-size:13.5px}
#club .tr small{display:block;font-size:10px;color:var(--dim);margin-top:3px;line-height:1.4}
#club .tr.sp{border-color:var(--accent);background:#2a2412}
#club .tr.sp b{color:var(--accent)}
#club .tabs{display:flex;gap:6px;margin-bottom:8px}
#club .tabs.t4 .tab{font-size:12px}
#club .ints{display:flex;gap:6px;margin-bottom:6px}
#club .ints .tab{flex:1;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:13px;font-weight:700;font-family:inherit}
#club .ints .tab small{display:block;font-size:8.5px;color:var(--dim);font-weight:400}
#club .ints .tab.on{border-color:var(--accent);color:var(--accent)}
#club .warn{color:var(--bad)}
#club .sq .fat{font-size:10px;color:var(--dim);text-align:right}
#club .sq .age{font-size:9px;color:var(--dim)}
#club .sq .fat.warn{color:var(--bad)}
#club .tab{flex:1;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:13px;font-weight:700;font-family:inherit}
#club .tab small{display:block;font-size:9px;color:var(--dim);font-weight:400}
#club .tab.on{border-color:var(--accent);color:var(--accent)}
#club .chips{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin:6px 0}
#club .chipb{position:relative;padding:5px 2px 4px;border-radius:7px;border:1.5px solid transparent;color:#fff;
  font-size:10.5px;font-family:inherit;line-height:1.25;white-space:nowrap;overflow:hidden;background:var(--mf)}
#club .chipb.gk{background:var(--gk)} #club .chipb.df{background:var(--df)} #club .chipb.fw{background:var(--fw)}
#club .chipb i{font-style:normal;font-weight:800;margin-right:3px}
#club .chipb small{display:block;font-size:8.5px;opacity:.85}
#club .chipb.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
#club .sign{display:inline-block;margin-left:3px;padding:0 3px;border-radius:3px;font-size:9px;
  background:var(--accent);color:#201400}
#club .ask{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
#club .ask .hint{color:var(--accent)}
#club .ask .ch{display:block;width:100%;margin-top:6px;font-size:13.5px}
#club .msg{border-color:var(--accent)}
#club .sq td{padding:3px 2px;font-size:11px}
#club .sq .pos{display:inline-block;font-style:normal;font-size:9px;padding:1px 4px;border-radius:3px;color:#fff;background:var(--mf)}
#club .sq .pos.gk{background:var(--gk)} #club .sq .pos.df{background:var(--df)} #club .sq .pos.fw{background:var(--fw)}
#club .sq tr.bn td{opacity:.6}
#club .sq .st5{color:var(--accent);font-size:9.5px;letter-spacing:-1px;white-space:nowrap;text-align:left}
#club .sq .st5.sp{color:#7ec8e0}
#club .sq .st5 em{display:block;height:2px;background:#263049;margin-top:1px}
#club .sq .st5 u{display:block;height:100%;background:var(--accent)}
#club .sq .mot{font-size:10px;white-space:nowrap}
#club .mot.m1{color:var(--bad)} #club .mot.m2{color:var(--mid)} #club .mot.m3{color:var(--text)} #club .mot.m4{color:var(--good)}
#club .kpt{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--accent);color:#201400}
#club .graph div{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:6px;font-size:11px;margin:3px 0}
#club .graph em{position:relative;height:6px;background:#263049;border-radius:3px}
#club .graph em::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--dim)}
#club .graph u{position:absolute;top:0;bottom:0;background:var(--good);border-radius:3px}
#club .graph u.neg{background:var(--bad)}
#club .graph b{text-align:right;font-variant-numeric:tabular-nums}
#info .stars{font-size:10px;color:var(--accent);font-weight:400}

/* ---- 重ね ---- */
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(5,8,14,.74);z-index:20}
#ov.on{display:flex}
#ovBox{width:82%;padding:22px 18px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);text-align:center}
#ovTitle{margin:0 0 10px;font-size:22px;letter-spacing:.08em}
#ovBody{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:16px}
#ovBody b{color:var(--text);font-size:30px;display:block;margin:4px 0 8px;font-variant-numeric:tabular-nums}
#ovBody table{width:100%;border-collapse:collapse;color:var(--text);font-size:13px}
#ovBody td{padding:3px 0;font-variant-numeric:tabular-nums}
#ovBody td:nth-child(2){color:var(--dim);font-size:11px}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="tm tm-h"><i id="hudHc" class="chip"></i><b id="hudH">HOME</b></div>
    <div class="sc"><span id="hudScore">0 - 0</span><small id="hudClock">0'</small></div>
    <div class="tm tm-a"><b id="hudA">AWAY</b><i id="hudAc" class="chip"></i></div>

  <div id="viewWrap"><canvas id="view"></canvas><div id="flash"></div>
    <div id="info"><div id="infoBody"></div>
      <div class="row"><button id="infoKp" class="btn"></button><button id="infoClose" class="btn">閉じる</button></div>
    </div>
  </div>
  <div id="stylebar"><span id="styH"></span><span id="styA"></span></div>
  <div id="ticker">&nbsp;</div>
  <div id="board"><div id="boardLines"></div><div id="paOwn" class="pa"></div><div id="paOpp" class="pa"></div><svg id="links"></svg><div id="cards"></div></div>
  <div id="bench"></div>
  <div id="tac">

    <button id="btnDown" class="btn btn-ins">下げろ<small>◀ ライン</small></button>
    <button id="btnLeft" class="btn btn-ins">左サイド<small>▲ 上側</small></button>
    <button id="btnRight" class="btn btn-ins">右サイド<small>▼ 下側</small></button>

  </div>

  <div id="ov"><div id="ovBox"><h1 id="ovTitle"></h1><div id="ovBody"></div><button id="ovBtn" class="btn btn-main"></button></div></div>
</div>
<script>
"use strict";
/* =========================================================================
   wcc_f — データと数値
   確率・係数・閾値はすべて TUNING に置く(ロジックに直書きしない)。
   座標系は「自軍フレーム」: h = 0(自陣ゴール) 〜 1(敵陣ゴール) / x = 0〜100(左右)
   ========================================================================= */

const STAT_MAX=20;
const STATS=["off","def","tec","pow","spd","sta"];
const STAT_LABEL={ off:"攻撃", def:"守備", tec:"技術", pow:"パワー", spd:"スピード", sta:"スタミナ" };

const TUNING={
  // 判定の揺らぎ。攻守それぞれに独立して乗る(0.6〜1.4)
  rng:{ min:0.6, span:0.8 },
  // 時計。1ステップ = 1アクション。前後半それぞれ stepsPerHalf + アディショナル
  clock:{ stepsPerHalf:110, at1:[1,5], at2:[3,9] },
  // カードの位置 → 役割(→docs/02 §2.3)
  zone:{ dfH:0.36, fwH:0.68, wide:27, dmfH:0.47, omfH:0.58 },
  // 役割の適性。own=得意な役割 / group=同じポジション / near=隣 / far=DF↔FW / gk=GKとフィールドの取り違え
  apt:{ own:1.0, group:0.90, near:0.76, far:0.62, gk:0.35 },
  // 盤面でカードを置ける範囲
  board:{ minH:0.14, maxH:0.94, minX:5, maxX:95, gkH:0.05 },
  // GK(→docs/02 §2.3a)。ペナルティエリアの中だけ動かせる。
  //   baseH   … ゴールライン上の定位置。ここより前に出たぶんが「飛び出し」(0〜1)
  //   sweep   … 飛び出したGKが裏へのボールに対応する強さ(定位置では0)
  //   follow  … シュートの左右に対して寄るべき量 / lat・latSpan … ずれの効き
  //   rush    … 飛び出しが近距離のシュートに効く量 / lob … 遠目のシュートに弱くなる量
  //   farH〜nearH … 「遠目」と「近距離」の境
  gk:{ minH:0.03, maxH:0.15, minX:28, maxX:72, baseH:0.05,
       sweep:0.9, follow:0.5, lat:0.15, latSpan:15,
       rush:0.12, lob:0.36, farH:0.72, nearH:0.90 },
  squad:{ subMax:3 },
  // ボールの位置に合わせて隊列全体が動く量(判定と描画で同じ値を使う)
  block:{ shiftK:0.34 },
  // 競り合い(→docs/02 §2.5)
  duel:{ th:0.40, atkW:0.30, defW:0.60, pressMin:0.30,
         sigH:0.17, sigX:0.20, markSpd:0.5, goalSide:0.55, beaten:1.35,
         covSig:1.6, covBase:1.0, covK:0.20 },
  // パスの受け手
  recv:{ sigH:0.20, sigX:0.22, atk:1.2, qMin:0.45, pull:0.5 },
  // ボールの進み方
  chain:{ gainK:1.0, jit:0.25, toJit:0.06,
          strayFloor:0.15, strayFull:0.42, strayPass:1.6, deepCarry:0.35,
          spread:{ same:8, in:8, out:6, switch:8, box:9, any:0 } },
  // シュート(→docs/02 §2.6)
  shot:{ minH:0.62, forceH:0.55, base:0.03, depth:0.74, wideCut:0.6,
         dead:0.50, minRange:0.12, angle:0.45,
         thBlock:1.25, accBase:0.50, accTec:0.40, accRange:0.55,
         rangePow:1.0, gapPow:0.45, thGoal:1.13,
         rebound:0.25,
         // セットプレーからのシュート。PK は圧縮(gapPow)を掛けず、別の閾値で競る
         midH:0.80, pkAcc:0.90, thPk:0.66, hdrAcc:0.70, hdrPow:0.85, fkAcc:0.90, fkPow:1.10 },
  // 反則とセットプレー(→docs/02 §2.10)。**反則の入口は「守備側が競り勝った瞬間」だけ**
  //   foulCarry/foulPass … 止めたのが持ち運び / パスだったときに反則になる率
  //   boxCare            … エリア内では守備者が慎重になる(反則率に掛ける)
  //   yellow/red/pkCardK … 警告・一発退場の率と、PKになる反則での倍率
  //   boxH/boxX          … ペナルティエリア(この高さ以上・中央からこの幅以内)。**実寸**(奥行 16.5m/105m・
  //                        幅 40.3m/68m)。映像と盤面の線もこの値から引く
  //   setH               … これより前の反則はセットプレー。手前はその場で再開
  //   directH/directX/directP/wall … 直接狙える位置・狙う率・壁に当たる率
  //   thAerial/hdrShot   … 空中戦の閾値 / 競り勝ってそのまま撃てる率(残りはこぼれて続く)
  //   ckBlock/ckSave     … ブロック / セーブがコーナーになる率
  //   ckDuel/ckH         … この高さより深くで守備側が止めたとき、コーナーに逃げる率
  //   foulBlock          … エリア内のシュートブロックが反則(PK)になる率
  //   offBase/offSpan    … 最終ラインより前で受けたときのオフサイド率と、出すぎの幅
  rule:{ foulCarry:0.62, foulPass:0.43, boxCare:0.08,
         yellow:0.21, red:0.003, pkCardK:2.5, minPlayers:8,
         boxH:0.843, boxX:29.6, setH:0.60, pkH:0.895,
         directH:0.68, directX:26, directP:0.55, wall:0.24,
         thAerial:1.10, hdrShot:0.55, ckBlock:0.55, ckSave:0.40, ckDuel:0.40, ckH:0.85, foulBlock:0.03,
         offBase:0.22, offSpan:0.10 },
  // スタミナ(→docs/02 §2.7)
  //   perStep/perAct … 毎ステップ / プレーに関わるたびの消耗
  //   fatPow/fatK/fatMax … 消耗が能力に響く形。**減り始めは軽く、半分を切ると急に重い**
  //   tiredAt … これを切ると「足が止まった」と知らせる
  //   htRest  … ハーフタイムの回復量
  stam:{ perStep:0.0031, perAct:0.0105, staReduce:0.55, min:0.20,
         fatPow:1.5, fatK:1.3, fatMax:0.75, tiredAt:0.40, htRest:0.08,
         offBall:{ GK:0.5, CB:0.85, SB:1.2, DMF:1.1, CMF:1.15, SMF:1.25, OMF:1.0, WG:1.1, CF:0.9 },
         wear:{ off:0.5, def:0.5, tec:0.7, pow:0.3, spd:0.9, sta:0 } },
  // 相手監督(→docs/02 §2.8)。**プレイヤーと同じ「カードを動かす」しかできない**
  //   subMin/subAt/every … 交代(この分以降・このスタミナ未満・何ステップごとに見るか)
  //   atkMin/allOutMin   … 負けているとき、この分から前がかり / さらに前へ
  //   up/upLate          … 前がかりで隊列を上げる量
  //   defMin/narrow      … 勝っているとき、この分から中央を固める(左右の幅に掛ける)
  //   markH              … これより高い位置の相手を「前線」と見て最終ラインが付く
  //   markPull/markMax   … 付くときに左右へ寄る割合と上限
  //   stepH/stepX/gkStep … 1ステップに動かせる量(人の手でカードを動かす速さ)
  //   構えに合わせて**指示と KP**も変える(前がかり → ラインを上げ、allOutMin からプレスも /
  //   固める → ラインを下げる)。カードを前後に動かすのはやめ、指示で表す
  coach:{ subMin:55, subAt:0.50, every:8,
          atkMin:60, allOutMin:80,
          defMin:70, narrow:0.65,
          markH:0.62, markPull:0.4, markMax:10,
          stepH:0.012, stepX:1.5, gkStep:2.5 },
  // KP(→docs/04)。1クラブに1人。試合中も変えられる。recv = どのスタイルでも KP にボールが少し集まる
  kp:{ recv:1.25 },
  // スタイルのランク(→docs/04 §4.5)。軸の値 = その能力の上位 top 人の平均 + 連携の上乗せ
  //   th … B / A / S になる値 / k … 「得るもの」に掛かる倍率(失うものには掛からない)
  //   spStar/spEvo … KP の特殊能力の★1つごと / ★5で、軸の値に乗る量(→docs/05 §5.4)
  rank:{ top:6, th:[13.6,15.0,16.4], k:{ C:0.5, B:0.8, A:1.0, S:1.25 }, spStar:0.2, spEvo:0.5 },
  // 連携(→docs/04 §4.6)。段は 1〜3
  //   pass … 線で結ばれた2人のパスに、段ごとに乗る強さ
  //   full/rank … 盤面に居る線の段の合計がこの値で満点。満点で軸の値に rank が乗る
  link:{ pass:0.04, full:50, rank:1.0 },
  // 監督の指示(→docs/04 §4.9)
  //   line … ラインを上げる/下げるで隊列がずれる量
  //   sideOn/sideOff … 重視したサイドの選手 / 逆サイドの選手が受け手に選ばれる倍率
  //   pressHigh/pressLow/pressSta … プレス指示の守備の強さ(敵陣/自陣)とスタミナ消費
  //   lineBeaten … ラインを上げたぶん、裏を取られたときに戻れなくなる強さ
  //   lineAtk    … ラインを上げたぶん、敵陣での攻撃に人数が掛かる(下げれば減る)
  //   lineDef    … ラインを下げたぶん、自陣の守備が堅くなる(上げれば薄くなる)
  ins:{ line:0.05, lineBeaten:3, lineAtk:2.4, lineDef:1.6, sideOn:1.6, sideOff:0.6, pressHigh:1.12, pressLow:0.97, pressSta:1.12 },
  // スタイルの細かい条件
  //   lateMin … 「終盤」とみなす分 / zoneNear … エリア支配が効く、持ち場からの距離
  //   fastOwn … ロングカウンターが「自陣で奪った」とみなす高さ
  style:{ lateMin:70, zoneNear:0.20, deepH:0.75 },
  // クラブ運営(→docs/05)
  //   termLen     … 1任期の試合数
  //   tierStat    … 相手クラブの強さの段(1〜5)ごとの、能力のひな形からのずれ
  //   statNoise   … 能力のばらつき / linkBase … 連携の線の本数の下限(段のぶん増える)
  //   leagueTiers … リーグの格(1〜3)ごとの、同じリーグに入る7クラブの段
  //   promoteRank … 周の終わりにこの順位以内なら、リーグの格が上がる
  //   prize       … 賞金(億)。cup は格ごとの1勝ぶん。優勝は titleK 倍が上乗せ
  //   linkTier    … 段1つごとに増える線の本数 / tierGraph … 段ごとの戦力グラフの上乗せ(相手は育成しない代わり)
  club:{ termLen:100, tierStat:[-1.6,-0.9,-0.3,0.4,1.1], statNoise:1.2, linkBase:6, linkTier:4,
         tierGraph:[-0.3,0,0.3,0.6,0.9],
         leagueTiers:[[1,1,2,2,2,3,3],[2,2,3,3,3,4,4],[3,3,4,4,4,5,5]], promoteRank:2,
         prize:{ league:1, leagueRank:[12,7,4,2,1,0,0,0], friendly:0.3, titleK:4,
                 cup:{ E:1.5, D:2, C:3, B:5, A:7, S:10 } },
         historyMax:120 },
  // 育成(→docs/05 §5.3〜5.6)
  //   startOff/startKeep … 任期の初めは能力がこれだけ低い(育てて戻す)。startKeep 以下の能力は下げない
  //   spChance … 練習の枠が特殊練習に差し替わる率(施設レベル1つごと)
  //   ind  … 個人能力。need=★1〜4に要る経験 / awake=★4から兆しまで / train・trainFit・match=もらえる経験
  //          starUp=★1つで伸びる能力 / awakeP=フレンドリー勝利で覚醒する率 / awakeUp=2つ目・3つ目が上がる率
  //   sp   … 特殊能力。meet=ミーティングの経験 / train=特殊練習の星1つぶん / qOk・qNg=3択が合ったとき・外したときの成功率
  //          failKeep=失敗で残る経験の割合 / star5P=フレンドリー勝利で★5になる率 / buff=★1つでバフが強まる割合
  //   link … 連携。need=薄線・太線に要る経験 / match=一緒に試合に出た経験 / lounge=大成功・成功・失敗の経験
  //          pFit・pMid・pBad=3択が合う手・次点・合わない手のときの [大成功, 成功, 失敗] の率
  //          goldP=黄金線になる率(**1試合に生まれる黄金線は1本まで**)
  //   graph… 戦力グラフ。basic=基本練習 / up・upAll・down=特殊練習 / decay=練習のたびに全軸が0へ戻る割合
  //   set  … セットプレイの練習。星1つぶん / 上限(FK・CK・PK に掛かる)
  //   mot  … モチベーション(ケガ/絶不調/不調/好調/絶好調)の倍率と、上下する率
  //   int  … 練習の強度(軽め/普通/ハード)。k=経験とグラフの伸び / fat=たまる疲労
  //          matchLoad=試合に出たぶんの疲労 / recover=次の試合までに残る割合 / fatMax=上限 / tiredSign=「！」が付く疲労
  //   age  … 年齢による違い(→docs/05 §5.4)。若いほど育ちやすいが、やる気の上下が大きい
  //          band=年齢の区切り / grow=区切りごとの伸びやすさ / swing=やる気の上下の起きやすさ
  //   abil … 能力による違い。得意な2能力の平均が ref より高いほど、伸びが遅い(1ごとに k、lo〜hi に収める)
  //   comm … コミュニケーション。max=1試合の回数 / ind=個人練習の経験 / talk・talkLow=声かけで上がるやる気(落ちている選手は2段)
  grow:{ startOff:-1.4, startKeep:6, spChance:0.12,
         ind:{ need:[26,48,68,94], awake:40, train:2, trainFit:1, match:1, starUp:0.5, awakeP:0.6, awakeUp:[1,0.6,0.4] },
         sp:{ need:[12,18,24,30], awake:30, meet:8, train:1, qOk:0.85, qNg:0.35, failKeep:0.5, star5P:0.6, buff:0.05 },
         link:{ need:[10,30], match:1, lounge:[8,4,0], goldP:0.5,
                pFit:[0.60,0.35,0.05], pMid:[0.15,0.60,0.25], pBad:[0.05,0.35,0.60] },
         graph:{ basic:0.12, up:0.10, upAll:0.06, down:0.08, decay:0.985, min:-2, max:3 },
         set:{ per:0.02, max:0.2 },
         mot:{ mul:[0.80,0.92,0.97,1.02,1.06], start:3, winUp:0.35, loseDown:0.30, benchDown:0.35, drawSwing:0.15 },
         int:{ k:[0.5,1.0,1.6], fat:[0,0.02,0.05], matchLoad:0.02, recover:0.4, fatMax:0.20, tiredSign:0.04 },
         comm:{ max:3, ind:8, talk:1, talkLow:2 },
         age:{ band:[21,24,28,31], grow:[1.40,1.20,1.00,0.85,0.70], swing:[1.6,1.25,1.0,0.75,0.55] },
         abil:{ ref:14, k:0.04, lo:0.80, hi:1.20 } },

     ・ステップごとに独立したたね。指示を出しても以降の乱数列がずれない
   ========================================================================= */

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function hashStr(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rr=rng=>TUNING.rng.min+rng()*TUNING.rng.span;
const r2=v=>Math.round(v*100)/100;

/* ---------- 位置 → 役割 → 適性 ---------- */

function roleAt(h,x){
  const Z=TUNING.zone, wide=x<Z.wide||x>100-Z.wide;
  if(h<Z.dfH)return wide?"SB":"CB";
  if(h>=Z.fwH)return wide?"WG":"CF";
  if(wide)return "SMF";
  return h<Z.dmfH?"DMF":h>=Z.omfH?"OMF":"CMF";
}
function aptOf(card,role){
  const A=TUNING.apt;
  if(role==="GK"||card.pos==="GK")return (role==="GK"&&card.pos==="GK")?A.own:A.gk;
  if(card.roles.includes(role))return A.own;
  const g=GROUP_OF[role];
  if(g===card.pos)return A.group;
  const o={ DF:0, MF:1, FW:2 };
  return Math.abs(o[g]-o[card.pos])===1?A.near:A.far;
}

/* ---------- 選手・チーム ---------- */

/** カードを置ける範囲。GK はペナルティエリアの中、ほかは盤面の内側 */
function clampPos(gk,h,x){
  const B=gk?TUNING.gk:TUNING.board;
  return { h:clamp(h,B.minH,B.maxH), x:clamp(x,B.minX,B.maxX) };
}
/** GK がどれだけ前に出ているか(0=定位置 〜 1=エリアの端) */
function gkOut(gk){
  const K=TUNING.gk;
  return gk&&gk.gk?clamp((gk.h-K.baseH)/(K.maxH-K.baseH),0,1):0;
}
function placePlayer(p,h,x){
  const q=clampPos(p.gk,h,x);
  p.h=q.h; p.x=q.x;
  p.role=p.gk?"GK":roleAt(p.h,p.x);
  p.apt=aptOf(p.c,p.role);
}
/** 効果の入れ物。数値は倍率(1=何も無い)、cov と range だけ加算 */
const FX0=()=>({ chs:[], defs:[], shot:1, mid:1, aerial:1, fk:1, ck:1, pkK:1, blk:1, gk:1, pk:1,
  sweep:1, lob:1, sta:1, all:1, recv:1, recvDeep:1, zone:1, chase:1, assist:1, urge:1, vsKp:1,
  cov:0, range:0 });
function mkPlayer(card,h,x,gk){
  // fat0 = 練習の疲れ。試合をそのぶん消耗した状態で始める(→docs/05 §5.3)
  const f0=card.fat0||0;
  const p={ c:card, id:card.id, gk:!!gk, h:0, x:0, role:"", apt:1, fat:f0, stam:1-f0, yc:0,
    kp:false, fx:FX0(), fxName:undefined, lo:0, stayK:1,
    st:{ act:0, pass:0, passOk:0, duelW:0, duelL:0, shots:0, goals:0 } };
  placePlayer(p,h,x);
  p.b={ h:p.h, x:p.x };                      // 監督が戻ってくる基準の位置(相手監督だけが使う)
  return p;
}
/** 能力に掛かる修正は必ずここへ足す(全判定の単一集約点) */
function eff(p,k){
  return p.c[k]*p.apt*(1-fatOf(p.stam)*TUNING.stam.wear[k])*p.fx.all*(p.c.cond||1);
}
/** 消耗が能力に響く量(0〜fatMax)。減り始めは軽く、半分を切ると急に重くなる */
function fatOf(stam){
  const S=TUNING.stam;
  return Math.min(S.fatMax,Math.pow(1-stam,S.fatPow)*S.fatK);
}
function makeTeamDef(teamId,cpu){
  const t=TEAMS[teamId], f=FORMS[t.form];
  // 相手クラブは育成しない代わりに、強さの段に応じた戦力グラフを初めから持つ(→docs/05 §5.6)
  const tg=t.tier?TUNING.club.tierGraph[t.tier-1]:0;
  return { id:t.id, name:t.name, short:t.short, color:t.color, cpu:!!cpu,
    kp:t.kp||null, links:t.links||[],
    graph:tg?{ O:tg, D:tg, R:tg, C:tg, S:tg, P:tg }:null, setplay:0,
    xi:t.xi.map((id,i)=>({ card:CARDS[id], h:f[i][0], x:f[i][1] })),
    bench:t.bench.map(id=>CARDS[id]) };
}
function buildTeam(def,side){
  const T={ side, id:def.id, name:def.name, short:def.short, color:def.color, cpu:!!def.cpu,
    players:def.xi.map((s,i)=>mkPlayer(s.card,s.h,s.x,i===0)),
    bench:def.bench.slice(), subs:0, score:0, shootOrder:0, posture:"normal",
    kp:null, kp0:def.kp||null, links:def.links||[], graph:def.graph||null, setplay:def.setplay||0,
    ins:{ line:0, side:0, press:false },
    style:null, rank:null, axis:0, rk:0, rk0:0, fx:{}, linkSum:0, lineOff:0,
    st:{ steps:0, shots:0, onT:0, pass:0, passOk:0,
      fouls:0, yc:0, rc:0, ck:0, fk:0, pk:0, off:0 } };
  if(def.kp)setKp(T,def.kp);
  return T;
}
const outfield=T=>T.players.filter(p=>!p.gk);
const gkOf=T=>T.players.find(p=>p.gk)||T.players[0];
const playerOf=(T,id)=>T.players.find(p=>p.id===id)||null;

/* ---------- スキル・スタイル・連携(→docs/04) ---------- */

const skOf=p=>p&&p.c.skill?SKILLS[p.c.skill]:null;
const styleOfCard=c=>{ const s=c&&c.skill?SKILLS[c.skill]:null; return s?STYLES[s.style]||null:null; };
function setKp(T,id){
  if(!T.players.some(p=>p.id===id))return false;
  for(const p of T.players)p.kp=p.id===id;
  T.kp=id;
  return true;
}
/** バフ・個人スタイルを効果の入れ物へ足す。k はランクの倍率(バフは 1) */
function addFx(fx,src,k){
  if(!src)return;
  for(const key in src){
    const v=src[key];
    if(key==="ch"||key==="w"||key==="s"||key==="on"||key==="team")continue;
    if(key==="def"){ fx.defs.push({ on:src.on, k:1+(v-1)*k }); continue; }
    if(key==="cov"||key==="range"){ fx[key]+=v*k; continue; }
    fx[key]*=Math.max(0,1+(v-1)*k);
  }
  if(src.ch)fx.chs.push({ ids:src.ch, w:1+((src.w||1)-1)*k, s:1+((src.s||1)-1)*k });
}
const chW=(p,ch)=>{ let v=1; for(const e of p.fx.chs)if(e.ids.includes(ch.id))v*=e.w; return v; };
const chS=(p,ch)=>{ let v=1; for(const e of p.fx.chs)if(e.ids.includes(ch.id))v*=e.s; return v; };
const defK=(p,kind)=>{ let v=1; for(const e of p.fx.defs)if(e.on===kind)v*=e.k; return v; };

function linkLv(T,a,b){
  for(const l of T.links)if((l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a))return l[2];
  return 0;
}
/** 戦力グラフの軸の値。その能力の上位 top 人の平均(適性込み)+ 連携の上乗せ */
const AXIS_STAT={ O:c=>c.off, D:c=>c.def, R:c=>c.tec, S:c=>c.spd, P:c=>c.pow,
  C:c=>(c.def+c.spd+c.sta)/3 };
function axisVal(T,axis){
  const R=TUNING.rank, L=TUNING.link, f=AXIS_STAT[axis];
  const v=T.players.map(p=>f(p.c)*p.apt).sort((a,b)=>b-a).slice(0,R.top);
  const base=v.reduce((s,x)=>s+x,0)/(v.length||1);
  return base+Math.min(1,T.linkSum/L.full)*L.rank+(T.graph?T.graph[axis]||0:0);
}
function rankOf(v){
  const th=TUNING.rank.th;
  return v>=th[2]?"S":v>=th[1]?"A":v>=th[0]?"B":"C";
}
/** 全体スタイルの効果。**得るものにだけランクが掛かり、失うものは満額** */
function teamFx(st,rk){
  const out={};
  if(!st||st.scope!=="team")return out;
  const sc=(key,v)=>key==="push"?v*rk:typeof v==="number"?Math.max(0,1+(v-1)*rk):v;
  for(const key in st.gain){
    const v=st.gain[key];
    if(v&&typeof v==="object"){ out[key]={}; for(const k in v)out[key][k]=sc(key,v[k]); }
    else out[key]=sc(key,v);
  }
  for(const key in st.cost)out[key]=st.cost[key];
  return out;
}
/**
 * スタイル・ランク・各選手の効果を組み直す。毎ステップの頭で呼ぶ
 * (KP・交代・退場・カード移動・得点・時間のどれでも変わりうるため)。
 */
function refreshFx(M,min){
  const teams=[M.home,M.away], Y=TUNING.style;
  for(const T of teams){
    const on=new Set(T.players.map(p=>p.id));
    T.linkSum=T.links.reduce((s,l)=>s+(on.has(l[0])&&on.has(l[1])?l[2]:0),0);
    const kp=T.players.find(p=>p.kp)||null, st=kp?styleOfCard(kp.c):null;
    if(!kp)T.kp=null;
    T.style=st?SKILLS[kp.c.skill].style:null;
    // KP の特殊能力の★が、その選手のスタイルを押し上げる(★5で極まる)
    const ss=kp&&kp.c.ss||0;
    T.axis=st?axisVal(T,st.axis)+ss*TUNING.rank.spStar+(ss>=5?TUNING.rank.spEvo:0):0;
    T.rank=st?rankOf(T.axis):null;
    T.rk0=st?TUNING.rank.k[T.rank]:0;
  }
  for(const T of teams){
    const D=otherOf(M,T), st=T.style?STYLES[T.style]:null, ds=D.style?STYLES[D.style]:null;
    // 相手のアンチキープレイヤーは、こちらのスタイルの効きを落とす
    T.rk=T.rk0*(ds&&ds.scope==="team"&&ds.gain.antiRank!=null?Math.max(0,1+(ds.gain.antiRank-1)*D.rk0):1);
    T.fx=teamFx(st,T.rk);
    const lineOff=T.lineOff=T.ins.line*TUNING.ins.line+(T.fx.push||0);
    const late=T.fx.late&&(min>=Y.lateMin||T.score<D.score)?T.fx.late:1;
    const solo=st&&st.scope==="solo";
    const kp=T.players.find(p=>p.kp)||null;
    for(const p of T.players){
      const fx=FX0(), sk=skOf(p);
      addFx(fx,sk&&sk.buff,p.c.buffK||1);          // 特殊能力の★でバフが強まる
      if(T.setplay){ fx.fk*=1+T.setplay; fx.ck*=1+T.setplay; fx.pkK*=1+T.setplay; }
      if(p.kp){ fx.recv*=TUNING.kp.recv; if(solo)addFx(fx,st.fx,T.rk); }
      if(solo&&st.fx.team&&kp&&p!==kp){        // フォアザチーム: KP と線で繋がる味方
        const lv=linkLv(T,kp.id,p.id);
        if(lv)fx.all*=1+st.fx.team*lv*T.rk;
      }
      fx.all*=late;
      p.fx=fx; p.lo=lineOff;
      p.stayK=T.fx.fwStay!=null&&GROUP_OF[p.role]==="FW"?T.fx.fwStay:1;
      p.fxName=p.kp&&solo?st.name:sk?sk.label:undefined;
    }
  }
}

/* ---------- 幾何 ---------- */

/**
 * 隊列はボールに合わせて全体で動く。bh は**そのチームのフレームで見た**ボールの高さ。
 *   p.lo    … 監督の指示(ラインを上げる/下げる)とスタイル(全員攻撃)によるずれ
 *   p.stayK … 守るときに下がらない割合(ロングカウンターの前線)
 */
function blockH(p,bh){
  if(p.gk)return p.h;
  const d=(bh-0.5)*TUNING.block.shiftK;
  return clamp(p.h+(d<0?d*p.stayK:d)+p.lo,0.04,0.97);
}
const gauss2=(dh,dx,sh,sx)=>Math.exp(-(dh/sh)*(dh/sh)-(dx/sx)*(dx/sx));

function pickW(rng,list,wfn){
  if(!list.length)return null;
  let tot=0; const ws=list.map(p=>{ const w=Math.max(0,wfn(p)); tot+=w; return w; });
  if(tot<=0)return list[Math.floor(rng()*list.length)];
  let r=rng()*tot;
  for(let i=0;i<list.length;i++){ r-=ws[i]; if(r<=0)return list[i]; }
  return list[list.length-1];
}

/**
 * (h,x) は攻撃側フレーム。守備側から見ると (1-h, 100-x) にあたる。
 * 近い守備者ほど対応しやすく、遠ければ圧(prox)が掛からない。
 */
function matchupDefender(rng,h,x,D,ballH){
  // 隊列の位置は**いまボールがある高さ**で決まる(届け先ではない)。
  // だからラインが高いと、裏へのボールに戻りきれない
  const U=TUNING.duel, mh=1-h, mx=100-x, bh=1-ballH;
  // ゴール側に立っている守備者は遠くても間に合い、裏を取られた守備者は近くても届かない
  const bt=U.beaten*(D.fx.beaten||1)*(1+Math.max(0,D.lineOff)*TUNING.ins.lineBeaten);
  const dhOf=q=>{ const d=blockH(q,bh)-mh; return d<0?d*U.goalSide:d*bt; };
  // **飛び出したGKは守備者として数える**(→docs/02 §2.3a)。定位置では関与しない
  const gk=gkOf(D), sw=gkOut(gk)*TUNING.gk.sweep*gk.fx.sweep;
  const geom=q=>gauss2(dhOf(q),(q.x-mx)/100,U.sigH,U.sigX)*(q.gk?sw:1);
  const field=outfield(D), list=sw>0?field.concat(gk):field;
  const p=pickW(rng,list,q=>geom(q)*(1+eff(q,"spd")/STAT_MAX*U.markSpd));
  if(!p)return null;
  let n=0;
  for(const q of field)
    n+=gauss2(dhOf(q),(q.x-mx)/100,U.sigH*U.covSig,U.sigX*U.covSig)*q.stam*(1+q.fx.cov);
  return { p, prox:Math.min(1,geom(p)*(D.fx.pressK||1)),
    cover:1+Math.max(0,n-U.covBase)*U.covK*(D.fx.covK||1) };
}

/** 監督の指示「左/右サイド重視」が受け手に掛ける倍率。左 = x<50 */
function sideW(T,x){
  const s=T.ins.side, I=TUNING.ins;
  if(!s)return 1;
  const d=(x-50)*s;                          // 重視した側なら正
  return d>12?I.sideOn:d<-12?I.sideOff:1;
}
/** パスの受け手。行き先に近い味方ほど選ばれ、深い位置ほど決定力のある選手を探す */
function receiverAt(rng,T,D,tg,self,bh){
  const R=TUNING.recv, A=T.fx, deep=tg.h>TUNING.style.deepH;
  const geom=q=>gauss2(blockH(q,bh)-tg.h,(q.x-tg.x)/100,R.sigH,R.sigX);
  const list=outfield(T).filter(q=>q!==self);
  const p=pickW(rng,list,q=>geom(q)*(1+tg.h*eff(q,"off")/STAT_MAX*R.atk)
    *q.fx.recv*(deep?q.fx.recvDeep:1)*sideW(T,q.x)
    *(A.recvRole&&A.recvRole[q.role]||1)
    *(q.kp?(A.kpRecv||1)*(D.fx.antiRecv!=null?D.fx.antiRecv:1):1));
  if(!p)return null;
  const g=geom(p);
  return { p, q:R.qMin+(1-R.qMin)*Math.min(1,g*1.15),
    h:tg.h+(blockH(p,bh)-tg.h)*R.pull, x:tg.x+(p.x-tg.x)*R.pull };
}

function strayOf(p,h,x){
  const dh=h-blockH(p,h), dx=(x-p.x)/100;
  return Math.sqrt(dh*dh+dx*dx);
}

function pickChannel(rng,p,h,x,T,fast){
  const C=TUNING.chain, stray=strayOf(p,h,x), A=T.fx;
  return pickW(rng,CHANNELS[p.role],ch=>{
    let w=eff(p,ch.stat)*chW(p,ch);
    if(A.lane)w*=A.lane[ch.lane]||1;
    if(A.chW&&A.chW[ch.id])w*=A.chW[ch.id];
    if(A.safe)w*=Math.pow(ch.risk,A.safe);
    if(ch.to){ if(fast&&A.fastTo)w*=A.fastTo; if(A.direct)w*=A.direct; }
    if(ch.kind==="carry"){
      w*=Math.max(C.strayFloor,1-stray/C.strayFull);
      if(h>0.9)w*=C.deepCarry;
    }else w*=1+stray*C.strayPass;
    return w;
  });
}

function ballTarget(rng,h,x,ch,gainK,side){
  const C=TUNING.chain, j=()=>rng()*2-1;
  let nh=ch.gain<0?h+ch.gain:h+ch.gain*(1-h)*C.gainK*(gainK||1)*(1+j()*C.jit);
  if(ch.to)nh=Math.max(nh,ch.to*(1+j()*C.toJit));
  nh=clamp(nh,0.03,0.96);
  let nx;
  switch(ch.lane){
    case "in":     nx=x+(50-x)*0.55; break;
    // 外へ開く手は、サイド重視の指示があればそちらを向く
    case "out":    nx=side?(side<0?12:88):x<50?12:x>50?88:(rng()<0.5?12:88); break;
    case "switch": nx=clamp(100-x,15,85); break;
    case "box":    nx=50; break;
    case "any":    nx=(side?35+side*15:20)+rng()*(side?30:60); break;
    default:       nx=x;
  }
  nx=clamp(nx+j()*C.spread[ch.lane],3,97);
  return { h:nh, x:nx };
}

/* ---------- 時計 ---------- */

/**
 * 試合を作る。opts:
 *   ko  … 同点で終わったら PK 戦で決める(勝ち抜き戦)
 *   agg … 2試合制の第1試合のスコア [ホーム, アウェイ]。合計が同点なら PK 戦
 */
function createMatch(homeDef,awayDef,seed,opts){
  const K=TUNING.clock, rng=mulberry32((seed^hashStr("clock"))>>>0);
  const at=r=>r[0]+Math.floor(rng()*(r[1]-r[0]+1));
  const M={ seed:seed>>>0, ix:0, len1:K.stepsPerHalf+at(K.at1), len2:K.stepsPerHalf+at(K.at2),
    home:buildTeam(homeDef,"H"), away:buildTeam(awayDef,"A"),
    events:[], orders:{ H:[], A:[] },
    phase:"kickoff", koSide:"H", ball:null, set:null, poss:{ side:null, n:0, h0:0.5 },
    opts:opts||{}, pso:null, ht:false, over:false };
  refreshFx(M,0);
  return M;
}
const teamOf=(M,side)=>side==="H"?M.home:M.away;
const otherOf=(M,T)=>T===M.home?M.away:M.home;

function timeOf(M,ix){
  const K=TUNING.clock.stepsPerHalf;
  if(ix<M.len1){
    return ix<K?{ half:1, min:Math.floor(ix*45/K)+1, at:false }:{ half:1, min:45, at:true };
  }
  const j=ix-M.len1;
  return j<K?{ half:2, min:45+Math.floor(j*45/K)+1, at:false }:{ half:2, min:90, at:true };
}
function matchMin(M){ return M.ix?timeOf(M,Math.min(M.ix,M.len1+M.len2)-1).min:0; }

/* ---------- 指示 ---------- */

/**
 * 指示を積む。いつ呼んでもよく、次のステップの頭で効く。
 *   { type:"move", id, h, x }        カードを動かす
 *   { type:"sub", out, in }          交代(控えは出る選手の位置を引き継ぐ)
 *   { type:"kp", id }                KP を決める。**そのカードのスキルが引くスタイルが発動する**
 *   { type:"ins", line, side, press } 監督の指示(渡した項目だけ変わる)
 *                                      line: -1 下げる / 0 / +1 上げる
 *                                      side: -1 左(x<50) / 0 / +1 右
 *                                      press: true / false
 *   { type:"shoot" }                 シュートしろ(数ステップ有効)
 */
function orderMatch(M,side,order){
  const q=M.orders[side];
  if(order.type==="move"){
    const i=q.findIndex(o=>o.type==="move"&&o.id===order.id);
    if(i>=0)q.splice(i,1);
  }
  q.push(order);
}
function doSub(M,T,outId,inId,t){
  if(T.subs>=TUNING.squad.subMax)return false;
  const i=T.players.findIndex(p=>p.id===outId), j=T.bench.findIndex(c=>c.id===inId);
  if(i<0||j<0)return false;
  const out=T.players[i], np=mkPlayer(T.bench[j],out.h,out.x,out.gk);
  np.b=out.b;
  T.players[i]=np; T.bench.splice(j,1); T.subs++;
  if(out.kp)T.kp=null;                       // KP を下げると KP は居なくなる
  if(M.ball&&M.ball.holder===out)M.ball.holder=np;
  if(M.ball&&M.ball.assist===out)M.ball.assist=null;
  M.events.push({ ix:M.ix, min:t.min, half:t.half, side:T.side, type:"sub", out:outId, in:inId });
  return true;
}
function changeKp(M,T,id,t){
  if(id===T.kp||!setKp(T,id))return false;
  M.events.push({ ix:M.ix, min:t.min, half:t.half, side:T.side, type:"kp", id });
  return true;
}
function setIns(M,T,o,t){
  const n={ line:o.line!=null?clamp(Math.sign(o.line),-1,1):T.ins.line,
    side:o.side!=null?clamp(Math.sign(o.side),-1,1):T.ins.side,
    press:o.press!=null?!!o.press:T.ins.press };
  if(n.line===T.ins.line&&n.side===T.ins.side&&n.press===T.ins.press)return;
  T.ins=n;
  M.events.push({ ix:M.ix, min:t.min, half:t.half, side:T.side, type:"ins",
    line:n.line, lane:n.side, press:n.press });
}
function applyOrders(M,t){
  for(const side of ["H","A"]){
    const T=teamOf(M,side), q=M.orders[side];
    if(T.shootOrder>0)T.shootOrder--;
    for(const o of q){
      if(o.type==="move"){ const p=playerOf(T,o.id); if(p)placePlayer(p,o.h,o.x); }
      else if(o.type==="sub")doSub(M,T,o.out,o.in,t);
      else if(o.type==="shoot")T.shootOrder=3;
      else if(o.type==="ins")setIns(M,T,o,t);
      else if(o.type==="kp")changeKp(M,T,o.id,t);
    }
    q.length=0;
  }
}

/* ---------- 相手監督(→docs/02 §2.8) ---------- */

function coachStep(M,t){
  const K=TUNING.coach;
  for(const T of [M.home,M.away])if(T.cpu)coachMove(M,T,t);
  if(t.min<K.subMin||M.ix%K.every)return;
  for(const T of [M.home,M.away]){
    if(!T.cpu||T.subs>=TUNING.squad.subMax)continue;
    const tired=outfield(T).filter(p=>p.stam<K.subAt).sort((a,b)=>a.stam-b.stam)[0];
    if(!tired)continue;
    const cand=T.bench.filter(c=>c.pos===tired.c.pos)
      .sort((a,b)=>aptOf(b,tired.role)-aptOf(a,tired.role))[0];
    if(cand){ const was=tired.kp; doSub(M,T,tired.id,cand.id,t); if(was)coachKp(M,T,T.posture,t); }
  }
}
/** 適性を落とさない範囲で、基準の位置から狙いへ寄せる */
function safeTarget(p,tgt){
  const a0=aptOf(p.c,roleAt(p.b.h,p.b.x));
  for(const f of [1,0.66,0.33]){
    const q=clampPos(false,p.b.h+(tgt.h-p.b.h)*f,p.b.x+(tgt.x-p.b.x)*f);
    if(aptOf(p.c,roleAt(q.h,q.x))>=a0)return q;
  }
  return p.b;
}
/**
 * 構えに合う KP を選ぶ。**相手監督にできるのはプレイヤーと同じ「KP を替える」だけ**。
 *   前がかり → 攻撃のスタイルを持つカード / 固める → 守備のスタイルを持つカード /
 *   それ以外 → クラブの既定の KP。候補の中ではランクの高いものを取る
 */
function coachKp(M,T,mode,t){
  const want=mode==="attack"?"atk":mode==="defend"?"def":null;
  let best=null, bs=-1;
  if(!want&&T.kp0&&playerOf(T,T.kp0))best=T.kp0;
  else for(const p of T.players){
    const st=styleOfCard(p.c);
    if(!st||(want&&st.kind!==want))continue;
    const s=TUNING.rank.k[rankOf(axisVal(T,st.axis))]+(p.id===T.kp0?0.01:0)+(st.scope==="team"?0.02:0);
    if(s>bs){ bs=s; best=p.id; }
  }
  if(best)changeKp(M,T,best,t);
}
/**
 * 相手監督の1ステップ。乱数は使わない。
 *   ① 構え   負けていれば前がかり、勝っていれば固める。構えに合わせて**指示と KP**を替える
 *   ② マーク 相手の前線の左右に、最終ラインが付いていく(カードを動かす)
 *   ③ GK     ボールのある側へ寄る
 */
function coachMove(M,T,t){
  const K=TUNING.coach, D=otherOf(M,T), diff=T.score-D.score;
  const mode=diff<0&&t.min>=K.atkMin?"attack":diff>0&&t.min>=K.defMin?"defend":"normal";
  if(mode!==T.posture){
    T.posture=mode;
    M.events.push({ ix:M.ix, min:t.min, half:t.half, side:T.side, type:"posture", mode });
    coachKp(M,T,mode,t);
  }
  if(!T.kp)coachKp(M,T,mode,t);
  setIns(M,T,{ line:mode==="attack"?1:mode==="defend"?-1:0,
    press:mode==="attack"&&t.min>=K.allOutMin },t);
  const nar=mode==="defend"?K.narrow:1;
  const markX=new Map();
  const free=outfield(T).filter(p=>p.b.h<TUNING.zone.dfH);
  const fw=outfield(D).filter(q=>q.h>=K.markH).sort((a,b)=>b.h-a.h);
  for(const q of fw){
    if(!free.length)break;
    const mx=100-q.x;
    let bi=0;
    for(let i=1;i<free.length;i++)
      if(Math.abs(free[i].b.x-mx)<Math.abs(free[bi].b.x-mx))bi=i;
    const d=free.splice(bi,1)[0];
    markX.set(d,d.b.x+clamp((mx-d.b.x)*K.markPull,-K.markMax,K.markMax));
  }
  for(const p of T.players){
    if(p.gk){
      if(!M.ball)continue;
      const bx=M.ball.side===T.side?M.ball.x:100-M.ball.x;
      const tx=50+(bx-50)*TUNING.gk.follow;
      placePlayer(p,p.b.h,p.x+clamp(tx-p.x,-K.gkStep,K.gkStep));
      continue;
    }
    const s=safeTarget(p,{ h:p.b.h, x:50+((markX.has(p)?markX.get(p):p.b.x)-50)*nar });
    placePlayer(p,p.h+clamp(s.h-p.h,-K.stepH,K.stepH),p.x+clamp(s.x-p.x,-K.stepX,K.stepX));
  }
}

function refreshStamina(M,t){
  const S=TUNING.stam, I=TUNING.ins;
  for(const T of [M.home,M.away]){
    const tk=(T.fx.sta||1)*(T.ins.press?I.pressSta:1);
    for(const p of T.players){
      const mul=(1-(p.c.sta-1)/(STAT_MAX-1)*S.staReduce)*tk*p.fx.sta;
      p.fat+=S.perStep*S.offBall[p.role]*mul;
      p.stam=clamp(1-p.fat,S.min,1);
      if(!p.tired&&p.stam<S.tiredAt){           // 足が止まった(1人1回だけ知らせる)
        p.tired=true;
        M.events.push({ ix:M.ix, min:t.min, half:t.half, side:T.side, type:"tired", by:p.id });
      }
    }
  }
}
function tire(p){
  const S=TUNING.stam;
  p.fat+=S.perAct*(1-(p.c.sta-1)/(STAT_MAX-1)*S.staReduce);
  p.st.act++;
}

/* ---------- 1ステップ ---------- */

function nearestTo(T,h,x,except){
  let best=null, bd=1e9;
  for(const p of outfield(T)){
    if(p===except)continue;
    const d=(blockH(p,h)-h)*(blockH(p,h)-h)+((p.x-x)/100)*((p.x-x)/100);
    if(d<bd){ bd=d; best=p; }
  }
  return best||gkOf(T);
}
function giveBall(M,T,h,x,holder){
  M.ball={ side:T.side, h, x, holder:holder||nearestTo(T,h,x), assist:null };
}

function stepMatch(M){
  if(M.over)return [];
  const from=M.events.length, total=M.len1+M.len2;
  if(M.ix===M.len1&&!M.ht){
    M.ht=true; M.phase="kickoff"; M.koSide="A"; M.set=null;
    for(const T of [M.home,M.away])for(const p of T.players){    // ハーフタイムで少し戻る
      p.fat=Math.max(0,p.fat-TUNING.stam.htRest);
      p.stam=clamp(1-p.fat,TUNING.stam.min,1);
    }
    M.events.push({ ix:M.ix, min:45, half:1, type:"halftime", hg:M.home.score, ag:M.away.score });
    return M.events.slice(from);
  }
  if(M.ix>=total){
    M.over=true;
    const agg=M.opts.agg||[0,0];
    if(M.opts.ko&&M.home.score+agg[0]===M.away.score+agg[1])shootout(M);
    M.events.push({ ix:M.ix, min:90, half:2, type:"fulltime", hg:M.home.score, ag:M.away.score,
      pso:M.pso||undefined });
    return M.events.slice(from);
  }
  const ix=M.ix++, t=timeOf(M,ix);
  const rng=mulberry32((M.seed^hashStr("s:"+ix))>>>0);
  coachStep(M,t);
  applyOrders(M,t);
  refreshFx(M,t.min);
  refreshStamina(M,t);
  const push=e=>M.events.push(Object.assign({ ix, min:t.min, half:t.half, at:t.at },e));

  if(M.phase==="kickoff"){
    const T=teamOf(M,M.koSide);
    giveBall(M,T,0.5,50);
    M.phase="play";
    push({ side:T.side, type:"kickoff", by:M.ball.holder.id, from:[0.5,50], dest:[0.5,50] });
    return M.events.slice(from);
  }

  if(M.phase==="set"){
    takeSet(M,rng,push);
    return M.events.slice(from);
  }

  const B=M.ball, T=teamOf(M,B.side), D=otherOf(M,T), c=B.holder, h=B.h, x=B.x;
  const A=T.fx, Dt=D.fx, I=TUNING.ins, Y=TUNING.style;
  T.st.steps++;
  // 奪ってから何手目か・どこで奪ったか(カウンターが見る)
  if(M.poss.side===B.side)M.poss.n++; else M.poss={ side:B.side, n:0, h0:h };
  const fast=A.fastN!=null&&M.poss.n<A.fastN&&(A.fastZone==="own"?M.poss.h0<0.5:M.poss.h0>=0.5);
  if(!c.gk&&((T.shootOrder>0&&h>=TUNING.shot.forceH)||shotUrge(rng,h,x,c,A.urgeK))){
    T.shootOrder=0;
    shoot(M,rng,push,T,D,c,h,x,null,B.assist);
    return M.events.slice(from);
  }

  const U=TUNING.duel;
  const ch=pickChannel(rng,c,h,x,T,fast), tg=ballTarget(rng,h,x,ch,ch.to?1:A.gainK,T.ins.side);
  const rc=ch.kind==="pass"?receiverAt(rng,T,D,tg,c,h):null;
  const dest=rc?{ h:rc.h, x:rc.x }:tg;
  // 競る場所: パスは届け先(カットされる場所)、持ち運びはいま居る場所
  const cp=ch.kind==="pass"?dest:{ h, x };
  // オフサイド(→docs/02 §2.10)。相手の最終ラインより前で受けると取られる
  if(rc&&dest.h>0.5&&dest.h>h){
    const O=TUNING.rule, over=dest.h-lastLine(D,h);
    if(over>0&&rng()<O.offBase*(Dt.off||1)*(A.offRisk||1)*Math.min(1,over/O.offSpan)){
      tire(c); T.st.pass++; c.st.pass++; T.st.off++;
      push({ side:T.side, type:"offside", by:c.id, to:rc.p.id, label:ch.label, ok:false,
        from:[r2(h),r2(x)], dest:[r2(dest.h),r2(dest.x)] });
      giveBall(M,D,1-dest.h,100-dest.x);
      return M.events.slice(from);
    }
  }
  const mk=matchupDefender(rng,cp.h,cp.x,D,h);
  tire(c);
  let ok=true, ask, dsk;
  if(mk){
    tire(mk.p);
    const m=mk.p, high=h<0.5;                   // ボールがいまどちらの陣にあるかで見る
    // ---- 攻撃側に掛かるもの ----
    const cs=chS(c,ch);
    if(cs>1)ask=c.fxName;
    let tA=(A.riskK||1)*cs*(A.fastN!=null?(fast?A.fastK:A.slowK)||1:1);
    if(A.chS&&A.chW&&A.chW[ch.id])tA*=A.chS;
    if(c.kp)tA*=(A.kpS||1)*(Dt.antiDuel!=null?Dt.antiDuel:1);
    if(strayOf(c,h,x)<Y.zoneNear)tA*=c.fx.zone;
    if(!high)tA*=1+T.lineOff*I.lineAtk;         // ラインが高いほど敵陣に人数が掛かる
    if(rc){
      const lv=linkLv(T,c.id,rc.p.id);
      tA*=lv?1+TUNING.link.pass*lv*(A.linkK||1):(A.noLinkK||1);
      if(!rc.p.kp&&A.nonKpQ)tA*=A.nonKpQ;
    }
    // ---- 守備側に掛かるもの ----
    const dk=defK(m,ch.kind);
    if(dk>1)dsk=m.fxName;
    let tD=dk*(high?(Dt.highK||1)*(D.ins.press?I.pressHigh:1)*m.fx.chase
                   :(Dt.lowK||1)*(D.ins.press?I.pressLow:1));
    if(c.kp)tD*=m.fx.vsKp; else if(Dt.others)tD*=Dt.others;
    if(mk.prox>0.5)tD*=m.fx.zone;
    if(!high)tD*=1-D.lineOff*I.lineDef;         // ラインが低いほど自陣が堅い
    const aSc=(eff(c,"off")*U.atkW+eff(c,ch.stat)*(1-U.atkW))*ch.risk*(rc?rc.q:1)*tA*rr(rng);
    const dSc=(eff(m,"def")*U.defW+eff(m,ch.stat)*(1-U.defW))
      *(U.pressMin+(1-U.pressMin)*mk.prox)*mk.cover*tD*rr(rng);
    ok=aSc>dSc*U.th;
  }
  if(ch.kind==="pass"){ T.st.pass++; c.st.pass++; if(ok){ T.st.passOk++; c.st.passOk++; } }
  if(ok){ c.st.duelW++; if(mk)mk.p.st.duelL++; }
  else{ c.st.duelL++; mk.p.st.duelW++; }
  const end=ok?dest:cp;
  // **止めた瞬間だけが反則の入口**。何も起きていない所で笛は鳴らない
  let fouled=false;
  if(!ok){
    const O=TUNING.rule;
    fouled=rng()<(ch.kind==="carry"?O.foulCarry:O.foulPass)*(inBox(cp.h,cp.x)?O.boxCare:1)*(Dt.foulK||1);
  }
  push({ side:T.side, type:ch.kind, by:c.id, to:rc?rc.p.id:null, vs:mk?mk.p.id:null,
    ch:ch.id, label:ch.label, ok, role:c.role, foul:fouled||undefined,
    sk:ok?ask:undefined, dsk:ok?undefined:dsk, fast:(fast&&ok)||undefined,
    out:(!ok&&!fouled&&ch.kind==="pass"&&(end.x<8||end.x>92))||undefined,
    from:[r2(h),r2(x)], dest:[r2(end.h),r2(end.x)] });
  if(ok)M.ball={ side:T.side, h:dest.h, x:dest.x, holder:rc?rc.p:c, assist:rc?c:B.assist };
  else if(fouled)giveFoul(M,rng,push,T,D,mk.p,rc?rc.p:c,cp.h,cp.x,false);
  else if(cp.h>=TUNING.rule.ckH&&rng()<TUNING.rule.ckDuel){   // 深い位置で止めて、外へ逃げる
    M.events[M.events.length-1].ck=true;
    setPiece(M,T,"ck",0.97,cp.x<50?3:97);
  }
  else M.ball={ side:D.side, h:1-cp.h, x:100-cp.x, holder:mk.p, assist:null };
  return M.events.slice(from);
}

/* ---------- 反則とセットプレー(→docs/02 §2.10) ---------- */

const inBox=(h,x)=>h>=TUNING.rule.boxH&&Math.abs(x-50)<=TUNING.rule.boxX;

/** 相手の最終ライン(GKを除いていちばん後ろの選手)を、攻撃側フレームの高さで返す */
function lastLine(D,ballH){
  let m=1;
  for(const q of outfield(D))m=Math.min(m,blockH(q,1-ballH));
  return 1-m;
}
function spKicker(T,kind){
  const sc=kind==="pk"?p=>(eff(p,"off")*1.2+eff(p,"tec"))*p.fx.pkK
    :kind==="fk"?p=>(eff(p,"tec")*1.2+eff(p,"off")*0.8)*p.fx.fk
    :p=>(eff(p,"tec")+eff(p,"pow")*0.6)*p.fx.ck;
  let best=null, bs=-1;
  for(const p of outfield(T)){ const s=sc(p); if(s>bs){ bs=s; best=p; } }
  return best||gkOf(T);
}
function setPiece(M,T,kind,h,x){
  M.phase="set"; M.set={ kind, side:T.side, h, x };
  M.ball={ side:T.side, h, x, holder:spKicker(T,kind), assist:null };
}
/**
 * 反則。(h,x) は反則を受けた側 T のフレーム。
 * 警告2枚か一発で退場し、そのまま人数が減って試合が続く。
 */
function giveFoul(M,rng,push,T,D,fouler,victim,h,x,forcePk){
  const O=TUNING.rule, pk=forcePk||inBox(h,x), k=pk?O.pkCardK:1, r=rng();
  D.st.fouls++;
  let card=null;
  if(r<O.red*k)card="r";
  else if(r<(O.red+O.yellow)*k){ fouler.yc++; D.st.yc++; card=fouler.yc>=2?"yr":"y"; }
  if(card&&card!=="y"){
    if(fouler.gk||D.players.length<=O.minPlayers){
      if(card==="yr")fouler.yc=1;
      card=card==="yr"?"y":null;
    }else{
      D.players=D.players.filter(p=>p!==fouler); D.st.rc++;
      if(fouler.kp)D.kp=null;
    }
  }
  const set=pk?"pk":h>=O.setH?"fk":"re";
  push({ side:D.side, type:"foul", by:fouler.id, on:victim.id, card, set });
  if(set==="pk")setPiece(M,T,"pk",O.pkH,50);
  else if(set==="fk")setPiece(M,T,"fk",h,x);
  else M.ball={ side:T.side, h, x, holder:victim, assist:null };
}
function takeSet(M,rng,push){
  const O=TUNING.rule, s=M.set, T=teamOf(M,s.side), D=otherOf(M,T);
  M.set=null; M.phase="play";
  T.st.steps++;
  if(s.kind==="pk"){ T.st.pk++; return shoot(M,rng,push,T,D,spKicker(T,"pk"),O.pkH,50,"pk"); }
  if(s.kind==="fk")T.st.fk++; else T.st.ck++;
  if(s.kind==="fk"&&s.h>=O.directH&&Math.abs(s.x-50)<=O.directX&&rng()<O.directP)
    return shoot(M,rng,push,T,D,spKicker(T,"fk"),s.h,s.x,"fk");
  // ボックスへ入れる → 空中戦。高さ(pow)が主役
  const k=spKicker(T,s.kind), th=0.9, tx=50+(rng()*2-1)*10, air=T.fx.aerial||1;
  const a=pickW(rng,outfield(T).filter(q=>q!==k),q=>Math.pow((eff(q,"pow")+eff(q,"off")*0.5)*q.fx.aerial,2));
  const d=pickW(rng,outfield(D),q=>Math.pow((eff(q,"pow")+eff(q,"def")*0.5)*q.fx.aerial,2));
  tire(k); if(a)tire(a); if(d)tire(d);
  let won=false;
  if(a&&d){
    const aSc=(eff(a,"pow")*0.65+eff(a,"off")*0.35)*(0.75+eff(k,"tec")/STAT_MAX*0.5)
      *a.fx.aerial*k.fx.ck*air*rr(rng);
    const dSc=(eff(d,"pow")*0.65+eff(d,"def")*0.35)*d.fx.aerial*rr(rng);
    won=aSc>dSc*O.thAerial;
  }else won=!!a;
  push({ side:T.side, type:"cross", sp:s.kind, by:k.id, to:a?a.id:null, vs:d?d.id:null, ok:won,
    label:s.kind==="ck"?"コーナーキック":"フリーキック",
    from:[r2(s.h),r2(s.x)], dest:[th,r2(tx)] });
  if(!won){
    if(d)M.ball={ side:D.side, h:1-th, x:100-tx, holder:d, assist:null }; else giveBall(M,D,1-th,100-tx);
    return;
  }
  if(rng()<O.hdrShot)return shoot(M,rng,push,T,D,a,th,tx,"hdr",k);
  M.ball={ side:T.side, h:th-0.06, x:tx, holder:a, assist:k };   // 触っただけ。こぼれて続く
}

/* ---------- シュート ---------- */

function nearOf(h){
  const S=TUNING.shot;
  return clamp((h-S.dead)/(1-S.dead),S.minRange,1);
}
const angleOf=x=>1-Math.abs(x-50)/50*TUNING.shot.angle;

/** 深く入るほど・中央ほど・撃てる選手ほど撃ちに行く */
function shotUrge(rng,h,x,p,urgeK){
  const S=TUNING.shot, minH=S.minH-p.fx.range;
  if(h<minH)return false;
  const d=(h-minH)/(1-minH);
  const u=(S.base+d*d*S.depth)*(0.35+eff(p,"off")/STAT_MAX*0.65)
    *(1-Math.abs(x-50)/50*S.wideCut)*(urgeK||1)*p.fx.urge;
  return rng()<u;
}

/**
 * GK の立ち位置がセーブに掛かる倍率(→docs/02 §2.3a)。**定位置(中央・ライン上)で 1.0**。
 *   左右 … ボールのある側へ寄るほど強く、逆へずれるほど弱い
 *   前後 … 飛び出すと近距離のシュートに強く、遠目のシュートに弱い
 * (h,x) は撃つ側のフレーム。
 */
function gkPosK(gk,h,x){
  const K=TUNING.gk, out=gkOut(gk);
  const ideal=50+((100-x)-50)*K.follow;
  const lat=1-K.lat*(Math.abs(gk.x-ideal)-Math.abs(50-ideal))/K.latSpan;
  const close=clamp((h-K.farH)/(K.nearH-K.farH),0,1);
  return lat*(1+out*(K.rush*close-K.lob*gk.fx.lob*(1-close)));
}

/**
 * シュート。sp はセットプレーの種類(pk / fk / hdr)。流れの中なら省略。
 * assist は直前にボールを渡した選手(チャンスメイクが見る)。
 * どれも同じ経路(ブロック → 枠 → GK → こぼれ球)を通る。
 */
function shoot(M,rng,push,T,D,p,h,x,sp,assist){
  const S=TUNING.shot, O=TUNING.rule, gk=gkOf(D);
  const near=sp==="pk"?1:nearOf(h), ang=sp==="pk"?1:angleOf(x);
  tire(p); p.st.shots++; T.st.shots++;
  const ev={ side:T.side, type:"shot", by:p.id, gk:gk.id, from:[r2(h),r2(x)], vs:null, sp:sp||undefined };
  // ① ブロック(PKとヘディングには無い。FKは壁)
  if(sp==="fk"){
    if(rng()<O.wall){
      ev.res="block"; ev.wall=true; ev.dest=[r2(h+(1-h)*0.3),r2(x)];
      push(ev);
      giveBall(M,D,1-ev.dest[0],100-x);
      return;
    }
  }else if(!sp){
    const mk=matchupDefender(rng,h,x,D,h);
    if(mk){
      const aSc=(eff(p,"tec")*0.5+eff(p,"off")*0.5)*rr(rng);
      const bSc=(eff(mk.p,"def")*0.6+eff(mk.p,"pow")*0.4)*mk.prox*mk.cover
        *mk.p.fx.blk*(D.fx.blk||1)*rr(rng);
      if(bSc>aSc*S.thBlock){
        tire(mk.p);
        if(mk.p.fx.blk>1)ev.dsk=mk.p.fxName;
        ev.res="block"; ev.vs=mk.p.id; ev.dest=[r2(h+(1-h)*0.35),r2(x)];
        const r=rng();
        if(inBox(h,x)&&r<O.foulBlock){                      // 止めに行った身体の入れ方が反則
          ev.foul=true; push(ev);
          giveFoul(M,rng,push,T,D,mk.p,p,h,x,true);
        }else if(r<O.foulBlock+O.ckBlock){
          ev.ck=true; push(ev);
          setPiece(M,T,"ck",0.97,x<50?3:97);
        }else{
          push(ev);
          M.ball={ side:D.side, h:1-ev.dest[0], x:100-x, holder:mk.p, assist:null };
        }
        return;
      }
    }
  }
  // ② 枠
  const gy=50+(rng()*2-1)*7;
  const acc=sp==="pk"?S.pkAcc
    :(S.accBase+eff(p,"tec")/STAT_MAX*S.accTec)*Math.pow(near,S.accRange)*ang
      *(sp==="hdr"?S.hdrAcc:sp==="fk"?S.fkAcc:1);
  if(rng()>=acc){
    ev.res="miss"; ev.dest=[1.03,r2(50+(rng()<0.5?-1:1)*(9+rng()*8))];
    push(ev);
    giveBall(M,D,TUNING.board.gkH,50,gk);
    return;
  }
  // ③ GK
  T.st.onT++;
  const raw=sp==="hdr"?(eff(p,"pow")*0.6+eff(p,"off")*0.4)*S.hdrPow
    :sp==="fk"?(eff(p,"tec")*0.5+eff(p,"pow")*0.3+eff(p,"off")*0.2)*S.fkPow
    :eff(p,"off")*0.7+eff(p,"pow")*0.3;
  // 効果は**当てはまる場面だけ**に掛かる
  const far=!sp&&h<S.midH;
  const sk=sp==="hdr"?p.fx.aerial*(T.fx.aerial||1):sp==="fk"?p.fx.fk:sp==="pk"?p.fx.pkK
    :p.fx.shot*(far?p.fx.mid:1);
  const as=assist&&assist!==p&&!sp?assist.fx.assist:1;
  if(sk>1)ev.sk=p.fxName; else if(as>1){ ev.sk=assist.fxName; ev.ask=assist.id; }
  const sSc=raw*Math.pow(near,S.rangePow)*ang*sk*as;
  const gk1=sp==="pk"?gk.fx.pk:gk.fx.gk;
  const gSc=(eff(gk,"def")*0.65+eff(gk,"pow")*0.20+eff(gk,"tec")*0.15)*gkPosK(gk,h,x)*gk1;
  ev.dest=[1.0,r2(gy)];
  const a=rr(rng), b=rr(rng);
  const goal=sp==="pk"?sSc*a>gSc*b*S.thPk:Math.pow(sSc/gSc,S.gapPow)*a>S.thGoal*b;
  if(goal){
    T.score++; p.st.goals++;
    ev.res="goal"; ev.hg=M.home.score; ev.ag=M.away.score;
    push(ev);
    M.phase="kickoff"; M.koSide=D.side; M.ball=null;
    return;
  }
  ev.res="save";
  if(gk1>1)ev.dsk=gk.fxName;
  if(sp==="pk"){ push(ev); giveBall(M,D,TUNING.board.gkH,50,gk); return; }
  const r=rng();
  if(r<O.ckSave){                                           // 弾いてコーナー
    ev.ck=true; push(ev);
    setPiece(M,T,"ck",0.97,gy<50?3:97);
    return;
  }
  // ④ こぼれ球
  if(r<O.ckSave+S.rebound){
    const at=nearestTo(T,0.9,gy,p), df=nearestTo(D,0.1,100-gy);
    const aSc=(eff(at,"spd")*0.5+eff(at,"off")*0.5)*rr(rng);
    const dSc=(eff(df,"def")*0.5+eff(df,"spd")*0.5)*rr(rng);
    ev.reb=aSc>dSc?at.id:df.id;
    push(ev);
    if(aSc>dSc)M.ball={ side:T.side, h:0.9, x:gy, holder:at, assist:null };
    else M.ball={ side:D.side, h:0.1, x:100-gy, holder:df, assist:null };
    return;
  }
  push(ev);
  giveBall(M,D,TUNING.board.gkH,50,gk);
}

/* ---------- PK戦 ---------- */

/**
 * PK戦。5人ずつ蹴り、決まらなければ1人ずつ。**必ずどちらかが勝つ**。
 * 判定は試合中の PK と同じ式。蹴る順は「決める力」の高い順(乱数は試合のたねから)。
 */
function shootout(M){
  const P=TUNING.pso, S=TUNING.shot, rng=mulberry32((M.seed^hashStr("pso"))>>>0);
  const order=T=>outfield(T).slice().sort((a,b)=>
    (eff(b,"off")*1.2+eff(b,"tec"))*b.fx.pkK-(eff(a,"off")*1.2+eff(a,"tec"))*a.fx.pkK);
  const K={ H:order(M.home), A:order(M.away) }, sc={ H:0, A:0 }, n={ H:0, A:0 };
  const kick=side=>{
    const T=teamOf(M,side), D=otherOf(M,T), list=K[side], p=list.length?list[n[side]%list.length]:gkOf(T);
    const gk=gkOf(D);
    let ok=rng()<S.pkAcc;
    if(ok){
      const sSc=(eff(p,"off")*0.7+eff(p,"pow")*0.3)*p.fx.pkK;
      const gSc=(eff(gk,"def")*0.65+eff(gk,"pow")*0.20+eff(gk,"tec")*0.15)*gk.fx.pk;
      ok=sSc*rr(rng)>gSc*rr(rng)*S.thPk;
    }
    n[side]++; if(ok)sc[side]++;
    M.events.push({ ix:M.ix, min:90, half:2, type:"pso", side, by:p.id, gk:gk.id, ok, h:sc.H, a:sc.A });
  };
  for(let i=0;i<P.kicks;i++){
    for(const side of ["H","A"]){
      kick(side);
      // もう追いつけないなら終わり
      if(sc.H>sc.A+(P.kicks-n.A)||sc.A>sc.H+(P.kicks-n.H)){ M.pso=[sc.H,sc.A]; return; }
    }
  }
  for(let i=0;i<P.maxKicks&&sc.H===sc.A;i++){ kick("H"); kick("A"); }
  if(sc.H===sc.A)sc[rng()<0.5?"H":"A"]++;     // 打ち切り(まず起きない)
  M.pso=[sc.H,sc.A];
}

/* ---------- まとめて解く ---------- */

function finishMatch(M){
  let guard=0;
  while(!M.over&&guard++<2000)stepMatch(M);
  return M;
}
function simulateMatch(homeDef,awayDef,seed,opts){
  return finishMatch(createMatch(homeDef,awayDef,seed,opts));
}

};
const CUP_IDS=["PRE","W4","KINGS","NSC","CT","JT","ENT","CONTI","CSC","ICC"];

/** 1周 43試合の並び(本家のスケジュール)。[大会, その大会の何番目の試合か] */
const SCHED=(()=>{
  const out=[], lg=n=>{ for(let i=0;i<n;i++)out.push(["LG",out.filter(s=>s[0]==="LG").length]); };
  const cup=id=>COMPS[id].stages.forEach((_,i)=>out.push([id,i]));
  cup("PRE"); lg(2); cup("W4"); lg(2); cup("KINGS"); cup("NSC"); lg(2); cup("CT"); cup("JT"); lg(2);
  cup("ENT"); lg(2); cup("CONTI"); cup("CSC"); lg(2); cup("ICC"); lg(2);
  return out;
})();

/* ---------- 世界(相手クラブ)の生成 ---------- */

/** 役割ごとの能力のひな形 [off,def,tec,pow,spd,sta] と、付けるスキルの候補 */
const GEN_ROLE={
  GK: { st:[3,16,10,14,9,10],   pos:"GK", sk:["stopper","stopper","pkstop","sweeper","feeder"] },
  CB: { st:[6,16,10,15,11,12],  pos:"DF", sk:["leader","wall","line","cover","mark","manmark","killer","libero","tower"] },
  SB: { st:[9,13,12,10,15,15],  pos:"DF", sk:["over","over","cross","allout","dynamo"] },

};
const GEN_BENCH=["GK","CB","CMF","SMF","CF"];
const GEN_NO=[1,2,5,4,3,6,8,10,7,9,11,12,15,14,17,19];
const GEN_SYL=["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ","シ","ス","セ","ソ","タ","チ","ト","ナ","ニ",
  "ノ","ハ","ヒ","フ","ヘ","ホ","マ","ミ","ム","メ","モ","ラ","リ","ル","レ","ロ","ガ","ギ","グ","ゴ","ザ","ジ","ズ",
  "ダ","デ","ド","バ","ビ","ブ","ベ","ボ","パ","ピ","ポ","ヴァ","ヴィ","ジョ","シャ","チェ","ファ","フィ","フェ"];
const GEN_END=["","","","ス","ン","ル","ノ","ニ","ッチ","ーロ","ーニ","ソン","ック","ート"];
const GEN_CLUB=[["ノルド","NOR"],["ヴェルデ","VER"],["アウレア","AUR"],["カステル","CAS"],["リオ","RIO"],
  ["ポルト","POR"],["グラン","GRA"],["ネロ","NER"],["ビアンコ","BIA"],["エスト","EST"],["モンテ","MON"],
  ["ラーゴ","LAG"],["フェロ","FER"],["ソル","SOL"],["ルナ","LUN"],["ステラ","STE"],["マーレ","MAR"],
  ["ティエラ","TIE"],["シエロ","CIE"],["フォルテ","FOR"],["オリゾン","ORI"],["ブルーム","BLU"],["ガレオン","GAL"]];
const GEN_SUF=["FC","ユナイテッド","シティ","SC","アスレティック","ローヴァーズ"];
const GEN_COL=["#e0483a","#e08a2f","#d8c23a","#58b04a","#2fa8a0","#7a5fe0","#c94fb0","#8a8f9c","#b0522d","#3f9be0"];
const GEN_FORM=["4-3-3","4-4-2","4-2-3-1","3-5-2"];
/** 強さの段ごとのクラブ数(生成ぶん)。ロッソ・ユナイテッドは段3として別に加わる */
/** 生成する架空クラブの段。段4・5は実在の16クラブ(→pool.js) */
const GEN_TIERS=[1,1,1,1, 2,2,2,2,2,2, 3,3,3,3,3];

function genWorld(seed){
  const C=TUNING.club, rng=mulberry32((seed^hashStr("world"))>>>0);
  const pick=a=>a[Math.floor(rng()*a.length)], used=new Set(), clubs=[];
  const name=()=>{
    for(let k=0;k<50;k++){
      let s=""; const n=2+Math.floor(rng()*2);
      for(let i=0;i<n;i++)s+=pick(GEN_SYL);
      s+=pick(GEN_END);
      if(!used.has(s)){ used.add(s); return s; }
    }
    return "ナナシ"+used.size;
  };
  GEN_TIERS.forEach((tier,ci)=>{
    const id="c"+String(ci+1).padStart(2,"0"), nm=GEN_CLUB[ci], form=pick(GEN_FORM), slots=FORMS[form];
    const roles=slots.map((s,i)=>i===0?"GK":roleAt(s[0],s[1])).concat(GEN_BENCH);
    const cards=roles.map((role,i)=>{
      const g=GEN_ROLE[role], off=C.tierStat[tier-1];
      const age=18+Math.floor(rng()*17), ageOff=age<=21?-0.8:age>=31?0.4:0;
      const st=g.st.map((v,k)=>clamp(Math.round(v+(v<=6?off*0.3:off+ageOff)+(rng()*2-1)*C.statNoise),1,STAT_MAX));
      const cid=id+"p"+String(i+1).padStart(2,"0");
      const two=role==="CMF"?["CMF",rng()<0.5?"DMF":"OMF"]:role==="SMF"?["SMF","WG"]:role==="WG"?["WG","SMF"]
        :role==="OMF"?["OMF","CMF"]:role==="DMF"?["DMF","CMF"]:[role];
      CARDS[cid]={ id:cid, no:GEN_NO[i], name:name(), pos:g.pos, roles:two,
        off:st[0], def:st[1], tec:st[2], pow:st[3], spd:st[4], sta:st[5], skill:pick(g.sk), age };
      return cid;
    });
    const xi=cards.slice(0,11), links=[], nLink=C.linkBase+C.linkTier*tier;
    for(let k=0;k<nLink*3&&links.length<nLink;k++){
      const a=xi[1+Math.floor(rng()*10)], b=xi[1+Math.floor(rng()*10)];
      if(a===b||links.some(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a)))continue;
      links.push([a,b,clamp(Math.round(tier/2+rng()*1.2),1,3)]);
    }
    TEAMS[id]={ id, name:nm[0]+" "+pick(GEN_SUF), short:nm[1], color:GEN_COL[ci%GEN_COL.length], form,
      kp:xi[7+Math.floor(rng()*4)], xi, bench:cards.slice(11), links, tier };
    clubs.push(id);
  });
  TEAMS.ros.tier=3; clubs.push("ros");
  REAL_IDS.forEach(id=>clubs.push(id));       // 実在の16クラブ(段4・5)
  return { seed, clubs };
}
const tierOf=id=>TEAMS[id].tier||3;

/* ---------- セーブの形 ---------- */

function newLeague(S,W){
  const want=TUNING.club.leagueTiers[S.grade-1].slice(), rng=mulberry32((S.seed^hashStr("lg"+S.term+":"+S.cyc))>>>0);
  const pool=W.clubs.slice(), ids=[];
  for(const t of want){
    const c=pool.filter(id=>tierOf(id)===t&&!ids.includes(id));
    if(c.length)ids.push(c[Math.floor(rng()*c.length)]);
  }
  const clubs=["me"].concat(ids), table={};
  clubs.forEach(id=>table[id]={ p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 });
  return { clubs, table, done:0 };
}
function newCups(){
  const c={};
  CUP_IDS.forEach(id=>c[id]={ st:"wait", opp:[], leg:null, grp:null });
  return c;
}
function newCareer(seed){
  const S={ ver:1, seed:seed>>>0, term:1, played:0, slot:0, cyc:1, grade:1, money:0, money0:0,
    rec:{ w:0, d:0, l:0, gf:0, ga:0 }, titles:[], prev:null, league:null, cups:null,
    layout:{}, kp:TEAMS.azr.kp, last:null, termOver:false, history:[], g:newGrowth(),
    ts:newTermStats(), tend:null, career:[], salary:0, fac:1,
    sq:startSquad(), coll:newCollection() };
  const W=genWorld(S.seed);
  S.league=newLeague(S,W); S.cups=newCups();

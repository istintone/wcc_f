  --gk:#d9a521; --df:#2f7fe0; --mf:#2fa866; --fw:#d8493c;
  --good:#7ee08f; --mid:#f2c14e; --bad:#ff7a6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;background:var(--surface);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* ---- スコア帯(中継風) ---- */
#hud{flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px;
  background:linear-gradient(180deg,#1a2236,#0a0e18);border-bottom:2px solid #c9a23a;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#hud .sb{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 6px;
  background:linear-gradient(180deg,#232c44,#121827);border:1px solid #3a4562;transform:skewX(-10deg)}
#hud .sb>*{transform:skewX(10deg)}
#hud .em{display:block;width:22px;height:26px}
#hud .tn{font-size:14px;font-weight:900;font-style:italic;letter-spacing:.06em}
#hudScore{min-width:58px;text-align:center;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;
  padding:0 6px;color:#101726;background:linear-gradient(180deg,#ffe28a,#d9a52e);border-radius:2px}
#hud .clk{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;min-width:0}
#hudComp{font-size:9px;color:var(--dim);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudClock{font-size:16px;font-weight:900;font-style:italic;color:#ffe28a;font-variant-numeric:tabular-nums}

/* ---- 試合映像 ---- */
#viewWrap{position:relative;flex:0 0 auto;width:100%;height:clamp(110px,19dvh,160px);background:var(--pitch1)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.65));transition:opacity .18s}
#flash.on{opacity:1}
#flash b{font-size:58px;font-weight:900;font-style:italic;letter-spacing:.04em;line-height:1;
  background:linear-gradient(180deg,#fff 10%,#ffe28a 45%,#d9a52e 70%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55));animation:goalIn .5s cubic-bezier(.2,1.6,.4,1)}
#flash:not(.mine) b{background:linear-gradient(180deg,#fff 10%,#c9d3e6 60%,#8b97b0);-webkit-background-clip:text;background-clip:text}
#flash i{margin-top:6px;font-style:normal;font-size:20px;font-weight:900;padding:2px 14px;background:rgba(0,0,0,.6);
  border-left:4px solid #f2c14e;transform:skewX(-10deg);animation:slideIn .45s .15s both}
#flash small{margin-top:4px;font-size:11px;color:#ffe28a;letter-spacing:.2em}
@keyframes goalIn{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(-60px) skewX(-10deg);opacity:0}to{transform:skewX(-10deg);opacity:1}}

#ticker{flex:0 0 28px;line-height:28px;padding:0 12px;font-size:12.5px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,#05070d,#151c2c 70%,#0b0f1a);border-left:4px solid #c9a23a;border-bottom:1px solid #000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker.goal{color:var(--accent);font-weight:700}

/* ---- カード盤面 ---- */
/* 筐体と同じ縦向き(下=自陣・上=敵陣)。右に控えの列(→docs/07 §7.11) */
#deck{position:relative;flex:1 1 auto;min-height:220px;display:flex;align-items:stretch}
#board{position:relative;flex:1 1 auto;min-width:0;touch-action:none;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch1) 0 12.5%,var(--pitch2) 12.5% 25%)}
#boardLines{position:absolute;inset:6px;border:2px solid var(--chalk);pointer-events:none}
#boardLines::before{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px solid var(--chalk)}
/* ペナルティエリア。位置は board.js が TUNING.rule から決める(判定と同じ値) */
.pa{position:absolute;border:2px solid var(--chalk);pointer-events:none}
#paOwn{bottom:6px;border-bottom:0;background:rgba(255,255,255,.06)}
#paOpp{top:6px;border-top:0}
#cards{position:absolute;inset:0}
#board.kpmode .cd{box-shadow:0 0 0 2px var(--accent),0 2px 5px rgba(0,0,0,.45)}
#board.kpmode{outline:2px solid var(--accent);outline-offset:-2px}
.cd{position:absolute;width:40px;height:52px;margin:-26px 0 0 -20px;border-radius:5px;
  background:var(--mf);border:1.5px solid rgba(255,255,255,.85);color:#fff;text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,.45);touch-action:none;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;will-change:left,top}
.cd.gk{background:var(--gk)} .cd.df{background:var(--df)} .cd.mf{background:var(--mf)} .cd.fw{background:var(--fw)}
.cd.drag{z-index:5;transform:scale(1.14);box-shadow:0 8px 16px rgba(0,0,0,.55)}
.cd.hasball{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 2px 5px rgba(0,0,0,.45)}
.cd.drop{box-shadow:0 0 0 3px #fff,0 2px 5px rgba(0,0,0,.45)}
.cd .rl{font-size:9.5px;font-weight:800;line-height:13px;width:100%;background:rgba(0,0,0,.42);font-style:normal}
.cd .rl.a0{color:var(--good)} .cd .rl.a1{color:var(--mid)} .cd .rl.a2{color:var(--bad)}
.cd .no{font-size:17px;font-weight:800;line-height:19px;font-style:normal}
.cd .nm{font-size:8px;line-height:10px;text-decoration:none;white-space:nowrap;max-width:38px;overflow:hidden}
.cd .stm{position:absolute;left:3px;right:3px;bottom:2px;height:5px;background:rgba(0,0,0,.45);border-radius:2px}
.cd .stm em{display:block;height:100%;background:var(--good);border-radius:2px}
.cd .stm em.low{background:var(--bad)} .cd .stm em.midv{background:var(--mid)}

/* ---- 控え ---- */
#bench{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  padding:6px 0;background:var(--panel);border-left:1px solid var(--line);touch-action:none;overflow:hidden}
#bench .cd{position:relative;margin:0;left:auto;top:auto;flex:0 0 52px}
#bench .cd.used{opacity:.25;filter:grayscale(1)}
#bench .lbl{font-size:10px;color:var(--dim);letter-spacing:.2em}

/* ---- 盤面のカードの印 ---- */
.cd.tired{filter:saturate(.45) brightness(.82)}
.cd.tired .stm{outline:1px solid var(--bad)}
.cd .kpm{display:none;position:absolute;right:-1px;top:13px;font-size:7.5px;line-height:10px;padding:0 2px;
  background:var(--accent);color:#201400;border-radius:2px 0 0 2px}
.cd.iskp .kpm{display:block}
.cd.iskp{border-color:var(--accent)}
.cd .ycm{display:none;position:absolute;left:2px;top:15px;width:6px;height:9px;background:#ffd84a;border-radius:1px}
.cd.booked .ycm{display:block}

/* ---- カードの詳細 ---- */
/* 重ね(#ov)より上に出す。キックオフ前のダイアログが出ていても詳細とKPを触れる */
#info{position:absolute;inset:8px 14px;z-index:20;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:none;flex-direction:column;justify-content:space-between;
  padding:10px 12px;background:rgba(10,14,24,.96);z-index:30;font-size:12px}
#info .roles b.hi{color:var(--good)} #info .roles b.md{color:var(--mid)} #info .roles b.lo{color:var(--bad)}
#info.on{display:flex}
#info h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:6px}
#info .pos{font-size:10px;padding:2px 6px;border-radius:3px;color:#fff}
#info .pos.gk{background:var(--gk)} #info .pos.df{background:var(--df)}
#info .pos.mf{background:var(--mf)} #info .pos.fw{background:var(--fw)}
#info .kpt{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--accent);color:#201400}
#info .yct{font-size:10px;padding:2px 6px;border-radius:3px;background:#ffd84a;color:#201400}
#info .roles{color:var(--dim);margin-bottom:6px}
#info .sts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px 8px}
#info .st{display:grid;grid-template-columns:1fr;justify-items:start}
#info .st i{font-style:normal;color:var(--dim);font-size:9px;white-space:nowrap}
#info .st b{font-size:14px;font-variant-numeric:tabular-nums}
#info .st em{width:100%;height:3px;background:#263049;border-radius:2px}
#info .st u{display:block;height:100%;background:var(--accent);border-radius:2px}
#info .skl{margin-top:5px;line-height:1.4;color:var(--text)}
#info .skl b{color:var(--accent)}
#info .row{display:flex;gap:8px;justify-content:flex-end}
#info .btn{height:34px;font-size:13px}
#info .btn:disabled{opacity:.45}

/* ---- 連携の線 ---- */
#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lk{stroke:rgba(255,255,255,.55);stroke-width:1.5;stroke-linecap:round}
.lk2{stroke:rgba(255,255,255,.9);stroke-width:3}
.lk3{stroke:#f2c14e;stroke-width:4.5}

/* ---- いま有効なスタイル ---- */
#stylebar{flex:0 0 22px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:0 10px;font-size:10.5px;color:var(--dim);background:#101726;white-space:nowrap;overflow:hidden}
#stylebar span{overflow:hidden;text-overflow:ellipsis}
#stylebar #styH{color:var(--text)}
.rk{display:inline-block;min-width:14px;padding:0 3px;border-radius:3px;text-align:center;
  font-weight:800;font-size:10px;color:#101726;background:#8b97b0}
.rkB{background:#7ec8e0} .rkA{background:#f2c14e} .rkS{background:#ff8a5c}
#info .sty{margin-top:4px;line-height:1.5}
#info .sty i{font-style:normal;color:var(--dim);font-size:10.5px}
#info .sty .get{color:var(--good)} #info .sty .lose{color:var(--bad)}

/* ---- 操作の台(左に十字の戦術ボタン、右に SHOOT / KEEPER。→docs/04 §4.9b) ---- */
#pad{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;
  padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);background:#0b0f1a;border-top:1px solid var(--line)}
#pad .cross{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,30px);gap:3px}
#pad .tac{height:auto;min-width:0;padding:0;font-size:10.5px;line-height:1.1;white-space:nowrap;border-radius:6px}
#pad .tac.up{grid-area:1/2} #pad .tac.lf{grid-area:2/1} #pad .tac.md{grid-area:2/2;border-radius:50%}
#pad .tac.rt{grid-area:2/3} #pad .tac.dn{grid-area:3/2}
#pad .tac.on{background:var(--accent);color:#201400;border-color:#fff}
#pad .mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
#pad .mid .pr{display:flex;gap:4px}
#pad .mid .btn{height:30px;min-width:40px;padding:0 8px;font-size:13px}
#pad .mid .btn-kp{width:100%;max-width:92px}
#pad .act{display:flex;flex-direction:column;align-items:center;gap:6px}
.btn{height:40px;min-width:48px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:15px;font-weight:700;font-family:inherit}
.btn:active{filter:brightness(1.3)}
.btn-kp{border-color:var(--accent);color:var(--accent)}
.btn-kp.on{background:var(--accent);color:#201400}
/* 筐体の丸い大きなボタン */
.btn-shoot,.btn-keeper{width:64px;height:44px;min-width:0;padding:0;border-radius:22px;font-size:11px;letter-spacing:.08em;color:#fff}
.btn-shoot{background:#b3261e;border-color:#e2584f}
.btn-shoot.armed{background:#f2c14e;color:#201400;border-color:#fff}
.btn-keeper{background:#1d5fbf;border-color:#5a92e6}
.btn-keeper.on{background:#f2c14e;color:#201400;border-color:#fff}
.btn-main{background:var(--accent);color:#201400;border:0;min-width:180px;height:46px;font-size:16px}
#subInfo{font-size:11px;color:var(--dim)}

/* ---- クラブハウス ---- */
#club{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;z-index:40;overflow-y:auto;
  -webkit-overflow-scrolling:touch;background:var(--surface);
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px)}
#club.on{display:flex}
#club .chd{display:flex;align-items:flex-end;gap:14px;padding:4px 2px 8px;border-bottom:1px solid var(--line)}
#club .chd>div:first-child{flex:1;min-width:0}
#club .chd b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#club .chd small{display:block;font-size:10.5px;color:var(--dim)}
#club .chd .num{text-align:right}
#club .chd .num b{font-size:20px;font-variant-numeric:tabular-nums}
#club .chd .num i{font-style:normal;font-size:11px;color:var(--dim)}
#club .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
#club h3{margin:0 0 8px;font-size:13px;color:var(--accent);display:flex;align-items:baseline;gap:8px}
#club h3 small{font-size:11px;color:var(--text);font-weight:400}
#club p{margin:4px 0;font-size:12.5px}
#club .dim{color:var(--dim);font-size:11.5px}
#club ul{margin:6px 0 0;padding-left:18px;font-size:12px;line-height:1.6}
#club .sc2{font-size:15px;text-align:center;margin:2px 0 4px}
#club .sc2 b{font-size:26px;font-variant-numeric:tabular-nums;margin:0 8px}
#club .opp{display:flex;gap:10px;align-items:center;margin:6px 0 10px}
#club .opp .chip{flex:0 0 12px;height:44px;border-radius:3px}
#club .opp b{display:block;font-size:17px}
#club .opp small{display:block;font-size:11px;color:var(--dim)}
#club .btn-main{display:block;width:100%;margin-top:6px}
.btn-sub{display:block;width:100%;height:36px;margin-top:8px;font-size:12.5px;font-weight:400;color:var(--dim)}
#club .tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
#club .tbl th{font-weight:400;color:var(--dim);font-size:10.5px;text-align:right;padding:2px 3px}
#club .tbl td{text-align:right;padding:4px 3px;border-top:1px solid var(--line)}
#club .tbl .nm2{text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#club .tbl tr.me td{color:var(--accent);font-weight:700}
#club .cups td:first-child{text-align:left;width:26px}
#club .cups tr.st-won td{color:var(--accent)} #club .cups tr.st-out td,#club .cups tr.st-quit td{color:var(--dim)}
#club .cups tr.st-in td{color:var(--good)}
.gr{display:inline-block;min-width:16px;padding:0 4px;margin-right:4px;border-radius:3px;text-align:center;
  font-size:10px;font-weight:800;color:#101726;background:#8b97b0}
.grC{background:#7ec8e0} .grB{background:#7ee08f} .grA{background:#f2c14e} .grS{background:#ff8a5c}
#club .cft{padding-top:4px}
#club .set .btn-sub{text-align:center}
#club .file{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
#club .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
#club .lnk{background:none;border:0;color:var(--dim);font-size:11px;text-decoration:underline;font-family:inherit}
#club .cp{width:100%;height:90px;margin-top:6px;font-size:10px;background:#0b0f1a;color:var(--text);
  border:1px solid var(--line);border-radius:6px}
/* ---- カード ---- */
#club .tabs.t5 .tab{height:32px;font-size:12px}
#club .kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.kc{position:relative;border-radius:7px;padding:4px 4px 5px;overflow:hidden;cursor:pointer;
  border:1.5px solid #9aa4b8;background:#eef1f6;color:#1a2030;line-height:1.2}
.kc .kr{font-size:8px;font-weight:800;letter-spacing:.05em;opacity:.8}
.kc .kp{position:absolute;right:3px;top:3px;font-size:8px;font-weight:800;padding:0 3px;border-radius:2px;color:#fff;background:var(--mf)}
.kc .kp.gk{background:var(--gk)} .kc .kp.df{background:var(--df)} .kc .kp.fw{background:var(--fw)}
.kc .kn{font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .kn b{margin-right:3px}
.kc .kcl{font-size:8px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .ksk{font-size:8.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .kcnt{position:absolute;right:3px;bottom:2px;font-style:normal;font-size:9px;font-weight:800}
.kc.on{box-shadow:0 0 0 2px var(--accent)}
.kc.r-B{background:#1b1f28;color:#e8ebf2;border-color:#b9c0cc}
.kc.r-K{background:linear-gradient(135deg,#2b2347,#1d3a4a 40%,#463062 70%,#1f2a4a);color:#f2eefc;border-color:#c6a8ff}
.kc.r-L{background:linear-gradient(160deg,#3a2c08,#151006 60%,#3a2c08);color:#ffe7a3;border-color:#f2c14e}
.kc.r-K .kr{color:#c6a8ff} .kc.r-L .kr{color:#f2c14e}
.kc-m{padding:8px 9px 9px}
.kc-m .kr{font-size:10px} .kc-m .kn{font-size:16px} .kc-m .kcl{font-size:10px}
.kc-m .kst{display:flex;gap:8px;margin-top:5px;font-size:9.5px;opacity:.85}
.kc-m .kst b{margin-left:2px;font-size:12px}
.kc-m .ksk{font-size:11px;margin-top:4px} .kc-m .ksy{font-size:10px;opacity:.8}
#club .pay{margin:8px 0}
#club .pay small{display:block;font-size:10.5px;color:var(--dim);margin-bottom:4px}
#club .pay .new{color:#201400;background:var(--accent);padding:0 4px;border-radius:3px;font-size:9px}
#club .kdet{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:8px 0}
#club .kdet .kst{display:none}
#club .kinfo{font-size:11px}
#club .kinfo .sts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px 8px}
#club .kinfo .st{display:grid;grid-template-columns:1fr auto;align-items:baseline}
#club .kinfo .st i{font-style:normal;color:var(--dim);font-size:9px}
#club .kinfo .st b{font-size:12px}
#club .kinfo .st em{grid-column:1/3;height:2px;background:#263049}
#club .kinfo .st u{display:block;height:100%;background:var(--accent)}
#club .kinfo p{margin:5px 0;font-size:11px}
#club .kinfo .get{color:var(--good)} #club .kinfo .lose{color:var(--bad)}
#club .hint{color:var(--accent);font-size:12px}
#club .sq tr{cursor:pointer} #club .sq tr.sel td{background:#2a2412}
#club .tend .ttl{text-align:center;margin:6px 0 10px;padding:12px 8px;border-radius:10px;
  background:linear-gradient(180deg,#2a2412,#161d2e);border:1px solid var(--accent)}
#club .tend .ttl small{display:block;font-size:10px;color:var(--dim)}
#club .tend .ttl b{display:block;font-size:26px;color:var(--accent);letter-spacing:.08em;margin:2px 0}
#club .tend .ttl i{display:block;font-style:normal;font-size:10.5px;color:var(--dim)}
#club .tend .sal{display:flex;gap:8px;margin:8px 0}
#club .tend .sal div{flex:1;text-align:center;padding:6px;border-radius:8px;background:#101726}
#club .tend .sal small{display:block;font-size:10px;color:var(--dim)}
#club .tend .sal b{font-size:18px;font-variant-numeric:tabular-nums}
#club .tend .sal i{font-style:normal;font-size:10px;color:var(--dim)}
#club .tend .sal .up{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;background:var(--good);color:#101726;font-size:9px}
#club h4{margin:10px 0 4px;font-size:12px;color:var(--accent)}
#club .fol{list-style:none;padding:0;margin:0}
#club .fol li{padding:5px 0;border-top:1px solid var(--line);font-size:12px}
#club .fol li b{margin-right:6px}
#club .fol small{color:var(--dim)}

/* ---- 育成 ---- */

#club .tr small{display:block;font-size:10px;color:var(--dim);margin-top:3px;line-height:1.4}

#club .tabs{display:flex;gap:6px;margin-bottom:8px}
#club .tabs.t4 .tab{font-size:12px}
#club .ints{display:flex;gap:6px;margin-bottom:6px}
#club .ints .tab{flex:1;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:13px;font-weight:700;font-family:inherit}
#club .ints .tab small{display:block;font-size:8.5px;color:var(--dim);font-weight:400}
#club .ints .tab.on{border-color:var(--accent);color:var(--accent)}
#club .warn{color:var(--bad)}
#club .sq .fat{font-size:10px;color:var(--dim);text-align:right}
#club .sq .age{font-size:9px;color:var(--dim)}
#club .sq .fat.warn{color:var(--bad)}
#club .tab{flex:1;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:13px;font-weight:700;font-family:inherit}
#club .tab small{display:block;font-size:9px;color:var(--dim);font-weight:400}
#club .tab.on{border-color:var(--accent);color:var(--accent)}
#club .chips{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin:6px 0}
#club .chipb{position:relative;padding:5px 2px 4px;border-radius:7px;border:1.5px solid transparent;color:#fff;

#club .chipb i{font-style:normal;font-weight:800;margin-right:3px}
#club .chipb small{display:block;font-size:8.5px;opacity:.85}
#club .chipb.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
#club .sign{display:inline-block;margin-left:3px;padding:0 3px;border-radius:3px;font-size:9px;
  background:var(--accent);color:#201400}
#club .ask{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
#club .ask .hint{color:var(--accent)}
#club .ask .ch{display:block;width:100%;margin-top:6px;font-size:13.5px}
#club .msg{border-color:var(--accent)}
#club .sq td{padding:3px 2px;font-size:11px}
#club .sq .pos{display:inline-block;font-style:normal;font-size:9px;padding:1px 4px;border-radius:3px;color:#fff;background:var(--mf)}
#club .sq .pos.gk{background:var(--gk)} #club .sq .pos.df{background:var(--df)} #club .sq .pos.fw{background:var(--fw)}
#club .sq tr.bn td{opacity:.6}
#club .sq .st5{color:var(--accent);font-size:9.5px;letter-spacing:-1px;white-space:nowrap;text-align:left}
#club .sq .st5.sp{color:#7ec8e0}
#club .sq .st5 em{display:block;height:2px;background:#263049;margin-top:1px}
#club .sq .st5 u{display:block;height:100%;background:var(--accent)}

#club .graph div{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:6px;font-size:11px;margin:3px 0}

#club .graph em::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--dim)}

#ovBody td{padding:3px 0;font-variant-numeric:tabular-nums}
#ovBody td:nth-child(2){color:var(--dim);font-size:11px}

/* =========================================================================
   筐体らしさ(→docs/07)
   ========================================================================= */
/* ---- 筐体のボタン(盛り上がり、押すと沈む) ---- */
#pad .tac{background:linear-gradient(180deg,#2c3754,#141b2b);border:1px solid #46557a;
  box-shadow:0 3px 0 #05070d,inset 0 1px 0 rgba(255,255,255,.18);transition:transform .05s}
#pad .tac:active{transform:translateY(2px);box-shadow:0 1px 0 #05070d,inset 0 1px 0 rgba(255,255,255,.1)}
#pad .tac.on{background:linear-gradient(180deg,#ffe28a,#d9a52e);box-shadow:0 3px 0 #6e4f0e,0 0 12px rgba(242,193,78,.6)}
.btn-shoot{background:radial-gradient(circle at 50% 35%,#ff6a5c,#b3261e 60%,#7a1712);border:2px solid #ff9a8f;
  border-radius:24px;box-shadow:0 4px 0 #4a0c09,0 0 14px rgba(255,80,60,.45);font-style:italic;font-weight:900}
.btn-shoot:active{transform:translateY(3px);box-shadow:0 1px 0 #4a0c09}
#ovBox{background:linear-gradient(180deg,rgba(30,38,60,.96),rgba(12,16,28,.96));border:1px solid #46557a;
  border-top:3px solid #c9a23a;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#ovTitle{font-style:italic;font-weight:900;font-size:26px;background:linear-gradient(180deg,#fff,#ffe28a 60%,#d9a52e);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ---- 場面の層 ---- */
#scene{position:absolute;inset:0;z-index:60;display:none;overflow:hidden;color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#scene.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
#scene .wipe{position:absolute;top:-10%;bottom:-10%;left:0;width:140%;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,transparent,#c9a23a 20%,#ffe28a 50%,#c9a23a 80%,transparent);
  transform:translateX(-140%) skewX(-18deg);animation:wipe .55s ease-in forwards}
@keyframes wipe{to{transform:translateX(120%) skewX(-18deg)}}
#scene .touch{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);font-size:15px;font-weight:900;
  font-style:italic;letter-spacing:.3em;color:#ffe28a;animation:blink 1.1s infinite}
#scene .touch.sm{font-size:11px;bottom:calc(env(safe-area-inset-bottom) + 12px)}
@keyframes blink{50%{opacity:.25}}

/* タイトル */
.sc-title{background:radial-gradient(ellipse at 50% 28%,#1f4a86 0%,#0b1430 50%,#04060c 100%)}
.sc-title .beams{position:absolute;inset:0;pointer-events:none}
.sc-title .beams i{position:absolute;top:-20%;width:16%;height:90%;opacity:.16;transform-origin:50% 0;
  background:linear-gradient(180deg,#fff,transparent);animation:sway 6s ease-in-out infinite alternate}
.sc-title .beams i:nth-child(1){left:6%;transform:rotate(-24deg)} .sc-title .beams i:nth-child(2){left:30%;transform:rotate(-8deg);animation-delay:-2s}
.sc-title .beams i:nth-child(3){left:54%;transform:rotate(8deg);animation-delay:-4s} .sc-title .beams i:nth-child(4){left:78%;transform:rotate(24deg);animation-delay:-1s}
@keyframes sway{from{margin-left:-4%}to{margin-left:4%}}
.sc-title .logo{text-align:center;margin-top:-60px;animation:logoIn .9s cubic-bezier(.2,1.4,.4,1) .2s both}
.sc-title .logo b{display:block;font-size:76px;font-weight:900;font-style:italic;letter-spacing:-.02em;line-height:1;
  background:linear-gradient(180deg,#fff 5%,#ffe28a 45%,#c9902a 70%,#fff3c4 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(242,193,78,.35))}
.sc-title .logo b span{color:#5fd3ff;-webkit-text-fill-color:#5fd3ff}
.sc-title .logo small{display:block;margin-top:8px;font-size:12px;font-weight:900;letter-spacing:.45em;color:#bcd2f2}
@keyframes logoIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.sc-title .club{display:flex;align-items:center;gap:10px;margin-top:40px;padding:8px 16px;background:rgba(0,0,0,.45);
  border:1px solid rgba(242,193,78,.4);transform:skewX(-8deg)}
.sc-title .club>*{transform:skewX(8deg)}
.sc-title .club b{display:block;font-size:16px;font-style:italic} .sc-title .club small{font-size:11px;color:#bcd2f2}
.sc-title .snd{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 10px);background:rgba(0,0,0,.45);
  border:1px solid #46557a;color:#fff;border-radius:16px;padding:5px 10px;font-size:11px}

/* 対戦カード */
.sc-vs{justify-content:space-between!important;padding-top:calc(env(safe-area-inset-top) + 8px)!important;
  background:linear-gradient(160deg,#141c30 0%,#0a0f1c 50%,#141c30 100%)}
.vs-band{width:100%;text-align:center;padding:8px 0;background:linear-gradient(90deg,transparent,rgba(201,162,58,.25),transparent);
  border-top:1px solid #c9a23a;border-bottom:1px solid #c9a23a;animation:fadeIn .4s .3s both}
.vs-band i{font-style:normal;font-size:11px;color:#bcd2f2;margin-right:8px}
.vs-band b{font-size:17px;font-style:italic;font-weight:900;color:#ffe28a} .vs-band em{font-style:normal;font-size:12px;margin-left:8px}
.vs-side{width:100%;display:flex;align-items:center;gap:14px;padding:14px 14px;position:relative;
  background:linear-gradient(90deg,var(--tc),transparent 85%);clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}
.vs-side.away{flex-direction:row-reverse;text-align:right;background:linear-gradient(270deg,var(--tc),transparent 85%);
  clip-path:polygon(6% 0,100% 0,100% 100%,0 100%)}
.vs-side.home{animation:fromL .5s .45s cubic-bezier(.2,1.2,.4,1) both} .vs-side.away{animation:fromR .5s .75s cubic-bezier(.2,1.2,.4,1) both}
@keyframes fromL{from{transform:translateX(-110%)}to{transform:none}} @keyframes fromR{from{transform:translateX(110%)}to{transform:none}}
.vs-em{filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.vs-info{flex:1;min-width:0}
.vs-info>b{display:block;font-size:20px;font-weight:900;font-style:italic;text-shadow:0 2px 0 rgba(0,0,0,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-info>small{display:block;font-size:11px;color:#ffe28a}
.vs-kp{margin-top:4px;font-size:12px;font-weight:700}
.vs-kp i{font-style:normal;font-size:9px;font-weight:900;padding:0 4px;margin-right:5px;background:#f2c14e;color:#201400}
.vs-kp em{display:block;font-style:normal;font-size:10px;color:#bcd2f2}
.ax{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;margin-top:6px}
.ax span{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:3px;font-size:9px}
.ax i{font-style:normal;color:#bcd2f2} .ax em{height:4px;background:rgba(0,0,0,.45)}
.ax u{display:block;height:100%;background:linear-gradient(90deg,#5fd3ff,#ffe28a)}
.vs-side.away .ax span{grid-template-columns:1fr 22px} .vs-side.away .ax i{order:2} .vs-side.away .ax em{transform:scaleX(-1)}
.vs-mark{font-size:84px;font-weight:900;font-style:italic;line-height:1;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff,#ffe28a 50%,#d9a52e);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 rgba(0,0,0,.6));animation:vsIn .5s 1.1s cubic-bezier(.2,1.8,.4,1) both}
@keyframes vsIn{from{transform:scale(3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.vs-note{font-size:12px;color:#ffe28a;margin-bottom:28px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 結果 */
.sc-res{gap:10px;justify-content:flex-start!important;padding-top:calc(env(safe-area-inset-top) + 36px)!important}
.sc-res.r-win{background:radial-gradient(ellipse at 50% 20%,#7a5a12 0%,#2a1f08 45%,#07080c 100%)}
.sc-res.r-draw{background:radial-gradient(ellipse at 50% 20%,#24406b 0%,#0f1a2e 50%,#05070d 100%)}
.sc-res.r-lose{background:radial-gradient(ellipse at 50% 20%,#4a1414 0%,#1a0a0c 50%,#05070d 100%)}
.res-word{font-size:92px;font-weight:900;font-style:italic;line-height:1;letter-spacing:-.03em;
  background:linear-gradient(180deg,#fff 10%,#ffe28a 50%,#c9902a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.6));animation:vsIn .6s .35s cubic-bezier(.2,1.6,.4,1) both}

.r-draw .res-word{background:linear-gradient(180deg,#fff,#bfe6ff 55%,#5fa6d9);-webkit-background-clip:text;background-clip:text}
.res-score{display:flex;align-items:center;gap:16px;animation:fadeIn .4s .7s both}
.res-score .rs{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-style:italic;font-weight:900}
.res-score .rn{display:flex;align-items:center;gap:10px;font-size:54px;font-weight:900;font-variant-numeric:tabular-nums}
.res-score .rn i{font-style:normal;color:rgba(255,255,255,.5)}
.res-pso{font-size:14px;font-weight:900;color:#ffe28a}
.res-goals{display:flex;gap:24px;width:100%;justify-content:center;font-size:12px;animation:fadeIn .4s 1s both}
.res-goals ul{list-style:none;margin:0;padding:0;min-width:120px} .res-goals ul.a{text-align:right}
.res-goals li i{font-style:normal;color:#ffe28a;margin-right:6px}
.res-mvp{display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(0,0,0,.45);border:1px solid #c9a23a;
  transform:skewX(-10deg);animation:fadeIn .4s 1.2s both}
.res-mvp>*{transform:skewX(10deg)}
.res-mvp i{font-style:normal;font-size:11px;font-weight:900;color:#201400;background:#f2c14e;padding:0 6px}
.res-mvp b{font-size:16px;font-style:italic} .res-mvp small{font-size:10px;color:#bcd2f2}
.res-lines{list-style:none;margin:6px 0 0;padding:8px 12px;width:100%;max-height:34%;overflow:auto;
  background:rgba(0,0,0,.4);border-left:3px solid #c9a23a;font-size:12px;line-height:1.7}
.res-lines li{animation:fadeIn .35s both} .res-lines li.hi{color:#ffe28a;font-weight:900}

/* カード排出 */
.sc-card{background:radial-gradient(ellipse at 50% 45%,#22304e 0%,#0b1020 55%,#030408 100%)}
.pk-head{text-align:center;margin-bottom:14px}
.pk-head b{display:block;font-size:30px;font-weight:900;font-style:italic;letter-spacing:.2em;color:#ffe28a}
.pk-head small{font-size:11px;color:#bcd2f2}
.pk-slot{position:relative;width:210px;height:300px;perspective:900px}
.pk-card{position:relative;width:100%;height:100%;cursor:pointer;z-index:2;animation:cardOut .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes cardOut{from{transform:translateY(80px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.pk-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.3,.5,1)}
.pk-card.open .pk-in{transform:rotateY(180deg)}
.pk-back,.pk-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden}

.pk-back i{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 45%,transparent 60%);

.pk-front{transform:rotateY(180deg)}
.pk-front .kc{position:absolute;inset:0;border-radius:12px;padding:16px 14px;display:flex;flex-direction:column;justify-content:flex-end}
.pk-front .kc .kr{position:absolute;top:12px;left:14px;font-size:13px}
.pk-front .kc .kp{top:12px;right:12px;font-size:12px;padding:1px 6px}
.pk-front .kc .kn{font-size:22px} .pk-front .kc .kcl{font-size:11px}
.pk-front .kc .kst{font-size:11px} .pk-front .kc .kst b{font-size:15px}
.pk-front .kc::before{content:"";position:absolute;left:50%;top:22%;width:46%;height:42%;transform:translateX(-50%);
  border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22) 0 22%,transparent 23%),
  radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.16) 0 55%,transparent 56%)}
.glow-K .pk-front .kc{background:linear-gradient(120deg,#2b2347,#1d3a4a,#463062,#1d4a3a,#2b2347);background-size:300% 300%;
  animation:holo 2.4s linear infinite;box-shadow:0 0 30px rgba(198,168,255,.6)}
@keyframes holo{to{background-position:300% 0}}
.glow-L .pk-front .kc{box-shadow:0 0 40px rgba(242,193,78,.85)}
.rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;z-index:1;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,138,.35) 0 8deg,transparent 8deg 22deg);

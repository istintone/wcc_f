const GEN_BENCH=["GK","CB","CMF","SMF","CF"];
const GEN_NO=[1,2,5,4,3,6,8,10,7,9,11,12,15,14,17,19];
const GEN_SYL=["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ","シ","ス","セ","ソ","タ","チ","ト","ナ","ニ",
  "ノ","ハ","ヒ","フ","ヘ","ホ","マ","ミ","ム","メ","モ","ラ","リ","ル","レ","ロ","ガ","ギ","グ","ゴ","ザ","ジ","ズ",
  "ダ","デ","ド","バ","ビ","ブ","ベ","ボ","パ","ピ","ポ","ヴァ","ヴィ","ジョ","シャ","チェ","ファ","フィ","フェ"];
const GEN_END=["","","","ス","ン","ル","ノ","ニ","ッチ","ーロ","ーニ","ソン","ック","ート"];
const GEN_CLUB=[["ノルド","NOR"],["ヴェルデ","VER"],["アウレア","AUR"],["カステル","CAS"],["リオ","RIO"],
  ["ポルト","POR"],["グラン","GRA"],["ネロ","NER"],["ビアンコ","BIA"],["エスト","EST"],["モンテ","MON"],
  ["ラーゴ","LAG"],["フェロ","FER"],["ソル","SOL"],["ルナ","LUN"],["ステラ","STE"],["マーレ","MAR"],
  ["ティエラ","TIE"],["シエロ","CIE"],["フォルテ","FOR"],["オリゾン","ORI"],["ブルーム","BLU"],["ガレオン","GAL"]];
const GEN_SUF=["FC","ユナイテッド","シティ","SC","アスレティック","ローヴァーズ"];
const GEN_COL=["#e0483a","#e08a2f","#d8c23a","#58b04a","#2fa8a0","#7a5fe0","#c94fb0","#8a8f9c","#b0522d","#3f9be0"];
const GEN_FORM=["4-3-3","4-4-2","4-2-3-1","3-5-2"];
/** 強さの段ごとのクラブ数(生成ぶん)。ロッソ・ユナイテッドは段3として別に加わる */
/** 生成する架空クラブの段。段4・5は実在の16クラブ(→pool.js) */
const GEN_TIERS=[1,1,1,1, 2,2,2,2,2,2, 3,3,3,3,3];

function genWorld(seed){
  const C=TUNING.club, rng=mulberry32((seed^hashStr("world"))>>>0);
  const pick=a=>a[Math.floor(rng()*a.length)], used=new Set(), clubs=[];
  const name=()=>{
    for(let k=0;k<50;k++){
      let s=""; const n=2+Math.floor(rng()*2);
      for(let i=0;i<n;i++)s+=pick(GEN_SYL);
      s+=pick(GEN_END);
      if(!used.has(s)){ used.add(s); return s; }
    }
    return "ナナシ"+used.size;
  };
  GEN_TIERS.forEach((tier,ci)=>{
    const id="c"+String(ci+1).padStart(2,"0"), nm=GEN_CLUB[ci], form=pick(GEN_FORM), slots=FORMS[form];
    const roles=slots.map((s,i)=>i===0?"GK":roleAt(s[0],s[1])).concat(GEN_BENCH);
    const cards=roles.map((role,i)=>{
      const g=GEN_ROLE[role], off=C.tierStat[tier-1];
      const age=18+Math.floor(rng()*17), ageOff=age<=21?-0.8:age>=31?0.4:0;
      const st=g.st.map((v,k)=>clamp(Math.round(v+(v<=6?off*0.3:off+ageOff)+(rng()*2-1)*C.statNoise),1,STAT_MAX));
      const cid=id+"p"+String(i+1).padStart(2,"0");
      const two=role==="CMF"?["CMF",rng()<0.5?"DMF":"OMF"]:role==="SMF"?["SMF","WG"]:role==="WG"?["WG","SMF"]
        :role==="OMF"?["OMF","CMF"]:role==="DMF"?["DMF","CMF"]:[role];
      CARDS[cid]={ id:cid, no:GEN_NO[i], name:name(), pos:g.pos, roles:two,
        off:st[0], def:st[1], tec:st[2], pow:st[3], spd:st[4], sta:st[5], skill:pick(g.sk), age };
      return cid;
    });
    const xi=cards.slice(0,11), links=[], nLink=C.linkBase+C.linkTier*tier;
    for(let k=0;k<nLink*3&&links.length<nLink;k++){
      const a=xi[1+Math.floor(rng()*10)], b=xi[1+Math.floor(rng()*10)];
      if(a===b||links.some(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a)))continue;
      links.push([a,b,clamp(Math.round(tier/2+rng()*1.2),1,3)]);
    }
    TEAMS[id]={ id, name:nm[0]+" "+pick(GEN_SUF), short:nm[1], color:GEN_COL[ci%GEN_COL.length], form,
      kp:xi[7+Math.floor(rng()*4)], xi, bench:cards.slice(11), links, tier };
    clubs.push(id);
  });
  TEAMS.ros.tier=3; clubs.push("ros");
  REAL_IDS.forEach(id=>clubs.push(id));       // 実在の16クラブ(段4・5)
  return { seed, clubs };
}
const tierOf=id=>TEAMS[id].tier||3;

/* ---------- セーブの形 ---------- */

function newLeague(S,W){
  const want=TUNING.club.leagueTiers[S.grade-1].slice(), rng=mulberry32((S.seed^hashStr("lg"+S.term+":"+S.cyc))>>>0);
  const pool=W.clubs.slice(), ids=[];
  for(const t of want){
    const c=pool.filter(id=>tierOf(id)===t&&!ids.includes(id));
    if(c.length)ids.push(c[Math.floor(rng()*c.length)]);
  }
  const clubs=["me"].concat(ids), table={};
  clubs.forEach(id=>table[id]={ p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 });
  return { clubs, table, done:0 };
}
function newCups(){
  const c={};
  CUP_IDS.forEach(id=>c[id]={ st:"wait", opp:[], leg:null, grp:null });
  return c;
}
function newCareer(seed){
  const S={ ver:1, seed:seed>>>0, term:1, played:0, slot:0, cyc:1, grade:1, money:0, money0:0,
    rec:{ w:0, d:0, l:0, gf:0, ga:0 }, titles:[], prev:null, league:null, cups:null,
    layout:{}, form:TEAMS.azr.form, kp:TEAMS.azr.kp, last:null, termOver:false, history:[], g:newGrowth(),
    ts:newTermStats(), tend:null, career:[], salary:0, fac:1,
    sq:startSquad(), coll:newCollection(), sec:newSec(), biz:newBiz(), mgr:null, club:null, tset:null, tsetChosen:true, mab:{ set:[], xp:{} } };
  const W=genWorld(S.seed);
  S.league=newLeague(S,W); S.cups=newCups();
  spRenew(S);                                  // 最初のスポンサーの候補
  return S;
}
/** 読み込んだセーブに世界を作り直して返す(世界はたねから決まる) */
function worldOf(S){ return genWorld(S.seed); }

/* ---------- リーグ ---------- */

/** 8クラブの2回総当たり。r(0〜13)節の対戦を [ホーム, アウェイ] の配列で返す */
function leagueRound(clubs,r){
  const n=clubs.length, half=n-1, k=r%half, arr=clubs.slice(1), out=[];
  const rot=arr.slice(k).concat(arr.slice(0,k)), list=[clubs[0]].concat(rot);
  for(let i=0;i<n/2;i++){
    const a=list[i], b=list[n-1-i];
    // 前半(7節)で決めた向きを、後半はそっくり裏返す → どの組もホームとアウェイが1回ずつ
    const fwd=(i+k)%2===0;
    out.push(fwd===(r<half)?[a,b]:[b,a]);
  }
  return out;
}
function addTable(table,h,a,hg,ag){
  const H=table[h], A=table[a];
  H.p++; A.p++; H.gf+=hg; H.ga+=ag; A.gf+=ag; A.ga+=hg;
  if(hg>ag){ H.w++; A.l++; H.pts+=3; }
  else if(hg<ag){ A.w++; H.l++; A.pts+=3; }
  else{ H.d++; A.d++; H.pts++; A.pts++; }
}
function sortTable(table){
  return Object.keys(table).sort((a,b)=>{
    const x=table[a], y=table[b];
    return y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||(a<b?-1:1);
  });
}
/** 相手どうしの試合を解く。どちらも監督つき */
function simCpu(a,b,seed){
  const M=simulateMatch(makeTeamDef(a,true),makeTeamDef(b,true),seed);
  return [M.home.score,M.away.score];
}

/* ---------- 次の試合 ---------- */

/** その大会に出られるか(→docs/05 §5.7)。prev は前の周の成績 */
function entryOk(S,id){
  const p=S.prev, won=S.cups, wonNow=x=>won[x].st==="won", wonPrev=x=>!!p&&p.won.includes(x);
  switch(id){
    case "PRE": case "ENT": case "KINGS": return true;
    case "NSC":   return wonNow("PRE")||wonNow("KINGS");
    case "W4":    return !!p&&p.rank<=4;
    case "CONTI": return !!p&&(p.rank<=2||["ENT","KINGS","NSC","W4"].some(wonPrev));
    case "CSC":   return wonNow("CONTI");
    case "CT":    return !!p&&(p.rank===1||wonPrev("CONTI")||wonPrev("W4"));
    case "JT":    return wonNow("CT");
    case "ICC":   return wonNow("CT")||wonNow("CONTI")||wonPrev("CT");
  }
  return false;
}
function cupRng(S,id,tag){ return mulberry32((S.seed^hashStr(id+":"+S.term+":"+S.cyc+":"+tag))>>>0); }
/** 大会の相手を決める。勝ち進むほど強い相手が出る */
function drawCup(S,W,id){
  const comp=COMPS[id], cup=S.cups[id], rng=cupRng(S,id,"draw");
  const pool=W.clubs.filter(c=>comp.tiers.includes(tierOf(c))).sort((a,b)=>tierOf(a)-tierOf(b)||(a<b?-1:1));
  const take=q=>{
    const i=clamp(Math.floor(q*pool.length+(rng()-0.5)*2),0,pool.length-1);
    return pool.length?pool.splice(i,1)[0]:W.clubs[Math.floor(rng()*W.clubs.length)];
  };
  const st=comp.stages, n=st.length;
  cup.opp=[];
  if(st[0][0]==="grp"){
    const g=[take(0.3),take(0.5),take(0.7)], table={};
    ["me"].concat(g).forEach(c=>table[c]={ p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 });
    cup.grp={ clubs:g, table };
  }
  for(let i=0;i<n;i++){
    if(st[i][0]==="grp")cup.opp.push(cup.grp.clubs[i]);
    else if(st[i][0]==="leg2")cup.opp.push(cup.opp[i-1]);
    else cup.opp.push(take(n>1?0.2+0.75*i/(n-1):0.6));
  }
  cup.st="in"; cup.leg=null;
}
/**
 * 次の試合。kind: league / cup / friendly
 *   ko  … 同点なら PK 戦で決める / agg … 2試合制の第1試合のスコア [自分, 相手]
 *   canDecline … カップを棄権してフレンドリーにできる
 */
function nextFixture(S,W){
  if(S.termOver)return null;
  const [cid,ix]=SCHED[S.slot], base={ slot:S.slot, no:S.played+1 };
  if(cid==="LG"){
    const pair=leagueRound(S.league.clubs,ix).find(p=>p[0]==="me"||p[1]==="me");
    return Object.assign(base,{ kind:"league", comp:"LG", label:"第"+(ix+1)+"節",
      opp:pair[0]==="me"?pair[1]:pair[0], home:pair[0]==="me", ko:false, agg:null, canDecline:false });
  }
  const cup=S.cups[cid], comp=COMPS[cid];
  if(cup.st==="wait"&&ix===0&&entryOk(S,cid))drawCup(S,W,cid);
  if(cup.st==="in"){
    const type=comp.stages[ix][0];
    return Object.assign(base,{ kind:"cup", comp:cid, label:comp.stages[ix][1], opp:cup.opp[ix],
      home:type!=="leg2", ko:type==="ko"||type==="leg2", agg:type==="leg2"?cup.leg:null,
      type, canDecline:true });
  }
  // 出られない・負けた・棄権した枠はフレンドリーマッチ
  const rng=mulberry32((S.seed^hashStr("fr:"+S.term+":"+S.played))>>>0);
  const lg=S.league.clubs.filter(c=>c!=="me"), want=clamp(S.grade+Math.floor(rng()*3),1,5);
  const cand=W.clubs.filter(c=>tierOf(c)===want);
  const opp=(cand.length?cand:lg)[Math.floor(rng()*(cand.length||lg.length))];
  return Object.assign(base,{ kind:"friendly", comp:"FR", label:"", opp, home:true, ko:false, agg:null,
    canDecline:false, missed:cid, why:cup.st==="wait"?"条件を満たしていない":cup.st==="out"?"敗退":cup.st==="quit"?"棄権":"終了" });
}
/** カップを棄権する。その大会の残りの枠はフレンドリーマッチになる */
function declineCup(S,id){ if(S.cups[id]&&S.cups[id].st==="in")S.cups[id].st="quit"; }

/** 自分のクラブの定義。前の試合の最後の配置と KP を引き継ぐ(カードは盤面に置いたまま) */
function playerDef(S){
  // 登録選手(S.sq)から作る。先頭11枚が先発で、並びは陣形の枠の順(→pool.js)
  const def=makeTeamDef("azr",false), f=FORMS[S.form]||FORMS[TEAMS.azr.form], sq=S.sq||startSquad();
  def.xi=sq.slice(0,11).map((id,i)=>({ card:CARDS[id], h:f[i][0], x:f[i][1] }));
  def.bench=sq.slice(11).map(id=>CARDS[id]);
  def.xi.forEach(s=>{ const l=S.layout[s.card.id]; if(l){ s.h=l[0]; s.x=l[1]; } });
  // 育成を反映する: 能力・モチベーション・特殊能力はカードに、連携・グラフ・セットプレイはクラブに
  def.xi.forEach(s=>{ s.card=growCard(S,s.card); });
  def.bench=def.bench.map(c=>growCard(S,c));
  def.links=growLinks(S); def.graph=Object.assign({},S.g.graph); def.setplay=S.g.set;
  if(S.kp&&def.xi.some(s=>s.card.id===S.kp))def.kp=S.kp;
  def.injK=spBoost(S,"injury")??1;           // スポンサーの効果(医療): ケガの起きやすさ
  if(S.club){ def.name=S.club.name; def.short=S.club.short; def.color=S.club.color; }   // 監督契約で決めたクラブ
  def.mab=mabOf(S);                              // 監督能力(→docs/10 §10.2 C)
  return def;
}
/** 試合を作る材料。自分は常にホーム側(右へ攻める)に置く */
function fixtureMatch(S,fx){
  return { home:playerDef(S), away:makeTeamDef(fx.opp,true),
    seed:(S.seed^hashStr("m:"+S.term+":"+S.played))>>>0,
    opts:{ ko:fx.ko, agg:fx.agg } };
}

/* ---------- 結果の反映 ---------- */

/**
 * 試合の結果を反映して、次の枠へ進む。
 *   res: { hg, ag, pso:null|[h,a], layout:{id:[h,x]}, kp, played:[id], onPitch:[id],
 *          starters:[id], kpCh:KPを替えた回数, subs:交代の数 }
 * 返り値は「何が起きたか」の行(画面に出す)。
 */
function applyResult(S,W,fx,res){
  const C=TUNING.club, out=[], hg=res.hg, ag=res.ag;
  const win=hg>ag||(hg===ag&&res.pso&&res.pso[0]>res.pso[1]);
  S.rec.gf+=hg; S.rec.ga+=ag;
  if(hg>ag)S.rec.w++; else if(hg<ag)S.rec.l++; else S.rec.d++;
  if(res.layout)S.layout=res.layout;
  if(res.kp)S.kp=res.kp;
  const grade=COMPS[fx.comp].grade, prize=x=>{ S.money+=x; return x; };
  let got=0;
  if(fx.kind==="league"){
    const ix=SCHED[fx.slot][1], L=S.league;
    for(const [h,a] of leagueRound(L.clubs,ix)){
      if(h==="me")addTable(L.table,h,a,hg,ag);
      else if(a==="me")addTable(L.table,h,a,ag,hg);
      else{
        const r=simCpu(h,a,(S.seed^hashStr("lg:"+S.term+":"+S.cyc+":"+ix+":"+h))>>>0);
        addTable(L.table,h,a,r[0],r[1]);
      }
    }
    L.done=ix+1;
    if(hg>ag)got+=prize(C.prize.league);
    const rank=sortTable(L.table).indexOf("me")+1;
    out.push("リーグ "+rank+"位("+L.table.me.pts+"点)");
    if(L.done===14){
      got+=prize(C.prize.leagueRank[rank-1]||0);
      if(rank===1){ S.titles.push({ term:S.term, cyc:S.cyc, comp:"LG" }); out.push("🏆 レギュラーリーグ 優勝"); }
    }
  }else if(fx.kind==="cup"){
    const cup=S.cups[fx.comp], comp=COMPS[fx.comp], ix=SCHED[fx.slot][1], last=ix===comp.stages.length-1;
    const type=fx.type, pw=C.prize.cup[grade];
    let through=false;
    if(type==="grp"){
      const g=cup.grp, me=fx.opp, others=g.clubs.filter(c=>c!==me);
      addTable(g.table,"me",me,hg,ag);
      const r=simCpu(others[0],others[1],(S.seed^hashStr("grp:"+fx.comp+":"+S.term+":"+S.cyc+":"+ix))>>>0);
      addTable(g.table,others[0],others[1],r[0],r[1]);
      if(hg>ag)got+=prize(pw);
      const end=comp.stages[ix+1][0]!=="grp";
      if(end){
        const rank=sortTable(g.table).indexOf("me")+1;
        through=rank<=comp.adv;
        out.push(comp.name+" グループ "+rank+"位 → "+(through?"突破":"敗退"));
        if(!through)cup.st="out";
      }else through=true;
    }else if(type==="leg1"){
      cup.leg=[hg,ag]; through=true;
      if(hg>ag)got+=prize(pw);
      out.push(comp.name+" "+fx.label+" 終了(第2試合へ)");
    }else{
      const th=hg+(fx.agg?fx.agg[0]:0), ta=ag+(fx.agg?fx.agg[1]:0);
      through=th>ta||(th===ta&&!!res.pso&&res.pso[0]>res.pso[1]);
      cup.leg=null;
      if(through)got+=prize(pw);
      if(fx.agg)out.push("2試合合計 "+th+" - "+ta+(res.pso?"(PK "+res.pso[0]+"-"+res.pso[1]+")":""));
      if(!through){ cup.st="out"; out.push(comp.name+" 敗退"); }
      else if(!last)out.push(comp.name+" "+fx.label+" 突破");
    }
    if(through&&last){
      cup.st="won"; got+=prize(pw*C.prize.titleK);
      S.titles.push({ term:S.term, cyc:S.cyc, comp:fx.comp });
      out.push("🏆 "+comp.name+" 優勝");
    }
  }else if(win||hg>ag)got+=prize(C.prize.friendly);
  if(got)out.push("賞金 +"+got.toFixed(1)+"億");
  // 育成(→grow.js)。フレンドリーマッチの勝利で、覚醒・★5・黄金線が開花する
  const gr={ played:res.played, onPitch:res.onPitch||res.played, win:hg>ag, lose:hg<ag, inj:res.inj||[] };
  const gl=res.played?afterMatchGrowth(S,fx,gr):[];
  gl.forEach(x=>out.push(x));
  // 経営(→docs/05 §5.13): 入場料・ファン・スタジアム改修の知らせ
  // (昇格のファンと改修の知らせは、1周の終わり endCycle で足す)
  if(S.biz){
    const titles=out.filter(x=>/^🏆 /.test(x)).length;
    bizAfterMatch(S,fx,{ win:hg>ag||win, lose:hg<ag&&!win, titles, prize:got },out);
    S.biz.earn+=spAfterMatch(S,fx,{ hg, ag, winPso:win&&hg===ag, titles },out);
  }
  // 秘書の親密度(→docs/08 §8.7): 試合のたびと大会の優勝で上がる。ときどき監督室で短い会話が起きる
  if(S.sec){
    const n=out.filter(x=>/^🏆 /.test(x)).length, up=secGain(S,TUNING.sec.match+n*TUNING.sec.title);
    if(up)out.push(up);
    if(S.sec.ev==null&&mulberry32((S.seed^hashStr("sev:"+S.term+":"+S.played))>>>0)()<TUNING.sec.eventP)
      S.sec.ev=hashStr("sevk:"+S.term+":"+S.played)%SEC_EVENTS.length;
  }
  // 監督能力の熟練度: セットして試合をした能力に +1(ランクが上がったら知らせる)
  if(S.mab)for(const k of S.mab.set){ const r0=mabRank(S,k); S.mab.xp[k]=(S.mab.xp[k]||0)+1; const r1=mabRank(S,k);
    if(r1>r0)out.push("🎖 監督能力「"+MAB.find(x=>x.id===k).name+"」がランク "+MAB_RANK[r1]+" に"); }
  // カードの払い出し(→pool.js)。試合のたびに1枚
  const card=payout(S);
  out.unshift("カード: "+RARITY[CARDS[card.id].rar].name+" "+nameOf(CARDS[card.id])+(card.isNew?"(NEW)":""));

  // 称号の条件に使う記録(→term.js)
  const ts=S.ts;
  ts.kpCh+=res.kpCh||0; ts.subs+=res.subs||0;
  (res.starters||[]).forEach(id=>{ if(!ts.used.includes(id))ts.used.push(id); });
  if(win&&tierOf(fx.opp)>=5)ts.topW++;
  if(res.pso){ if(res.pso[0]>res.pso[1])ts.psoW++; else ts.psoL++; }
  // gl … 育成の行(ロッカールームで出す) / news … 誰に何が起きたか(→grow.js の newsOf)
  S.last={ no:fx.no, comp:fx.comp, label:fx.label, opp:fx.opp, hg, ag, pso:res.pso||null, lines:out,
    gl, news:gr.news||[], card:card.id, cardNew:card.isNew };
  S.history.push([fx.comp,fx.opp,hg,ag]);
  if(S.history.length>TUNING.club.historyMax)S.history.shift();
  S.played++; S.slot++;
  if(S.slot>=SCHED.length)endCycle(S,W,out);
  if(S.played>=C.termLen&&!S.termOver){ S.termOver=true; endTerm(S); }
  return out;
}
/** 1周(43試合)の終わり。前の周の成績を残し、リーグと大会を作り直す */
function endCycle(S,W,out){
  const rank=sortTable(S.league.table).indexOf("me")+1;
  const won=CUP_IDS.filter(id=>S.cups[id].st==="won");
  if(rank===1)won.push("LG");
  S.prev={ rank, won };
  if(rank<=TUNING.club.promoteRank&&S.grade<TUNING.club.leagueTiers.length){
    S.grade++; out.push("リーグの格が上がった(格 "+S.grade+")");
    if(S.biz){ S.biz.fans+=TUNING.biz.fansPromo; const nx=TUNING.biz.stad[S.biz.stad], disc=nx?Math.round(nx.cost*TUNING.biz.chanceK):0;
      if(!S.biz.offer&&nx&&S.money>=disc)S.biz.offer={ lv:S.biz.stad+1, cost:disc, why:"昇格" }; }
  }
  S.cyc++; S.slot=0;
  S.league=newLeague(S,W); S.cups=newCups();
  if(S.biz&&S.played+1<TUNING.club.termLen)spRenew(S);   // リーグの1周ごとにスポンサーを選び直す(任期の最後は除く)
}
/** 任期が終わったあと、次の任期を始める(称号・年俸・引き継ぎは 3c で足す) */
function newTerm(S,W){
  S.term++; S.played=0; S.slot=0; S.cyc=1; S.prev=null; S.termOver=false;
  S.grade=1;                                  // 育成が初めに戻るので、リーグの格も戻す(称号による上積みは 3c)
  S.rec={ w:0, d:0, l:0, gf:0, ga:0 }; S.last=null; S.layout={};
  S.g=newGrowth(S.sq);                        // 育成は任期ごと(絆の深い選手は startNextTerm が引き継ぐ)
  // 本家と同じく、任期が終わると別のクラブへ移る(→docs/08 §8.12)。クラブの持ち物(資金・ファン・スタジアム・施設)は元に戻す。
  // 残るのは監督の情報(称号・年俸・監督ランク・歴代)・ついてくる選手・カード・秘書との親密度
  S.money=0; S.ts=newTermStats(); S.money0=0;
  S.league=newLeague(S,W); S.cups=newCups();
  if(S.sec){ S.sec.chosen=false; S.sec.ev=null; }   // 任期の始めに秘書を選び直す(親密度は残る)
  if(S.biz){ S.biz=newBiz(); spRenew(S); }      // クラブの持ち物は元に戻す。スポンサーは選び直す
  S.tsetChosen=false;                           // 任期の始めに称号をセットし直す(→docs/10 §10.2 B)
  S.club=null;                                  // 新しい任期は新しいクラブ。監督契約で決め直す(→docs/10 §10.2 A)
}

/* ---------- 保存 ---------- */

const SAVE_KEY="wcc_f.save.v1";
const SAVE_BAD_KEY="wcc_f.save.bad";        // 読めなかったセーブの退避先(上書きで失わないため)
/** 保存の中身をそのまま返す(読めるかどうかは見ない) */
function rawSave(store){ try{ return store.getItem(SAVE_KEY); }catch(e){ return null; } }
/** 読めなかったセーブを退避する。退避できたら true */
function backupSave(store,raw){
  // 前に退避したものを押し出して、新しいものを先頭に置く(最大3件。SAVE_BAD_KEY が最新)
  try{
    const b1=store.getItem(SAVE_BAD_KEY+".1");
    if(b1!=null)store.setItem(SAVE_BAD_KEY+".2",b1);
    const b0=store.getItem(SAVE_BAD_KEY);
    if(b0!=null&&b0!==raw)store.setItem(SAVE_BAD_KEY+".1",b0);
    store.setItem(SAVE_BAD_KEY,raw); return store.getItem(SAVE_BAD_KEY)===raw;
  }catch(e){ return false; }
}
/** 端末に書かない保存先(保存できない環境・退避できなかったとき) */
function memStore(){ return { m:{}, setItem(k,v){ this.m[k]=v; }, getItem(k){ return k in this.m?this.m[k]:null; }, removeItem(k){ delete this.m[k]; } }; }
/** 保存する。直前のセーブは1つ前の世代(SAVE_KEY.prev)に回してから書く */
function saveCareer(store,S){
  try{
    const old=store.getItem(SAVE_KEY);
    if(old)store.setItem(SAVE_KEY+".prev",old);
    store.setItem(SAVE_KEY,JSON.stringify(S)); return true;
  }catch(e){ return false; }
}
function parseSave(t){ try{ const S=t?JSON.parse(t):null; return S&&S.ver===1?migrate(S):null; }catch(e){ return null; } }
/** 読む。読めなければ1つ前の世代から(S.fromPrev が付く) */
function loadCareer(store){
  let t=null, p=null;
  try{ t=store.getItem(SAVE_KEY); p=store.getItem(SAVE_KEY+".prev"); }catch(e){ return null; }
  const S=parseSave(t);
  if(S||!t)return S;
  const P=parseSave(p);
  if(P)P.fromPrev=true;
  return P;
}
/**
 * 古いセーブに、あとから増えた項目を補う。**項目を足したら、ここにも足す**。
 *   g … 育成(3b で追加)。無ければ任期の途中でも育成なしの状態から始める
 */
function migrate(S){
  if(!S.sq)S.sq=startSquad();
  if(!S.coll)S.coll=newCollection();
  // カードの一覧が変わって存在しなくなったカードを外す(登録の空きは初めの16枚で埋める)
  for(const id of Object.keys(S.coll))if(!CARDS[id])delete S.coll[id];
  const spare=startSquad().filter(id=>!S.sq.includes(id));
  S.sq=S.sq.map(id=>CARDS[id]?id:spare.shift());
  for(const id of Object.keys(S.layout||{}))if(!CARDS[id])delete S.layout[id];
  if(S.kp&&!CARDS[S.kp])S.kp=null;
  if(S.last&&S.last.card&&!CARDS[S.last.card])S.last.card=null;
  S.g=S.g?migrateGrowth(S.g,S.sq):newGrowth(S.sq);
  if(!S.ts)S.ts=newTermStats();
  if(S.ts.awake===undefined){ S.ts.awake=null; S.ts.gold=null; S.ts.pow0=null; }   // 途中の任期は前の数え方のまま
  if(S.money0==null)S.money0=0;
  if(!S.career)S.career=[];
  if(S.salary==null)S.salary=0;
  if(S.fac==null)S.fac=1;
  if(S.tend===undefined)S.tend=null;
  if(S.termOver&&!S.tend)endTerm(S);
  if(!S.layout)S.layout={};
  if(!FORMS[S.form])S.form=TEAMS.azr.form;
  if(!S.history)S.history=[];
  if(!S.sec){ S.sec=newSec(); S.sec.chosen=S.played>0; }   // 途中のセーブは今の秘書のまま
  if(S.tset===undefined){ S.tset=null; S.tsetChosen=true; }
  if(!S.mab)S.mab={ set:[], xp:{} };
  if(S.mgr===undefined)S.mgr=null;                 // 監督ライセンスは次に開いたときに登録する
  if(S.club===undefined)S.club=S.played>0||S.term>1?defaultClub():null;   // 途中の任期は今までのクラブのまま
  if(!S.biz){ S.biz=newBiz(); S.biz.earn=Math.max(0,S.money-(S.money0||0)); }   // それまでの賞金は稼いだ額に数える
  if(!S.biz.boostRank||(S.biz.sp&&!S.biz.sp.ind)){ S.biz.boost={}; S.biz.boostRank={}; S.biz.sp=null; S.biz.offers=null; }   // 前の形のスポンサーは選び直す
  if(!S.biz.sp&&!S.biz.offers&&!S.termOver)spRenew(S);
  return S;
}
function clearCareer(store){ try{ store.removeItem(SAVE_KEY); }catch(e){} }

/* ---------- クラブの経営(→docs/08 §8.9・docs/05 §5.13) ----------
 * クラブ資金(S.money)には 賞金・入場料(ホームの試合)・スポンサー収入(2回目)が入り、施設とスタジアム改修に使う。
 * 年俸は任期中に**稼いだ額**(S.biz.earn)で決まる(使っても減らない)。
 * ファン数がクラブの格: 勝利・優勝・昇格・スタジアムで増え、負けで少し減る。観客の数を決める。
 * S.biz = { fans, stad:スタジアムの段(1〜), fac:{ train, tact, lounge, med }(各 0〜3), earn, offer:改修の知らせ | null, cool:知らせを出さない残り試合 } */
const FAC_KEYS=["train","tact","lounge","med"];
const FAC_INFO={
  train: { name:"練習場",     eff:"個人能力が育ちやすい" },
  tact:  { name:"戦術室",     eff:"特殊能力が育ちやすい" },
  lounge:{ name:"ラウンジ",   eff:"連携がつながりやすい" },
  med:   { name:"メディカル", eff:"疲労が抜けやすく、ケガが治りやすい" }
};
function newBiz(){ return { fans:TUNING.biz.fans0, stad:1, fac:{ train:0, tact:0, lounge:0, med:0 }, earn:0, offer:null, cool:0, att:0,
  sp:null, offers:null, boost:{}, boostRank:{} }; }
const stadOf=S=>TUNING.biz.stad[(S.biz?S.biz.stad:1)-1];
/** 施設の効き目(育成に掛ける倍率)。建てていなければ 1 */
const facK=(S,k)=>S&&S.biz?TUNING.biz.facK[S.biz.fac[k]||0]:1;
const medFat=S=>S&&S.biz?TUNING.biz.medFat[S.biz.fac.med||0]:1;
const medHeal=S=>S&&S.biz?TUNING.biz.medHeal[S.biz.fac.med||0]:0;
const facCost=(S,k)=>{ const lv=S.biz.fac[k]||0; return lv<TUNING.biz.facCost.length?TUNING.biz.facCost[lv]:null; };
/** 施設を建てる・上げる。資金が足りなければ false */
function buildFac(S,k){
  const c=facCost(S,k);
  if(c==null||S.money<c)return false;
  S.money-=c; S.biz.fac[k]++;
  return true;
}
/** 観客の数。ホームの試合だけ。収容人数が上限 */
function attendanceOf(S,fx,rng){
  const B=TUNING.biz, cap=stadOf(S).cap;
  const big=fx.kind==="friendly"?B.friendlyK:fx.kind==="cup"?(fx.ko&&/決勝/.test(fx.label||"")?B.finalK:B.cupK):1;
  return Math.min(cap,Math.round(S.biz.fans*B.fill*big*(0.9+0.2*rng())/100)*100);
}
/**
 * 試合のあとの経営。入場料・ファン数・改修の知らせ(資金が費用に届いたとき。優勝・昇格のときは割り引いた費用に届けば)。行(画面に出す)を out に足す。
 * res: { win, lose, titles:優勝した数, prize:この試合の賞金 }
 */
function bizAfterMatch(S,fx,res,out){
  const B=TUNING.biz, Z=S.biz, rng=mulberry32((S.seed^hashStr("biz:"+S.term+":"+S.played))>>>0);
  let gate=0;
  if(fx.home){
    Z.att=attendanceOf(S,fx,rng); gate=Math.round(Z.att*B.price*10)/10;
    S.money+=gate;
    out.push("観客 "+(Z.att/10000).toFixed(1)+"万人(入場料 +"+gate.toFixed(1)+"億)");
  }else Z.att=0;
  Z.earn+=(res.prize||0)+gate;
  // ファン: 勝てば増え(スタジアムが大きいほど多く)、負ければ少し減る。優勝・昇格で大きく増える
  const f0=Z.fans, sk=1+B.fansStadK*(Z.stad-1);
  Z.fans+=res.win?B.fansWin*sk:res.lose?B.fansLose:B.fansDraw*sk;
  Z.fans+=(res.titles||0)*B.fansTitle;
  Z.fans=Math.max(B.fansMin,Math.round(Z.fans));
  if(Math.floor(Z.fans/10000)>Math.floor(f0/10000))out.push("ファンが "+Math.floor(Z.fans/10000)+"万人を超えた");
  // スタジアム改修の知らせ: 資金が費用に届いたとき、または優勝・昇格のとき(少し安く)
  if(Z.cool>0)Z.cool--;
  const nx=B.stad[Z.stad];
  if(nx&&!Z.offer){
    const disc=Math.round(nx.cost*B.chanceK);
    if((res.titles||0)>0&&S.money>=disc)Z.offer={ lv:Z.stad+1, cost:disc, why:"優勝" };
    else if(Z.cool<=0&&S.money>=nx.cost)Z.offer={ lv:Z.stad+1, cost:nx.cost, why:"資金" };
  }
}
/** 改修の知らせに答える。yes なら払って改修、no なら見送り(しばらく知らせない) */
function answerStadium(S,yes){
  const Z=S.biz, o=Z.offer; if(!o)return null;
  Z.offer=null;
  if(!yes){ Z.cool=TUNING.biz.cool; return { ok:false }; }
  if(S.money<o.cost){ Z.cool=TUNING.biz.cool; return { ok:false, short:true }; }
  S.money-=o.cost; Z.stad=o.lv; Z.fans+=TUNING.biz.fansStad;
  return { ok:true, lv:o.lv };
}

/* ---------- スポンサーとミッション(→docs/08 §8.9・docs/05 §5.14) ----------
 * **マスタ**: 業種(11)× ランク(☆1〜5)。業種が報酬の効果の系統を、ランクが 収入・ミッションの難しさ・効果の大きさ・続く試合数 を決める。
 * 任期の始めとリーグの1周の終わりに、3社の候補(すべて架空の企業)から選ぶ。契約はその次の選び直しまで。
 * 報酬は持ち物にしない。ミッションを達成すると、その業種・ランクの報酬の名前で効果が始まり、決まった試合数だけ続く(重なると長い方)。
 * S.biz.sp = { ind:業種, rank:1〜5, name, pay, ms:[ミッション], at } | null、S.biz.offers = [候補] | null、S.biz.boost = { 効果: 残り試合 } */
const SP_IND=[
  { id:"kaden",  name:"家電",       eff:"care",     effName:"ケアの効果アップ",               dur:[3,7], items:["家電製品","最新家電","高級家電","全自動掃除機","IoT家電"],
    pre:["ミナト","ヒカリ","アオバ","シンセイ","ユメノ"], suf:["電機","家電","エレクトリック"] },
  { id:"car",    name:"自動車",     eff:"careSec",  effName:"ケアで秘書が手伝う",             dur:[3,7], items:["軽自動車","自動車","高級車","EV車","AI搭載車"],
    pre:["カゼミチ","ハヤブサ","ミライ","アークス","ソウマ"], suf:["自動車","モーターズ","オート"] },
  { id:"food",   name:"食品",       eff:"indExp",   effName:"個人練習の経験アップ",           dur:[3,7], items:["健康食品","サプリメント","プロテイン","最新アスリートフード","専属カリスマ栄養士"],
    pre:["ミノリ","アサヒノ","ユタカ","ハルカ","ミドリ"], suf:["食品","フーズ","ニュートリション"] },
  { id:"sports", name:"スポーツ用品", eff:"indSec", effName:"個人練習で秘書が手伝う",         dur:[3,7], items:["ウォーターボトル","サッカーウェア","サッカーボール","高級サッカーウェア","最高級サッカースパイク"],
    pre:["ストライダ","ハヤテ","ジンバ","アスリオ","トップス"], suf:["スポーツ","アスレチック"] },
  { id:"it",     name:"IT機器",     eff:"loungeOk", effName:"ラウンジが成功しやすい",         dur:[3,7], items:["最新モバイル","高性能PC","次世代ツール","スマートウォッチ","AIスピーカー"],
    pre:["ネクサ","ルミナ","カナタ","ソラ","ゼニス"], suf:["テック","デバイス","システムズ"] },
  { id:"game",   name:"ゲーム",     eff:"loungeExp",effName:"ラウンジの連携の経験アップ",     dur:[3,7], items:["人気ゲーム機","最新ゲーム機","次世代ゲーム機","VRヘッドセット","ARゴーグル"],
    pre:["ピクセル","スターリ","ノヴァ","ワンダ","ミラージュ"], suf:["ゲームス","エンタテインメント"] },
  { id:"travel", name:"旅行・航空", eff:"loungeSec",effName:"ラウンジの失敗に秘書のフォロー", dur:[3,7], items:["往復航空券","国内旅行","海外旅行","世界一周旅行","宇宙旅行"],
    pre:["ツバサ","アオゾラ","セレスタ","オリオン","カモメ"], suf:["トラベル","エアラインズ","ツーリスト"] },
  { id:"drink",  name:"飲料",       eff:"noFat",    effName:"試合の疲労がたまりにくい",       dur:[2,6], items:["スポーツドリンク","エナジードリンク","栄養ドリンク","フレッシュジュース","最高級ミネラルウォーター"],
    pre:["シズク","イズミ","ミナモ","サワ","アクア"], suf:["飲料","ビバレッジ","ウォーター"] },
  { id:"medic",  name:"医療",       eff:"injury",   effName:"ケガに強くなる",                 dur:[2,6], items:["テーピングセット","リハビリグッズ","専属フィジオセラピスト","スポーツ人間ドック","専属スポーツドクター"],
    pre:["ケンセイ","ヤスラギ","ミマモリ","ユウキ","サクラ"], suf:["メディカル","製薬","ヘルスケア"] },
  { id:"finance",name:"金融",       eff:"bench",    effName:"控えの不満がたまりにくい",       dur:[3,7], items:["宝くじ","有価証券","ゴールドバー","プラチナバー","仮想通貨"],
    pre:["ヤマト","コガネ","アストラ","グランデ","ホクト"], suf:["銀行","証券","フィナンシャル"] },
  { id:"media",  name:"放送・芸能", eff:"keepForm", effName:"好調を維持しやすい",             dur:[2,5], items:["ラジオ番組出演オファー","テレビ番組出演オファー","CM出演オファー","ドラマ出演オファー","映画出演オファー"],
    pre:["ステラ","ヒノデ","アカツキ","ミライ","ルクス"], suf:["放送","エンタープライズ","プロダクション"] }
];
const spIndOf=id=>SP_IND.find(x=>x.id===id)||SP_IND[0];
const spDur=(ind,rank)=>Math.round(ind.dur[0]+(ind.dur[1]-ind.dur[0])*(rank-1)/4);
const spItem=(ind,rank)=>ind.items[rank-1];
/** 効果の大きさ(☆1〜5)。effTxt は画面の説明 */
const spEffK=(eff,rank)=>TUNING.biz.sp.eff[eff][rank-1];
function spEffTxt(eff,rank){
  const v=spEffK(eff,rank), pc=x=>Math.round(x*100)+"%";
  return eff==="care"?"ケアで やる気がもう1段上がる率 "+pc(v):eff==="careSec"?"ケアのあと秘書がもう1人ケアする率 "+pc(v)
    :eff==="indExp"?"個人練習の経験 ×"+v:eff==="indSec"?"個人練習のあと秘書がもう1人に経験の半分を入れる率 "+pc(v)
    :eff==="loungeOk"?"ラウンジの大成功 +"+pc(v):eff==="loungeExp"?"ラウンジの連携の経験 ×"+v:eff==="loungeSec"?"ラウンジの失敗に秘書のフォロー +"+pc(v)
    :eff==="noFat"?"試合の疲労 ×"+v:eff==="injury"?"ケガの起きやすさ ×"+v:eff==="bench"?"控えのやる気が下がる率 ×"+v:"負けてやる気が下がる率 ×"+v;
}
/** いま効いている効果の大きさ(効いていなければ null) */
const spBoost=(S,eff)=>S&&S.biz&&S.biz.boost&&S.biz.boost[eff]>0?spEffK(eff,S.biz.boostRank[eff]||1):null;
/** その時点で届くランク(1〜5)。ファン数と実績(リーグの格・今の任期の優勝) */
function spRankMax(S){
  const B=TUNING.biz.sp, Z=S.biz, t=S.titles.filter(x=>x.term===S.term).length;
  let r=1;
  for(let i=0;i<B.rankFans.length;i++)if(Z.fans>=B.rankFans[i]||(Z.fans>=B.rankFans[i]*0.7&&(S.grade>=B.rankGrade[i]||t>=B.rankTitles[i])))r=i+2;
  return r;
}
/** ミッションを1つ作る。ランクが上がるほど難しい */
function mkMission(rng,rank){
  const k=rank-1, r=rng();
  const m=r<0.3?{ t:"win", n:[3,4,5,6,7][k], m:[8,8,9,10,10][k] }
    :r<0.5?{ t:"cs", n:[1,2,2,3,4][k] }
    :r<0.65?{ t:"goals", n:[10,12,15,18,22][k], m:10 }
    :r<0.8?{ t:"unb", n:[3,4,5,6,8][k] }
    :r<0.9?{ t:"att", n:[6000,10000,18000,30000,45000][k] }
    :{ t:"title" };
  m.p=0; m.st=0; m.done=false; m.fail=false;
  return m;
}
const missionTxt=m=>m.t==="win"?m.m+"試合以内に"+m.n+"勝":m.t==="cs"?"無失点の試合を"+m.n+"回":m.t==="goals"?m.m+"試合以内に"+m.n+"得点"
  :m.t==="unb"?m.n+"試合負けなし":m.t==="att"?"ホームの観客 "+(m.n/10000).toFixed(1)+"万人":"大会で優勝";
const missionProg=m=>m.done?"達成":m.fail?"期限切れ":m.t==="win"||m.t==="goals"?m.p+"/"+m.n+"(残り "+Math.max(0,m.m-m.st)+"試合)"
  :m.t==="att"||m.t==="title"?"まだ":m.p+"/"+m.n;
/** 報酬の説明(例: 最高級ミネラルウォーター — 試合の疲労 ×0.35 を6試合) */
const spRewardTxt=sp=>{ const ind=spIndOf(sp.ind); return spItem(ind,sp.rank)+" — "+spEffTxt(ind.eff,sp.rank)+" を"+spDur(ind,sp.rank)+"試合"; };
/** 3社の候補を作る。業種は重ならない。1社は届くいちばん上のランク、残りはその1つ下まで */
function spOffers(S){
  const top=spRankMax(S), rng=mulberry32((S.seed^hashStr("spo:"+S.term+":"+S.cyc+":"+S.played))>>>0), out=[], used=new Set();
  for(let i=0;i<3;i++){
    let ind; do{ ind=SP_IND[Math.floor(rng()*SP_IND.length)]; }while(used.has(ind.id)); used.add(ind.id);
    const rank=Math.max(1,i===0?top:top-(rng()<0.5?1:0));
    const name=ind.pre[Math.floor(rng()*ind.pre.length)]+ind.suf[Math.floor(rng()*ind.suf.length)];
    const pay=Math.round(TUNING.biz.sp.pay[rank-1]*(0.9+0.2*rng())*100)/100;
    const n=rank>=4?3:2, ms=[]; for(let j=0;j<n;j++)ms.push(mkMission(rng,rank));
    out.push({ ind:ind.id, rank, name, pay, ms });
  }
  return out;
}
/** 契約する(i = 候補の番号)。keep なら今の社と、ミッションを新しくして続ける */
function signSponsor(S,i,keep){
  const Z=S.biz;
  if(keep&&Z.sp){ const rng=mulberry32((S.seed^hashStr("spk:"+S.term+":"+S.played))>>>0);
    Z.sp.ms=Z.sp.ms.map(()=>mkMission(rng,Z.sp.rank)); Z.sp.at=S.played; Z.offers=null; return true; }
  const o=Z.offers&&Z.offers[i]; if(!o)return false;
  Z.sp=Object.assign({},o,{ at:S.played }); Z.offers=null;
  return true;
}
/** 契約の区切り(任期の始め・リーグの1周の終わり)。終わっていないミッションは期限切れにして、候補を出す */
function spRenew(S){
  const Z=S.biz;
  if(Z.sp)Z.sp.ms.forEach(m=>{ if(!m.done)m.fail=true; });
  Z.offers=spOffers(S);
}
/** 試合のあと: スポンサー収入・ミッションの進み・報酬の効果・効果の残り。行を out に足す。収入を返す */
function spAfterMatch(S,fx,r,out){
  const Z=S.biz, sp=Z.sp;
  for(const k in Z.boost)if(Z.boost[k]>0)Z.boost[k]--;
  if(!sp)return 0;
  const pay=sp.pay; S.money+=pay;
  out.push("スポンサー収入 +"+pay.toFixed(2)+"億("+sp.name+")");
  const won=r.hg>r.ag||r.winPso, lost=r.hg<r.ag&&!r.winPso, ind=spIndOf(sp.ind);
  for(const m of sp.ms){
    if(m.done||m.fail)continue;
    m.st++;
    if(m.t==="win"&&won)m.p++;
    else if(m.t==="cs"&&r.ag===0)m.p++;
    else if(m.t==="goals")m.p+=r.hg;
    else if(m.t==="unb")m.p=lost?0:m.p+1;
    const ok=m.t==="att"?Z.att>=m.n:m.t==="title"?r.titles>0:m.p>=m.n;
    if(ok){
      m.done=true;
      const d=spDur(ind,sp.rank);
      // 同じ効果が重なったら、残りは長い方・大きさは高い☆の方
      const on=(Z.boost[ind.eff]||0)>0;
      Z.boostRank[ind.eff]=Math.max(on?(Z.boostRank[ind.eff]||1):1,sp.rank); Z.boost[ind.eff]=Math.max(Z.boost[ind.eff]||0,d);
      out.push("📣 ミッション達成「"+missionTxt(m)+"」→ "+spItem(ind,sp.rank)+"("+spEffTxt(ind.eff,sp.rank)+"、"+d+"試合)");
    }else if((m.t==="win"||m.t==="goals")&&m.st>=m.m){ m.fail=true; out.push("ミッション「"+missionTxt(m)+"」は期限切れ"); }
  }
  return pay;
}

/* ---------- 監督ライセンスと監督契約(→docs/10 §10.2 A) ----------
 * 監督ライセンス S.mgr = { name, birth:"YYYY-MM-DD" | null, ani:動物 | null }。初回だけ登録し、**あとから変えられない**(本家と同じ)
 * 監督契約 S.club = { name, short, town, color, emblem:{ shape, field, crest, orn, lay, text, home, away } | null }。初回と新しい任期の始めに決める */
const TOWNS=["ミナト市","ホクト市","アオバ市","カザミ市","セト市","ソラノ市","アカネ市","シラユキ市","ハヤテ市","ミドリ市","コガネ市","ツバサ市"];
/** 監督契約の前の、今までのクラブ(古いセーブ・途中の任期) */
function defaultClub(){ return { name:"アズーロFC", short:"AZR", town:TOWNS[0], color:TEAMS.azr.color, emblem:null }; }
/** 監督ライセンスを登録する。名前は必須、生年月日は任意。登録したら変えられない */
function registerManager(S,name,birth){
  const nm=String(name||"").trim().slice(0,12);
  if(!nm||S.mgr)return false;
  let ani=null;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(birth||"");
  if(m)ani=aniOfDate(+m[1],+m[2],+m[3]);
  S.mgr={ name:nm, birth:m?birth:null, ani };
  return true;
}
/** 監督契約を結ぶ。クラブ名は必須。略称は英字3字(無ければクラブ名から作る) */
function signClub(S,o){
  const name=String(o.name||"").trim().slice(0,10);
  if(!name)return false;
  const short=(String(o.short||"").toUpperCase().replace(/[^A-Z]/g,"")||clubAbbr(name)).slice(0,3).padEnd(3,"X");
  S.club={ name, short, town:TOWNS.includes(o.town)?o.town:TOWNS[0], color:/^#[0-9a-fA-F]{6}$/.test(o.color||"")?o.color:TEAMS.azr.color,
    emblem:o.emblem||null };
  return true;
}
/** 自分のクラブ(試合以外の画面で使う)。監督契約の前はアズーロFC */
const myTeam=S=>Object.assign({},TEAMS.azr,S&&S.club?{ name:S.club.name, short:S.club.short, color:S.club.color }:{});

/* ---------- 監督能力(→docs/10 §10.2 C) ----------
 * S.mab = { set:[セットした能力の id(最大3)], xp:{ id: 使った試合数 } }。監督のデータなので任期をまたいで残る */
function mabRank(S,k){ const t=TUNING.mab.rankAt, x=(S.mab&&S.mab.xp[k])||0; let r=0; while(r+1<t.length&&x>=t[r+1])r++; return r; }
const mabVal=(S,k)=>TUNING.mab.base[k]*TUNING.mab.rankK[mabRank(S,k)];
/** 試合に渡す効き目 { id: 値 } */
function mabOf(S){ const o={}; for(const k of (S.mab&&S.mab.set)||[])if(TUNING.mab.base[k]!=null)o[k]=mabVal(S,k); return o; }
/** セットを入れ替える(最大 max まで。もう一度押すと外す) */
function toggleMab(S,k){
  const set=S.mab.set, i=set.indexOf(k);
  if(i>=0){ set.splice(i,1); return true; }
  if(!MAB.some(x=>x.id===k)||set.length>=TUNING.mab.max)return false;
  set.push(k); return true;
}

/* =========================================================================
   wcc_f — カード(DOM非依存)→docs/06
   ・カードの一覧(POOL)は実在の16クラブ × 16人(realcards.js。**名前は偽名**。実名はパックで上書き →docs/01 §1.4)
   ・能力は「役割のひな形 + 格 + 特徴」から作る。レアリティは格で決まる
   ・16クラブは相手クラブとしても登場する(強さの段4〜5。→club.js の genWorld)
   ・試合のあとに1枚払い出される。レアリティを抽選してから、その段のカードを1枚選ぶ
   ・持っているカードは S.coll {id: 枚数}。任期をまたいでも残る
   ・登録選手は S.sq(16枚。先頭11枚が先発で、並びは陣形の枠の順)
   ========================================================================= */

/** レアリティ。W 白 / B 黒 / K キラ / L レジェンド。at=この格以上でその段 */
const RARITY={
  W:{ name:"白",         at:-9 },
  B:{ name:"黒",         at:1.6 },
  K:{ name:"キラ",       at:2.2 },
  L:{ name:"レジェンド", at:2.8 }
};
const RAR_ORDER=["W","B","K","L"];
const rarOf=r=>RAR_ORDER.slice().reverse().find(k=>r>=RARITY[k].at);
/** 特徴の文字 → 能力 */
const TRAIT_STAT={ o:"off", d:"def", t:"tec", p:"pow", s:"spd", a:"sta" };
const POOL_SEED=20261117;
/** 実在クラブの id(並びは REAL_CLUBS の順) */
const REAL_IDS=REAL_CLUBS.map(c=>c[0]);
const POOL=(()=>{
  const C=TUNING.pack, out=[];
  for(const r of REAL_ROWS){
    const [id,ci,no,name,roles,age,grade,traits,skill,nat,ani]=r, rl=roles.split("/"), g=GEN_ROLE[rl[0]];
    const st={};
    const off=(grade-C.gradeBase)*C.gradeK;      // 格 → 能力のずれ
    STATS.forEach((k,i)=>{ const v=g.st[i]; st[k]=v+(v<=6?off*C.lowK:off); });
    for(let k=0;k+1<traits.length;k+=2)st[TRAIT_STAT[traits[k]]]+=traits[k+1]==="+"?C.trait:-C.trait;
    STATS.forEach(k=>{ st[k]=clamp(Math.round(st[k]),1,STAT_MAX); });
    CARDS[id]=Object.assign({ id, no, name, pos:g.pos, roles:rl, skill, age, grade,
      rar:rarOf(grade), club:REAL_CLUBS[ci][1], team:REAL_CLUBS[ci][0],
      nat:nat||NAT_POOL[hashStr("nat:"+id)%NAT_POOL.length], ani:ani!=null?ani:hashStr("ani:"+id)%ANIMALS.length },st);
    out.push(id);
  }
  // 相手クラブとしての定義。強さの段は先発11人の格の平均で、上位8クラブが5、残りが4
  const avg=REAL_CLUBS.map((c,ci)=>{ const xi=REAL_ROWS.filter(r=>r[1]===ci).slice(0,11);
    return xi.reduce((s,r)=>s+r[6],0)/xi.length; });
  const top=avg.slice().sort((a,b)=>b-a)[7];
  const rng=mulberry32(POOL_SEED);
  REAL_CLUBS.forEach((c,ci)=>{
    const [cid,name,short,color,form,kp]=c, ids=REAL_ROWS.filter(r=>r[1]===ci).map(r=>r[0]);
    const xi=ids.slice(0,11), tier=avg[ci]>=top?5:4, links=[], nLink=TUNING.club.linkBase+TUNING.club.linkTier*tier;
    for(let k=0;k<nLink*3&&links.length<nLink;k++){
      const a=xi[1+Math.floor(rng()*10)], b=xi[1+Math.floor(rng()*10)];
      if(a===b||links.some(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a)))continue;
      links.push([a,b,clamp(Math.round(tier/2+rng()*1.2),1,3)]);
    }
    TEAMS[cid]={ id:cid, name, short, color, form, kp:ids[kp-1], xi, bench:ids.slice(11), links, tier, real:true };
  });
  return out;
})();
/** 最初から持っている16枚(アズーロFC)。レアリティは黒として扱う */
TEAMS.azr.xi.concat(TEAMS.azr.bench).forEach(id=>{ CARDS[id].rar=CARDS[id].rar||"B"; CARDS[id].club=CARDS[id].club||"アズーロFC"; });

/** 最初の状態。持っているのはアズーロFCの16枚で、それがそのまま登録選手 */
function newCollection(){
  const coll={};
  TEAMS.azr.xi.concat(TEAMS.azr.bench).forEach(id=>coll[id]=1);
  return coll;
}
const startSquad=()=>TEAMS.azr.xi.concat(TEAMS.azr.bench);

/** 試合のあとに1枚引く。たねは任期と試合数で決まる(読み込み直しても同じカード) */
function drawCard(S,salt){
  // salt … 同じ試合で何枚か引くとき(スポンサーの選手パック)に1枚ずつ変える
  const P=TUNING.pack, rng=mulberry32((S.seed^hashStr("pack:"+S.term+":"+S.played+(salt?":"+salt:"")))>>>0);
  let r=rng(), rar="W";
  for(const k of RAR_ORDER){ if(r<P.rate[k]){ rar=k; break; } r-=P.rate[k]; }
  const list=POOL.filter(id=>CARDS[id].rar===rar);
  return list[Math.floor(rng()*list.length)];
}
/** 払い出し。コレクションに足して、何を引いたかを返す */
function payout(S,salt){
  const id=drawCard(S,salt), isNew=!S.coll[id];
  S.coll[id]=(S.coll[id]||0)+1;
  return { id, isNew };
}

/**
 * 登録選手を入れ替える。out の枠(位置・先発か控えか)に in が入る。
 * **入れ替えられた選手の育成は消える**(本家と同じく、登録を外すと育てたものは残らない)。
 * 入ってきた選手は育成が初めから。
 */
function swapSquad(S,outId,inId){
  const i=S.sq.indexOf(outId);
  if(i<0||S.sq.includes(inId)||!S.coll[inId])return false;
  S.sq[i]=inId;
  if(S.layout[outId]){ S.layout[inId]=S.layout[outId]; delete S.layout[outId]; }
  if(S.kp===outId)S.kp=null;
  delete S.g.pl[outId];
  for(const k of Object.keys(S.g.links))if(k.split("|").includes(outId))delete S.g.links[k];
  S.g.pl[inId]=newPlayerGrowth();
  return true;
}
/** 登録選手の中で、先発と控えを入れ替える(育成は消えない) */
/** 先発11人の既定の位置を埋める。置いていない人は陣形の枠、控えの位置は消す(→docs/07 §7.10) */
function fillLayout(S){
  const f=FORMS[S.form]||FORMS[TEAMS.azr.form], on=S.sq.slice(0,11);
  on.forEach((id,i)=>{ if(!S.layout[id])S.layout[id]=[f[i][0],f[i][1]]; });
  for(const id of Object.keys(S.layout))if(!on.includes(id))delete S.layout[id];
  // KP は先発にいる人だけ。いなければクラブの既定、それも控えなら最前線の人
  if(!on.includes(S.kp))S.kp=on.includes(TEAMS.azr.kp)?TEAMS.azr.kp:on.slice().sort((a,b)=>S.layout[b][0]-S.layout[a][0])[0];
  return S.layout;
}
/** 陣形を選び直す。先発の並び順(枠の順)どおりに一括で置き直す */
function setForm(S,form){
  if(!FORMS[form])return false;
  S.form=form; S.layout={};
  fillLayout(S);
  return true;
}
function moveSquad(S,a,b){
  const i=S.sq.indexOf(a), j=S.sq.indexOf(b);
  if(i<0||j<0||i===j)return false;
  S.sq[i]=b; S.sq[j]=a;
  const la=S.layout[a], lb=S.layout[b];
  if(la||lb){ if(lb)S.layout[a]=lb; else delete S.layout[a]; if(la)S.layout[b]=la; else delete S.layout[b]; }
  return true;
}

/* ---- カードNo.(通し番号)とパラメーター合計値(→docs/06) ----
 * カードNo. はカードの id そのもの(mcb01 なら MCB01)。クラブの略号 + クラブ内の番号なので、
 * 選手を足しても既存の番号は変わらず、No.順に並べるとクラブごとにまとまる */
const cardNoOf=c=>c.id.toUpperCase();
const cnoCmp=(a,b)=>a<b?-1:a>b?1:0;
const statTotal=c=>STATS.reduce((s,k)=>s+(c[k]||0),0);
/** カードのクラブ名(実名パックがあれば実名) */
function clubOfCard(c){
  const t=c.team&&TEAMS[c.team]?TEAMS[c.team]:c.id[0]==="h"?TEAMS.azr:c.id[0]==="a"?TEAMS.ros:null;
  return t?teamNameOf(t):(c.club||"");
}

/* =========================================================================
   wcc_f — 育成(DOM非依存)→docs/05 §5.3〜5.6
   1試合ごとに:
     ① チーム練習  メニューを1つ + 強度(軽め / 普通 / ハード)。強いほど伸びるが、疲労がたまる
     ② コミュニケーション  最大3回。個人練習 / ミーティング / ラウンジ / ケア
     ③ 試合  経験がたまり、**試合のあとに**★の上昇・覚醒・連携の変化が起きる
   ★の上がり方
     個人能力 ★0〜5 … 経験がたまると試合後に上がる。★5(覚醒)は兆しのあとフレンドリーマッチの勝利で
     特殊能力 ★0〜5 … ミーティングで経験をため、★突破の3択に成功すると上がる。★5はフレンドリーマッチの勝利で
     連携     0〜3   … 経験がたまると試合後に太くなる。黄金線はラウンジで兆し → フレンドリーマッチの勝利で
   育成の状態は S.g に素の値だけで持つ(そのまま保存できる)。
   ========================================================================= */

const PARAM_AXIS={ off:"O", def:"D", tec:"R", pow:"P", spd:"S", sta:"C" };
const AXIS_PARAM={ O:"off", D:"def", R:"tec", P:"pow", S:"spd", C:"sta" };
const MOT_LABEL=["ケガ","絶不調","不調","好調","絶好調"];
const LINK_LABEL=["線なし","薄線","太線","黄金線"];
const INT_LABEL=["軽め","普通","ハード"];
const COMM_LABEL={ ind:"個人練習", meet:"ミーティング", lounge:"ラウンジ", talk:"ケア" };
/** ラウンジの3択。相性(2=良い / 1=ふつう / 0=悪い)ごとに、いちばん合う手が違う */
const LOUNGE_CHOICE=["連携の練習をさせる","食事に行かせる","競わせる"];
const LOUNGE_HINT=["ふたりは張り合っているようだ","ふたりはまだよそよそしい","ふたりは気が合うようだ"];
const LOUNGE_BEST=[2,0,1];                   // 相性 0/1/2 のときにいちばん合う手
/** ミーティングの3択。選手の性格ごとに、響く言い方が違う */
const MEET_CHOICE=["褒めて伸ばす","厳しく求める","本人に任せる"];
const PERS_LABEL=["褒められて伸びる","負けず嫌い","マイペース"];

const persOf=id=>hashStr("pers:"+id)%3;
/** 年齢の区切り(0 = 21歳以下 〜 4 = 32歳以上) */
const ageBand=id=>{ const a=CARDS[id].age||26, b=TUNING.grow.age.band; let i=0; while(i<b.length&&a>b[i])i++; return i; };
/**
 * 伸びやすさ = 年齢 × 能力。若いほど・能力が低いほど育ちやすい(→docs/05 §5.4)。
 * 全員が同じ時期に★4へ揃わないのは、これと「選んだ練習」「個人練習で呼んだ回数」の差による
 */
function growK(id,S){
  const G0=TUNING.grow, c=CARDS[id], A=G0.abil, yk=S&&c.age<=21?(tsetOf(S,"youngK")||1):1;   // 生え抜き: 若手が伸びやすい
  const top=STATS.map(k=>c[k]).sort((a,b)=>b-a), best=(top[0]+top[1])/2;
  return G0.age.grow[ageBand(id)]*clamp(1-(best-A.ref)*A.k,A.lo,A.hi)*yk;
}
/** やる気の上下の起きやすさ。若いほどむらがある */
const motSwing=id=>TUNING.grow.age.swing[ageBand(id)];
/**
 * 2人の相性(→docs/08 §8.6)。**動物占いの群れ**で決まる。2=良い(試合に出るだけで太線まで)/ 1=ふつう(薄線まで)/ 0=張り合う(ラウンジでしか育たない)。
 * ラウンジの合う手もこれで決まる
 */
const compatOf=(a,b)=>aniCompat(CARDS[a].ani,CARDS[b].ani);
/** 同じ実在クラブか(アズーロFC の初めの16人には付けない。全員に付くと最初から連携が育ちすぎる) */
const sameClub=(a,b)=>{ const x=CARDS[a], y=CARDS[b]; return !!x.team&&x.team===y.team; };
/** 連携が付きやすくなる理由(画面にも出す): 同じ国籍 / 同じクラブ / 同じ動物 */
function linkBonusOf(a,b){
  const x=CARDS[a], y=CARDS[b], out=[];
  if(x.nat&&x.nat===y.nat)out.push("nat");
  if(sameClub(a,b))out.push("club");
  if(x.ani===y.ani)out.push("ani");
  return out;
}
/** 試合で入る連携の経験の倍率(重なる) */
const linkBonusK=(a,b)=>linkBonusOf(a,b).reduce((k,t)=>k*TUNING.grow.link.bonus[t],1);
/** 試合だけで育つ上限。相性で決まり、国籍かクラブが同じなら少なくとも薄線(1) */
function linkCap(a,b){ const c=compatOf(a,b), bo=linkBonusOf(a,b); return Math.max(c,(bo.includes("nat")||bo.includes("club"))?1:0); }
const lkey=(a,b)=>a<b?a+"|"+b:b+"|"+a;

/* ---------- 状態 ---------- */

/** 1人ぶんの育成の初め */
function newPlayerGrowth(){
  return { ie:0, is:0, se:0, ss:0, tr:{}, up:{}, mot:TUNING.grow.mot.start, fat:0, q:false, sq:false, bond:0 };
}
/** 登録選手(ids)ぶんの育成。ids を省くとアズーロFCの初めの16枚 */
function newGrowth(ids){
  const pl={};
  (ids||TEAMS.azr.xi.concat(TEAMS.azr.bench)).forEach(id=>{ pl[id]=newPlayerGrowth(); });
  return { pl, links:{}, graph:{ O:0, D:0, R:0, C:0, S:0, P:0 }, set:0,
    step:"train", cn:0, done:[], opts:null };
}
/** 古いセーブの育成に、あとから増えた項目を補う */
function migrateGrowth(g,sq){
  for(const id in g.pl)if(!CARDS[id]||(sq&&!sq.includes(id)))delete g.pl[id];
  if(sq)sq.forEach(id=>{ if(!g.pl[id])g.pl[id]=newPlayerGrowth(); });
  for(const k of Object.keys(g.links))if(!k.split("|").every(id=>g.pl[id]))delete g.links[k];
  for(const id in g.pl)if(g.pl[id].fat==null)g.pl[id].fat=0;
  if(g.cn==null)g.cn=0;
  if(!g.done)g.done=[];
  if(g.step==="ready")g.step="comm";
  return g;
}
const linkOf=(S,a,b)=>S.g.links[lkey(a,b)]||{ lv:0, exp:0, gold:false };
function linkSet(S,a,b){ const k=lkey(a,b); return S.g.links[k]||(S.g.links[k]={ lv:0, exp:0, gold:false }); }

/** 育成を反映したカード。試合にはこれを渡す(元のカードは書き換えない) */
function growCard(S,card){
  const G0=TUNING.grow, g=S.g.pl[card.id], c=Object.assign({},card);
  if(!g)return c;
  for(const k of STATS){
    const base=card[k]+(card[k]<=G0.startKeep?0:G0.startOff);
    c[k]=clamp(base+(g.up[k]||0),1,STAT_MAX);
  }
  c.cond=G0.mot.mul[g.mot];
  c.gs=g.is; c.gm=g.mot;                     // 盤面に出す★とやる気(見た目だけ)
  c.buffK=1+G0.sp.buff*g.ss;
  c.ss=g.ss; c.is=g.is;
  c.fat0=g.fat;                              // 練習の疲れを残したまま試合を始める
  return c;
}
/** 連携の線を、試合に渡す形 [a, b, 段] にする */
function growLinks(S){
  return Object.keys(S.g.links).filter(k=>S.g.links[k].lv>0).map(k=>{ const p=k.split("|"); return [p[0],p[1],S.g.links[k].lv]; });
}
/** 疲労の平均(盤面の11人) */
function teamFatigue(S){
  const xi=squadXi(S);
  return xi.reduce((s,id)=>s+(S.g.pl[id]?S.g.pl[id].fat:0),0)/(xi.length||1);
}

/* ---------- ① チーム練習 ---------- */

/** 今回の練習の候補6つ。基本練習が能力ごとに1つずつ。施設が良いほど特殊練習に差し替わる */
function trainOptions(S){
  if(S.g.opts)return S.g.opts;
  const G0=TUNING.grow, rng=mulberry32((S.seed^hashStr("tr:"+S.term+":"+S.played))>>>0);
  S.g.opts=STATS.map(param=>{
    if(rng()<G0.spChance*(S.fac||1)*(tsetOf(S,"spK")||1)){   // 監督ランク(累計の年俸 →term.js)と、セットした称号(レジェンド)
      const pool=TRAIN_SP.map((t,i)=>i).filter(i=>TRAIN_SP[i].slot===param||TRAIN_SP[i].slot==="any");
      // セットした称号の系統に合う特殊練習ほど出やすい(→docs/10 §10.2 B)
      const w=pool.map(i=>trainWeight(S,TRAIN_SP[i])), tot=w.reduce((a,b)=>a+b,0);
      if(pool.length){ let r=rng()*tot; for(let j=0;j<pool.length;j++){ if(r<w[j])return { param, sp:pool[j] }; r-=w[j]; } return { param, sp:pool[pool.length-1] }; }
    }
    return { param, sp:-1 };
  });
  return S.g.opts;
}
function trainLabel(o){ return o.sp>=0?TRAIN_SP[o.sp].name:STAT_LABEL[o.param]+"の練習"; }
/** 練習の中身を、選ぶ前に見せる文にする */
function trainDesc(o){
  const ax=s=>s.split("").map(a=>AXIS_LABEL[a]).join("・");
  if(o.sp<0)return "個人能力 ・ グラフ: "+AXIS_LABEL[PARAM_AXIS[o.param]]+" ↑";
  const t=TRAIN_SP[o.sp], e=t.eff, nm={ ind:"個人", link:"連携", sp:"特殊", set:"セットプレイ" };
  return Object.keys(e).map(k=>nm[k]+"★".repeat(e[k])).join(" ")+" ・ グラフ: "+
    (t.up?ax(t.up)+" ↑":"")+(t.down?" / "+ax(t.down)+" ↓":"");
}
function graphAdd(S,axis,v){
  const R=TUNING.grow.graph;
  S.g.graph[axis]=clamp(S.g.graph[axis]+v,R.min,R.max);
}
/** 個人能力の★が上がるか見る(試合のあとに呼ぶ)。上がったら、その間にいちばん練習した能力が伸びる */
function checkInd(S,id,out){
  const I=TUNING.grow.ind, g=S.g.pl[id], card=CARDS[id];
  while(g.is<4&&g.ie>=I.need[g.is]){
    g.ie-=I.need[g.is]; g.is++;
    let best=null, bv=-1;
    for(const k of STATS){ const v=(g.tr[k]||0)*100+card[k]; if(card[k]+(g.up[k]||0)<STAT_MAX&&v>bv){ bv=v; best=k; } }
    if(best)g.up[best]=(g.up[best]||0)+I.starUp;
    g.tr={};
    out.push(nameOf(card)+" 個人能力 ★"+g.is+(best?"("+STAT_LABEL[best]+" +"+I.starUp+")":""));
    newsOf("star",[id],out);
  }
  if(g.is===4&&!g.q&&g.ie>=I.awake){ g.q=true; out.push(nameOf(card)+" に覚醒の兆し(フレンドリーマッチで勝てば覚醒)"); newsOf("q",[id],out); }
}
function checkSp(S,id,out){
  const P=TUNING.grow.sp, g=S.g.pl[id];
  if(g.ss===4&&!g.sq&&g.se>=P.awake){ g.sq=true; out.push(nameOf(CARDS[id])+" の特殊能力が極まりそうだ(フレンドリーマッチで勝てば ★5)"); }
}
/** ミーティングで★突破の3択が出る状態か */
const spReady=(S,id)=>{ const g=S.g.pl[id]; return g.ss<4&&g.se>=TUNING.grow.sp.need[g.ss]; };
/** 連携の経験を足す。**段は試合のあとに上がる**(settleLinks)。cap は相性で決まる上限 */
function linkExp(S,a,b,v,cap){
  const l=linkSet(S,a,b);
  l.cap=Math.max(l.cap||0,cap);
  if(l.lv<Math.min(l.cap,2))l.exp+=v*facK(S,"lounge");
}
/** 試合のあと、たまった経験で連携の段を上げる(黄金線=3 はここでは上がらない) */
function settleLinks(S,out){
  const L=TUNING.grow.link; let thin=0;
  for(const k in S.g.links){
    const l=S.g.links[k], p=k.split("|"), cap=Math.min(l.cap||0,2);
    while(l.lv<cap&&l.exp>=L.need[l.lv]){
      l.exp-=L.need[l.lv]; l.lv++;
      if(l.lv===1){ thin++; continue; }       // 薄線はまとめて1行にする(知らせが埋もれないように)
      out.push(nameOf(CARDS[p[0]])+" と "+nameOf(CARDS[p[1]])+" の連携が"+LINK_LABEL[l.lv]+"に");
      newsOf("link",[p[0],p[1]],out);
    }
  }
  if(thin)out.push("新しい連携(薄線)が "+thin+" 組できた");
}
/** いま盤面に並べている11人(前の試合の最後の配置。無ければクラブの既定) */
function squadXi(S){
  return (S.sq||startSquad()).slice(0,11);
}
/**
 * チーム練習を1つ行う。intensity: 0=軽め / 1=普通 / 2=ハード。
 * 強いほど経験とグラフの伸びが大きく、**全員の疲労がたまる**(試合を消耗した状態で始める)。
 */
function doTraining(S,i,intensity){
  const G0=TUNING.grow, I=G0.ind, R=G0.graph, N=G0.int, o=trainOptions(S)[i], out=[];
  if(S.g.step!=="train"||!o)return out;
  const lv=intensity==null?1:clamp(intensity,0,2), k=N.k[lv];
  const ids=Object.keys(S.g.pl);
  for(const a in S.g.graph)S.g.graph[a]*=R.decay;
  if(o.sp<0){
    for(const id of ids){
      const g=S.g.pl[id], top=STATS.slice().sort((a,b)=>CARDS[id][b]-CARDS[id][a]).slice(0,2);
      g.ie+=(I.train+(top.includes(o.param)?I.trainFit:0))*k*growK(id,S)*facK(S,"train");
      g.tr[o.param]=(g.tr[o.param]||0)+1;
    }
    graphAdd(S,PARAM_AXIS[o.param],R.basic*k);
  }else{
    const t=TRAIN_SP[o.sp], e=t.eff, all=t.up.length===6;
    for(const id of ids){
      const g=S.g.pl[id];
      g.ie+=(I.spTrain+(e.ind||0))*k*growK(id,S)*facK(S,"train");
      g.tr[o.param]=(g.tr[o.param]||0)+1;
      // 練習で入る特殊能力の経験は、★突破の話(！)の手前で止める。話はミーティングで経験を足して出す(印が増えすぎないように)
      if(e.sp){ const add=e.sp*G0.sp.train*k*facK(S,"tact"); g.se=g.ss<4&&g.se<G0.sp.need[g.ss]?Math.min(g.se+add,G0.sp.need[g.ss]-1):g.se+add; }
    }
    if(e.link){
      const xi=squadXi(S);
      for(let a=0;a<xi.length;a++)for(let b=a+1;b<xi.length;b++)
        linkExp(S,xi[a],xi[b],e.link*k*linkBonusK(xi[a],xi[b]),linkCap(xi[a],xi[b]));
    }
    if(e.set)S.g.set=Math.min(G0.set.max,S.g.set+G0.set.per*e.set*k*(tsetOf(S,"setK")||1));
    for(const a of t.up)graphAdd(S,a,(all?R.upAll:R.up)*k);
    for(const a of t.down)graphAdd(S,a,-R.down*k);
  }
  for(const id of ids){
    const g=S.g.pl[id];
    g.fat=Math.min(N.fatMax,g.fat+N.fat[lv]);
    checkSp(S,id,out);
  }
  if(N.fat[lv]>0)out.push("疲労 +"+Math.round(N.fat[lv]*100)+"%(試合はそのぶん消耗した状態で始まる)");
  S.g.step="comm"; S.g.cn=0; S.g.done=[];
  return out;
}

/**
 * 休憩。チーム練習の代わりに1手使う。経験は入らないが、疲労が大きく抜け、調子の落ちた選手が戻る
 */
function doRest(S){
  const G0=TUNING.grow, out=[];
  if(S.g.step!=="train")return out;
  const rng=mulberry32((S.seed^hashStr("rest:"+S.term+":"+S.played))>>>0);
  let up=0;
  for(const id in S.g.pl){
    const g=S.g.pl[id];
    g.fat*=G0.rest.keep;
    if(g.mot<G0.mot.start&&g.mot>=1&&rng()<G0.rest.motUp){ g.mot++; up++; }
  }
  out.push("休憩: 疲労が抜けた"+(up?"("+up+"人の調子が戻った)":""));
  S.g.step="comm"; S.g.cn=0; S.g.done=[];
  return out;
}

/* ---------- 進み具合(見える化) ---------- */

/** 個人能力の次の★までの進み(0〜1)。★4なら覚醒の兆しまで */
function indProgress(g){
  const I=TUNING.grow.ind;
  if(g.is>=5||g.q)return 1;
  return Math.min(1,g.ie/(g.is<4?I.need[g.is]:I.awake));
}
function spProgress(g){
  const P=TUNING.grow.sp;
  if(g.ss>=5||g.sq)return 1;
  return Math.min(1,g.se/(g.ss<4?P.need[g.ss]:P.awake));
}
/** 2人の連携の次の段までの進み(0〜1)。太線なら黄金線の兆しが出ているか */
function linkProgress(S,a,b){
  const L=TUNING.grow.link, l=linkOf(S,a,b);
  if(l.lv>=2)return l.gold?1:0;
  return Math.min(1,l.exp/L.need[l.lv]);
}
/** 信頼度(絆)の段 0〜3 */
const trustLv=g=>{ const t=TUNING.grow.trust; let i=0; while(i<t.length&&(g.bond||0)>=t[i])i++; return i; };
const TRUST_LABEL=["まだ遠い","打ち解けてきた","信頼している","心酔している"];

/* ---------- 選手の言葉(→docs/05 §5.3) ----------
 * 疲労・調子・成長・信頼度・出番から、いま一番言いたいことを1つ選ぶ。
 * 同じ試合の同じ選手なら毎回同じ言葉(たねで選ぶ)。 */
const VOICE={
  ready:  ["監督、少しお話ししたいことがあります。","自分の型がつかめそうなんです。聞いてもらえますか。"],
  awake:  ["体が軽い。次の試合で何かが起きそうです。","今なら何でもできる気がします。フレンドリーマッチで試させてください。"],
  near:   ["もう少しで何かつかめそうです。","練習の手応えが変わってきました。"],
  tired:  ["脚が重いです……少し休みたい。","正直、疲れがたまっています。"],
  low:    ["最近うまくいかなくて……。","自信をなくしかけています。"],
  bench:  ["そろそろ試合に出たいです。","ベンチから見ているだけなのはつらいです。"],
  high:   ["今日は調子がいいです！","絶好調です。任せてください！"],
  young:  ["もっと上手くなりたいです！","先輩たちに追いつきたいです。"],
  vet:    ["若い連中の手本にならないとな。","経験なら負けませんよ。"],
  trust:  ["監督の言うことなら信じてやります。","監督のためなら走れます。"],
  new:    ["よろしくお願いします。","まだ監督のことがよく分からなくて……。"],
  plain:  ["はい、なんでしょう。","次の試合も頑張ります。"]
};
function voiceOf(S,id){
  const g=S.g.pl[id], c=CARDS[id], G0=TUNING.grow;
  if(!g)return "";
  const k=spReady(S,id)?"ready":(g.q||g.sq)?"awake":g.mot<=1?"low":g.fat>=G0.int.tiredSign*1.5?"tired"
    :(g.bench||0)>=G0.mot.benchGrace?"bench":(indProgress(g)>=0.8&&g.is<5)?"near":g.mot>=4?"high"
    :trustLv(g)>=2?"trust":(g.bond||0)===0?"new":c.age<=21?"young":c.age>=31?"vet":"plain";
  const list=VOICE[k], r=hashStr("v:"+S.term+":"+S.played+":"+id)%list.length;
  return list[r];
}
/** 手を打ったあとの返事。res: 0=大成功 / 1=成功 / 2=失敗(個人練習・ケアは成功) */
const REACT={
  ind:   [["ありがとうございます！手応えがありました。"],["勉強になりました。"],["……はい。"]],
  talk:  [["気持ちが楽になりました！"],["ありがとうございます。切り替えます。"],["……分かりました。"]],
  meet:  [["監督、やってみます！","目が覚めました！"],["分かりました。考えてみます。"],["それは……少し違う気がします。"]],
  lounge:[["あいつとは息が合いそうです！"],["悪くない時間でした。"],["……どうも噛み合わないな。"]]
};
function reactOf(S,id,kind,res){
  const t=REACT[kind]||REACT.ind, list=t[Math.max(0,Math.min(2,res))], r=hashStr("r:"+S.term+":"+S.played+":"+id+":"+kind)%list.length;
  return nameOf(CARDS[id])+"「"+list[r]+"」";
}

/* ---------- ② コミュニケーション(最大3回) ---------- */

const commLeft=S=>S.g.step==="comm"?TUNING.grow.comm.max-S.g.cn:0;
/** コミュニケーションを1回使う。使い切ったら試合へ */
function useComm(S,kind){
  S.g.cn++; S.g.done.push(kind);
  if(S.g.cn>=TUNING.grow.comm.max)S.g.step="ready";
}
const canComm=S=>S.g.step==="comm"&&S.g.cn<TUNING.grow.comm.max;

/** 個人練習。1人を呼び出して個別に指導する。個人能力の経験が入る(★は試合のあとに上がる) */
function doIndTrain(S,id){
  const C=TUNING.grow.comm, g=S.g.pl[id], out=[];
  if(!canComm(S)||!g)return { res:-1, lines:out };
  // 重なったカード1枚ごとに +10%(→docs/08 §8.12)
  g.ie+=C.ind*growK(id,S)*facK(S,"train")*(spBoost(S,"indExp")||1)*(1+TUNING.grow.dup.indK*dupOf(S,id))*(tsetOf(S,"indK")||1);
  g.bond++;
  out.push(nameOf(CARDS[id])+" に個別指導(個人能力の経験 +"+C.ind+")");
  // スポンサーの効果: 秘書がもう1人の先発にも経験の半分を入れる
  const si=spBoost(S,"indSec");
  if(si&&mulberry32((S.seed^hashStr("isec:"+S.term+":"+S.played+":"+S.g.cn))>>>0)()<si){
    const o=S.sq.slice(0,11).filter(x=>x!==id&&S.g.pl[x]&&S.g.pl[x].is<5).sort((a,b)=>S.g.pl[a].is-S.g.pl[b].is)[0];
    if(o){ S.g.pl[o].ie+=C.ind*0.5*growK(o,S)*facK(S,"train"); out.push("💬 "+secOf(S).name+"が "+nameOf(CARDS[o])+" の練習も見てくれた(経験の半分)"); }
  }
  useComm(S,"ind");
  return { res:1, lines:out };
}
/** ケア。調子の落ちた選手を立て直す。モチベーションが上がる。**ケガの選手は手当てで「不調」まで戻る**(→docs/08 §8.8) */
function doTalk(S,id){
  const C=TUNING.grow.comm, g=S.g.pl[id], out=[];
  if(!canComm(S)||!g)return { res:-1, lines:out };
  const was=g.mot;
  g.mot=Math.min(4,g.mot+(g.mot<=2?C.talkLow:C.talk));
  g.bond++;
  // スポンサーの効果: もう1段上がることがある / 秘書がもう1人の落ちた先発もケアする
  const rc=mulberry32((S.seed^hashStr("care:"+S.term+":"+S.played+":"+S.g.cn+":"+id))>>>0);
  const ca=spBoost(S,"care"); if(ca&&was>0&&g.mot<4&&rc()<ca)g.mot++;
  const cs=spBoost(S,"careSec");
  if(cs&&rc()<cs){
    const o=S.sq.slice(0,11).filter(x=>x!==id&&S.g.pl[x]&&S.g.pl[x].mot>0&&S.g.pl[x].mot<=2).sort((a,b)=>S.g.pl[a].mot-S.g.pl[b].mot)[0];
    if(o){ const q=S.g.pl[o], w=q.mot; q.mot=Math.min(4,q.mot+1); out.push("💬 "+secOf(S).name+"が "+nameOf(CARDS[o])+" もケアしてくれた("+MOT_LABEL[w]+" → "+MOT_LABEL[q.mot]+")"); }
  }
  if(was===0)g.injN=0;
  out.push(nameOf(CARDS[id])+(was===0?" のケガを手当てした(":" をケアした(")+MOT_LABEL[was]+" → "+MOT_LABEL[g.mot]+")");
  useComm(S,"talk");
  return { res:1, lines:out };
}
/**
 * ラウンジで見える2人の様子。相性の組そのものは見せない。
 * 様子の文は相性を映すが、hintNoise の率で隣の相性の文になる(見れば答えが決まる当て物にしない)。
 * 同じ試合の同じ2人なら毎回同じ文
 */
function loungeInfo(S,a,b){
  const c=compatOf(a,b), l=linkOf(S,a,b);
  const r=mulberry32((S.seed^hashStr("lh:"+S.term+":"+S.played+":"+lkey(a,b)))>>>0);
  let h=c;
  if(r()<TUNING.grow.link.hintNoise)h=c===0?1:c===2?1:(r()<0.5?0:2);
  return { compat:c, hint:LOUNGE_HINT[h], lv:l.lv, gold:l.gold, choices:LOUNGE_CHOICE };
}
/**
 * ラウンジ。2人を呼び出して3択に答える。結果は 0=大成功 / 1=成功 / 2=失敗。
 * 相性に合う手ほど大成功しやすい。太線の2人が大成功すると、黄金線の兆しが出る。
 */
function doLounge(S,a,b,choice){
  const L=TUNING.grow.link, out=[];
  if(!canComm(S)||a===b||!S.g.pl[a]||!S.g.pl[b])return { res:-1, lines:out };
  const c=compatOf(a,b), best=LOUNGE_BEST[c];
  const p0=choice===best?L.pFit:choice===(best+1)%3?L.pMid:L.pBad, ok=(spBoost(S,"loungeOk")||0)+(tsetOf(S,"loungeOk")||0);
  const p=[p0[0]+ok,p0[1],Math.max(0,p0[2]-ok)];   // スポンサーの効果: 失敗のぶんが大成功に回る
  const r=mulberry32((S.seed^hashStr("lg:"+S.term+":"+S.played+":"+S.g.cn+":"+lkey(a,b)+":"+choice))>>>0)();
  const res=r<p[0]?0:r<p[0]+p[1]?1:2, l=linkSet(S,a,b);
  out.push(["大成功！","成功","失敗…"][res]);
  if(res<2){
    // 太線の2人は、**大成功のときだけ**黄金線の兆しが出る。ラウンジは相性に関係なく太線まで育てられる
    if(l.lv===2){ if(res===0&&!l.gold){ l.gold=true; out.push("フレンドリーマッチで新たな連携が生まれそうだ"); } }
    else{ linkExp(S,a,b,L.lounge[res]*(spBoost(S,"loungeExp")||1),2); out.push("連携の経験 +"+L.lounge[res]+"(試合のあとに太くなる)"); }
    S.g.pl[a].bond++; S.g.pl[b].bond++;
  }else secFollow(S,[],[a,b],out,"lg:"+lkey(a,b),spBoost(S,"loungeSec")||0);
  useComm(S,"lounge");
  return { res, lines:out };
}
/**
 * ミーティングが一緒に効く「周り」の選手(→docs/08 §8.3: 仲のよい選手など)。合わせて near.max 人まで:
 *   ① 呼んだ選手と連携のある登録選手(太い順)
 *   ② 呼んだ選手が先発なら、SQUAD の盤面(S.layout の [h, x])で近い先発(距離 near.r 以内。距離は h と x/100 の直線)
 */
function meetNear(S,id){
  fillLayout(S);                              // 先発の位置が無ければ陣形の枠で埋める(何度呼んでも同じ)
  const N=TUNING.grow.sp.near, on=S.sq.slice(0,11), me=S.layout[id];
  const linked=S.sq.filter(x=>x!==id&&S.g.pl[x]&&linkOf(S,id,x).lv>0).sort((a,b)=>linkOf(S,id,b).lv-linkOf(S,id,a).lv);
  const close=on.includes(id)&&me?on.filter(x=>x!==id&&S.layout[x]&&S.g.pl[x]&&!linked.includes(x))
    .map(x=>({ x, d:Math.hypot(S.layout[x][0]-me[0],(S.layout[x][1]-me[1])/100) }))
    .filter(o=>o.d<=N.r).sort((a,b)=>a.d-b.d).map(o=>o.x):[];
  return linked.concat(close).slice(0,N.max);
}
function meetInfo(S,id){
  const g=S.g.pl[id];
  return { ready:spReady(S,id), pers:PERS_LABEL[persOf(id)], choices:MEET_CHOICE, mot:g.mot, ss:g.ss, se:g.se,
    need:g.ss<4?TUNING.grow.sp.need[g.ss]:TUNING.grow.sp.awake, near:meetNear(S,id) };
}
/**
 * ミーティング。1人を呼び出す。特殊能力の経験がたまる。
 * 経験が満ちていれば★突破の3択が出る(choice)。性格に合う言い方ほど成功しやすい。
 */
function doMeeting(S,id,choice){
  const P=TUNING.grow.sp, g=S.g.pl[id], out=[];
  if(!canComm(S)||!g)return { res:-1, lines:out };
  const mot0=g.mot;
  let res=1;
  if(spReady(S,id)){
    const p=(choice===persOf(id)?P.qOk:P.qNg)+(tsetOf(S,"qOk")||0);   // 名将: ★突破が成功しやすい
    const r=mulberry32((S.seed^hashStr("mt:"+S.term+":"+S.played+":"+S.g.cn+":"+id+":"+choice))>>>0)();
    if(r<p){
      g.se-=P.need[g.ss]; g.ss++; res=0;
      out.push(nameOf(CARDS[id])+" 特殊能力 ★"+g.ss);
    }else{
      g.se=Math.floor(g.se*P.failKeep); res=2;
      if(g.mot>0)g.mot=Math.max(1,g.mot-1);
      out.push(nameOf(CARDS[id])+" の心に響かなかった…(やる気が下がった)");
    }
  }else{
    g.se+=P.meet*facK(S,"tact")*(tsetOf(S,"meetK")||1);
    out.push(nameOf(CARDS[id])+" と戦術の話をした(特殊能力の経験 +"+P.meet+")");
  }
  g.bond+=2;
  checkSp(S,id,out);
  // 周りにも効く: 話を聞いていた近くの選手にも経験が入る。★突破の成否は周りのやる気にも響く
  const N=P.near, near=meetNear(S,id);
  if(near.length){
    const rn=mulberry32((S.seed^hashStr("mn:"+S.term+":"+S.played+":"+S.g.cn+":"+id))>>>0);
    const add=Math.round(P.meet*N.se), up=[], down=[];
    for(const x of near){
      const q=S.g.pl[x];
      if(q.ss<5){ q.se+=add; checkSp(S,x,out); }
      q.bond++;
      if(res===0&&rn()<N.up&&q.mot>0&&q.mot<4){ q.mot++; up.push(x); }
      else if(res===2&&rn()<N.down&&q.mot>1){ q.mot--; down.push(x); }
    }
    out.push("周りの "+near.map(x=>nameOf(CARDS[x])).join("・")+" も聞いていた(特殊能力の経験 +"+add+")");
    if(up.length)out.push(up.map(x=>nameOf(CARDS[x])).join("・")+" も奮い立った(やる気が上がった)");
    if(down.length)out.push(down.map(x=>nameOf(CARDS[x])).join("・")+" にも動揺が広がった(やる気が下がった)");
    if(res===2)secFollow(S,[[id,mot0]].concat(down.map(x=>[x,S.g.pl[x].mot+1])),[],out,"mt:"+id);
  }else if(res===2)secFollow(S,[[id,mot0]],[],out,"mt:"+id);
  useComm(S,"meet");
  return { res, lines:out };
}
/** 残りのコミュニケーションを使わずに試合へ */
function skipComm(S){ if(S.g.step==="comm")S.g.step="ready"; }
/**
 * 選手の上に「！」が出るか(★突破の3択が待っている / やる気が絶不調)。
 * **疲労では出さない**(練習のたびに全員に付いて、印の意味が無くなるため。疲労は選手一覧と秘書が伝える)
 */
/** 「！」の印。★突破の話がある選手と、先発で絶不調の選手だけ(控えにまで付けると印の意味が薄れる) */
function hasSign(S,id){ const g=S.g.pl[id]; return spReady(S,id)||(g.mot<=1&&S.sq.indexOf(id)<11); }

/* ---------- ③ 試合のあと ---------- */

/** 重なったカードの枚数(持っている枚数 − 1。数えるのは dup.max まで) */
const dupOf=(S,id)=>Math.min(TUNING.grow.dup.max,Math.max(0,((S.coll&&S.coll[id])||1)-1));
/** 覚醒で1項目に上がる値(1〜3 = 無地 / ＋ / ＋＋)。重なりが多いほど大きい値が出やすい */
function awakeGain(S,id,rng){
  const D=TUNING.grow.dup, n=dupOf(S,id), p=D.awakeP.map((v,i)=>Math.max(0,v+D.awakeStep[i]*n)), t=p.reduce((a,b)=>a+b,0);
  let r=rng()*t; for(let i=0;i<3;i++){ if(r<p[i])return i+1; r-=p[i]; } return 1;
}
const GAIN_MARK=["","","＋","＋＋"];
/** 覚醒。能力が最大3項目、各+1〜3(どれが上がるか・いくつ上がるかは不定。1つは必ず上がる。重なりで大きくなりやすい) */
function awaken(S,id,rng,out){
  const I=TUNING.grow.ind, g=S.g.pl[id], card=CARDS[id], got=[];
  const pool=STATS.filter(k=>card[k]+(g.up[k]||0)<STAT_MAX&&card[k]>TUNING.grow.startKeep);
  for(let n=0;n<3&&pool.length;n++){
    if(n>0&&rng()>=I.awakeUp[n])break;
    const k=pool.splice(Math.floor(rng()*pool.length),1)[0];
    const v=Math.min(awakeGain(S,id,rng),STAT_MAX-card[k]-(g.up[k]||0));
    g.up[k]=(g.up[k]||0)+v; got.push(STAT_LABEL[k]+" +"+v+GAIN_MARK[v]);
  }
  g.is=5; g.q=false; g.ie=0;
  out.push("⭐ "+nameOf(card)+" が覚醒！("+got.join("・")+")");
  if(S.ts&&S.ts.awake!=null)S.ts.awake++;
  newsOf("awake",[id],out);
}
/**
 * 試合の結果を育成に反映する。**★の上昇・覚醒・連携の変化はここで起きる**。
 *   res.played  … その試合に出た選手 / res.onPitch … 最後に盤面に居た選手 / res.win
 * フレンドリーマッチに勝つと、兆しのある選手・連携が開花する(必ずではない)。
 */
/* 試合のあとの知らせ(誰に何が起きたか)。ロッカールームで話す選手を選ぶのに使う(→docs/07 §7.12)。
 * 試合のあとだけ集める(練習・コミュニケーションの最中は集めない) */
let GROW_NEWS=null;
function newsOf(kind,ids,out){ if(GROW_NEWS)GROW_NEWS.push({ kind, ids, line:out[out.length-1] }); }
function afterMatchGrowth(S,fx,res){
  const G0=TUNING.grow, I=G0.ind, L=G0.link, Mo=G0.mot, N=G0.int, out=[];
  GROW_NEWS=res.news=[];
  const rng=mulberry32((S.seed^hashStr("gr:"+S.term+":"+S.played))>>>0);
  const played=res.played.filter(id=>S.g.pl[id]), on=res.onPitch.filter(id=>S.g.pl[id]);
  for(const id of played)S.g.pl[id].ie+=I.match*growK(id,S)*facK(S,"train");
  for(let a=0;a<on.length;a++)for(let b=a+1;b<on.length;b++)
    linkExp(S,on[a],on[b],L.match*linkBonusK(on[a],on[b]),linkCap(on[a],on[b]));
  for(const id in S.g.pl)checkInd(S,id,out);
  settleLinks(S,out);
  if(fx.kind==="friendly"&&res.win){
    for(const id of on){
      const g=S.g.pl[id];
      if(g.q&&rng()<I.awakeP)awaken(S,id,rng,out);
      if(g.sq&&rng()<G0.sp.star5P){ g.ss=5; g.sq=false; g.se=0; out.push("⭐ "+nameOf(CARDS[id])+" の特殊能力が ★5 に(スタイルが極まる)"); newsOf("star5",[id],out); }
    }
    // 黄金線は1試合に1本まで(兆しのある組のうち、たねで1つ選ぶ)
    const cand=Object.keys(S.g.links).filter(k=>{ const l=S.g.links[k], p=k.split("|");
      return l.gold&&l.lv===2&&on.includes(p[0])&&on.includes(p[1]); });
    if(cand.length&&rng()<L.goldP){
      const k=cand[Math.floor(rng()*cand.length)], l=S.g.links[k], p=k.split("|");
      l.lv=3; l.gold=false;
      out.push("✨ "+nameOf(CARDS[p[0]])+" と "+nameOf(CARDS[p[1]])+" の連携が黄金の輝きに");
      if(S.ts&&S.ts.gold!=null)S.ts.gold++;
      newsOf("gold",[p[0],p[1]],out);
    }
  }
  // 疲労: 出た選手は試合のぶん溜まり、全員が次までに半分ほど抜ける
  for(const id in S.g.pl){
    const g=S.g.pl[id];
    g.fat=Math.min(N.fatMax,(g.fat+(played.includes(id)?N.matchLoad*(spBoost(S,"noFat")||1):0))*N.recover*medFat(S));
  }
  // ケガ(→docs/08 §8.8): 試合の中でケガをした選手は「ケガ」に。前からのケガは確率で治る(続いても maxN 試合で治る)
  const J=TUNING.inj, newInj=(res.inj||[]).filter(id=>S.g.pl[id]);
  for(const id in S.g.pl){
    const g=S.g.pl[id];
    if(newInj.includes(id)){ g.mot=0; g.injN=1; out.push("🩹 "+nameOf(CARDS[id])+" がケガ(治るまで能力が落ちる。ケアで手当てできる)"); newsOf("inj",[id],out); }
    else if(g.mot===0){
      if((g.injN||0)>=J.maxN||rng()<J.heal+medHeal(S)){ g.mot=J.healTo; g.injN=0; out.push(nameOf(CARDS[id])+" のケガが治った"); }
      else{ g.injN=(g.injN||0)+1; out.push(nameOf(CARDS[id])+" のケガが続いている"); }
    }
  }
  const giant=tsetOf(S,"giant")&&fx.opp&&TEAMS[fx.opp]&&tierOf(fx.opp)>=S.grade+2?tsetOf(S,"giant"):0;   // 刺客(格上 = 強さの段がリーグの格より2つ以上上)
  // モチベーション(→docs/08 §8.4): 出て勝てば上がり、負ければ下がる。
  // 控えは出番の無い試合が続くと下がり始めるが、ゆるやか。勝てば控えも少し上がる。何も起きなければ普通へ戻る
  for(const id in S.g.pl){
    const g=S.g.pl[id], was=g.mot;
    if(g.mot===0||newInj.includes(id)){ if(!played.includes(id))g.bench=(g.bench||0)+1; else g.bench=0; continue; }
    const sw=motSwing(id);                    // 若いほどむらがある
    if(played.includes(id)){
      g.bench=0;
      if(res.win&&rng()<Mo.winUp*sw*(tsetOf(S,"winUpK")||1))g.mot=Math.min(4,g.mot+1);
      else if(res.win&&giant&&rng()<giant)g.mot=Math.min(4,g.mot+1);   // 刺客: 格上に勝つと上がりやすい
      else if(res.lose&&rng()<Mo.loseDown*sw*(spBoost(S,"keepForm")??1)*(fx.kind==="cup"?(tsetOf(S,"cupKeep")||1):1))g.mot=Math.max(1,g.mot-1);
      else if(!res.win&&!res.lose&&rng()<Mo.drawSwing*sw)g.mot=clamp(g.mot+(rng()<0.5?1:-1),1,4);
    }else{
      g.bench=(g.bench||0)+1;
      if(g.bench>=Mo.benchGrace&&rng()<Mo.benchDown*sw*(spBoost(S,"bench")??1)*(tsetOf(S,"benchK")||1))g.mot=Math.max(1,g.mot-1);
      else if(res.win&&rng()<Mo.teamWinUp)g.mot=Math.min(4,g.mot+1);
    }
    if(g.mot===was&&g.mot!==Mo.start&&rng()<Mo.revert)g.mot+=g.mot<Mo.start?1:-1;
  }
  S.g.step="train"; S.g.opts=null; S.g.cn=0; S.g.done=[];
  GROW_NEWS=null;
  return out;
}

/** 監督室の短い会話(親密度のイベント)。答えごとに親密度が上がる量 */
const SEC_EVENTS=[
  { q:"差し入れを持ってきました。どれにしますか？", ch:[["コーヒーを頼む",2],["紅茶がいいな",2],["今はいらない",0]] },
  { q:"次の相手の資料、まとめておきましょうか？", ch:[["頼む。助かるよ",3],["自分でやるよ",1]] },
  { q:"今日のスタジアム、すごい歓声でしたね。", ch:[["君の支えのおかげだ",3],["選手たちのおかげだ",2],["まだまだこれからだ",1]] },
  { q:"お休みの日は、何をしているんですか？", ch:[["試合の研究だ",1],["街を散歩している",2],["それは秘密だ",2]] },
  { q:"選手たちの写真、クラブの広報に使ってもいいですか？", ch:[["いい写真を頼む",2],["任せるよ",3],["試合に集中させたい",1]] }
];
const SEC_EV_REPLY=["……そうですか。","はい！","ふふ、ありがとうございます。","監督……うれしいです。"];
const secOf=S=>SECS.find(x=>x.id===(S.sec&&S.sec.id))||SECS[0];
const secBond=S=>(S.sec&&S.sec.bond[secOf(S).id])||0;
function secLv(S){ const t=TUNING.sec.lv, b=secBond(S); let i=0; while(i<t.length&&b>=t[i])i++; return i; }
function newSec(){ return { id:"s0", bond:{}, chosen:false, ev:null }; }
/** 秘書の言葉。key の言葉を、いまの秘書の口調と親密度で返す */
function secSay(S,key,vars){
  const L=SEC_LINES[secOf(S).id]||SEC_LINES.s0;
  let t=L[key]!=null?L[key]:SEC_LINES.s0[key];
  if(Array.isArray(t))t=t[secLv(S)>=2?1:0];
  t=t||"";
  for(const k in (vars||{}))t=t.split("{"+k+"}").join(vars[k]);
  return t;
}
/** 親密度を上げる。段が上がったら秘書の一言を返す */
function secGain(S,v){
  if(!S.sec||v<=0)return null;
  const id=secOf(S).id, lv0=secLv(S);
  S.sec.bond[id]=(S.sec.bond[id]||0)+v;
  const lv=secLv(S);
  return lv>lv0?"💬 "+secOf(S).name+"との仲が「"+SEC_LV_LABEL[lv]+"」に"+(lv===SEC_LV_LABEL.length-1?"。「"+secSay(S,"lvup")+"」":""):null;
}
function chooseSec(S,id){ if(!SECS.some(x=>x.id===id))return false; S.sec.id=id; S.sec.chosen=true; return true; }
/** 監督室の会話に答える。親密度が上がる量を返す */
function answerSecEvent(S,i){
  const ev=SEC_EVENTS[S.sec.ev]; if(!ev||!ev.ch[i])return null;
  const v=ev.ch[i][1]; S.sec.ev=null;
  const up=secGain(S,v);
  return { v, line:secOf(S).name+"「"+SEC_EV_REPLY[Math.min(3,v)]+"」", up };
}
/**
 * 秘書のフォロー。コミュニケーションが失敗したときに呼ぶ。起きたら下がったやる気を戻す(drops: [[id, 元のやる気]])、
 * ups の選手はやる気を1段上げる。起きたかどうかを返す
 */
function secFollow(S,drops,ups,out,salt,plus){
  if(!S.sec)return false;
  const p=TUNING.sec.follow[secLv(S)]+(plus||0);   // plus … スポンサーの効果(旅行・航空)
  const r=mulberry32((S.seed^hashStr("sf:"+S.term+":"+S.played+":"+S.g.cn+":"+salt))>>>0)();
  if(r>=p)return false;
  const names=[];
  for(const [id,was] of drops){ const g=S.g.pl[id]; if(g&&g.mot>0&&g.mot<was){ g.mot=was; names.push(nameOf(CARDS[id])); } }
  for(const id of ups){ const g=S.g.pl[id]; if(g&&g.mot>0&&g.mot<4){ g.mot++; if(!names.includes(nameOf(CARDS[id])))names.push(nameOf(CARDS[id])); } }
  if(!names.length)return false;
  out.push("💬 秘書のフォロー: "+secOf(S).name+"「"+secSay(S,"follow",{ n:names.join("・") })+"」(やる気が戻った)");
  return true;
}

/** チーム力 = 先発11人の、育成を反映した能力の合計の平均(→docs/09 第2弾)。任期の始めからの伸びを見せる */
function teamPower(S){
  const xi=S.sq.slice(0,11); let t=0;
  for(const id of xi){ const c=growCard(S,CARDS[id]); t+=STATS.reduce((a,k)=>a+c[k],0); }
  return t/xi.length;
}

     ② 年俸が決まり、累計に積み上がる。累計で施設レベルが上がる(特殊練習が出やすくなる)
     ③ 絆の深い選手(最大3人)が、育成後のまま次の任期についてくる
     ④ 称号によっては、次の任期をリーグの格が高い状態から始める
   任期中の記録は S.ts に、終わりの結果は S.tend に、歴代は S.career に持つ。
   ========================================================================= */

/** 任期中の記録(称号の条件に使う) */
function newTermStats(){
  // awake・gold … この任期に起きた覚醒・黄金線の数(ついてきた選手の★・線は数えない)/ pow0 … 任期の始めのチーム力
  return { kpCh:0, subs:0, used:[], topW:0, psoW:0, psoL:0, frW:0, awake:0, gold:0, pow0:null };
}

/**
 * 監督称号。**上から順に見て、最初に条件を満たしたもの**が付く。
 *   名前は本家の称号から借りたもの。条件は本作で決めた(→docs/05 §5.8)
 *   grade … 次の任期を始めるリーグの格 / bonus … 年俸の上乗せ(億)
 */
const TITLES=[
  { id:"legend",  name:"レジェンド",   grade:3, bonus:120, need:"S の大会を3つ以上制覇し、勝率 70% 以上",
    ok:x=>x.sWins>=3&&x.wr>=0.70 },

    ok:x=>x.sWins>=1&&x.lgWins>=2 },
  { id:"master",  name:"名将",         grade:3, bonus:70,  need:"タイトル8つ以上、勝率 60% 以上",
    ok:x=>x.titles>=8&&x.wr>=0.60 },
  { id:"factory", name:"覚醒工場",     grade:2, bonus:50,  need:"8人以上を覚醒させ、勝ち越した",
    ok:x=>x.awake>=8&&x.w>x.l },               // 集中育成では3人ほどが普通(→docs/08 §8.5)。負け越しでは付かない(ブラッシュアップ会議 →docs/09)

/** 称号の条件に使う数字を集める */
function termFacts(S){
  const t=S.titles.filter(x=>x.term===S.term), pl=Object.values(S.g.pl), r=S.rec, n=r.w+r.d+r.l;
  return { w:r.w, d:r.d, l:r.l, wr:n?r.w/n:0, titles:t.length,
    sWins:t.filter(x=>COMPS[x.comp].grade==="S").length,
    lgWins:t.filter(x=>x.comp==="LG").length,
    koWins:t.filter(x=>x.comp!=="LG"&&x.comp!=="W4").length,
    // この任期に起きた数で数える(前の任期からついてきた覚醒済みの選手や黄金線は入れない。→docs/09 第2弾)
    awake:S.ts.awake!=null?S.ts.awake:pl.filter(g=>g.is>=5).length,
    gold:S.ts.gold!=null?S.ts.gold:Object.values(S.g.links).filter(l=>l.lv>=3).length,
    money:S.biz?S.biz.earn:S.money-S.money0,   // 稼いだ額(施設やスタジアムに使っても減らない)
    kpCh:S.ts.kpCh, subs:S.ts.subs, used:S.ts.used.length, topW:S.ts.topW, psoW:S.ts.psoW, psoL:S.ts.psoL };
}
/** 絆の深い選手(次の任期についてくる候補)。絆が mono 以上で、深い順に max 人 */
function followers(S){
  const T=TUNING.term;
  return Object.keys(S.g.pl).filter(id=>S.g.pl[id].bond>=T.bondMin)
    .sort((a,b)=>S.g.pl[b].bond-S.g.pl[a].bond||(a<b?-1:1)).slice(0,T.follow);
}
/** 施設レベル。累計の年俸で上がる */
function facLevel(total){
  const th=TUNING.term.facAt; let lv=1;
  while(lv<=th.length&&total>=th[lv-1])lv++;
  return lv;
}
/** 任期が終わった瞬間に呼ぶ。結果を S.tend に置き、歴代に積む */
function endTerm(S){
  const T=TUNING.term, x=termFacts(S), title=TITLES.find(t=>t.ok(x));
  const salary=Math.round(T.salaryBase+x.money*T.salaryK+title.bonus);
  const before=facLevel(S.salary);
  S.salary+=salary;
  S.fac=facLevel(S.salary);
  S.tend={ term:S.term, title:title.id, salary, total:S.salary, fac:S.fac, facUp:S.fac>before,
    grade:title.grade, follow:followers(S), facts:x };
  S.career.push({ term:S.term, title:title.id, w:x.w, d:x.d, l:x.l, titles:x.titles, salary, money:Math.round(x.money) });   // money … その任期に稼いだ資金(最高額を競う)
  return S.tend;
}
/**
 * 次の任期を始める。ついてくる選手は★・能力・特殊能力を保ったまま。
 * 互いの連携(線)も残る。やる気は好調、疲労は0から。
 */
function startNextTerm(S,W){
  const end=S.tend, keep=end?end.follow:[], old=S.g;
  newTerm(S,W);
  if(!end)return;
  S.grade=Math.max(1,end.grade);
  if(S.biz)spRenew(S);                         // 引き継いだ格でスポンサーの候補を出し直す
  S.league=newLeague(S,W);
  for(const id of keep){
    const o=old.pl[id], g=S.g.pl[id];        // 登録を外れていればついてこない
    if(!o||!g)continue;
    Object.assign(g,{ is:o.is, ss:o.ss, up:Object.assign({},o.up), ie:0, se:0, q:false, sq:false,
      bond:Math.floor(o.bond/2), followed:true });
  }
  for(const k in old.links){
    const p=k.split("|");
    if(keep.includes(p[0])&&keep.includes(p[1])&&old.links[k].lv>0)
      S.g.links[k]={ lv:old.links[k].lv, exp:0, gold:false, cap:old.links[k].cap||0 };
  }
  S.tend=null;
}
const titleOf=id=>TITLES.find(t=>t.id===id)||TITLES[TITLES.length-1];

/* ---------- 称号のセット(監督能力の継承。→docs/10 §10.2 B) ----------
 * 任期の始めに、これまでに獲った称号から1つを選んでセットする。その任期のあいだ:
 *   favor … 出やすくなる特殊練習(eff = 伸びるもの / axis = 上がる戦力グラフの軸)。spK … 特殊練習が出る率の倍率
 *   ほかは小さな効き目(数値は TUNING.tset)
 * S.tset = 称号の id | null、S.tsetChosen = その任期に選んだか */
const TITLE_FX={
  legend:   { favor:null,              desc:"特殊練習がどの系統も出やすい" },
  emperor:  { favor:{ axis:"ORDCSP" }, desc:"戦力グラフを伸ばす特殊練習 ・ 大会の試合で負けてもやる気が下がりにくい" },
  master:   { favor:{ eff:"sp" },      desc:"特殊能力の特殊練習 ・ ミーティングの★突破が成功しやすい" },
  factory:  { favor:{ eff:"ind" },     desc:"個人能力の特殊練習 ・ 個人練習の経験 +10%" },
  magic:    { favor:{ eff:"sp" },      desc:"特殊能力の特殊練習 ・ ミーティングの経験 +10%" },
  heir:     { favor:{ eff:"link" },    desc:"連携の特殊練習 ・ ラウンジが大成功しやすい" },
  assassin: { favor:{ axis:"DC" },     desc:"守備・奪取の特殊練習 ・ 格上に勝つとやる気が上がりやすい" },
  tactician:{ favor:{ eff:"set" },     desc:"セットプレイの特殊練習 ・ セットプレイの伸び +20%" },
  native:   { favor:{ eff:"ind" },     desc:"個人能力の特殊練習 ・ 21歳以下の伸びやすさ +10%" },
  fickle:   { favor:{ axis:"S" },      desc:"スピードの特殊練習 ・ 控えのやる気が下がりにくい" },
  fighter:  { favor:{ axis:"O" },      desc:"攻撃の特殊練習 ・ 勝つとやる気が上がりやすい" }
};
/** これまでに獲った称号のうち、セットできるもの(効き目のあるもの。新しい順) */
function earnedTitles(S){ const out=[]; for(let i=S.career.length-1;i>=0;i--){ const id=S.career[i].title; if(TITLE_FX[id]&&!out.includes(id))out.push(id); } return out; }
/** いまセットしている称号の数値(TUNING.tset)。セットしていなければ null */
const tsetOf=(S,k)=>S&&S.tset&&TUNING.tset[S.tset]&&TUNING.tset[S.tset][k]!=null?TUNING.tset[S.tset][k]:null;
function setTitle(S,id){ if(id&&!earnedTitles(S).includes(id))return false; S.tset=id||null; S.tsetChosen=true; return true; }
/** 特殊練習の重み。セットした称号の系統に合うものは favorW 倍 */
function trainWeight(S,t){
  const f=S&&S.tset&&TITLE_FX[S.tset]&&TITLE_FX[S.tset].favor; if(!f)return 1;
  const hit=(f.eff&&t.eff[f.eff])||(f.axis&&t.up&&f.axis.split("").some(a=>t.up.includes(a)));
  return hit?TUNING.tset.favorW:1;
}

//   ・自分のクラブの組み替えは opts.design で渡す(pftb の S.club は持たない)
//   ・実在クラブの色(#rrggbb)を地の色にそのまま使える(opts.color)
//   ・★(ワールドクラブカップの数)は出さない / クラブの一覧に頼らない / 文字のエスケープは embEsc
// 以下の注記の §番号は pftb の docs/10 を指す
// **絵を1枚も持たずに描く**。クラブは 144 + カップの架空名 40 の 184 個あり、
// 汎用のパターン画像を数枚用意しても「15クラブが同じ絵柄」になって個性が減る。
// 形 × 地の柄 × 紋章 × 色相 の組み合わせなら、全部に別の顔を配れて index.html も太らない。
//
// **クラブIDから決まる**(世界のたねと同じ流儀)。クラブを足せばエンブレムも生える。
// 自分のクラブだけは CLUB 画面で好きに組み替えられる(→S.club.emblem)。

 * インクカラーはレモンのように非常に明るいものがあり、白字だと消える。
 */
function embLum(hex){
  const v=String(hex||"").replace("#","");
  if(v.length<6)return 0.5;
  const r=parseInt(v.slice(0,2),16)/255, g=parseInt(v.slice(2,4),16)/255,
        b=parseInt(v.slice(4,6),16)/255;
  return 0.2126*r+0.7152*g+0.0722*b;      // sRGB の相対輝度(ざっくり)
}
/** 少し暗くした色(縁や字の縁取りに使う)。 */
function embShade(hex,k){
  const v=String(hex||"").replace("#","");
  if(v.length<6)return hex;
  const f=x=>Math.max(0,Math.min(255,Math.round(parseInt(x,16)*k)));
  const h=n=>n.toString(16).padStart(2,"0");
  return "#"+h(f(v.slice(0,2)))+h(f(v.slice(2,4)))+h(f(v.slice(4,6)));
}

const embEsc=s=>String(s).replace(/[&<>"]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

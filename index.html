/** 読み込んだセーブに世界を作り直して返す(世界はたねから決まる) */
function worldOf(S){ return genWorld(S.seed); }

/* ---------- リーグ ---------- */

/** 8クラブの2回総当たり。r(0〜13)節の対戦を [ホーム, アウェイ] の配列で返す */
function leagueRound(clubs,r){
  const n=clubs.length, half=n-1, k=r%half, arr=clubs.slice(1), out=[];
  const rot=arr.slice(k).concat(arr.slice(0,k)), list=[clubs[0]].concat(rot);
  for(let i=0;i<n/2;i++){
    const a=list[i], b=list[n-1-i];
    // 前半(7節)で決めた向きを、後半はそっくり裏返す → どの組もホームとアウェイが1回ずつ
    const fwd=(i+k)%2===0;
    out.push(fwd===(r<half)?[a,b]:[b,a]);
  }
  return out;
}
function addTable(table,h,a,hg,ag){
  const H=table[h], A=table[a];
  H.p++; A.p++; H.gf+=hg; H.ga+=ag; A.gf+=ag; A.ga+=hg;
  if(hg>ag){ H.w++; A.l++; H.pts+=3; }
  else if(hg<ag){ A.w++; H.l++; A.pts+=3; }
  else{ H.d++; A.d++; H.pts++; A.pts++; }
}
function sortTable(table){
  return Object.keys(table).sort((a,b)=>{
    const x=table[a], y=table[b];
    return y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||(a<b?-1:1);
  });
}
/** 相手どうしの試合を解く。どちらも監督つき */
function simCpu(a,b,seed){
  const M=simulateMatch(makeTeamDef(a,true),makeTeamDef(b,true),seed);
  return [M.home.score,M.away.score];
}

/* ---------- 次の試合 ---------- */

/** その大会に出られるか(→docs/05 §5.7)。prev は前の周の成績 */
function entryOk(S,id){
  const p=S.prev, won=S.cups, wonNow=x=>won[x].st==="won", wonPrev=x=>!!p&&p.won.includes(x);
  switch(id){
    case "PRE": case "ENT": case "KINGS": return true;
    case "NSC":   return wonNow("PRE")||wonNow("KINGS");
    case "W4":    return !!p&&p.rank<=4;
    case "CONTI": return !!p&&(p.rank<=2||["ENT","KINGS","NSC","W4"].some(wonPrev));
    case "CSC":   return wonNow("CONTI");
    case "CT":    return !!p&&(p.rank===1||wonPrev("CONTI")||wonPrev("W4"));
    case "JT":    return wonNow("CT");
    case "ICC":   return wonNow("CT")||wonNow("CONTI")||wonPrev("CT");
  }
  return false;
}
function cupRng(S,id,tag){ return mulberry32((S.seed^hashStr(id+":"+S.term+":"+S.cyc+":"+tag))>>>0); }
/** 大会の相手を決める。勝ち進むほど強い相手が出る */
function drawCup(S,W,id){
  const comp=COMPS[id], cup=S.cups[id], rng=cupRng(S,id,"draw");
  const pool=W.clubs.filter(c=>comp.tiers.includes(tierOf(c))).sort((a,b)=>tierOf(a)-tierOf(b)||(a<b?-1:1));
  const take=q=>{
    const i=clamp(Math.floor(q*pool.length+(rng()-0.5)*2),0,pool.length-1);
    return pool.length?pool.splice(i,1)[0]:W.clubs[Math.floor(rng()*W.clubs.length)];
  };
  const st=comp.stages, n=st.length;
  cup.opp=[];
  if(st[0][0]==="grp"){
    const g=[take(0.3),take(0.5),take(0.7)], table={};
    ["me"].concat(g).forEach(c=>table[c]={ p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 });
    cup.grp={ clubs:g, table };
  }
  for(let i=0;i<n;i++){
    if(st[i][0]==="grp")cup.opp.push(cup.grp.clubs[i]);
    else if(st[i][0]==="leg2")cup.opp.push(cup.opp[i-1]);
    else cup.opp.push(take(n>1?0.2+0.75*i/(n-1):0.6));
  }
  cup.st="in"; cup.leg=null;
}
/**
 * 次の試合。kind: league / cup / friendly
 *   ko  … 同点なら PK 戦で決める / agg … 2試合制の第1試合のスコア [自分, 相手]
 *   canDecline … カップを棄権してフレンドリーにできる
 */
function nextFixture(S,W){
  if(S.termOver)return null;
  const [cid,ix]=SCHED[S.slot], base={ slot:S.slot, no:S.played+1 };
  if(cid==="LG"){
    const pair=leagueRound(S.league.clubs,ix).find(p=>p[0]==="me"||p[1]==="me");
    return Object.assign(base,{ kind:"league", comp:"LG", label:"第"+(ix+1)+"節",
      opp:pair[0]==="me"?pair[1]:pair[0], home:pair[0]==="me", ko:false, agg:null, canDecline:false });
  }
  const cup=S.cups[cid], comp=COMPS[cid];
  if(cup.st==="wait"&&ix===0&&entryOk(S,cid))drawCup(S,W,cid);
  if(cup.st==="in"){
    const type=comp.stages[ix][0];
    return Object.assign(base,{ kind:"cup", comp:cid, label:comp.stages[ix][1], opp:cup.opp[ix],
      home:type!=="leg2", ko:type==="ko"||type==="leg2", agg:type==="leg2"?cup.leg:null,
      type, canDecline:true });
  }
  // 出られない・負けた・棄権した枠はフレンドリーマッチ
  const rng=mulberry32((S.seed^hashStr("fr:"+S.term+":"+S.played))>>>0);
  const lg=S.league.clubs.filter(c=>c!=="me"), want=clamp(S.grade+Math.floor(rng()*3),1,5);
  const cand=W.clubs.filter(c=>tierOf(c)===want);
  const opp=(cand.length?cand:lg)[Math.floor(rng()*(cand.length||lg.length))];
  return Object.assign(base,{ kind:"friendly", comp:"FR", label:"", opp, home:true, ko:false, agg:null,
    canDecline:false, missed:cid, why:cup.st==="wait"?"条件を満たしていない":cup.st==="out"?"敗退":cup.st==="quit"?"棄権":"終了" });
}
/** カップを棄権する。その大会の残りの枠はフレンドリーマッチになる */
function declineCup(S,id){ if(S.cups[id]&&S.cups[id].st==="in")S.cups[id].st="quit"; }

/** 自分のクラブの定義。前の試合の最後の配置と KP を引き継ぐ(カードは盤面に置いたまま) */
function playerDef(S){
  // 登録選手(S.sq)から作る。先頭11枚が先発で、並びは陣形の枠の順(→pool.js)
  const def=makeTeamDef("azr",false), f=FORMS[TEAMS.azr.form], sq=S.sq||startSquad();
  def.xi=sq.slice(0,11).map((id,i)=>({ card:CARDS[id], h:f[i][0], x:f[i][1] }));
  def.bench=sq.slice(11).map(id=>CARDS[id]);
  def.xi.forEach(s=>{ const l=S.layout[s.card.id]; if(l){ s.h=l[0]; s.x=l[1]; } });
  // 育成を反映する: 能力・モチベーション・特殊能力はカードに、連携・グラフ・セットプレイはクラブに
  def.xi.forEach(s=>{ s.card=growCard(S,s.card); });
  def.bench=def.bench.map(c=>growCard(S,c));
  def.links=growLinks(S); def.graph=Object.assign({},S.g.graph); def.setplay=S.g.set;
  if(S.kp&&def.xi.some(s=>s.card.id===S.kp))def.kp=S.kp;
  return def;
}
/** 試合を作る材料。自分は常にホーム側(右へ攻める)に置く */
function fixtureMatch(S,fx){
  return { home:playerDef(S), away:makeTeamDef(fx.opp,true),
    seed:(S.seed^hashStr("m:"+S.term+":"+S.played))>>>0,
    opts:{ ko:fx.ko, agg:fx.agg } };
}

/* ---------- 結果の反映 ---------- */

/**
 * 試合の結果を反映して、次の枠へ進む。
 *   res: { hg, ag, pso:null|[h,a], layout:{id:[h,x]}, kp, played:[id], onPitch:[id],
 *          starters:[id], kpCh:KPを替えた回数, subs:交代の数 }
 * 返り値は「何が起きたか」の行(画面に出す)。
 */
function applyResult(S,W,fx,res){
  const C=TUNING.club, out=[], hg=res.hg, ag=res.ag;
  const win=hg>ag||(hg===ag&&res.pso&&res.pso[0]>res.pso[1]);
  S.rec.gf+=hg; S.rec.ga+=ag;
  if(hg>ag)S.rec.w++; else if(hg<ag)S.rec.l++; else S.rec.d++;
  if(res.layout)S.layout=res.layout;
  if(res.kp)S.kp=res.kp;
  const grade=COMPS[fx.comp].grade, prize=x=>{ S.money+=x; return x; };
  let got=0;
  if(fx.kind==="league"){
    const ix=SCHED[fx.slot][1], L=S.league;
    for(const [h,a] of leagueRound(L.clubs,ix)){
      if(h==="me")addTable(L.table,h,a,hg,ag);
      else if(a==="me")addTable(L.table,h,a,ag,hg);
      else{
        const r=simCpu(h,a,(S.seed^hashStr("lg:"+S.term+":"+S.cyc+":"+ix+":"+h))>>>0);
        addTable(L.table,h,a,r[0],r[1]);
      }
    }
    L.done=ix+1;
    if(hg>ag)got+=prize(C.prize.league);
    const rank=sortTable(L.table).indexOf("me")+1;
    out.push("リーグ "+rank+"位("+L.table.me.pts+"点)");
    if(L.done===14){
      got+=prize(C.prize.leagueRank[rank-1]||0);
      if(rank===1){ S.titles.push({ term:S.term, cyc:S.cyc, comp:"LG" }); out.push("🏆 レギュラーリーグ 優勝"); }
    }
  }else if(fx.kind==="cup"){
    const cup=S.cups[fx.comp], comp=COMPS[fx.comp], ix=SCHED[fx.slot][1], last=ix===comp.stages.length-1;
    const type=fx.type, pw=C.prize.cup[grade];
    let through=false;
    if(type==="grp"){
      const g=cup.grp, me=fx.opp, others=g.clubs.filter(c=>c!==me);
      addTable(g.table,"me",me,hg,ag);
      const r=simCpu(others[0],others[1],(S.seed^hashStr("grp:"+fx.comp+":"+S.term+":"+S.cyc+":"+ix))>>>0);
      addTable(g.table,others[0],others[1],r[0],r[1]);
      if(hg>ag)got+=prize(pw);
      const end=comp.stages[ix+1][0]!=="grp";
      if(end){
        const rank=sortTable(g.table).indexOf("me")+1;
        through=rank<=comp.adv;
        out.push(comp.name+" グループ "+rank+"位 → "+(through?"突破":"敗退"));
        if(!through)cup.st="out";
      }else through=true;
    }else if(type==="leg1"){
      cup.leg=[hg,ag]; through=true;
      if(hg>ag)got+=prize(pw);
      out.push(comp.name+" "+fx.label+" 終了(第2試合へ)");
    }else{
      const th=hg+(fx.agg?fx.agg[0]:0), ta=ag+(fx.agg?fx.agg[1]:0);
      through=th>ta||(th===ta&&!!res.pso&&res.pso[0]>res.pso[1]);
      cup.leg=null;
      if(through)got+=prize(pw);
      if(fx.agg)out.push("2試合合計 "+th+" - "+ta+(res.pso?"(PK "+res.pso[0]+"-"+res.pso[1]+")":""));
      if(!through){ cup.st="out"; out.push(comp.name+" 敗退"); }
      else if(!last)out.push(comp.name+" "+fx.label+" 突破");
    }
    if(through&&last){
      cup.st="won"; got+=prize(pw*C.prize.titleK);
      S.titles.push({ term:S.term, cyc:S.cyc, comp:fx.comp });
      out.push("🏆 "+comp.name+" 優勝");
    }
  }else if(win||hg>ag)got+=prize(C.prize.friendly);
  if(got)out.push("賞金 +"+got.toFixed(1)+"億");
  // 育成(→grow.js)。フレンドリーマッチの勝利で、覚醒・★5・黄金線が開花する
  if(res.played)afterMatchGrowth(S,fx,{ played:res.played, onPitch:res.onPitch||res.played,
    win:hg>ag, lose:hg<ag }).forEach(x=>out.push(x));
  // カードの払い出し(→pool.js)。試合のたびに1枚
  const card=payout(S);
  out.unshift("カード: "+RARITY[CARDS[card.id].rar].name+" "+nameOf(CARDS[card.id])+(card.isNew?"(NEW)":""));

  // 称号の条件に使う記録(→term.js)
  const ts=S.ts;
  ts.kpCh+=res.kpCh||0; ts.subs+=res.subs||0;
  (res.starters||[]).forEach(id=>{ if(!ts.used.includes(id))ts.used.push(id); });
  if(win&&tierOf(fx.opp)>=5)ts.topW++;
  if(res.pso){ if(res.pso[0]>res.pso[1])ts.psoW++; else ts.psoL++; }
  S.last={ no:fx.no, comp:fx.comp, label:fx.label, opp:fx.opp, hg, ag, pso:res.pso||null, lines:out,
    card:card.id, cardNew:card.isNew };
  S.history.push([fx.comp,fx.opp,hg,ag]);
  if(S.history.length>TUNING.club.historyMax)S.history.shift();
  S.played++; S.slot++;
  if(S.slot>=SCHED.length)endCycle(S,W,out);
  if(S.played>=C.termLen&&!S.termOver){ S.termOver=true; endTerm(S); }
  return out;
}
/** 1周(43試合)の終わり。前の周の成績を残し、リーグと大会を作り直す */
function endCycle(S,W,out){
  const rank=sortTable(S.league.table).indexOf("me")+1;
  const won=CUP_IDS.filter(id=>S.cups[id].st==="won");
  if(rank===1)won.push("LG");
  S.prev={ rank, won };
  if(rank<=TUNING.club.promoteRank&&S.grade<TUNING.club.leagueTiers.length){
    S.grade++; out.push("リーグの格が上がった(格 "+S.grade+")");
  }
  S.cyc++; S.slot=0;
  S.league=newLeague(S,W); S.cups=newCups();
}
/** 任期が終わったあと、次の任期を始める(称号・年俸・引き継ぎは 3c で足す) */
function newTerm(S,W){
  S.term++; S.played=0; S.slot=0; S.cyc=1; S.prev=null; S.termOver=false;
  S.grade=1;                                  // 育成が初めに戻るので、リーグの格も戻す(称号による上積みは 3c)
  S.rec={ w:0, d:0, l:0, gf:0, ga:0 }; S.last=null; S.layout={};
  S.g=newGrowth(S.sq);                        // 育成は任期ごと(絆の深い選手は startNextTerm が引き継ぐ)
  S.ts=newTermStats(); S.money0=S.money;
  S.league=newLeague(S,W); S.cups=newCups();
}

/* ---------- 保存 ---------- */

const SAVE_KEY="wcc_f.save.v1";
function saveCareer(store,S){
  try{ store.setItem(SAVE_KEY,JSON.stringify(S)); return true; }catch(e){ return false; }
}
function loadCareer(store){
  try{
    const t=store.getItem(SAVE_KEY);
    if(!t)return null;
    const S=JSON.parse(t);
    return S&&S.ver===1?migrate(S):null;
  }catch(e){ return null; }
}
/**
 * 古いセーブに、あとから増えた項目を補う。**項目を足したら、ここにも足す**。
 *   g … 育成(3b で追加)。無ければ任期の途中でも育成なしの状態から始める
 */
function migrate(S){
  if(!S.sq)S.sq=startSquad();
  if(!S.coll)S.coll=newCollection();
  // カードの一覧が変わって存在しなくなったカードを外す(登録の空きは初めの16枚で埋める)
  for(const id of Object.keys(S.coll))if(!CARDS[id])delete S.coll[id];
  const spare=startSquad().filter(id=>!S.sq.includes(id));
  S.sq=S.sq.map(id=>CARDS[id]?id:spare.shift());
  for(const id of Object.keys(S.layout||{}))if(!CARDS[id])delete S.layout[id];
  if(S.kp&&!CARDS[S.kp])S.kp=null;
  if(S.last&&S.last.card&&!CARDS[S.last.card])S.last.card=null;
  S.g=S.g?migrateGrowth(S.g,S.sq):newGrowth(S.sq);
  if(!S.ts)S.ts=newTermStats();
  if(S.money0==null)S.money0=0;
  if(!S.career)S.career=[];
  if(S.salary==null)S.salary=0;
  if(S.fac==null)S.fac=1;
  if(S.tend===undefined)S.tend=null;
  if(S.termOver&&!S.tend)endTerm(S);
  if(!S.layout)S.layout={};
  if(!S.history)S.history=[];
  return S;
}
function clearCareer(store){ try{ store.removeItem(SAVE_KEY); }catch(e){} }

/* =========================================================================
   wcc_f — カード(DOM非依存)→docs/06
   ・カードの一覧(POOL)は実在の16クラブ × 16人(realcards.js。**名前は偽名**。実名はパックで上書き →docs/01 §1.4)
   ・能力は「役割のひな形 + 格 + 特徴」から作る。レアリティは格で決まる
   ・16クラブは相手クラブとしても登場する(強さの段4〜5。→club.js の genWorld)
   ・試合のあとに1枚払い出される。レアリティを抽選してから、その段のカードを1枚選ぶ
   ・持っているカードは S.coll {id: 枚数}。任期をまたいでも残る
   ・登録選手は S.sq(16枚。先頭11枚が先発で、並びは陣形の枠の順)
   ========================================================================= */

/** レアリティ。W 白 / B 黒 / K キラ / L レジェンド。at=この格以上でその段 */
const RARITY={
  W:{ name:"白",         at:-9 },
  B:{ name:"黒",         at:1.6 },
  K:{ name:"キラ",       at:2.2 },
  L:{ name:"レジェンド", at:2.8 }
};
const RAR_ORDER=["W","B","K","L"];
const rarOf=r=>RAR_ORDER.slice().reverse().find(k=>r>=RARITY[k].at);
/** 特徴の文字 → 能力 */
const TRAIT_STAT={ o:"off", d:"def", t:"tec", p:"pow", s:"spd", a:"sta" };
const POOL_SEED=20261117;
/** 実在クラブの id(並びは REAL_CLUBS の順) */
const REAL_IDS=REAL_CLUBS.map(c=>c[0]);
const POOL=(()=>{
  const C=TUNING.pack, out=[];
  for(const r of REAL_ROWS){
    const [id,ci,no,name,roles,age,grade,traits,skill]=r, rl=roles.split("/"), g=GEN_ROLE[rl[0]];
    const st={};
    const off=(grade-C.gradeBase)*C.gradeK;      // 格 → 能力のずれ
    STATS.forEach((k,i)=>{ const v=g.st[i]; st[k]=v+(v<=6?off*C.lowK:off); });
    for(let k=0;k+1<traits.length;k+=2)st[TRAIT_STAT[traits[k]]]+=traits[k+1]==="+"?C.trait:-C.trait;
    STATS.forEach(k=>{ st[k]=clamp(Math.round(st[k]),1,STAT_MAX); });
    CARDS[id]=Object.assign({ id, no, name, pos:g.pos, roles:rl, skill, age, grade,
      rar:rarOf(grade), club:REAL_CLUBS[ci][1], team:REAL_CLUBS[ci][0] },st);
    out.push(id);
  }
  // 相手クラブとしての定義。強さの段は先発11人の格の平均で、上位8クラブが5、残りが4
  const avg=REAL_CLUBS.map((c,ci)=>{ const xi=REAL_ROWS.filter(r=>r[1]===ci).slice(0,11);
    return xi.reduce((s,r)=>s+r[6],0)/xi.length; });
  const top=avg.slice().sort((a,b)=>b-a)[7];
  const rng=mulberry32(POOL_SEED);
  REAL_CLUBS.forEach((c,ci)=>{
    const [cid,name,short,color,form,kp]=c, ids=REAL_ROWS.filter(r=>r[1]===ci).map(r=>r[0]);
    const xi=ids.slice(0,11), tier=avg[ci]>=top?5:4, links=[], nLink=TUNING.club.linkBase+TUNING.club.linkTier*tier;
    for(let k=0;k<nLink*3&&links.length<nLink;k++){
      const a=xi[1+Math.floor(rng()*10)], b=xi[1+Math.floor(rng()*10)];
      if(a===b||links.some(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a)))continue;
      links.push([a,b,clamp(Math.round(tier/2+rng()*1.2),1,3)]);
    }
    TEAMS[cid]={ id:cid, name, short, color, form, kp:ids[kp-1], xi, bench:ids.slice(11), links, tier, real:true };
  });
  return out;
})();
/** 最初から持っている16枚(アズーロFC)。レアリティは黒として扱う */
TEAMS.azr.xi.concat(TEAMS.azr.bench).forEach(id=>{ CARDS[id].rar=CARDS[id].rar||"B"; CARDS[id].club=CARDS[id].club||"アズーロFC"; });

/** 最初の状態。持っているのはアズーロFCの16枚で、それがそのまま登録選手 */
function newCollection(){
  const coll={};
  TEAMS.azr.xi.concat(TEAMS.azr.bench).forEach(id=>coll[id]=1);
  return coll;
}
const startSquad=()=>TEAMS.azr.xi.concat(TEAMS.azr.bench);

/** 試合のあとに1枚引く。たねは任期と試合数で決まる(読み込み直しても同じカード) */
function drawCard(S){
  const P=TUNING.pack, rng=mulberry32((S.seed^hashStr("pack:"+S.term+":"+S.played))>>>0);
  let r=rng(), rar="W";
  for(const k of RAR_ORDER){ if(r<P.rate[k]){ rar=k; break; } r-=P.rate[k]; }
  const list=POOL.filter(id=>CARDS[id].rar===rar);
  return list[Math.floor(rng()*list.length)];
}
/** 払い出し。コレクションに足して、何を引いたかを返す */
function payout(S){
  const id=drawCard(S), isNew=!S.coll[id];
  S.coll[id]=(S.coll[id]||0)+1;
  return { id, isNew };
}

/**
 * 登録選手を入れ替える。out の枠(位置・先発か控えか)に in が入る。
 * **入れ替えられた選手の育成は消える**(本家と同じく、登録を外すと育てたものは残らない)。
 * 入ってきた選手は育成が初めから。
 */
function swapSquad(S,outId,inId){
  const i=S.sq.indexOf(outId);
  if(i<0||S.sq.includes(inId)||!S.coll[inId])return false;
  S.sq[i]=inId;
  if(S.layout[outId]){ S.layout[inId]=S.layout[outId]; delete S.layout[outId]; }
  if(S.kp===outId)S.kp=null;
  delete S.g.pl[outId];
  for(const k of Object.keys(S.g.links))if(k.split("|").includes(outId))delete S.g.links[k];
  S.g.pl[inId]=newPlayerGrowth();
  return true;
}
/** 登録選手の中で、先発と控えを入れ替える(育成は消えない) */
function moveSquad(S,a,b){
  const i=S.sq.indexOf(a), j=S.sq.indexOf(b);
  if(i<0||j<0||i===j)return false;
  S.sq[i]=b; S.sq[j]=a;
  const la=S.layout[a], lb=S.layout[b];
  if(la||lb){ if(lb)S.layout[a]=lb; else delete S.layout[a]; if(la)S.layout[b]=la; else delete S.layout[b]; }
  return true;
}

/* =========================================================================
   wcc_f — 育成(DOM非依存)→docs/05 §5.3〜5.6
   1試合ごとに:
     ① チーム練習  メニューを1つ + 強度(軽め / 普通 / ハード)。強いほど伸びるが、疲労がたまる
     ② コミュニケーション  最大3回。個人練習 / ミーティング / ラウンジ / 声かけ
     ③ 試合  経験がたまり、**試合のあとに**★の上昇・覚醒・連携の変化が起きる
   ★の上がり方
     個人能力 ★0〜5 … 経験がたまると試合後に上がる。★5(覚醒)は兆しのあとフレンドリーマッチの勝利で
     特殊能力 ★0〜5 … ミーティングで経験をため、★突破の3択に成功すると上がる。★5はフレンドリーマッチの勝利で
     連携     0〜3   … 経験がたまると試合後に太くなる。黄金線はラウンジで兆し → フレンドリーマッチの勝利で
   育成の状態は S.g に素の値だけで持つ(そのまま保存できる)。
   ========================================================================= */

const PARAM_AXIS={ off:"O", def:"D", tec:"R", pow:"P", spd:"S", sta:"C" };
const AXIS_PARAM={ O:"off", D:"def", R:"tec", P:"pow", S:"spd", C:"sta" };
const MOT_LABEL=["ケガ","絶不調","不調","好調","絶好調"];
const LINK_LABEL=["線なし","薄線","太線","黄金線"];
const INT_LABEL=["軽め","普通","ハード"];
const COMM_LABEL={ ind:"個人練習", meet:"ミーティング", lounge:"ラウンジ", talk:"声かけ" };
/** ラウンジの3択。相性(2=良い / 1=ふつう / 0=悪い)ごとに、いちばん合う手が違う */
const LOUNGE_CHOICE=["連携の練習をさせる","食事に行かせる","競わせる"];
const LOUNGE_HINT=["ふたりは張り合っているようだ","ふたりはまだよそよそしい","ふたりは気が合うようだ"];
const LOUNGE_BEST=[2,0,1];                   // 相性 0/1/2 のときにいちばん合う手
/** ミーティングの3択。選手の性格ごとに、響く言い方が違う */
const MEET_CHOICE=["褒めて伸ばす","厳しく求める","本人に任せる"];
const PERS_LABEL=["褒められて伸びる","負けず嫌い","マイペース"];

const AFF_N=11;                              // 相性の組(本家の A〜K)
const affOf=id=>hashStr("aff:"+id)%AFF_N;
const persOf=id=>hashStr("pers:"+id)%3;
/** 年齢の区切り(0 = 21歳以下 〜 4 = 32歳以上) */
const ageBand=id=>{ const a=CARDS[id].age||26, b=TUNING.grow.age.band; let i=0; while(i<b.length&&a>b[i])i++; return i; };
/**
 * 伸びやすさ = 年齢 × 能力。若いほど・能力が低いほど育ちやすい(→docs/05 §5.4)。
 * 全員が同じ時期に★4へ揃わないのは、これと「選んだ練習」「個人練習で呼んだ回数」の差による
 */
function growK(id){
  const G0=TUNING.grow, c=CARDS[id], A=G0.abil;
  const top=STATS.map(k=>c[k]).sort((a,b)=>b-a), best=(top[0]+top[1])/2;
  return G0.age.grow[ageBand(id)]*clamp(1-(best-A.ref)*A.k,A.lo,A.hi);
}
/** やる気の上下の起きやすさ。若いほどむらがある */
const motSwing=id=>TUNING.grow.age.swing[ageBand(id)];
/** 2人の相性。2=良い(試合に出るだけで太線まで)/ 1=ふつう(薄線まで)/ 0=悪い(ラウンジでしか育たない) */
function compatOf(a,b){
  const d=Math.abs(affOf(a)-affOf(b)), c=Math.min(d,AFF_N-d);
  return c<=1?2:c<=3?1:0;
}
const lkey=(a,b)=>a<b?a+"|"+b:b+"|"+a;

/* ---------- 状態 ---------- */

/** 1人ぶんの育成の初め */
function newPlayerGrowth(){
  return { ie:0, is:0, se:0, ss:0, tr:{}, up:{}, mot:TUNING.grow.mot.start, fat:0, q:false, sq:false, bond:0 };
}
/** 登録選手(ids)ぶんの育成。ids を省くとアズーロFCの初めの16枚 */
function newGrowth(ids){
  const pl={};
  (ids||TEAMS.azr.xi.concat(TEAMS.azr.bench)).forEach(id=>{ pl[id]=newPlayerGrowth(); });
  return { pl, links:{}, graph:{ O:0, D:0, R:0, C:0, S:0, P:0 }, set:0,
    step:"train", cn:0, done:[], opts:null };
}
/** 古いセーブの育成に、あとから増えた項目を補う */
function migrateGrowth(g,sq){
  for(const id in g.pl)if(!CARDS[id]||(sq&&!sq.includes(id)))delete g.pl[id];
  if(sq)sq.forEach(id=>{ if(!g.pl[id])g.pl[id]=newPlayerGrowth(); });
  for(const k of Object.keys(g.links))if(!k.split("|").every(id=>g.pl[id]))delete g.links[k];
  for(const id in g.pl)if(g.pl[id].fat==null)g.pl[id].fat=0;
  if(g.cn==null)g.cn=0;
  if(!g.done)g.done=[];
  if(g.step==="ready")g.step="comm";
  return g;
}
const linkOf=(S,a,b)=>S.g.links[lkey(a,b)]||{ lv:0, exp:0, gold:false };
function linkSet(S,a,b){ const k=lkey(a,b); return S.g.links[k]||(S.g.links[k]={ lv:0, exp:0, gold:false }); }

/** 育成を反映したカード。試合にはこれを渡す(元のカードは書き換えない) */
function growCard(S,card){
  const G0=TUNING.grow, g=S.g.pl[card.id], c=Object.assign({},card);
  if(!g)return c;
  for(const k of STATS){
    const base=card[k]+(card[k]<=G0.startKeep?0:G0.startOff);
    c[k]=clamp(base+(g.up[k]||0),1,STAT_MAX);
  }
  c.cond=G0.mot.mul[g.mot];
  c.buffK=1+G0.sp.buff*g.ss;
  c.ss=g.ss; c.is=g.is;
  c.fat0=g.fat;                              // 練習の疲れを残したまま試合を始める
  return c;
}
/** 連携の線を、試合に渡す形 [a, b, 段] にする */
function growLinks(S){
  return Object.keys(S.g.links).filter(k=>S.g.links[k].lv>0).map(k=>{ const p=k.split("|"); return [p[0],p[1],S.g.links[k].lv]; });
}
/** 疲労の平均(盤面の11人) */
function teamFatigue(S){
  const xi=squadXi(S);
  return xi.reduce((s,id)=>s+(S.g.pl[id]?S.g.pl[id].fat:0),0)/(xi.length||1);
}

/* ---------- ① チーム練習 ---------- */

/** 今回の練習の候補6つ。基本練習が能力ごとに1つずつ。施設が良いほど特殊練習に差し替わる */
function trainOptions(S){
  if(S.g.opts)return S.g.opts;
  const G0=TUNING.grow, rng=mulberry32((S.seed^hashStr("tr:"+S.term+":"+S.played))>>>0);
  S.g.opts=STATS.map(param=>{
    if(rng()<G0.spChance*(S.fac||1)){             // 施設レベル(累計の年俸で上がる →term.js)
      const pool=TRAIN_SP.map((t,i)=>i).filter(i=>TRAIN_SP[i].slot===param||TRAIN_SP[i].slot==="any");
      if(pool.length)return { param, sp:pool[Math.floor(rng()*pool.length)] };
    }
    return { param, sp:-1 };
  });
  return S.g.opts;
}
function trainLabel(o){ return o.sp>=0?TRAIN_SP[o.sp].name:STAT_LABEL[o.param]+"の練習"; }
/** 練習の中身を、選ぶ前に見せる文にする */
function trainDesc(o){
  const ax=s=>s.split("").map(a=>AXIS_LABEL[a]).join("・");
  if(o.sp<0)return "個人能力 ・ グラフ: "+AXIS_LABEL[PARAM_AXIS[o.param]]+" ↑";
  const t=TRAIN_SP[o.sp], e=t.eff, nm={ ind:"個人", link:"連携", sp:"特殊", set:"セットプレイ" };
  return Object.keys(e).map(k=>nm[k]+"★".repeat(e[k])).join(" ")+" ・ グラフ: "+
    (t.up?ax(t.up)+" ↑":"")+(t.down?" / "+ax(t.down)+" ↓":"");
}
function graphAdd(S,axis,v){
  const R=TUNING.grow.graph;
  S.g.graph[axis]=clamp(S.g.graph[axis]+v,R.min,R.max);
}
/** 個人能力の★が上がるか見る(試合のあとに呼ぶ)。上がったら、その間にいちばん練習した能力が伸びる */
function checkInd(S,id,out){
  const I=TUNING.grow.ind, g=S.g.pl[id], card=CARDS[id];
  while(g.is<4&&g.ie>=I.need[g.is]){
    g.ie-=I.need[g.is]; g.is++;
    let best=null, bv=-1;
    for(const k of STATS){ const v=(g.tr[k]||0)*100+card[k]; if(card[k]+(g.up[k]||0)<STAT_MAX&&v>bv){ bv=v; best=k; } }
    if(best)g.up[best]=(g.up[best]||0)+I.starUp;
    g.tr={};
    out.push(nameOf(card)+" 個人能力 ★"+g.is+(best?"("+STAT_LABEL[best]+" +"+I.starUp+")":""));
  }
  if(g.is===4&&!g.q&&g.ie>=I.awake){ g.q=true; out.push(nameOf(card)+" に覚醒の兆し(フレンドリーマッチで勝てば覚醒)"); }
}
function checkSp(S,id,out){
  const P=TUNING.grow.sp, g=S.g.pl[id];
  if(g.ss===4&&!g.sq&&g.se>=P.awake){ g.sq=true; out.push(nameOf(CARDS[id])+" の特殊能力が極まりそうだ(フレンドリーマッチで勝てば ★5)"); }
}
/** ミーティングで★突破の3択が出る状態か */
const spReady=(S,id)=>{ const g=S.g.pl[id]; return g.ss<4&&g.se>=TUNING.grow.sp.need[g.ss]; };
/** 連携の経験を足す。**段は試合のあとに上がる**(settleLinks)。cap は相性で決まる上限 */
function linkExp(S,a,b,v,cap){
  const l=linkSet(S,a,b);
  l.cap=Math.max(l.cap||0,cap);
  if(l.lv<Math.min(l.cap,2))l.exp+=v;
}
/** 試合のあと、たまった経験で連携の段を上げる(黄金線=3 はここでは上がらない) */
function settleLinks(S,out){
  const L=TUNING.grow.link;
  for(const k in S.g.links){
    const l=S.g.links[k], p=k.split("|"), cap=Math.min(l.cap||0,2);
    while(l.lv<cap&&l.exp>=L.need[l.lv]){
      l.exp-=L.need[l.lv]; l.lv++;
      out.push(nameOf(CARDS[p[0]])+" と "+nameOf(CARDS[p[1]])+" の連携が"+LINK_LABEL[l.lv]+"に");
    }
  }
}
/** いま盤面に並べている11人(前の試合の最後の配置。無ければクラブの既定) */
function squadXi(S){
  const ids=Object.keys(S.layout).filter(id=>S.g.pl[id]);
  return ids.length>=8?ids:(S.sq||startSquad()).slice(0,11);
}
/**
 * チーム練習を1つ行う。intensity: 0=軽め / 1=普通 / 2=ハード。
 * 強いほど経験とグラフの伸びが大きく、**全員の疲労がたまる**(試合を消耗した状態で始める)。
 */
function doTraining(S,i,intensity){
  const G0=TUNING.grow, I=G0.ind, R=G0.graph, N=G0.int, o=trainOptions(S)[i], out=[];
  if(S.g.step!=="train"||!o)return out;
  const lv=intensity==null?1:clamp(intensity,0,2), k=N.k[lv];
  const ids=Object.keys(S.g.pl);
  for(const a in S.g.graph)S.g.graph[a]*=R.decay;
  if(o.sp<0){
    for(const id of ids){
      const g=S.g.pl[id], top=STATS.slice().sort((a,b)=>CARDS[id][b]-CARDS[id][a]).slice(0,2);
      g.ie+=(I.train+(top.includes(o.param)?I.trainFit:0))*k*growK(id);
      g.tr[o.param]=(g.tr[o.param]||0)+1;
    }
    graphAdd(S,PARAM_AXIS[o.param],R.basic*k);
  }else{
    const t=TRAIN_SP[o.sp], e=t.eff, all=t.up.length===6;
    for(const id of ids){
      const g=S.g.pl[id];
      g.ie+=(1+(e.ind||0))*k*growK(id);
      g.tr[o.param]=(g.tr[o.param]||0)+1;
      if(e.sp)g.se+=e.sp*G0.sp.train*k;
    }
    if(e.link){
      const xi=squadXi(S);
      for(let a=0;a<xi.length;a++)for(let b=a+1;b<xi.length;b++)
        linkExp(S,xi[a],xi[b],e.link*k,compatOf(xi[a],xi[b]));
    }
    if(e.set)S.g.set=Math.min(G0.set.max,S.g.set+G0.set.per*e.set*k);
    for(const a of t.up)graphAdd(S,a,(all?R.upAll:R.up)*k);
    for(const a of t.down)graphAdd(S,a,-R.down*k);
  }
  for(const id of ids){
    const g=S.g.pl[id];
    g.fat=Math.min(N.fatMax,g.fat+N.fat[lv]);
    checkSp(S,id,out);
  }
  if(N.fat[lv]>0)out.push("疲労 +"+Math.round(N.fat[lv]*100)+"%(試合はそのぶん消耗した状態で始まる)");
  S.g.step="comm"; S.g.cn=0; S.g.done=[];
  return out;
}

/* ---------- ② コミュニケーション(最大3回) ---------- */

const commLeft=S=>S.g.step==="comm"?TUNING.grow.comm.max-S.g.cn:0;
/** コミュニケーションを1回使う。使い切ったら試合へ */
function useComm(S,kind){
  S.g.cn++; S.g.done.push(kind);
  if(S.g.cn>=TUNING.grow.comm.max)S.g.step="ready";
}
const canComm=S=>S.g.step==="comm"&&S.g.cn<TUNING.grow.comm.max;

/** 個人練習。1人を呼び出して個別に指導する。個人能力の経験が入る(★は試合のあとに上がる) */
function doIndTrain(S,id){
  const C=TUNING.grow.comm, g=S.g.pl[id], out=[];
  if(!canComm(S)||!g)return { res:-1, lines:out };
  g.ie+=C.ind*growK(id);
  g.bond++;
  out.push(nameOf(CARDS[id])+" に個別指導(個人能力の経験 +"+C.ind+")");
  useComm(S,"ind");
  return { res:1, lines:out };
}
/** 声かけ。調子の落ちた選手を立て直す。モチベーションが上がる */
function doTalk(S,id){
  const C=TUNING.grow.comm, g=S.g.pl[id], out=[];
  if(!canComm(S)||!g)return { res:-1, lines:out };
  const was=g.mot;
  g.mot=Math.min(4,g.mot+(g.mot<=2?C.talkLow:C.talk));
  g.bond++;
  out.push(nameOf(CARDS[id])+" に声をかけた("+MOT_LABEL[was]+" → "+MOT_LABEL[g.mot]+")");
  useComm(S,"talk");
  return { res:1, lines:out };
}
function loungeInfo(S,a,b){
  const c=compatOf(a,b), l=linkOf(S,a,b);
  return { compat:c, hint:LOUNGE_HINT[c], lv:l.lv, gold:l.gold, choices:LOUNGE_CHOICE };
}
/**
 * ラウンジ。2人を呼び出して3択に答える。結果は 0=大成功 / 1=成功 / 2=失敗。
 * 相性に合う手ほど大成功しやすい。太線の2人が大成功すると、黄金線の兆しが出る。
 */
function doLounge(S,a,b,choice){
  const L=TUNING.grow.link, out=[];
  if(!canComm(S)||a===b||!S.g.pl[a]||!S.g.pl[b])return { res:-1, lines:out };
  const c=compatOf(a,b), best=LOUNGE_BEST[c];
  const p=choice===best?L.pFit:choice===(best+1)%3?L.pMid:L.pBad;
  const r=mulberry32((S.seed^hashStr("lg:"+S.term+":"+S.played+":"+S.g.cn+":"+lkey(a,b)+":"+choice))>>>0)();
  const res=r<p[0]?0:r<p[0]+p[1]?1:2, l=linkSet(S,a,b);
  out.push(["大成功！","成功","失敗…"][res]);
  if(res<2){
    // 太線の2人は、**大成功のときだけ**黄金線の兆しが出る。ラウンジは相性に関係なく太線まで育てられる
    if(l.lv===2){ if(res===0&&!l.gold){ l.gold=true; out.push("フレンドリーマッチで新たな連携が生まれそうだ"); } }
    else{ linkExp(S,a,b,L.lounge[res],2); out.push("連携の経験 +"+L.lounge[res]+"(試合のあとに太くなる)"); }
    S.g.pl[a].bond++; S.g.pl[b].bond++;
  }
  useComm(S,"lounge");
  return { res, lines:out };
}
function meetInfo(S,id){
  const g=S.g.pl[id];
  return { ready:spReady(S,id), pers:PERS_LABEL[persOf(id)], choices:MEET_CHOICE, mot:g.mot, ss:g.ss, se:g.se,
    need:g.ss<4?TUNING.grow.sp.need[g.ss]:TUNING.grow.sp.awake };
}
/**
 * ミーティング。1人を呼び出す。特殊能力の経験がたまる。
 * 経験が満ちていれば★突破の3択が出る(choice)。性格に合う言い方ほど成功しやすい。
 */
function doMeeting(S,id,choice){
  const P=TUNING.grow.sp, g=S.g.pl[id], out=[];
  if(!canComm(S)||!g)return { res:-1, lines:out };
  let res=1;
  if(spReady(S,id)){
    const p=choice===persOf(id)?P.qOk:P.qNg;
    const r=mulberry32((S.seed^hashStr("mt:"+S.term+":"+S.played+":"+S.g.cn+":"+id+":"+choice))>>>0)();
    if(r<p){
      g.se-=P.need[g.ss]; g.ss++; res=0;
      out.push(nameOf(CARDS[id])+" 特殊能力 ★"+g.ss);
    }else{
      g.se=Math.floor(g.se*P.failKeep); res=2;
      g.mot=Math.max(1,g.mot-1);
      out.push(nameOf(CARDS[id])+" の心に響かなかった…(やる気が下がった)");
    }
  }else{
    g.se+=P.meet;
    out.push(nameOf(CARDS[id])+" と戦術の話をした(特殊能力の経験 +"+P.meet+")");
  }
  g.bond+=2;
  checkSp(S,id,out);
  useComm(S,"meet");
  return { res, lines:out };
}
/** 残りのコミュニケーションを使わずに試合へ */
function skipComm(S){ if(S.g.step==="comm")S.g.step="ready"; }
/** 選手の上に「！」が出るか(★突破の3択が待っている / やる気が落ちている / 疲れている) */
function hasSign(S,id){ const g=S.g.pl[id]; return spReady(S,id)||g.mot<=1||g.fat>=TUNING.grow.int.tiredSign; }

/* ---------- ③ 試合のあと ---------- */

/** 覚醒。能力が最大3項目、各+1(どれが上がるかは不定。1つは必ず上がる) */
function awaken(S,id,rng,out){
  const I=TUNING.grow.ind, g=S.g.pl[id], card=CARDS[id], got=[];
  const pool=STATS.filter(k=>card[k]+(g.up[k]||0)<STAT_MAX&&card[k]>TUNING.grow.startKeep);
  for(let n=0;n<3&&pool.length;n++){
    if(n>0&&rng()>=I.awakeUp[n])break;
    const k=pool.splice(Math.floor(rng()*pool.length),1)[0];
    g.up[k]=(g.up[k]||0)+1; got.push(STAT_LABEL[k]);
  }
  g.is=5; g.q=false; g.ie=0;
  out.push("⭐ "+nameOf(card)+" が覚醒！("+got.join("・")+" +1)");
}
/**
 * 試合の結果を育成に反映する。**★の上昇・覚醒・連携の変化はここで起きる**。
 *   res.played  … その試合に出た選手 / res.onPitch … 最後に盤面に居た選手 / res.win
 * フレンドリーマッチに勝つと、兆しのある選手・連携が開花する(必ずではない)。
 */
function afterMatchGrowth(S,fx,res){
  const G0=TUNING.grow, I=G0.ind, L=G0.link, Mo=G0.mot, N=G0.int, out=[];
  const rng=mulberry32((S.seed^hashStr("gr:"+S.term+":"+S.played))>>>0);
  const played=res.played.filter(id=>S.g.pl[id]), on=res.onPitch.filter(id=>S.g.pl[id]);
  for(const id of played)S.g.pl[id].ie+=I.match*growK(id);
  for(let a=0;a<on.length;a++)for(let b=a+1;b<on.length;b++)
    linkExp(S,on[a],on[b],L.match,compatOf(on[a],on[b]));
  for(const id in S.g.pl)checkInd(S,id,out);
  settleLinks(S,out);
  if(fx.kind==="friendly"&&res.win){
    for(const id of on){
      const g=S.g.pl[id];
      if(g.q&&rng()<I.awakeP)awaken(S,id,rng,out);
      if(g.sq&&rng()<G0.sp.star5P){ g.ss=5; g.sq=false; g.se=0; out.push("⭐ "+nameOf(CARDS[id])+" の特殊能力が ★5 に(スタイルが極まる)"); }
    }
    // 黄金線は1試合に1本まで(兆しのある組のうち、たねで1つ選ぶ)
    const cand=Object.keys(S.g.links).filter(k=>{ const l=S.g.links[k], p=k.split("|");
      return l.gold&&l.lv===2&&on.includes(p[0])&&on.includes(p[1]); });
    if(cand.length&&rng()<L.goldP){
      const k=cand[Math.floor(rng()*cand.length)], l=S.g.links[k], p=k.split("|");
      l.lv=3; l.gold=false;
      out.push("✨ "+nameOf(CARDS[p[0]])+" と "+nameOf(CARDS[p[1]])+" の連携が黄金の輝きに");
    }
  }
  // 疲労: 出た選手は試合のぶん溜まり、全員が次までに半分ほど抜ける
  for(const id in S.g.pl){
    const g=S.g.pl[id];
    g.fat=Math.min(N.fatMax,(g.fat+(played.includes(id)?N.matchLoad:0))*N.recover);
  }
  // モチベーション: 出て勝てば上がり、負ければ下がる。出番が無いと下がる
  for(const id in S.g.pl){
    const g=S.g.pl[id];
    const sw=motSwing(id);                    // 若いほどむらがある
    if(played.includes(id)){
      if(res.win&&rng()<Mo.winUp*sw)g.mot=Math.min(4,g.mot+1);
      else if(res.lose&&rng()<Mo.loseDown*sw)g.mot=Math.max(1,g.mot-1);
      else if(!res.win&&!res.lose&&rng()<Mo.drawSwing*sw)g.mot=clamp(g.mot+(rng()<0.5?1:-1),1,4);
    }else if(rng()<Mo.benchDown*sw)g.mot=Math.max(1,g.mot-1);
  }
  S.g.step="train"; S.g.opts=null; S.g.cn=0; S.g.done=[];
  return out;
}

/* =========================================================================
   wcc_f — 任期の終わり(DOM非依存)→docs/05 §5.8
   100試合で任期が終わると:
     ① 成績から監督称号が1つ決まる(条件は明示する。本家は非公開だった)
     ② 年俸が決まり、累計に積み上がる。累計で施設レベルが上がる(特殊練習が出やすくなる)
     ③ 絆の深い選手(最大3人)が、育成後のまま次の任期についてくる
     ④ 称号によっては、次の任期をリーグの格が高い状態から始める
   任期中の記録は S.ts に、終わりの結果は S.tend に、歴代は S.career に持つ。
   ========================================================================= */

/** 任期中の記録(称号の条件に使う) */
function newTermStats(){
  return { kpCh:0, subs:0, used:[], topW:0, psoW:0, psoL:0, frW:0 };
}

/**
 * 監督称号。**上から順に見て、最初に条件を満たしたもの**が付く。
 *   名前は本家の称号から借りたもの。条件は本作で決めた(→docs/05 §5.8)
 *   grade … 次の任期を始めるリーグの格 / bonus … 年俸の上乗せ(億)
 */
const TITLES=[
  { id:"legend",  name:"レジェンド",   grade:3, bonus:120, need:"S の大会を3つ以上制覇し、勝率 70% 以上",
    ok:x=>x.sWins>=3&&x.wr>=0.70 },
  { id:"emperor", name:"皇帝",         grade:3, bonus:90,  need:"S の大会で優勝し、リーグを2回以上制覇",
    ok:x=>x.sWins>=1&&x.lgWins>=2 },
  { id:"master",  name:"名将",         grade:3, bonus:70,  need:"タイトル8つ以上、勝率 60% 以上",
    ok:x=>x.titles>=8&&x.wr>=0.60 },
  { id:"factory", name:"覚醒工場",     grade:2, bonus:50,  need:"8人以上を覚醒させた",
    ok:x=>x.awake>=8 },
  { id:"magic",   name:"魔術師",       grade:2, bonus:50,  need:"KP を30回以上替え、勝率 55% 以上",
    ok:x=>x.kpCh>=30&&x.wr>=0.55 },
  { id:"heir",    name:"伝承者",       grade:2, bonus:40,  need:"黄金線を10本以上つないだ",
    ok:x=>x.gold>=10 },
  { id:"assassin",name:"刺客",         grade:2, bonus:40,  need:"格上(★5)のクラブに8勝以上",
    ok:x=>x.topW>=8 },
  { id:"tactician",name:"知将",        grade:2, bonus:35,  need:"勝ち抜き戦で4回以上優勝し、PK戦で負け越していない",
    ok:x=>x.koWins>=4&&x.psoW>=x.psoL },
  { id:"native",  name:"生え抜き",     grade:1, bonus:30,  need:"先発で使った選手が13人以下で、勝ち越した",
    ok:x=>x.used<=13&&x.w>x.l },
  { id:"fickle",  name:"浮気者",       grade:1, bonus:10,  need:"16人全員を先発で使い、交代を200回以上",
    ok:x=>x.used>=16&&x.subs>=200 },
  { id:"fighter", name:"闘将",         grade:1, bonus:20,  need:"勝ち越し、賞金 100億以上",
    ok:x=>x.w>x.l&&x.money>=100 },
  { id:"wander",  name:"迷将",         grade:1, bonus:0,   need:"負け越した",
    ok:x=>x.w<x.l },
  { id:"rookie",  name:"新米監督",     grade:1, bonus:0,   need:"(どれにも当てはまらない)",
    ok:()=>true }
];

/** 称号の条件に使う数字を集める */
function termFacts(S){
  const t=S.titles.filter(x=>x.term===S.term), pl=Object.values(S.g.pl), r=S.rec, n=r.w+r.d+r.l;
  return { w:r.w, d:r.d, l:r.l, wr:n?r.w/n:0, titles:t.length,
    sWins:t.filter(x=>COMPS[x.comp].grade==="S").length,
    lgWins:t.filter(x=>x.comp==="LG").length,
    koWins:t.filter(x=>x.comp!=="LG"&&x.comp!=="W4").length,
    awake:pl.filter(g=>g.is>=5).length,
    gold:Object.values(S.g.links).filter(l=>l.lv>=3).length,
    money:S.money-S.money0,
    kpCh:S.ts.kpCh, subs:S.ts.subs, used:S.ts.used.length, topW:S.ts.topW, psoW:S.ts.psoW, psoL:S.ts.psoL };
}
/** 絆の深い選手(次の任期についてくる候補)。絆が mono 以上で、深い順に max 人 */
function followers(S){
  const T=TUNING.term;
  return Object.keys(S.g.pl).filter(id=>S.g.pl[id].bond>=T.bondMin)
    .sort((a,b)=>S.g.pl[b].bond-S.g.pl[a].bond||(a<b?-1:1)).slice(0,T.follow);
}
/** 施設レベル。累計の年俸で上がる */
function facLevel(total){
  const th=TUNING.term.facAt; let lv=1;
  while(lv<=th.length&&total>=th[lv-1])lv++;
  return lv;
}
/** 任期が終わった瞬間に呼ぶ。結果を S.tend に置き、歴代に積む */
function endTerm(S){
  const T=TUNING.term, x=termFacts(S), title=TITLES.find(t=>t.ok(x));
  const salary=Math.round(T.salaryBase+x.money*T.salaryK+title.bonus);
  const before=facLevel(S.salary);
  S.salary+=salary;
  S.fac=facLevel(S.salary);
  S.tend={ term:S.term, title:title.id, salary, total:S.salary, fac:S.fac, facUp:S.fac>before,
    grade:title.grade, follow:followers(S), facts:x };
  S.career.push({ term:S.term, title:title.id, w:x.w, d:x.d, l:x.l, titles:x.titles, salary });
  return S.tend;
}
/**
 * 次の任期を始める。ついてくる選手は★・能力・特殊能力を保ったまま。
 * 互いの連携(線)も残る。やる気は好調、疲労は0から。
 */
function startNextTerm(S,W){
  const end=S.tend, keep=end?end.follow:[], old=S.g;
  newTerm(S,W);
  if(!end)return;
  S.grade=Math.max(1,end.grade);
  S.league=newLeague(S,W);
  for(const id of keep){
    const o=old.pl[id], g=S.g.pl[id];        // 登録を外れていればついてこない
    if(!o||!g)continue;
    Object.assign(g,{ is:o.is, ss:o.ss, up:Object.assign({},o.up), ie:0, se:0, q:false, sq:false,
      bond:Math.floor(o.bond/2), followed:true });
  }
  for(const k in old.links){
    const p=k.split("|");
    if(keep.includes(p[0])&&keep.includes(p[1])&&old.links[k].lv>0)
      S.g.links[k]={ lv:old.links[k].lv, exp:0, gold:false, cap:old.links[k].cap||0 };
  }
  S.tend=null;
}
const titleOf=id=>TITLES.find(t=>t.id===id)||TITLES[TITLES.length-1];

/* =========================================================================
   wcc_f — 試合映像(上半分)。エンジンが解いた結果を読むだけで、何も書き戻さない。
   画面座標は u(0=左のゴール 〜 1=右のゴール) / v(0=上 〜 1=下)。ホームは右へ攻める。
   ========================================================================= */

const RV={ cv:null, ctx:null, w:0, h:0, vis:new Map(), ball:[0.5,0.5], lift:0 };

const scrOf=(side,h,x)=>side==="H"?[h,x/100]:[1-h,1-x/100];
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function initView(){
  RV.cv=document.getElementById("view");
  RV.ctx=RV.cv.getContext("2d");
  resizeView();
  window.addEventListener("resize",resizeView);
}
function resizeView(){
  const r=RV.cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,3);
  RV.w=r.width; RV.h=r.height;
  RV.cv.width=Math.round(r.width*dpr); RV.cv.height=Math.round(r.height*dpr);
  RV.ctx.setTransform(dpr,0,0,dpr,0,0);
}
function pxOf(u,v){
  const mx=RV.w*0.045, my=RV.h*0.06;
  return [mx+u*(RV.w-2*mx), my+v*(RV.h-2*my)];
}

function drawPitch(){
  const c=RV.ctx, W=RV.w, H=RV.h;
  for(let i=0;i<10;i++){
    c.fillStyle=i%2?"#1b6e3c":"#1f7a43";
    c.fillRect(i*W/10,0,W/10+1,H);
  }
  const [x0,y0]=pxOf(0,0), [x1,y1]=pxOf(1,1), pw=x1-x0, ph=y1-y0;
  c.strokeStyle="rgba(255,255,255,.6)"; c.lineWidth=1.5;
  c.strokeRect(x0,y0,pw,ph);
  c.beginPath(); c.moveTo(x0+pw/2,y0); c.lineTo(x0+pw/2,y1); c.stroke();
  c.beginPath(); c.arc(x0+pw/2,y0+ph/2,ph*0.135,0,Math.PI*2); c.stroke();
  const box=(w,hh)=>{
    c.strokeRect(x0,y0+ph*(0.5-hh/2),pw*w,ph*hh);
    c.strokeRect(x1-pw*w,y0+ph*(0.5-hh/2),pw*w,ph*hh);
  };
  box(1-TUNING.rule.boxH,TUNING.rule.boxX*2/100); box(0.052,0.27);
  c.fillStyle="rgba(255,255,255,.85)";
  const gw=W*0.018, gh=ph*0.11;
  c.fillRect(x0-gw,y0+ph/2-gh/2,gw,gh);
  c.fillRect(x1,y0+ph/2-gh/2,gw,gh);
}

/** いま映すべき場面を G(main.js の状態)から組み立てて描く */
function drawFrame(G,dt){
  const c=RV.ctx, M=G.M;
  if(!M||!RV.w)return;
  drawPitch();

  // ---- ボールの位置 ----
  const ev=G.cur;
  const pin=new Map();                       // この場面で位置が決まっている選手
  let target, lift=0, holderId=null;
  if(ev&&ev.from){
    const t=ease(clamp(G.curT/ev.dur,0,1));
    const a=scrOf(ev.side,ev.from[0],ev.from[1]), b=scrOf(ev.side,ev.dest[0],ev.dest[1]);
    target=[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
    RV.ball=target;
    const far=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(ev.type==="pass"||ev.type==="shot"||ev.type==="cross"||ev.type==="offside")lift=Math.sin(Math.PI*t)*far*0.9;
    if(ev.type==="carry"||ev.type==="kickoff"){ pin.set(ev.by,target); holderId=ev.by; }
    else{
      pin.set(ev.by,a);
      if(ev.to&&ev.ok)pin.set(ev.to,b);
    }
    if(ev.vs){                               // 競った相手は競った場所へ寄る
      const cpt=ev.type==="pass"||ev.type==="cross"?b:a;
      pin.set(ev.vs,[lerp(cpt[0],target[0],0.3)+(ev.side==="H"?0.022:-0.022),cpt[1]]);
    }
  }else if(M.ball){
    target=scrOf(M.ball.side,M.ball.h,M.ball.x);
    const k=1-Math.exp(-dt/90);
    RV.ball=[lerp(RV.ball[0],target[0],k),lerp(RV.ball[1],target[1],k)];
    holderId=M.ball.holder.id;
    pin.set(holderId,RV.ball);
  }else{
    const k=1-Math.exp(-dt/200);
    RV.ball=[lerp(RV.ball[0],0.5,k),lerp(RV.ball[1],0.5,k)];
  }

  // ---- 選手 ----
  const k=1-Math.exp(-dt/170), rad=Math.max(7,RV.w*0.024);
  const seen=new Set();
  for(const T of [M.home,M.away]){
    const bu=RV.ball[0], bh=T.side==="H"?bu:1-bu;
    const bx=(T.side==="H"?RV.ball[1]:1-RV.ball[1])*100;
    for(const p of T.players){
      seen.add(p.id);
      let goal=pin.get(p.id);
      if(!goal)goal=scrOf(T.side,blockH(p,bh),p.gk?p.x:p.x+(bx-p.x)*0.14);
      let v=RV.vis.get(p.id);
      if(!v){ v=goal.slice(); RV.vis.set(p.id,v); }
      v[0]=lerp(v[0],goal[0],k); v[1]=lerp(v[1],goal[1],k);
      const [x,y]=pxOf(v[0],v[1]);
      c.beginPath(); c.arc(x,y+rad*0.35,rad*0.9,0,Math.PI*2);
      c.fillStyle="rgba(0,0,0,.22)"; c.fill();
      c.beginPath(); c.arc(x,y,rad,0,Math.PI*2);
      c.fillStyle=p.gk?"#d9a521":T.color; c.fill();
      c.lineWidth=p.id===holderId?2.5:1.2;
      c.strokeStyle=p.id===holderId?"#f2c14e":"rgba(255,255,255,.9)"; c.stroke();
      c.fillStyle="#fff"; c.font="700 "+Math.round(rad*1.05)+"px system-ui,sans-serif";
      c.textAlign="center"; c.textBaseline="middle";
      c.fillText(p.c.no,x,y+0.5);
      if(p.kp){                                // KP の印
        c.fillStyle="#f2c14e"; c.font="900 "+Math.round(rad*0.9)+"px system-ui,sans-serif";
        c.fillText("★",x+rad*0.95,y-rad*0.95);
      }
      if(p.stam<TUNING.stam.tiredAt){          // 足が止まっている
        c.fillStyle="#ff7a6b"; c.fillRect(x-rad,y+rad*1.25,rad*2*p.stam/TUNING.stam.tiredAt,2.5);
      }
      if(p.yc){                                // 警告を受けている
        c.fillStyle="#ffd84a"; c.fillRect(x-rad*1.25,y-rad*1.3,rad*0.5,rad*0.7);
      }
    }
  }
  for(const id of RV.vis.keys())if(!seen.has(id))RV.vis.delete(id);

  // ---- ボール ----
  const [bx,by]=pxOf(RV.ball[0],RV.ball[1]), br=rad*0.42, up=lift*RV.h*0.5;
  c.beginPath(); c.ellipse(bx+rad*0.5,by+rad*0.55,br,br*0.6,0,0,Math.PI*2);
  c.fillStyle="rgba(0,0,0,.35)"; c.fill();
  c.beginPath(); c.arc(bx+rad*0.5,by+rad*0.2-up,br*(1+lift*1.2),0,Math.PI*2);
  c.fillStyle="#fff"; c.fill();
  c.lineWidth=1; c.strokeStyle="#222"; c.stroke();
}

/* =========================================================================
   wcc_f — カード盤面(下半分)。筐体のフラットパネルにあたる。
   カードを動かすと orderMatch に積まれ、次のステップから試合に効く。
   盤面は映像と同じ向き(左=自陣ゴール / 右=敵陣ゴール)。
   カードを動かさずに離す(タップ)と、そのカードの詳細が開く。
   ========================================================================= */

const BD={ cards:null, bench:null, board:null, map:new Map(), drag:null, pendingIn:new Set(), kp:null };
const TAP_PX=7;                              // これ未満の動きはタップとみなす

// 盤面の % 座標。端のカードが切れないよう内側に寄せる
const bdPos=(h,x)=>[6+h*88, 11+x*0.78];
function bdInv(cx,cy){
  const r=BD.board.getBoundingClientRect();
  return { h:((cx-r.left)/r.width*100-6)/88, x:((cy-r.top)/r.height*100-11)/0.78 };
}
const aptClass=a=>a>=TUNING.apt.own?"a0":a>=TUNING.apt.group?"a1":"a2";

function mkCard(card){
  const el=document.createElement("div");
  el.className="cd "+card.pos.toLowerCase();
  el.dataset.id=card.id;
  el.innerHTML='<i class="rl">'+card.pos+'</i><i class="no">'+card.no+'</i>'+
    '<u class="nm">'+nameOf(card)+'</u><s class="stm"><em style="width:100%"></em></s>'+
    '<b class="kpm">KP</b><b class="ycm"></b>';
  return el;
}

function initBoard(){
  BD.board=document.getElementById("board");
  BD.cards=document.getElementById("cards");
  BD.bench=document.getElementById("bench");
  // ペナルティエリアを判定と同じ値から引く(自陣 h≦1-boxH / 敵陣 h≧boxH / 左右は中央 ±boxX)
  const O=TUNING.rule, top=bdPos(0,50-O.boxX)[1], bot=100-bdPos(0,50+O.boxX)[1];
  const edge=bdPos(1-O.boxH,0)[0];
  for(const id of ["paOwn","paOpp"]){
    const el=document.getElementById(id);
    el.style.top=top+"%"; el.style.bottom=bot+"%";
    el.style.width="calc("+edge+"% - 6px)";
  }
}

function buildBoard(M){
  BD.cards.textContent=""; BD.bench.textContent=""; BD.map.clear(); BD.drag=null;
  for(const p of M.home.players){
    const el=mkCard(p.c);
    bindFieldDrag(el,p.id,p.gk);
    BD.cards.appendChild(el); BD.map.set(p.id,el);
  }
  const lbl=document.createElement("span"); lbl.className="lbl"; lbl.textContent="控え";
  BD.bench.appendChild(lbl);
  for(const card of M.home.bench){
    const el=mkCard(card);
    el.querySelector(".stm").remove();
    if(BD.pendingIn.has(card.id))el.classList.add("used");
    bindBenchDrag(el,card.id);
    BD.bench.appendChild(el);
  }
  syncBoard(M);
}

/** 連携の線を引き直す。段が高いほど太く、金色に近い */
function drawLinks(M){
  const svg=document.getElementById("links"), NS="http://www.w3.org/2000/svg";
  svg.textContent="";
  const at=id=>{ const el=BD.map.get(id); return el?[parseFloat(el.style.left),parseFloat(el.style.top)]:null; };
  for(const l of M.home.links){
    const a=at(l[0]), b=at(l[1]);
    if(!a||!b)continue;
    const ln=document.createElementNS(NS,"line");
    ln.setAttribute("x1",a[0]+"%"); ln.setAttribute("y1",a[1]+"%");
    ln.setAttribute("x2",b[0]+"%"); ln.setAttribute("y2",b[1]+"%");
    ln.setAttribute("class","lk lk"+l[2]);
    svg.appendChild(ln);
  }
}
function setCardLook(el,role,apt){
  const rl=el.firstChild;
  rl.textContent=role; rl.className="rl "+aptClass(apt);
}
function syncBoard(M){
  const hold=M.ball&&M.ball.side==="H"?M.ball.holder.id:null;
  const kp=BD.kp||M.home.kp;
  for(const p of M.home.players){
    const el=BD.map.get(p.id);
    if(!el)continue;
    if(!(BD.drag&&BD.drag.id===p.id&&!BD.drag.bench)){
      const [l,t]=bdPos(p.h,p.x);
      el.style.left=l+"%"; el.style.top=t+"%";
      setCardLook(el,p.role,p.apt);
    }
    const em=el.querySelector(".stm em");
    em.style.width=Math.round(p.stam*100)+"%";
    em.className=p.stam<TUNING.stam.tiredAt?"low":p.stam<0.6?"midv":"";
    el.classList.toggle("tired",p.stam<TUNING.stam.tiredAt);
    el.classList.toggle("hasball",p.id===hold);
    el.classList.toggle("iskp",p.id===kp);
    el.classList.toggle("booked",p.yc>0);
  }
  drawLinks(M);
}

/* ---- 盤面のカードを動かす ---- */
function bindFieldDrag(el,id,gk){
  el.addEventListener("pointerdown",e=>{
    if(BD.drag)return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    BD.drag={ id, el, pid:e.pointerId, x0:e.clientX, y0:e.clientY, moved:false };
    el.classList.add("drag");
  });
  el.addEventListener("pointermove",e=>{
    const d=BD.drag;
    if(!d||d.id!==id||d.pid!==e.pointerId||d.bench)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<TAP_PX)return;
    d.moved=true;
    const raw=bdInv(e.clientX,e.clientY), q=clampPos(gk,raw.h,raw.x), h=q.h, x=q.x;
    const [l,t]=bdPos(h,x);
    el.style.left=l+"%"; el.style.top=t+"%";
    const role=gk?"GK":roleAt(h,x);
    setCardLook(el,role,aptOf(CARDS[id],role));
    drawLinks(G.M);
    orderMatch(G.M,"H",{ type:"move", id, h, x });
  });
  const end=e=>{
    const d=BD.drag;
    if(!d||d.id!==id||d.pid!==e.pointerId)return;
    el.classList.remove("drag"); BD.drag=null;
    if(!d.moved&&e.type==="pointerup")tapCard(id);
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}

/* ---- 控えを盤面のカードに重ねて交代 ---- */
function fieldCardAt(cx,cy,except){
  for(const n of document.elementsFromPoint(cx,cy)){
    if(n===except)continue;
    const c=n.closest&&n.closest("#cards .cd");
    if(c)return c;
  }
  return null;
}
function bindBenchDrag(el,id){
  el.addEventListener("pointerdown",e=>{
    if(BD.drag)return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const can=!G.M.over&&!BD.pendingIn.has(id)&&G.M.home.subs+BD.pendingIn.size<TUNING.squad.subMax;
    BD.drag={ id, el, pid:e.pointerId, bench:true, x0:e.clientX, y0:e.clientY, over:null, moved:false, can };
    if(can)el.classList.add("drag");
  });
  el.addEventListener("pointermove",e=>{
    const d=BD.drag;
    if(!d||d.id!==id||d.pid!==e.pointerId)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<TAP_PX)return;
    d.moved=true;
    if(!d.can)return;
    el.style.transform="translate("+(e.clientX-d.x0)+"px,"+(e.clientY-d.y0)+"px) scale(1.14)";
    const tgt=fieldCardAt(e.clientX,e.clientY,el);
    if(tgt!==d.over){
      if(d.over)d.over.classList.remove("drop");
      if(tgt)tgt.classList.add("drop");
      d.over=tgt;
    }
  });
  const end=e=>{
    const d=BD.drag;
    if(!d||d.id!==id||d.pid!==e.pointerId)return;
    el.classList.remove("drag"); el.style.transform="";
    if(d.over){
      d.over.classList.remove("drop");
      if(e.type==="pointerup"){
        orderMatch(G.M,"H",{ type:"sub", out:d.over.dataset.id, in:id });
        BD.pendingIn.add(id);
        el.classList.add("used");
        onSubQueued(id,d.over.dataset.id);
      }
    }
    BD.drag=null;
    if(!d.moved&&e.type==="pointerup")showInfo(id);
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}

      (L.lines.length?'<ul>'+L.lines.filter(x=>!/^カード:/.test(x)).map(x=>'<li>'+x+'</li>').join("")+'</ul>':'')+'</section>';
  }

  // ---- 次の試合 / 任期の終わり ----
  if(S.termOver){
    h+=termEndHtml();
  }else{
    const comp=COMPS[fx.comp], t=TEAMS[fx.opp], kp=CARDS[t.kp], st=styleOfCard(kp), ready=S.g.step!=="train";
    h+='<section class="card next"><h3>第'+fx.no+'試合 <small>'+gradeTag(comp.grade)+comp.name+' '+fx.label+'</small></h3>'+
      (fx.missed?'<p class="dim">'+COMPS[fx.missed].name+'('+fx.why+')の枠</p>':'')+
      '<div class="opp"><i class="chip" style="background:'+t.color+'"></i><div><b>'+teamNameOf(t)+'</b>'+
      '<small>'+stars(tierOf(fx.opp))+' ・ '+t.form+' ・ '+(fx.kind==="friendly"?"":fx.home?"ホーム":"アウェイ")+'</small>'+
      '<small>KP '+nameOf(kp)+(st?'｜'+st.name:'')+'</small></div></div>'+
      (fx.agg?'<p>第1試合 '+fx.agg[0]+' - '+fx.agg[1]+'(2試合の合計で決まる)</p>':'')+
      (fx.ko?'<p class="dim">同点なら PK 戦</p>':'')+
      (fx.kind==="friendly"?'<p class="dim">フレンドリーマッチ: 勝つと、兆しのある選手の覚醒・★5・黄金線が開花する</p>':'')+
      (ready?'<button class="btn btn-main" data-act="play">③ 試合へ</button>'
            :'<button class="btn btn-main" disabled>先にチーム練習を選ぶ</button>')+
      (fx.canDecline?'<button class="btn btn-sub" data-act="decline">棄権してフレンドリーマッチにする</button>':'')+
      '</section>';
    h+=developHtml();
  }

  h+=squadHtml();
  h+=collectionHtml();

  // ---- リーグ ----
  const L=S.league, order=sortTable(L.table);
  h+='<section class="card"><h3>レギュラーリーグ <small>'+L.done+'/14 節</small></h3><table class="tbl">'+
    '<tr><th></th><th></th><th>試</th><th>勝</th><th>分</th><th>敗</th><th>得失</th><th>点</th></tr>'+
    order.map((id,i)=>{ const r=L.table[id];
      return '<tr'+(id==="me"?' class="me"':'')+'><td>'+(i+1)+'</td><td class="nm2">'+clubName(id)+'</td><td>'+r.p+
        '</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+(r.gf-r.ga>0?"+":"")+(r.gf-r.ga)+'</td><td><b>'+r.pts+'</b></td></tr>'; }).join("")+
    '</table></section>';

  // ---- 大会 ----
  const stTxt={ wait:"—", in:"出場中", out:"敗退", quit:"棄権", won:"優勝" };
  h+='<section class="card"><h3>大会 <small>'+S.cyc+'周目</small></h3><table class="tbl cups">'+
    CUP_IDS.map(id=>{ const c=S.cups[id], past=SCHED.findIndex(s=>s[0]===id)<S.slot;
      const txt=c.st==="wait"?(past?"出場なし":entryOk(S,id)?"出場できる":"条件を満たしていない"):stTxt[c.st];
      return '<tr class="st-'+c.st+'"><td>'+gradeTag(COMPS[id].grade)+'</td><td class="nm2">'+COMPS[id].name+'</td><td>'+txt+'</td></tr>'; }).join("")+
    '</table></section>';

  // ---- 成績 ----
  const r=S.rec, names=S.titles.map(t=>COMPS[t.comp].name);
  h+='<section class="card"><h3>この任期</h3><p>'+r.w+'勝 '+r.d+'分 '+r.l+'敗 ・ 得点 '+r.gf+' / 失点 '+r.ga+'</p>'+
    '<p class="dim">獲得タイトル '+S.titles.length+(names.length?': '+names.slice(-6).join(" / "):'')+'</p></section>';

  h+=careerHtml();
  h+=settingsHtml();
  return h;
}

/** 試合を始める。配置は前の試合の最後のまま */
function startFixture(){
  skipComm(CL.S);                              // 残りのコミュニケーションは使わない
  const fx=CL.fx, m=fixtureMatch(CL.S,fx), comp=COMPS[fx.comp];
  CL.msg=[]; CL.comm=null; CL.pick=[];
  hideClub();
  newMatch(m.home,m.away,m.seed,m.opts,{ title:comp.name+(fx.label?" "+fx.label:""), career:true,
    starters:m.home.xi.map(x=>x.card.id) });
}
/** 試合が終わったら呼ぶ。結果を反映して保存し、クラブハウスへ戻る */
function finishFixture(M){
  const layout={}, onPitch=M.home.players.map(p=>p.id);
  M.home.players.forEach(p=>layout[p.id]=[r2(p.h),r2(p.x)]);
  const played=[...new Set((G.meta.starters||[]).concat(onPitch))];
  applyResult(CL.S,CL.W,CL.fx,{ hg:M.home.score, ag:M.away.score, pso:M.pso, layout, kp:M.home.kp, played, onPitch,
    starters:G.meta.starters||[], subs:M.home.subs,
    kpCh:M.events.filter(e=>e.type==="kp"&&e.side==="H").length });
  saveCareer(CL.store,CL.S);
  showClub();
}
function onClubClick(e){
  const b=e.target.closest("[data-act]");
  if(!b||b.disabled)return;
  const act=b.dataset.act, S=CL.S, save=()=>saveCareer(CL.store,S);
  if(act!=="reset")CL.armReset=false;
  if(onSettingsClick(act))return;
  if(act==="play")startFixture();
  else if(act==="decline"){ declineCup(S,CL.fx.comp); save(); showClub(true); }
  else if(act==="term"){ startNextTerm(S,CL.W); CL.msg=[]; save(); showClub(); }
  else if(act==="train"){
    const o=trainOptions(S)[+b.dataset.i];
    CL.msg=["練習: "+trainLabel(o)+"("+INT_LABEL[CL.int]+")"].concat(doTraining(S,+b.dataset.i,CL.int));
    CL.comm=null; CL.pick=[]; save(); showClub();
  }
  else if(act==="int"){ CL.int=+b.dataset.i; showClub(true); }
  else if(act==="cf"){ CL.cf=b.dataset.v; CL.sel=null; showClub(true); }
  else if(act==="card"){ CL.sel=CL.sel===b.dataset.id?null:b.dataset.id; showClub(true); }
  else if(act==="swap"&&CL.sel){
    const out=b.dataset.id, inn=CL.sel;
    if(swapSquad(S,out,inn)){ CL.msg=["登録: "+cname(out)+" → "+cname(inn)+"(次の試合から使える)"]; CL.sel=null; save(); }
    showClub(true);
  }
  else if(act==="sqpick"){
    const id=b.dataset.id;
    if(!CL.sqSel)CL.sqSel=id;
    else if(CL.sqSel===id)CL.sqSel=null;
    else{ moveSquad(S,CL.sqSel,id); CL.sqSel=null; save(); }
    showClub(true);
  }
  else if(act==="comm"){ CL.comm=b.dataset.v; CL.pick=[]; showClub(true); }
  else if(act==="ind"&&CL.pick.length===1){
    const r=doIndTrain(S,CL.pick[0]); CL.msg=CL.msg.concat(["個人練習"],r.lines);
    CL.pick=[]; save(); showClub(true);
  }
  else if(act==="talk"&&CL.pick.length===1){
    const r=doTalk(S,CL.pick[0]); CL.msg=CL.msg.concat(["声かけ"],r.lines);
    CL.pick=[]; save(); showClub(true);
  }
  else if(act==="pick"){
    const id=b.dataset.id, max=COMM_UI[CL.comm]?COMM_UI[CL.comm].n:1, i=CL.pick.indexOf(id);
    if(i>=0)CL.pick.splice(i,1); else{ if(CL.pick.length>=max)CL.pick.shift(); CL.pick.push(id); }
    showClub(true);
  }
  else if(act==="lounge"&&CL.pick.length===2){
    const r=doLounge(S,CL.pick[0],CL.pick[1],+b.dataset.i);
    CL.msg=CL.msg.concat(["ラウンジ: "+cname(CL.pick[0])+" と "+cname(CL.pick[1])],r.lines);
    CL.pick=[]; save(); showClub(true);
  }
  else if(act==="meet"&&CL.pick.length===1){
    const r=doMeeting(S,CL.pick[0],+b.dataset.i);
    CL.msg=CL.msg.concat(["ミーティング: "+cname(CL.pick[0])],r.lines);
    CL.pick=[]; save(); showClub(true);
  }
  else if(act==="reset"){
    if(!CL.armReset){ CL.armReset=true; showClub(true); return; }
    CL.armReset=false; clearCareer(CL.store); CL.msg=[];
    CL.S=newCareer(Date.now()&0x7fffffff); CL.W=worldOf(CL.S);
    saveCareer(CL.store,CL.S); showClub();
  }
}

/* =========================================================================
   wcc_f — 設定とデータ(→docs/01 §1.4・§1.5)
   ・実名パック: JSON ファイルを選んで読み込む。**その端末の中だけ**に保存し、表示名を差し替える
     (本体には実名を入れない。fetch で取りに行かない)
   ・セーブの書き出し / 読み込み: 機種変更やブラウザのデータ消去に備える
   ========================================================================= */

const PACK_KEY="wcc_f.pack.v1";

/** 実名パックの形を確かめる。{ names:{カードid:名前}, teams:{クラブid:{name}} } */
function checkPack(d){
  if(!d||typeof d!=="object"||typeof d.names!=="object"||typeof d.teams!=="object")return "形が違う(names と teams が要る)";
  const n=Object.keys(d.names).filter(id=>CARDS[id]&&typeof d.names[id]==="string").length;
  if(!n)return "このゲームのカードに当てはまる名前が1つも無い";
  return null;
}
/** パックを PACK に流し込む(前のパックの名前は消す) */
function applyPack(d){
  for(const k of Object.keys(PACK.names))delete PACK.names[k];
  for(const k of Object.keys(PACK.teams))delete PACK.teams[k];
  if(!d)return 0;
  let n=0;
  for(const id in d.names)if(CARDS[id]&&typeof d.names[id]==="string"){ PACK.names[id]=d.names[id]; n++; }
  for(const id in d.teams)if(TEAMS[id]&&d.teams[id]&&typeof d.teams[id].name==="string")PACK.teams[id]={ name:d.teams[id].name };
  return n;
}
/** 起動時: 端末に保存したパックがあれば流し込む */
function loadStoredPack(){
  try{
    const t=localStorage.getItem(PACK_KEY);
    if(!t)return 0;
    const d=JSON.parse(t);
    return checkPack(d)?0:applyPack(d);
  }catch(e){ return 0; }
}
const packActive=()=>Object.keys(PACK.names).length>0;

/** ファイルを文字列で読む(file:// でも動く。fetch は使わない) */
function readFileText(file){
  return new Promise((ok,ng)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>ng(r.error); r.readAsText(file); });
}
/** 文字列をファイルとして保存させる。保存できない端末(古い iOS など)では、画面に出してコピーしてもらう */
function saveText(name,text){
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{ type:"application/json" }));
    a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return true;
  }catch(e){ return false; }
}

/* ---- 画面(クラブハウスの下の「設定・データ」) ---- */

function settingsHtml(){
  if(!CL.set)return '<footer class="cft"><button class="btn btn-sub" data-act="set">設定・データ</button></footer>';
  const S=CL.S, kb=(JSON.stringify(S).length/1024).toFixed(1);
  return '<section class="card set"><h3>設定・データ <small><button class="lnk" data-act="set">閉じる</button></small></h3>'+
    '<h4>実名パック</h4>'+
    '<p class="dim">'+(packActive()?'読み込み済み('+Object.keys(PACK.names).length+'人)。この端末の中だけで実名を表示している'
      :'未読み込み(偽名で表示中)。パックのファイル(.json)を選ぶと、この端末の中だけ実名で表示する')+'</p>'+
    '<label class="btn btn-sub file">パックを読み込む<input type="file" accept=".json,application/json" data-file="pack"></label>'+
    (packActive()?'<button class="btn btn-sub" data-act="unpack">パックを外す(偽名に戻す)</button>':'')+
    '<h4>セーブ</h4>'+
    '<p class="dim">第'+S.term+'任期 '+S.played+'試合目 ・ カード '+Object.keys(S.coll).length+'種 ・ '+kb+' KB。'+
      'ブラウザのデータを消すとセーブも消える。機種変更の前は書き出しておく</p>'+
    '<button class="btn btn-sub" data-act="export">セーブを書き出す(ファイル)</button>'+
    '<button class="btn btn-sub" data-act="copy">セーブをコピーする(テキスト)</button>'+
    '<label class="btn btn-sub file">セーブを読み込む(ファイル)<input type="file" accept=".json,application/json,text/plain" data-file="save"></label>'+
    (CL.setMsg?'<p class="hint">'+CL.setMsg+'</p>':'')+
    (CL.copyText?'<textarea class="cp" readonly>'+CL.copyText.replace(/</g,"&lt;")+'</textarea>':'')+
    '<h4>最初から</h4>'+
    '<button class="btn btn-sub" data-act="reset">'+(CL.armReset?"本当に最初からやり直す(セーブが消える)":"最初からやり直す")+'</button>'+
    '</section>';
}
function settingsMsg(t){ CL.setMsg=t; showClub(true); }
function onSettingsClick(act){
  const S=CL.S;
  if(act==="set"){ CL.set=!CL.set; CL.setMsg=""; CL.copyText=""; showClub(true); return true; }
  if(act==="unpack"){
    try{ localStorage.removeItem(PACK_KEY); }catch(e){}
    applyPack(null); settingsMsg("パックを外した(偽名に戻した)"); return true;
  }
  if(act==="export"){
    const name="wcc_f-save-t"+S.term+"-"+S.played+".json";
    settingsMsg(saveText(name,JSON.stringify(S))?"書き出した: "+name:"この端末ではファイルにできなかった。「コピーする」を使う");
    return true;
  }
  if(act==="copy"){
    const t=JSON.stringify(S);
    CL.copyText=t;
    settingsMsg("下の欄の文字がセーブ。メモ帳などに貼って保存する");   // 先に欄を出す(許可待ちで止まらない)
    try{ navigator.clipboard.writeText(t).then(()=>settingsMsg("コピーした。メモ帳などに貼って保存する"),
      ()=>settingsMsg("下の欄を長押しして全部選び、コピーする")); }
    catch(e){ settingsMsg("下の欄を長押しして全部選び、コピーする"); }
    return true;
  }
  return false;
}
/** ファイルが選ばれたとき(パック / セーブ) */
async function onSettingsFile(input){
  const f=input.files&&input.files[0], kind=input.dataset.file;
  if(!f)return;
  let text="";
  try{ text=await readFileText(f); }catch(e){ settingsMsg("ファイルを読めなかった"); return; }
  if(kind==="pack"){
    let d=null; try{ d=JSON.parse(text); }catch(e){}
    const bad=checkPack(d);
    if(bad){ settingsMsg("パックを読み込めなかった: "+bad); return; }
    try{ localStorage.setItem(PACK_KEY,JSON.stringify(d)); }catch(e){}
    settingsMsg("パックを読み込んだ("+applyPack(d)+"人を実名で表示)");
  }else{
    const box={ v:text, getItem(){ return this.v; }, setItem(){}, removeItem(){} };
    const L=loadCareer(box);
    if(!L){ settingsMsg("セーブを読み込めなかった(形が違うか、壊れている)"); return; }
    CL.S=L; CL.W=worldOf(L); CL.msg=[]; CL.sel=null;
    saveCareer(CL.store,L);
    settingsMsg("セーブを読み込んだ(第"+L.term+"任期 "+L.played+"試合目)");
  }
}

/* =========================================================================
   wcc_f — 進行。エンジンを1ステップずつ解き、解けたイベントを順に再生する。
   再生速度を変えても、止めても、結果は変わらない(描画は読むだけ)。
   ========================================================================= */

const G={ M:null, seed:1, playing:false, speed:1, queue:[], cur:null, curT:0, hold:0,
  flash:false, last:0, stopAt:0, onOv:null, ins:{ line:0, side:0, press:false }, info:null, kpMode:false };
const $=id=>document.getElementById(id);
const SPEEDS=[1,2,4];

/**
 * 試合を始める。クラブハウスからは両クラブの定義と大会の条件が渡る。
 * 何も渡さなければ、その場かぎりの練習試合(検証用の ?quick=1)。
 */
function newMatch(homeDef,awayDef,seed,opts,meta){
  G.seed=seed>>>0;
  G.meta=meta||{ title:"KICK OFF", career:false };
  G.M=createMatch(homeDef||makeTeamDef("azr",false),awayDef||makeTeamDef("ros",true),G.seed,opts);
  G.queue=[]; G.cur=null; G.hold=0; G.playing=false;
  G.ins={ line:0, side:0, press:false }; G.kpMode=false;
  RV.vis.clear(); RV.ball=[0.5,0.5];
  BD.pendingIn.clear(); BD.kp=null;
  const M=G.M;
  $("hudH").textContent=M.home.short; $("hudA").textContent=M.away.short;
  $("hudHc").style.background=M.home.color; $("hudAc").style.background=M.away.color;
  setHud(0,0,"0'");
  say(teamNameOf(M.home)+" vs "+teamNameOf(M.away));
  hideInfo();
  buildBoard(M);
  updateCtl();
  overlay(G.meta.title,"カードを動かして布陣を決める。<br>KP ボタン → カードをタップで、そのスタイルが発動する。"+
    (G.M.opts.agg?"<br>第1試合 "+G.M.opts.agg[0]+" - "+G.M.opts.agg[1]:"")+
    (G.M.opts.ko?"<br>同点なら PK 戦":""),"試合開始",true,()=>setPlaying(true));
}

/* ---- 表示まわり ---- */
function setHud(hg,ag,clock){
  $("hudScore").textContent=hg+" - "+ag;
  $("hudClock").textContent=clock;
}
function say(text,goal){
  const t=$("ticker"); t.textContent=text; t.classList.toggle("goal",!!goal);
}
function updateCtl(){
  $("btnPlay").textContent=G.playing?"⏸":"▶";
  $("btnSpeed").textContent="×"+G.speed;
  $("subInfo").textContent="交代 "+(G.M.home.subs+BD.pendingIn.size)+"/"+TUNING.squad.subMax;
  $("btnKp").classList.toggle("on",G.kpMode);
  $("board").classList.toggle("kpmode",G.kpMode);
  $("btnUp").classList.toggle("on",G.ins.line===1);
  $("btnDown").classList.toggle("on",G.ins.line===-1);
  $("btnLeft").classList.toggle("on",G.ins.side===-1);
  $("btnRight").classList.toggle("on",G.ins.side===1);
  $("btnPress").classList.toggle("on",G.ins.press);
  updateStyleBar();
}
/** いま有効なスタイルを両チームぶん出す(映像の下の帯) */
function styleText(T,pendingKp){
  const id=pendingKp||T.kp, c=id?CARDS[id]:null, st=c?styleOfCard(c):null;
  if(!st)return "KP なし";
  const rank=pendingKp?rankOf(axisVal(T,st.axis)):T.rank||rankOf(axisVal(T,st.axis));
  return "KP "+nameOf(c)+"｜"+st.name+" <b class=\"rk rk"+rank+"\">"+rank+"</b>";
}
function updateStyleBar(){
  $("styH").innerHTML=styleText(G.M.home,BD.kp);
  $("styA").innerHTML=styleText(G.M.away,null);
}
function setPlaying(v){ G.playing=v; updateCtl(); }
function overlay(title,body,btn,top,fn){
  $("ovTitle").textContent=title; $("ovBody").innerHTML=body; $("ovBtn").textContent=btn;
  const ov=$("ov");
  ov.classList.add("on");
  // top: 盤面を隠さない(キックオフ前とハーフタイムはカードを触れる)
  ov.style.bottom=top?"auto":"0";
  ov.style.height=top?($("hud").offsetHeight+$("viewWrap").offsetHeight+$("ticker").offsetHeight)+"px":"auto";
  G.onOv=fn;
}
function closeOverlay(){
  $("ov").classList.remove("on");
  const fn=G.onOv; G.onOv=null;
  if(fn)fn();
}
function onSubQueued(){ updateCtl(); say("交代を指示(次のプレーで入る)"); }
/** KP を替える。エンジンには次のステップで渡り、それまでは盤面に仮の印を出す */
function pickKp(id){
  if(G.M.over||!G.M.home.players.some(p=>p.id===id))return;
  orderMatch(G.M,"H",{ type:"kp", id });
  BD.kp=id; G.kpMode=false;
  const st=styleOfCard(CARDS[id]);
  say("KP "+nm(id)+(st?" ▶ "+st.name:""),true);
  syncBoard(G.M); updateCtl();
}
/** 盤面のカードをタップしたとき。KP ボタンを押したあとなら KP に、そうでなければ詳細を開く */
function tapCard(id){ if(G.kpMode)pickKp(id); else showInfo(id); }
/** 監督の指示。同じボタンをもう一度押すと解除。上げる/下げる、左/右はどちらか一方 */
function toggleIns(key,val){
  G.ins[key]=key==="press"?!G.ins.press:(G.ins[key]===val?0:val);
  orderMatch(G.M,"H",{ type:"ins", line:G.ins.line, side:G.ins.side, press:G.ins.press });
  updateCtl();
}

/* ---- カードの詳細(タップで開く) ---- */
function showInfo(id){
  const M=G.M, p=M.home.players.find(q=>q.id===id);
  // 育成を反映したカード(盤面の選手か控え)を見せる。無ければ元のカード
  const c=(p&&p.c)||M.home.bench.find(b=>b.id===id)||CARDS[id];
  if(!c)return;
  const sk=c.skill?SKILLS[c.skill]:null;
  const kp=(BD.kp||M.home.kp)===id, st=styleOfCard(c);
  const rank=st?rankOf(axisVal(M.home,st.axis)):null;
  const bar=k=>'<span class="st"><i>'+STAT_LABEL[k]+'</i><b>'+(Math.round(c[k]*10)/10)+'</b><em><u style="width:'+
    (c[k]/STAT_MAX*100)+'%"></u></em></span>';
  $("infoBody").innerHTML=
    '<h2><span class="pos '+c.pos.toLowerCase()+'">'+c.pos+'</span>'+c.no+' '+nameOf(c)+
      (kp?' <span class="kpt">KP</span>':'')+(p&&p.yc?' <span class="yct">警告</span>':'')+
      (c.is!=null?' <small class="stars">個'+"★".repeat(c.is)+' 特'+"★".repeat(c.ss)+'</small>':'')+'</h2>'+
    '<div class="roles">'+(c.age?c.age+'歳 ・ ':'')+'得意: '+c.roles.join(" / ")+(p?'　いま: '+p.role+'(適性 '+Math.round(p.apt*100)+'%)'+
      '　体力 <b class="'+(p.stam<0.4?"lo":p.stam<0.6?"md":"hi")+'">'+Math.round(p.stam*100)+'%</b>':'　控え')+'</div>'+
    '<div class="sts">'+STATS.map(bar).join("")+'</div>'+
    '<div class="skl">'+(sk?'<b>★'+sk.label+'</b> '+sk.desc+'(常時)':'スキルなし')+'</div>'+
    (st?'<div class="sty"><b>KP スタイル: '+st.name+'</b> <i>'+(st.scope==="team"?"全体":"個人")+'・'+
      AXIS_LABEL[st.axis]+'</i> <b class="rk rk'+rank+'">ランク'+rank+'</b><br>'+
      '<span class="get">○ '+st.get+'</span>'+(st.lose?'<br><span class="lose">× '+st.lose+'</span>':'')+'</div>':'');
  const b=$("infoKp");
  b.style.display=p?"":"none";
  b.disabled=kp||M.over;
  b.textContent=kp?"KP に指定中":"KP にする";
  updateStyleBar();
  G.info=id;
  $("info").classList.add("on");
}
function hideInfo(){ $("info").classList.remove("on"); G.info=null; }

const nm=id=>{ const c=CARDS[id]; return c?nameOf(c):""; };
const tag=ev=>"["+teamOf(G.M,ev.side).short+"] ";
const skt=s=>s?" ★"+s:"";
function sayStart(ev){
  if(ev.type==="kickoff")return say(tag(ev)+"キックオフ");
  if(ev.type==="shot")
    return say(tag(ev)+nm(ev.by)+(ev.sp==="pk"?"のPK！":ev.sp==="fk"?"が直接狙う！":ev.sp==="hdr"?"のヘディング！":"のシュート！"));
  if(ev.type==="offside")return say(tag(ev)+nm(ev.by)+"の"+ev.label+" → "+nm(ev.to)+"はオフサイド");
  if(ev.type==="cross")
    return say(tag(ev)+nm(ev.by)+"の"+ev.label+(ev.ok?" → "+nm(ev.to)+"が競り勝つ":"は"+nm(ev.vs)+"がはね返す"));
  const tail=ev.foul?"(反則)":ev.ck?"、コーナーへ":ev.out?"、タッチを割る":"";
  if(ev.type==="pass")
    return say(tag(ev)+(ev.ok?nm(ev.by)+" "+ev.label+" → "+nm(ev.to)+skt(ev.sk)
      :nm(ev.by)+"の"+ev.label+"を"+nm(ev.vs)+"がカット"+skt(ev.dsk)+tail));
  if(ev.type==="carry")
    return say(tag(ev)+(ev.ok?nm(ev.by)+"の"+ev.label+skt(ev.sk)
      :nm(ev.vs)+"が"+nm(ev.by)+"を止める"+skt(ev.dsk)+tail));
}
function sayShotEnd(ev){
  if(ev.res==="goal")return say("⚽ GOAL! "+tag(ev)+nm(ev.by)+skt(ev.sk),true);
  if(ev.res==="save")
    return say(tag(ev)+nm(ev.by)+"のシュートは"+nm(ev.gk)+"がセーブ"+skt(ev.dsk)+(ev.ck?"、コーナーへ":ev.reb?"、こぼれ球！":""));
  if(ev.res==="miss")return say(tag(ev)+nm(ev.by)+"のシュートは枠の外");
  if(ev.res==="block")
    return say(tag(ev)+nm(ev.by)+"のシュートは"+(ev.wall?"壁に当たる":nm(ev.vs)+"がブロック"+skt(ev.dsk))+
      (ev.foul?"…反則！":ev.ck?"、コーナーへ":""));
}
function sayFoul(ev){
  const card=ev.card==="r"?" 🟥一発退場":ev.card==="yr"?" 🟨🟥2枚目で退場":ev.card==="y"?" 🟨警告":"";
  const set=ev.set==="pk"?" → PK！":ev.set==="fk"?" → フリーキック":"";
  say(tag(ev)+nm(ev.by)+"が"+nm(ev.on)+"に反則"+card+set,ev.set==="pk");
}
function statsHtml(){
  const H=G.M.home, A=G.M.away, tot=H.st.steps+A.st.steps||1;
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"-";
  const row=(a,l,b)=>"<tr><td>"+a+"</td><td>"+l+"</td><td>"+b+"</td></tr>";
  return "<b>"+H.score+" - "+A.score+"</b><table>"+
    row(H.st.shots,"シュート",A.st.shots)+row(H.st.onT,"枠内",A.st.onT)+
    row(pct(H.st.steps,tot),"支配率",pct(A.st.steps,tot))+
    row(pct(H.st.passOk,H.st.pass),"パス成功",pct(A.st.passOk,A.st.pass))+
    row(H.st.ck,"コーナー",A.st.ck)+row(H.st.fouls,"反則",A.st.fouls)+
    row(H.st.yc+" / "+H.st.rc,"警告 / 退場",A.st.yc+" / "+A.st.rc)+
    row(H.st.off,"オフサイド",A.st.off)+"</table>";
}

/* ---- 再生 ---- */
function startEvent(ev){
  const P=TUNING.play;
  if(ev.type==="sub"){
    if(ev.side==="H"){ BD.pendingIn.delete(ev.in); buildBoard(G.M); updateCtl(); }
    say("["+teamOf(G.M,ev.side).short+"] 交代 "+nm(ev.out)+" → "+nm(ev.in));
    G.hold=350;
    return;
  }
  if(ev.type==="posture"){
    const T=teamOf(G.M,ev.side);
    say("["+T.short+"] "+(ev.mode==="attack"?"前がかりになった":ev.mode==="defend"?"中央を固めてきた":"構えを戻した"));
    G.hold=500;
    return;
  }
  if(ev.type==="kp"){
    const st=styleOfCard(CARDS[ev.id]);
    say(tag(ev)+"KP "+nm(ev.id)+(st?" ▶ "+st.name:""),true);
    syncBoard(G.M); updateStyleBar(); G.hold=ev.side==="H"?500:900;
    return;
  }
  if(ev.type==="tired"){
    say(tag(ev)+nm(ev.by)+"の足が止まった");
    syncBoard(G.M); G.hold=ev.side==="H"?700:300;
    return;
  }
  if(ev.type==="ins"){
    if(ev.side==="H")return;                 // 自分の指示はボタンに出ている
    const a=[];
    if(ev.line)a.push(ev.line>0?"ラインを上げる":"ラインを下げる");
    if(ev.lane)a.push(ev.lane<0?"左サイド重視":"右サイド重視");
    if(ev.press)a.push("プレス");
    say(tag(ev)+"指示: "+(a.join("・")||"解除"));
    G.hold=500;
    return;
  }
  if(ev.type==="foul"){
    sayFoul(ev);
    if(ev.card==="r"||ev.card==="yr"){ if(ev.side==="H")buildBoard(G.M); G.hold=P.cardHold; }
    else G.hold=ev.card||ev.set!=="re"?P.foulHold:P.foulHold*0.5;
    syncBoard(G.M);
    return;
  }
  if(ev.type==="pso"){
    say(tag(ev)+"PK戦 "+nm(ev.by)+(ev.ok?" 決めた":" 失敗")+"("+ev.h+" - "+ev.a+")",ev.ok);
    G.hold=P.psoHold;
    return;
  }
  if(ev.type==="halftime"){
    setPlaying(false);
    setHud(ev.hg,ev.ag,"HT");
    overlay("HALF TIME",statsHtml(),"後半へ",true,()=>setPlaying(true));
    return;
  }
  if(ev.type==="fulltime"){
    setPlaying(false);
    setHud(ev.hg,ev.ag,"FT");
    const H=G.M.home, A=G.M.away, pso=G.M.pso;
    const d=pso?pso[0]-pso[1]:H.score-A.score;
    overlay(d>0?"WIN":d<0?"LOSE":"DRAW",(pso?"<p>PK戦 "+pso[0]+" - "+pso[1]+"</p>":"")+statsHtml(),
      G.meta.career?"クラブハウスへ":"もう一度",false,
      ()=>{ if(G.meta.career)finishFixture(G.M); else newMatch(null,null,G.seed+1); });
    return;
  }
  if(!ev.from)return;                        // 知らない種類のイベントは読み飛ばす
  ev.dur=ev.type==="shot"?P.shotMs:ev.type==="kickoff"?P.kickMs:ev.type==="cross"?P.stepMs*1.3:P.stepMs;
  G.cur=ev; G.curT=0;
  $("hudClock").textContent=ev.min+(ev.at?"+":"'");
  sayStart(ev);
}
function endEvent(ev){
  const P=TUNING.play;
  if(ev.type==="offside"){ G.hold=P.foulHold; return; }
  if(ev.type!=="shot")return;
  sayShotEnd(ev);
  if(ev.res==="goal"){
    setHud(ev.hg,ev.ag,ev.min+(ev.at?"+":"'"));
    const f=$("flash"); f.textContent="GOAL!"; f.classList.add("on"); G.flash=true;
    G.hold=P.goalHold;
  }else G.hold=P.shotHold;
}
function advance(dt){
  if(G.hold>0){
    G.hold-=dt;
    if(G.hold<=0&&G.flash){ $("flash").classList.remove("on"); G.flash=false; }
    return;
  }
  if(G.cur){
    G.curT+=dt;
    if(G.curT>=G.cur.dur){ const ev=G.cur; G.cur=null; endEvent(ev); syncBoard(G.M); }
    return;
  }
  if(!G.queue.length){
    if(G.M.over)return;
    if(G.stopAt&&matchMin(G.M)>=G.stopAt){ G.stopAt=0; setPlaying(false); return; }
    G.queue=stepMatch(G.M);
    BD.kp=null;                              // KP の指定はエンジンに渡った
    updateStyleBar();
    syncBoard(G.M);
  }
  const ev=G.queue.shift();
  if(ev)startEvent(ev);
}
function frame(ts){
  const dt=Math.min(100,ts-(G.last||ts)); G.last=ts;
  if(G.playing&&!$("ov").classList.contains("on"))advance(dt*G.speed);
  drawFrame(G,dt);
  requestAnimationFrame(frame);
}

/* ---- 起動 ---- */
function boot(){
  initView(); initBoard();
  $("ovBtn").addEventListener("click",closeOverlay);
  $("btnPlay").addEventListener("click",()=>{ if(!G.M.over)setPlaying(!G.playing); });
  $("btnSpeed").addEventListener("click",()=>{
    G.speed=SPEEDS[(SPEEDS.indexOf(G.speed)+1)%SPEEDS.length]; updateCtl();
  });
  $("btnShoot").addEventListener("click",()=>{
    orderMatch(G.M,"H",{ type:"shoot" });
    const b=$("btnShoot"); b.classList.add("armed");
    setTimeout(()=>b.classList.remove("armed"),700);
  });
  $("btnKp").addEventListener("click",()=>{
    if(G.M.over)return;
    G.kpMode=!G.kpMode; hideInfo();
    if(G.kpMode)say("KP にする選手のカードをタップ(もう一度 KP ボタンで取り消し)");
    updateCtl();
  });
  $("btnUp").addEventListener("click",()=>toggleIns("line",1));
  $("btnDown").addEventListener("click",()=>toggleIns("line",-1));
  $("btnLeft").addEventListener("click",()=>toggleIns("side",-1));
  $("btnRight").addEventListener("click",()=>toggleIns("side",1));
  $("btnPress").addEventListener("click",()=>toggleIns("press"));
  $("infoClose").addEventListener("click",hideInfo);
  $("infoKp").addEventListener("click",()=>{
    if(!G.info||G.M.over)return;
    const id=G.info;
    pickKp(id); showInfo(id);
  });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden&&G.playing)setPlaying(false); });
  // iOS のピンチ・ダブルタップ拡大を止める
  document.addEventListener("gesturestart",e=>e.preventDefault());
  document.addEventListener("touchmove",e=>{ if(e.touches.length>1)e.preventDefault(); },{ passive:false });

  document.getElementById("club").addEventListener("click",onClubClick);
  document.getElementById("club").addEventListener("change",e=>{ if(e.target.dataset&&e.target.dataset.file)onSettingsFile(e.target); });
  loadStoredPack();                           // 端末に保存した実名パック(→settings.js)
  // ホーム画面に追加した版(http/https で配ったとき)はオフラインでも動くようにする。file:// では何もしない
  if(/^https?:$/.test(location.protocol)&&"serviceWorker" in navigator)
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  // 検証用: ?quick=1&seed=7&auto=1&speed=8&stopat=30&ff=1 (quick = クラブハウスを通さず1試合だけ)
  const q=new URLSearchParams(location.search);
  const seed0=+q.get("seed")||(Date.now()&0x7fffffff);
  if(!q.get("quick")){
    newMatch(null,null,seed0);                // 盤面と映像を先に作っておく(クラブハウスの下に隠れる)
    closeOverlay(); setPlaying(false);
    initCareer(seed0);
    updateCtl();
    requestAnimationFrame(frame);
    return;
  }
  newMatch(null,null,seed0);
  if(q.get("speed"))G.speed=+q.get("speed");
  if(q.get("stopat"))G.stopAt=+q.get("stopat");
  if(q.get("auto"))closeOverlay();
  if(q.get("ff")){                            // 描画を待たずに stopat まで進める(スクリーンショット用)
    for(let i=0;i<200000;i++){
      if(!G.playing){
        if(q.get("auto")&&!G.M.over&&$("ov").classList.contains("on"))closeOverlay(); else break;
      }
      advance(100);
    }
  }
  updateCtl();
  requestAnimationFrame(frame);
}
boot();
</script>

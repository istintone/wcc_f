.glow-L .rays{opacity:1;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pk-msg{margin-top:20px;text-align:center;font-size:13px;line-height:1.7;min-height:64px}
.pk-msg .rar{font-size:22px;font-style:italic} .pk-msg .rar.r-L{color:#ffe28a} .pk-msg .rar.r-K{color:#c6a8ff}
.pk-msg .rar.r-B{color:#e8ebf2} .pk-msg .rar.r-W{color:#bcd2f2}
.pk-msg .new{font-size:11px;color:#201400;background:#f2c14e;padding:0 6px;vertical-align:4px}
.pk-msg small{color:#ffe28a;letter-spacing:.2em;animation:blink 1.1s infinite;display:inline-block}

/* ---- 試合画面の触り心地(→docs/07 §7.11) ---- */
/* 控えをつまむと、指の上に浮いたカード(ゴースト)が付いてくる */
.cd.ghost{position:fixed;z-index:200;margin:-26px 0 0 -20px;transform:scale(1.25);pointer-events:none;
  box-shadow:0 12px 24px rgba(0,0,0,.55),0 0 0 2px #fff}
#bench .cd.lifted{opacity:.35}
#board.subbing .cd{transition:box-shadow .1s}
#board.subbing .cd.drop{transform:scale(1.18);z-index:6;box-shadow:0 0 0 3px #ffe28a,0 0 16px rgba(255,226,138,.9)}
/* 交代の確認 */
#subAsk{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);z-index:30;display:none;flex-direction:column;gap:10px;
  padding:14px;border-radius:10px;background:rgba(10,14,24,.95);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#subAsk.on{display:flex}
#subAsk p{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:15px}
#subAsk small{width:100%;text-align:center;font-size:11px;letter-spacing:.2em;opacity:.7}
#subAsk .out{color:#ff9a8f} #subAsk .in{color:#8fe3a3} #subAsk i{font-style:normal;opacity:.7}
#subAsk .row{display:flex;gap:8px} #subAsk .row .btn{flex:1;min-width:0}
/* 倍速は上部(誤って押さないように) */
#hud .spd{flex:0 0 auto;height:28px;min-width:40px;padding:0 6px;font-size:12px;border-radius:6px}
/* 操作の台: 大きく、筐体のボタンらしく */
#pad .cross{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,38px);gap:4px}
#pad .tac{font-size:11.5px;font-weight:800}
#pad .mid .btn{height:38px;min-width:56px;font-size:15px}
.btn-shoot,.btn-keeper{width:84px;height:58px;border-radius:29px;font-size:13px}

/* ---- ゴールのリプレイ(→docs/07 §7.12)。モニターの上に札を出し、押せば飛ばす ---- */
#replay{position:absolute;inset:0;z-index:3;display:none;border:0;padding:6px 8px;background:transparent;cursor:pointer;
  flex-direction:column;align-items:flex-start;justify-content:space-between;color:#fff;text-align:left}
#replay.on{display:flex}
#replay::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 3px rgba(200,16,46,.8)}
#replay b{position:relative;font-family:"Oswald",sans-serif;font-size:15px;font-weight:700;letter-spacing:.2em;padding:1px 8px;
  background:#c8102e;transform:skewX(-10deg);animation:blink 1.1s infinite}
#replay small{position:relative;align-self:flex-end;font-size:10px;font-weight:700;padding:1px 6px;background:rgba(0,0,0,.55)}

/* ---- 画面の大きさに合わせたカード(→docs/07 §7.11)。--k は board.js の fitBoard が盤面の高さから決める ---- */
#board .cd{transform:scale(var(--k,1))}
#board .cd.drag{transform:scale(calc(var(--k,1)*1.14))}
#board.subbing .cd.drop{transform:scale(calc(var(--k,1)*1.18))}
#bench{overflow-y:auto;overscroll-behavior:contain}
#bench .cd{transform:scale(var(--k,1));margin:calc(-26px*(1 - var(--k,1))) 0}
#bench{gap:calc(6px*var(--k,1))}
@media (max-height:700px){ #viewWrap{height:clamp(92px,16dvh,140px)} }

/* ---- 試合の区切りの字幕(→docs/07 §7.11)。モニターの中の中継の字幕として出る ---- */
#cap{position:absolute;left:0;right:0;top:50%;z-index:4;display:none;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 9px;transform:translateY(-50%);pointer-events:none;color:#fff;text-align:center;
  background:linear-gradient(90deg,transparent,rgba(10,14,24,.88) 18%,rgba(10,14,24,.88) 82%,transparent);
  border-top:2px solid #c9a23a;border-bottom:2px solid #c9a23a}
#cap.on{display:flex;animation:capIn .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes capIn{from{transform:translateY(-50%) scaleY(0);opacity:0}to{transform:translateY(-50%);opacity:1}}
#cap b{font-family:"Oswald",sans-serif;font-size:26px;font-weight:700;font-style:italic;letter-spacing:.14em;line-height:1.05;
  background:linear-gradient(180deg,#fff,#ffe28a 60%,#d9a52e);-webkit-background-clip:text;background-clip:text;color:transparent}
#cap .sc{font-family:"Oswald",sans-serif;font-size:20px;font-weight:700}
#cap small{font-size:11px;color:#dfe6f2}

/* 試合映像を大きく(→docs/07 §7.11)。立体の見え方で奥行きを出す。盤面のカードは fitBoard が残りの高さに合わせて縮める */
#viewWrap{height:clamp(150px,28dvh,260px)}
@media (max-height:700px){ #viewWrap{height:clamp(130px,25dvh,200px)} }

/* 盤面は縦長の比率を保って中央へ。余った左右は筐体の天板の色(→docs/07 §7.11) */
#deck{justify-content:center;background:#15171c}

/* =========================================================================
   wcc_f — テーマ(→docs/07 §7.8)
   色はすべてトークン(--t-*)を通す。テーマを足すときは、下のトークンの組を1つ増やすだけ。
     th-wr   ホワイトが主 / レッドが副 / 差し色にゴールドとブラック(既定)
     th-navy ネイビーが主 / ゴールドが副(最初の見た目)
   見た目の手本は、スポーツのトレーディングカードの「印刷物らしさ」:
     斜めに切った色の帯 / 網点(ハーフトーン)/ 細い罫線 / 幅の狭い太い数字 / 箔の光沢
   ========================================================================= */

.th-wr{
  --t-paper:#f2efe9; --t-paper2:#e6e1d7; --t-card:#ffffff; --t-rule:#d8d0c2;
  --t-ink:#121212; --t-ink2:#3a3a3a; --t-mute:#7d766b;
  --t-main:#ffffff; --t-sub:#c8102e; --t-sub2:#8f0a1f; --t-sub3:#e2324a;
  --t-gold:#b8892c; --t-gold2:#e9c76b; --t-gold3:#7d5a14; --t-black:#141414;
  --t-on-sub:#ffffff;
  /* base.css の色もこのテーマに寄せる */
  --bg:#d9d4ca; --surface:var(--t-paper); --panel:#ffffff; --line:var(--t-rule);
  --text:var(--t-ink); --dim:var(--t-mute); --accent:var(--t-sub);
  --good:#1f8a4c; --mid:#b8892c; --bad:#c8102e;
}
.th-navy{
  --t-paper:#0e1320; --t-paper2:#161d2e; --t-card:#1b2236; --t-rule:#2a3550;
  --t-ink:#eef1f6; --t-ink2:#c9d0de; --t-mute:#8b97b0;
  --t-main:#0e1320; --t-sub:#d9a52e; --t-sub2:#9b7414; --t-sub3:#ffe28a;
  --t-gold:#d9a52e; --t-gold2:#ffe28a; --t-gold3:#7d5a14; --t-black:#05070d;
  --t-on-sub:#201400;
}

/* ---- 書体 ---- */
.th-wr #hudScore,.th-wr #hudClock,.th-wr .tn,
.k-no,.k-pos,.k-rar,.k-st b,
#scene .logo b,#scene .vs-mark,#scene .res-word,#scene .rn,#scene .pk-head b,#scene .touch,
.th-wr #club .chd .num b,.th-wr #pad .tac,.th-wr .btn-shoot,.th-wr #flash b,.th-wr .cd .no{
  font-family:"Oswald","Arial Narrow","Helvetica Neue",system-ui,sans-serif}

/* =========================================================================
   カード(トレーディングカードの構成。どのテーマでも使う)
   ========================================================================= */
.kc{position:relative;aspect-ratio:5/7;padding:0;border:0;border-radius:5px;overflow:hidden;cursor:pointer;
  background:#fff;color:#121212;box-shadow:0 1px 0 rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.28);line-height:1.15;isolation:isolate}
/* 内側の細い罫線(印刷物の枠) */
.kc::after{content:"";position:absolute;inset:3px;border:1px solid rgba(0,0,0,.18);border-radius:3px;pointer-events:none;z-index:6}
/* 斜めの色帯(クラブの色) */
.kc .k-band{position:absolute;left:-30%;top:-10%;width:72%;height:120%;background:var(--tc);transform:skewX(-16deg);z-index:0;
  box-shadow:6px 0 0 rgba(255,255,255,.75),9px 0 0 var(--tc)}
/* 網点の地と人物の影 */
.kc .k-art{position:absolute;left:8%;right:8%;top:12%;bottom:27%;z-index:1;
  background:radial-gradient(circle,rgba(0,0,0,.16) 1.1px,transparent 1.4px) 0 0/5px 5px;
  -webkit-mask:radial-gradient(ellipse at 50% 60%,#000 55%,transparent 75%);mask:radial-gradient(ellipse at 50% 60%,#000 55%,transparent 75%)}
.kc .k-sil{position:absolute;left:10%;right:10%;bottom:0;height:92%;width:80%;fill:#1a1a1a;opacity:.82}
.kc .k-top{position:absolute;left:7%;top:5%;z-index:3;display:flex;flex-direction:column;align-items:flex-start;line-height:.9}
.kc .k-no{font-size:26px;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.kc .k-pos{margin-top:2px;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.08em;padding:1px 4px;
  color:#fff;background:#121212}
.kc .k-rar{position:absolute;right:6%;top:5%;z-index:3;font-size:8px;font-weight:700;letter-spacing:.2em;
  writing-mode:vertical-rl;color:#7d766b}
/* リボン状の名前帯 */
.kc .k-name{position:absolute;left:0;right:0;bottom:12%;z-index:4;padding:4px 8% 3px 9%;
  background:#c8102e;color:#fff;clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
.kc .k-name b{display:block;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.kc .k-name small{display:block;font-size:7.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .k-sk{position:absolute;left:9%;right:6%;bottom:3.5%;z-index:4;font-size:8px;font-weight:700;color:#3a3a3a;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .k-sk em{font-style:normal;font-weight:400;margin-left:5px;color:#7d766b}
.kc .k-st{position:absolute;right:6%;top:30%;z-index:3;display:flex;flex-direction:column;gap:3px;text-align:right}
.kc .k-st span{display:flex;flex-direction:column;line-height:1}
.kc .k-st i{font-style:normal;font-size:7.5px;color:#7d766b;letter-spacing:.06em}
.kc .k-st b{font-size:18px;font-weight:700}
.kc .k-foil{position:absolute;inset:0;z-index:5;pointer-events:none}
.kc .kcnt{position:absolute;right:5px;top:5px;z-index:7;font-style:normal;font-size:9px;font-weight:900;color:#fff;
  background:#121212;padding:0 4px;border-radius:2px}
.kc.on{outline:3px solid var(--t-gold2);outline-offset:1px}

/* 黒(PREMIUM): 黒い台紙に銀の罫 */
.kc.r-B{background:#161616;color:#f2f2f2}
.kc.r-B::after{border-color:rgba(220,220,220,.45)}
.kc.r-B .k-art{background:radial-gradient(circle,rgba(255,255,255,.14) 1.1px,transparent 1.4px) 0 0/5px 5px}
.kc.r-B .k-sil{fill:#e6e6e6;opacity:.55}
.kc.r-B .k-sk{color:#d8d8d8} .kc.r-B .k-st i,.kc.r-B .k-rar{color:#a8a8a8} .kc.r-B .k-sk em{color:#9a9a9a}
.kc.r-B .k-band{box-shadow:6px 0 0 rgba(200,200,200,.55),9px 0 0 var(--tc)}
/* キラ(FOIL): 虹色の箔が流れる */
.kc.r-K{background:#f6f3ff}
.kc.r-K .k-foil{background:linear-gradient(115deg,transparent 20%,rgba(255,120,200,.28) 32%,rgba(120,220,255,.32) 42%,
  rgba(255,240,120,.30) 52%,rgba(140,255,170,.26) 62%,transparent 75%);background-size:250% 100%;mix-blend-mode:color-dodge;
  animation:foil 3.2s linear infinite}
.kc.r-K::after{border:1.5px solid transparent;border-image:linear-gradient(135deg,#ff7ac8,#79d8ff,#ffe36e,#8cffaa,#ff7ac8) 1}
.kc.r-K .k-rar{color:#8a5cd6}
@keyframes foil{from{background-position:120% 0}to{background-position:-130% 0}}
/* レジェンド: 金の箔の台紙・黒いリボン */
.kc.r-L{background:repeating-linear-gradient(135deg,#f3dc95 0 2px,#e2bf62 2px 4px),#e2bf62;color:#2a1d02}
.kc.r-L::after{border:2px solid #7d5a14}
.kc.r-L .k-name{background:#121212;color:#f3dc95}
.kc.r-L .k-rar{color:#7d5a14} .kc.r-L .k-sk,.kc.r-L .k-st i,.kc.r-L .k-sk em{color:#5a420e}
.kc.r-L .k-foil{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;
  animation:foil 2.6s linear infinite}
.kc.r-L .k-art{background:radial-gradient(circle,rgba(90,60,10,.22) 1.1px,transparent 1.4px) 0 0/5px 5px}

/* 小さいカード(一覧) */
.kc-s .k-no{font-size:17px} .kc-s .k-pos{font-size:7px;padding:0 3px}
.kc-s .k-rar{font-size:6px} .kc-s .k-name{bottom:13%;padding:2px 6% 2px 7%}
.kc-s .k-name b{font-size:9.5px} .kc-s .k-name small{display:none}
.kc-s .k-sk{font-size:6.5px;bottom:4%}
/* 中のカード(払い出し・詳細) */
.kc-m{width:100%}
.kc-m .k-name b{font-size:15px} .kc-m .k-name small{font-size:9px}
.kc-m .k-sk{font-size:9.5px} .kc-m .k-no{font-size:34px} .kc-m .k-pos{font-size:11px}

/* =========================================================================
   場面(タイトル・対戦カード・結果・カード排出)
   ========================================================================= */
#scene .dots,#scene .slab{position:absolute;pointer-events:none;z-index:0}
#scene>*:not(.wipe):not(.dots):not(.slab){position:relative;z-index:1}
#scene .touch,#scene .snd{position:absolute!important}
#scene .wipe{background:linear-gradient(90deg,transparent,var(--t-sub) 20%,var(--t-sub3) 50%,var(--t-sub) 80%,transparent)}
.th-wr #scene{color:var(--t-ink)}
.th-wr #scene .dots{inset:0;background:radial-gradient(circle,rgba(0,0,0,.09) 1.2px,transparent 1.5px) 0 0/7px 7px;
  -webkit-mask:linear-gradient(160deg,#000 0%,transparent 45%,transparent 60%,#000 100%);mask:linear-gradient(160deg,#000 0%,transparent 45%,transparent 60%,#000 100%)}
.th-wr #scene .touch{color:var(--t-sub);letter-spacing:.35em}

/* タイトル: 紙の地に、赤と黒の斜めの帯 */
.th-wr .sc-title{background:var(--t-paper)}
.th-wr .sc-title .beams{display:none}
.th-wr .sc-title .slab.s1{left:-20%;right:-20%;top:36%;height:150px;background:var(--t-sub);transform:skewY(-9deg);
  box-shadow:0 8px 0 var(--t-black),0 11px 0 var(--t-gold2)}
.th-wr .sc-title .slab.s2{left:-20%;right:-20%;top:63%;height:26px;background:var(--t-black);transform:skewY(-9deg)}
.th-wr .sc-title .logo{margin-top:-30px}
.th-wr .sc-title .logo b{font-size:96px;font-weight:700;letter-spacing:-.01em;color:#fff;-webkit-text-fill-color:#fff;
  background:none;filter:drop-shadow(4px 4px 0 var(--t-black));transform:skewX(-8deg)}
.th-wr .sc-title .logo b span{color:var(--t-gold2);-webkit-text-fill-color:var(--t-gold2)}
.th-wr .sc-title .logo small{color:#fff;letter-spacing:.6em;font-family:"Oswald",sans-serif;font-weight:400}
.th-wr .sc-title .club{margin-top:70px;background:var(--t-card);border:0;border-left:5px solid var(--t-sub);
  box-shadow:0 3px 10px rgba(0,0,0,.18)}
.th-wr .sc-title .club small{color:var(--t-mute)}
.th-wr .sc-title .snd{background:var(--t-card);color:var(--t-ink);border:1px solid var(--t-rule)}

/* 対戦カード: 上に自クラブ(赤の帯)、下に相手(黒の帯) */
.th-wr .sc-vs{background:var(--t-paper)}
.th-wr .vs-band{background:var(--t-black);border:0;color:#fff;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%)}
.th-wr .vs-band b{color:var(--t-gold2)} .th-wr .vs-band i{color:#bbb}
.th-wr .vs-side{background:linear-gradient(90deg,var(--t-sub) 0 70%,var(--t-sub2));color:#fff;
  box-shadow:inset 8px 0 0 var(--tc)}
.th-wr .vs-side.away{background:linear-gradient(270deg,var(--t-black) 0 70%,#333);box-shadow:inset -8px 0 0 var(--tc)}
.th-wr .vs-info>small{color:var(--t-gold2)}
.th-wr .vs-kp em{color:rgba(255,255,255,.75)}
.th-wr .ax i{color:rgba(255,255,255,.8)} .th-wr .ax em{background:rgba(0,0,0,.3)}
.th-wr .ax u{background:linear-gradient(90deg,#fff,var(--t-gold2))}
.th-wr .vs-mark{font-size:110px;font-weight:700;color:var(--t-ink);-webkit-text-fill-color:var(--t-ink);background:none;
  filter:drop-shadow(5px 5px 0 var(--t-gold2));transform:skewX(-10deg)}
.th-wr .vs-note{color:var(--t-sub)}

/* 結果: 勝ち = 赤 / 負け = 黒 / 引き分け = 紙 */
.th-wr .sc-res.r-win{background:var(--t-sub);color:#fff}
.th-wr .sc-res.r-lose{background:var(--t-black);color:#fff}
.th-wr .sc-res.r-draw{background:var(--t-paper);color:var(--t-ink)}
.th-wr .sc-res .dots{background:radial-gradient(circle,rgba(255,255,255,.14) 1.2px,transparent 1.5px) 0 0/7px 7px}
.th-wr .sc-res.r-draw .dots{background:radial-gradient(circle,rgba(0,0,0,.08) 1.2px,transparent 1.5px) 0 0/7px 7px}
.th-wr .sc-res .slab.s1{left:-20%;right:-20%;top:9%;height:118px;background:rgba(0,0,0,.18);transform:skewY(-8deg)}
.th-wr .sc-res.r-draw .slab.s1{background:var(--t-sub)}
.th-wr .res-word{font-size:118px;font-weight:700;color:#fff;-webkit-text-fill-color:#fff;background:none;
  filter:drop-shadow(5px 5px 0 var(--t-black));transform:skewX(-8deg)}
.th-wr .r-win .res-word{filter:drop-shadow(5px 5px 0 var(--t-black)) drop-shadow(0 0 0 #000)}
.th-wr .r-lose .res-word{filter:drop-shadow(5px 5px 0 var(--t-sub))}
.th-wr .res-score .rn{font-size:62px;font-weight:700}
.th-wr .res-score .rn i{color:currentColor;opacity:.5}
.th-wr .res-pso{color:var(--t-gold2)}
.th-wr .res-goals li i{color:var(--t-gold2)} .th-wr .r-draw .res-goals li i{color:var(--t-sub)}
.th-wr .res-mvp{background:var(--t-card);color:var(--t-ink);border:0;border-left:5px solid var(--t-gold)}
.th-wr .res-mvp i{background:var(--t-black);color:var(--t-gold2)} .th-wr .res-mvp small{color:var(--t-mute)}
.th-wr .res-lines{background:rgba(255,255,255,.95);color:var(--t-ink);border-left:5px solid var(--t-gold)}
.th-wr .res-lines li.hi{color:var(--t-sub)}

/* カード排出: 紙の地にスポットライト。カードの裏は赤に白の細い斜線と金の印 */
.th-wr .sc-card{background:radial-gradient(ellipse at 50% 45%,#ffffff 0%,var(--t-paper) 45%,var(--t-paper2) 100%)}
.th-wr .pk-head b{color:var(--t-ink);font-size:38px;letter-spacing:.3em;font-weight:700}
.th-wr .pk-head small{color:var(--t-mute)}
.th-wr .pk-back{border:0;background:repeating-linear-gradient(135deg,var(--t-sub) 0 7px,#d8243f 7px 9px);
  box-shadow:0 0 0 3px #fff,0 0 0 4px var(--t-rule),0 14px 30px rgba(0,0,0,.35)}
.th-wr .pk-back b{font-family:"Oswald",sans-serif;font-size:48px;font-weight:700;color:#fff;text-shadow:3px 3px 0 var(--t-black);
  transform:skewX(-8deg)}
.th-wr .pk-back b span{color:var(--t-gold2)}
.pk-front .kc{position:absolute;inset:0;aspect-ratio:auto;border-radius:10px}
.pk-front .kc .k-no{font-size:44px} .pk-front .kc .k-pos{font-size:12px}
.pk-front .kc .k-name b{font-size:19px} .pk-front .kc .k-name small{font-size:10px}
.pk-front .kc .k-st b{font-size:24px} .pk-front .kc .k-st i{font-size:9px} .pk-front .kc .k-sk{font-size:11px}
.pk-front .kc .k-rar{font-size:11px}
.th-wr .rays{background:repeating-conic-gradient(from 0deg,rgba(185,137,44,.38) 0 7deg,transparent 7deg 20deg)}
.th-wr .pk-msg{color:var(--t-ink)} .th-wr .pk-msg .rar.r-L{color:var(--t-gold)} .th-wr .pk-msg .rar.r-K{color:#8a5cd6}
.th-wr .pk-msg .rar.r-B{color:var(--t-black)} .th-wr .pk-msg .rar.r-W{color:var(--t-mute)}
.th-wr .pk-msg .new{background:var(--t-sub);color:#fff} .th-wr .pk-msg small{color:var(--t-sub)}
.glow-K .pk-front .kc{background:#f6f3ff;animation:none;box-shadow:0 0 32px rgba(160,120,255,.55)}

/* =========================================================================
   試合の画面(ホワイト × レッド)
   ========================================================================= */
.th-wr #app{background:var(--t-paper)}
.th-wr #hud{background:var(--t-card);border-bottom:3px solid var(--t-sub);box-shadow:0 2px 0 var(--t-gold2)}
.th-wr #hud .sb{background:var(--t-black);border:0}
.th-wr #hud .tn{color:#fff;font-weight:700;font-style:normal;letter-spacing:.08em}
.th-wr #hudScore{background:var(--t-sub);color:#fff;font-weight:700;font-size:22px;border-radius:0}
.th-wr #hudComp{color:var(--t-mute)}
.th-wr #hudClock{color:var(--t-sub);font-style:normal;font-weight:700;font-size:18px}
.th-wr #ticker{background:var(--t-black);color:#fff;border-left:5px solid var(--t-sub)}
.th-wr #ticker.goal{color:var(--t-gold2)}
.th-wr #stylebar{background:var(--t-card);color:var(--t-mute);border-bottom:1px solid var(--t-rule)}
.th-wr #stylebar #styH{color:var(--t-ink)}
.th-wr #flash{background:linear-gradient(170deg,transparent 30%,rgba(0,0,0,.35) 30% 70%,transparent 70%)}
.th-wr #flash b{font-size:72px;font-weight:700;font-style:normal;color:#fff;-webkit-text-fill-color:#fff;background:none;
  filter:drop-shadow(4px 4px 0 var(--t-sub));transform:skewX(-10deg)}
.th-wr #flash:not(.mine) b{filter:drop-shadow(4px 4px 0 var(--t-black))}
.th-wr #flash i{background:#fff;color:var(--t-ink);border-left:6px solid var(--t-sub)}
.th-wr #flash small{color:#fff}
/* 盤面のカード: 白い台紙の小さなカード */
.th-wr .cd{background:#fff;color:var(--t-ink);border:1px solid rgba(0,0,0,.25);border-radius:3px;
  box-shadow:0 2px 4px rgba(0,0,0,.4)}
.th-wr .cd .rl{background:var(--pc,#555);color:#fff}
.th-wr .cd.gk{--pc:#c48a12} .th-wr .cd.df{--pc:#1d5fbf} .th-wr .cd.mf{--pc:#1f8a4c} .th-wr .cd.fw{--pc:#c8102e}
.th-wr .cd .rl.a0{color:#fff} .th-wr .cd .rl.a1{color:#ffe28a} .th-wr .cd .rl.a2{color:#ffb0b0}
.th-wr .cd .no{font-weight:700}
.th-wr .cd.hasball{border-color:var(--t-gold);box-shadow:0 0 0 2px var(--t-gold2),0 2px 4px rgba(0,0,0,.4)}
.th-wr .cd.iskp{border-color:var(--t-sub)}
.th-wr .cd .kpm{background:var(--t-sub);color:#fff}
.th-wr #bench{background:var(--t-paper2);border-left:1px solid var(--t-rule)}
.th-wr #bench .lbl{color:var(--t-mute)}
.th-wr #pad{background:var(--t-card);border-top:1px solid var(--t-rule)}
.th-wr .btn{background:var(--t-card);color:var(--t-ink);border:1px solid var(--t-rule)}
.th-wr #pad .tac{background:linear-gradient(180deg,#fff,#efebe4);color:var(--t-ink);border:1px solid #cfc6b7;
  box-shadow:0 3px 0 #b7ac9a;font-weight:700;letter-spacing:.04em}
.th-wr #pad .tac small{color:var(--t-mute)}
.th-wr #pad .tac:active{box-shadow:0 1px 0 #b7ac9a}
.th-wr #pad .tac.on{background:var(--t-sub);color:#fff;border-color:var(--t-sub2);box-shadow:0 3px 0 var(--t-sub2),0 0 10px rgba(200,16,46,.35)}
.th-wr #pad .tac.on small{color:rgba(255,255,255,.85)}
.th-wr .btn-kp{color:var(--t-gold3);border-color:var(--t-gold)}
.th-wr .btn-shoot{background:var(--t-sub);border:0;border-radius:3px;color:#fff;font-style:normal;font-weight:700;letter-spacing:.2em;
  clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);box-shadow:none}
.th-wr .btn-shoot:active{background:var(--t-sub2)}
.th-wr #subInfo{color:var(--t-mute)}
.th-wr #ovBox{background:var(--t-card);color:var(--t-ink);border:0;border-top:6px solid var(--t-sub);
  box-shadow:0 12px 30px rgba(0,0,0,.35)}
.th-wr #ovTitle{color:var(--t-ink);-webkit-text-fill-color:var(--t-ink);background:none;font-family:"Oswald",sans-serif;font-style:normal;
  font-weight:700;letter-spacing:.12em;font-size:30px}
.th-wr #ovBody{color:var(--t-mute)} .th-wr #ovBody b,.th-wr #ovBody table{color:var(--t-ink)}
.th-wr .btn-main{background:var(--t-sub);color:#fff;border-radius:2px;letter-spacing:.06em}
.th-wr #info{background:rgba(255,255,255,.97);color:var(--t-ink)}
.th-wr #info .st em{background:var(--t-paper2)} .th-wr #info .st u{background:var(--t-sub)}
.th-wr #info .skl b{color:var(--t-sub)}

/* =========================================================================
   監督室(ホワイト × レッド)
   ========================================================================= */
.th-wr #club{background:var(--t-paper);color:var(--t-ink)}
.th-wr #club .chd{background:var(--t-card);margin:-10px -12px 0;padding:12px 14px 10px;border-bottom:3px solid var(--t-sub);
  box-shadow:0 2px 0 var(--t-gold2)}
.th-wr #club .chd b{font-weight:900}
.th-wr #club .chd .num b{font-weight:700;color:var(--t-sub)}
.th-wr #club .card{background:var(--t-card);border:0;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.08);
  position:relative;padding-top:14px}
.th-wr #club .card::before{content:"";position:absolute;left:0;top:0;width:44%;height:4px;background:var(--t-sub);
  clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
.th-wr #club h3{color:var(--t-ink);font-weight:900;letter-spacing:.04em}
.th-wr #club h3 small{color:var(--t-mute)}
.th-wr #club .next{border-left:0;background:linear-gradient(180deg,#fff,#fbf8f2)}
.th-wr #club .next h3{color:var(--t-sub)}
.th-wr #club .tend .ttl{background:var(--t-sub);border:0;color:#fff}
.th-wr #club .tend .ttl b{color:#fff} .th-wr #club .tend .ttl small,.th-wr #club .tend .ttl i{color:rgba(255,255,255,.85)}
.th-wr #club .tend .sal div{background:var(--t-paper2)}
.th-wr #club .msg{border-left:5px solid var(--t-gold)}
.th-wr #club .tr,.th-wr #club .tab,.th-wr #club .ints .tab{background:#fff;color:var(--t-ink);border:1px solid var(--t-rule);border-radius:2px}
.th-wr #club .tr small,.th-wr #club .tab small{color:var(--t-mute)}
.th-wr #club .tr.sp{background:linear-gradient(135deg,#fffaf0,#f6ead0);border-color:var(--t-gold)}
.th-wr #club .tr.sp b{color:var(--t-gold3)}
.th-wr #club .tab.on,.th-wr #club .ints .tab.on{background:var(--t-sub);color:#fff;border-color:var(--t-sub)}
.th-wr #club .tab.on small{color:rgba(255,255,255,.85)}
.th-wr #club .btn-main{background:var(--t-sub);color:#fff;font-weight:900;clip-path:polygon(2% 0,100% 0,98% 100%,0 100%)}
.th-wr #club .btn-main:disabled{background:#cfc6b7}
.th-wr #club .btn-sub{background:#fff;color:var(--t-mute);border:1px solid var(--t-rule)}
.th-wr #club .tbl td{border-top:1px solid var(--t-rule)}
.th-wr #club .tbl tr.me td{color:var(--t-sub)}
.th-wr #club .cups tr.st-in td{color:#1f8a4c} .th-wr #club .cups tr.st-won td{color:var(--t-gold3)}
.th-wr #club .sq .st5{color:var(--t-gold)} .th-wr #club .sq .st5.sp{color:#2a7bd6}
.th-wr #club .sq .st5 em{background:var(--t-paper2)} .th-wr #club .sq .st5 u{background:var(--t-sub)}
.th-wr #club .sq tr.sel td{background:#fde8eb}
.th-wr #club .sign,.th-wr #club .kpt{background:var(--t-sub);color:#fff}
.th-wr #club .graph em{background:var(--t-paper2)} .th-wr #club .graph u{background:#1f8a4c} .th-wr #club .graph u.neg{background:var(--t-sub)}
.th-wr #club .hint{color:var(--t-sub)}
.th-wr #club .ask .hint{color:var(--t-sub)}
.th-wr #club .chipb{border-radius:2px}
.th-wr #club .chipb.on{border-color:#fff;box-shadow:0 0 0 2px var(--t-sub)}
.th-wr #club .pay small{color:var(--t-mute)} .th-wr #club .pay .new{background:var(--t-sub);color:#fff}
.th-wr #club .pay .kc{max-width:150px}
.th-wr #club .kinfo .st em{background:var(--t-paper2)} .th-wr #club .kinfo .st u{background:var(--t-sub)}
.th-wr #club .cp{background:var(--t-paper2);color:var(--t-ink)}
.th-wr .gr{color:#fff;background:#7d766b} .th-wr .grC{background:#2a7bd6} .th-wr .grB{background:#1f8a4c}
.th-wr .grA{background:var(--t-gold)} .th-wr .grS{background:var(--t-sub)}
.th-wr .rk{color:#fff;background:#7d766b} .th-wr .rkB{background:#2a7bd6} .th-wr .rkA{background:var(--t-gold)} .th-wr .rkS{background:var(--t-sub)}

/* =========================================================================
   監督室の構成(→docs/07 §7.9)。HOME をハブに、下のタブで行き来する。準備は全画面の手順
   ========================================================================= */
#club{padding:0!important;gap:0!important;overflow:hidden!important}
#club .cl-main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:10px;padding:0 12px 14px}
#club .cl-main>.chd{margin:0 -12px 2px}
#club .cl-main>section:first-child{margin-top:12px}
/* 下のタブ */
#club .tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  padding:0 0 env(safe-area-inset-bottom);background:var(--t-black);border-top:3px solid var(--t-sub)}
#club .tabbar button{position:relative;height:54px;border:0;background:none;color:#8d8d8d;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#club .tabbar i{font-style:normal;font-size:17px;line-height:1}
#club .tabbar span{font-family:"Oswald",sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em}
#club .tabbar button.on{color:#fff}
#club .tabbar button.on::before{content:"";position:absolute;left:18%;right:18%;top:0;height:3px;background:var(--t-gold2)}
#club .tabbar .dot{position:absolute;top:9px;right:28%;width:7px;height:7px;border-radius:50%;background:var(--t-sub3)}

/* HOME の見出し */
#club .chd{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
#club .chd .emb{flex:0 0 auto}
#club .chd>div:nth-child(2){flex:1;min-width:0}
#club .chd .num small{font-family:"Oswald",sans-serif;letter-spacing:.14em}

/* 次の試合のタイル(全体が押す面) */
#club .tile{position:relative;background:var(--t-card);border-radius:2px;padding:12px 14px;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 3px 10px rgba(0,0,0,.10)}
#club .tile.next{padding:0 0 12px;overflow:hidden;cursor:pointer;margin-top:12px;
  background:linear-gradient(170deg,#fff 0 55%,#f7f2ea 55%)}
#club .tile.next:active{transform:scale(.99)}
#club .nx-band{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--t-black);color:#fff;
  clip-path:polygon(0 0,100% 0,100% 100%,3% 100%)}
#club .nx-band b{font-size:13px;font-weight:900;font-style:italic;color:var(--t-gold2)}
#club .nx-band em{font-style:normal;font-size:12px}
#club .nx-band i{margin-left:auto;font-style:normal;font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.1em;color:#bbb}
#club .nx-hype{margin:10px 14px 0;font-size:13px;font-weight:900;color:var(--t-sub)}
/* VS は中央に固定(クラブ名の長さで中心がずれないように 1fr auto 1fr) */
#club .nx-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:8px 14px 0}
#club .nx-vs .me{display:flex;align-items:center;justify-content:flex-end;gap:8px}
#club .nx-vs .op{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-direction:row-reverse}
#club .nx-vs b{font-family:"Oswald",sans-serif;font-size:24px;font-weight:700;letter-spacing:.04em}
#club .nx-vs .vs{font-family:"Oswald",sans-serif;font-size:30px;font-weight:700;font-style:italic;color:var(--t-ink);
  text-shadow:2px 2px 0 var(--t-gold2)}
#club .nx-opp{margin:6px 14px 0;text-align:center;font-size:14px;font-weight:900}
#club .nx-opp span{color:var(--t-gold);font-size:11px;letter-spacing:-1px}
#club .nx-meta{margin:2px 14px 0;text-align:center;font-size:11px;color:var(--t-mute)}
#club .nx-go{margin:10px 14px 0;text-align:right;font-size:13px;font-weight:900;color:var(--t-sub)}

/* 秘書の一言 */
#club .sec{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--t-card);
  border-left:4px solid var(--t-gold);box-shadow:0 1px 6px rgba(0,0,0,.06)}
#club .sec-ic{flex:0 0 auto;font-style:normal;font-family:"Oswald",sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;
  padding:2px 6px;background:var(--t-black);color:var(--t-gold2)}
#club .sec p{margin:0;font-size:12.5px;line-height:1.55}

/* 前の試合(要約) */
#club .tile.last h3{margin-bottom:6px}
#club .ls{display:flex;align-items:center;gap:12px}
#club .ls-sc{flex:1;font-size:13px;font-weight:700;text-align:center}
#club .ls-sc b{display:block;font-family:"Oswald",sans-serif;font-size:34px;font-weight:700;line-height:1.1}
#club .ls-sc small{display:block;font-size:11px;color:var(--t-mute)}
#club .ls-card{flex:0 0 74px}
#club .tile.last ul{margin:8px 0 0;padding:0 0 0 16px;font-size:11.5px;line-height:1.6;color:var(--t-ink2)}

/* 準備の手順(全画面) */
#club .prep-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:var(--t-black);color:#fff}
#club .prep-top .x{flex:0 0 34px;height:34px;border:1px solid #444;background:none;color:#fff;font-size:18px;border-radius:2px}
#club .steps{flex:1;display:flex;gap:4px}
#club .steps span{flex:1;display:flex;align-items:center;gap:4px;padding:5px 6px;font-size:10.5px;font-weight:700;color:#888;
  background:#222;clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,8% 50%)}
#club .steps span:first-child{clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%)}
#club .steps i{font-style:normal;font-family:"Oswald",sans-serif;font-size:12px}
#club .steps .now{background:var(--t-sub);color:#fff}
#club .steps .done{background:#3a3a3a;color:#cfcfcf}
#club .prep-vs{padding:7px 12px;font-size:12px;background:var(--t-card);border-bottom:1px solid var(--t-rule);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#club .prep-vs b{font-weight:900;margin-right:4px}
#club .prep-vs span{color:var(--t-mute)}
#club .cl-main.prep{padding-top:12px}
#club .step-h{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
#club .step-h b{font-size:20px;font-weight:900}
#club .step-h small{font-size:11px;color:var(--t-mute)}
#club .step-h em{font-style:normal;font-family:"Oswald",sans-serif;font-size:15px;font-weight:700;color:var(--t-sub)}
#club .msgs{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--t-card);border-left:4px solid var(--t-gold);font-size:11.5px}
#club .prep-bot{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--t-card);border-top:1px solid var(--t-rule)}
#club .prep-bot .dim{text-align:center;font-size:12px;padding:8px 0}
#club .prep-bot .btn-main{margin:0;height:50px;font-size:18px}
#club .prep-bot .lnk{align-self:center;color:var(--t-mute);font-size:11px}
#club .tab:disabled{opacity:.4}
/* CLUB の記録 */
#club .rec{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;margin:4px 0 6px}
#club .rec b{display:block;font-family:"Oswald",sans-serif;font-size:24px;font-weight:700}
#club .rec small{font-size:10px;color:var(--t-mute)}
/* ネイビーのテーマでも読めるように、地の色だけ合わせる */
.th-navy #club .tile,.th-navy #club .sec,.th-navy #club .prep-vs,.th-navy #club .prep-bot,.th-navy #club .msgs{background:var(--t-card);color:var(--t-ink)}
.th-navy #club .tile.next{background:var(--t-card)}

/* ---- SQUAD: 既定の陣形(→docs/07 §7.10) ---- */
#club .sq-head{display:flex;flex-direction:column;gap:6px}
#club .sq-head h3{margin:0;font-family:"Oswald",sans-serif;font-size:20px;font-weight:700;letter-spacing:.08em}
#club .sq-head h3 small{margin-left:6px;font-family:system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:0;color:var(--t-mute)}
#club .sq-forms{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#club .sq-forms button{height:34px;border:1px solid var(--t-rule);border-radius:2px;background:var(--t-card);color:var(--t-ink);
  font-family:"Oswald",sans-serif;font-size:15px;font-weight:700;letter-spacing:.06em}
#club .sq-forms button.on{background:var(--t-black);border-color:var(--t-black);color:var(--t-gold2);box-shadow:inset 0 -3px 0 var(--t-sub)}
/* ピッチ: 縦。自陣が下 */
#club .sq-pitch{position:relative;aspect-ratio:100/122;border-radius:3px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:repeating-linear-gradient(180deg,#1f6b3d 0 10%,#237545 10% 20%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),0 3px 12px rgba(0,0,0,.18)}
#club .sq-pitch::before{content:"";position:absolute;inset:4% 5%;border:1.5px solid rgba(255,255,255,.55);pointer-events:none}
#club .sq-pitch .pm{position:absolute;pointer-events:none;border:1.5px solid rgba(255,255,255,.5)}
#club .sq-pitch .pm.half{left:5%;right:5%;top:50%;height:0;border-width:1.5px 0 0}
#club .sq-pitch .pm.circ{left:50%;top:50%;width:24%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
#club .sq-pitch .pm.pa{left:24%;right:24%;height:13%} #club .sq-pitch .pm.pa.top{top:4%;border-top:0} #club .sq-pitch .pm.pa.bot{bottom:4%;border-bottom:0}
#club .sq-pitch .pm.ga{left:38%;right:38%;height:5%} #club .sq-pitch .pm.ga.top{top:4%;border-top:0} #club .sq-pitch .pm.ga.bot{bottom:4%;border-bottom:0}
/* 連携の線 */
#club .sq-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#club .sq-links .lk{stroke-linecap:round}
#club .sq-links .l1{stroke:rgba(255,255,255,.55);stroke-width:1.5}
#club .sq-links .l2{stroke:rgba(255,255,255,.9);stroke-width:3.5}
#club .sq-links .l3{stroke:#f3cf6a;stroke-width:5;filter:drop-shadow(0 0 3px rgba(255,214,90,.9))}
#club .sq-links .omen{stroke:#f3cf6a;stroke-width:2;stroke-dasharray:4 4}
/* 選手(小さなカード) */
#club .sqc{position:absolute;width:58px;height:46px;transform:translate(-50%,-50%);display:grid;grid-template-columns:auto 1fr;
  grid-template-rows:20px 1fr;background:var(--t-card,#fff);color:var(--t-ink);border-radius:2px;overflow:visible;cursor:grab;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.25);border-top:4px solid var(--cc);transition:transform .12s}
#club .sqc.drag{z-index:5;transform:translate(-50%,-58%) scale(1.08);box-shadow:0 10px 18px rgba(0,0,0,.4);transition:none}
#club .sqc.sel{outline:3px solid var(--t-sub);outline-offset:1px;z-index:4}
#club .sqc .no{grid-row:1;grid-column:1;padding:0 3px 0 4px;font-style:normal;font-family:"Oswald",sans-serif;font-size:16px;font-weight:700;line-height:20px}
#club .sqc .rl{grid-row:1;grid-column:2;justify-self:end;margin:2px 3px 0 0;padding:0 3px;height:15px;line-height:15px;border-radius:1px;
  font-family:"Oswald",sans-serif;font-size:10px;font-weight:700;letter-spacing:.04em;background:var(--t-black);color:#fff}
#club .sqc .rl.a0{background:#1f8a4c} #club .sqc .rl.a1{background:#b8892c} #club .sqc .rl.a2{background:var(--t-sub)}
#club .sqc .nm{grid-row:2;grid-column:1/3;align-self:center;padding:0 3px;font-size:9.5px;font-weight:800;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#club .sqc .mt{position:absolute;left:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:#999}
#club .sqc .mt.m1{background:var(--t-sub)} #club .sqc .mt.m2{background:#e0a21b} #club .sqc .mt.m3{background:#4b9be0} #club .sqc .mt.m4{background:#1f8a4c}
#club .sqc .kpb{position:absolute;left:50%;top:-11px;transform:translateX(-50%);padding:0 5px;font-style:normal;font-family:"Oswald",sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.08em;line-height:14px;background:var(--t-gold);color:#fff;border-radius:1px;box-shadow:0 1px 0 var(--t-gold3)}
#club .sqc.kp{box-shadow:0 0 0 2px var(--t-gold),0 3px 10px rgba(0,0,0,.3)}
#club .sqc .sg{position:absolute;right:-5px;top:-8px;width:16px;height:16px;border-radius:50%;font-style:normal;font-size:9px;font-weight:900;
  line-height:16px;text-align:center;background:var(--t-sub);color:#fff}
#club .sqc.tired::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(200,16,46,.12) 5px 7px);pointer-events:none}
#club .sqc.r-K{background:linear-gradient(135deg,#fff 0%,#f4ecd8 45%,#fff 60%,#efe3c6 100%)}
#club .sqc.r-L{background:linear-gradient(135deg,#1a1a1a,#3a3226);color:#f3cf6a}
/* 控え */
#club .sq-bench{display:flex;align-items:center;gap:6px;padding:12px 8px 8px;background:var(--t-paper2);border-radius:2px;overflow-x:auto}
#club .sq-bench .lbl{flex:0 0 auto;writing-mode:vertical-rl;font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--t-mute)}
#club .sq-bench .sqc{position:relative;flex:0 0 56px;transform:none;left:auto;top:auto;cursor:pointer}
#club .sq-bench .sqc.sel{transform:translateY(-3px)}
/* 選んだ選手 */
#club .sq-hint{margin:0;font-size:11px;color:var(--t-mute);text-align:center}
#club .sq-det{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--t-card);border-left:4px solid var(--t-sub);
  box-shadow:0 1px 6px rgba(0,0,0,.08)}
#club .sd-top{display:flex;align-items:baseline;gap:6px}
#club .sd-top .no{font-style:normal;font-family:"Oswald",sans-serif;font-size:22px;font-weight:700}
#club .sd-top b{font-size:15px;font-weight:900}
#club .sd-top small{font-size:11px;color:var(--t-mute)}
#club .sd-top .rlx{margin-left:auto;padding:1px 6px;font-family:"Oswald",sans-serif;font-size:13px;font-weight:700;background:var(--t-black);color:#fff}
#club .sd-top .rlx.a0{background:#1f8a4c} #club .sd-top .rlx.a1{background:#b8892c} #club .sd-top .rlx.a2{background:var(--t-sub)}
#club .sd-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:11.5px}
#club .sd-row .st5{color:var(--t-gold);letter-spacing:-1px}
#club .sd-row em{display:inline-block;vertical-align:middle;width:40px;height:4px;margin-left:4px;background:var(--t-paper2);position:relative}
#club .sd-row em u{position:absolute;left:0;top:0;bottom:0;background:var(--t-gold)}
#club .sd-row .fat.warn{color:var(--t-sub);font-weight:900}
#club .sd-act{display:flex;gap:8px}
#club .sd-act button{flex:1;height:38px;border:0;border-radius:2px;background:var(--t-gold);color:#fff;font-family:inherit;font-size:14px;font-weight:900}
#club .sd-act button.ghost{background:none;border:1px solid var(--t-rule);color:var(--t-ink2);font-size:12px;font-weight:700}
#club .sd-act .kpnow{flex:1;display:flex;align-items:center;justify-content:center;font-family:"Oswald",sans-serif;font-weight:700;letter-spacing:.1em;
  color:var(--t-gold);border:1px solid var(--t-gold)}
/* 連携の凡例 */
#club .lklg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:0;font-size:11.5px}
#club .lklg i{display:inline-block;vertical-align:middle;width:22px;margin-right:4px;border-top:2px solid #6b8f78}
#club .lklg i.l2{border-top-width:4px;border-color:#2c5a3d} #club .lklg i.l3{border-top-width:5px;border-color:#e2b23d}
#club .lklg i.omen{border-top:2px dashed #e2b23d}

/* ---- 操作の台(白×赤)。筐体の台: 黒い天板に、黄色い十字・赤い中央、赤い SHOOT と青い KEEPER の丸ボタン ---- */
.th-wr #pad{background:linear-gradient(180deg,#1d1d1d,#0c0c0c);border-top:3px solid var(--t-gold)}
.th-wr #pad .tac{font-size:11.5px;font-weight:800;letter-spacing:.02em;color:#2a1d00;border:0;border-radius:6px;
  background:linear-gradient(180deg,#ffe58a,#f2b822 60%,#d9960f);box-shadow:0 4px 0 #8a5c06,inset 0 1px 0 rgba(255,255,255,.6)}
.th-wr #pad .tac:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5c06}
.th-wr #pad .tac.md{color:#fff;background:radial-gradient(circle at 50% 35%,#ff6a5c,#c8102e 65%,#8f0a1f);box-shadow:0 4px 0 #5e0614,inset 0 1px 0 rgba(255,255,255,.4)}
.th-wr #pad .tac.on{color:#fff;background:linear-gradient(180deg,#ff5a6e,var(--t-sub) 60%,var(--t-sub2));
  box-shadow:0 4px 0 #5e0614,0 0 14px rgba(255,90,110,.75),inset 0 1px 0 rgba(255,255,255,.4)}
.th-wr #pad .tac.md.on{background:radial-gradient(circle at 50% 35%,#fff3b0,#f2c14e 60%,#b8892c);color:#2a1d00;box-shadow:0 4px 0 #6e4f0e,0 0 14px rgba(242,193,78,.8)}
.th-wr #pad .mid .btn{background:#2a2a2a;color:#fff;border:1px solid #444}
.th-wr #pad .btn-kp{background:#2a2a2a;color:var(--t-gold2);border:1px solid var(--t-gold)}
.th-wr #pad .btn-kp.on{background:var(--t-gold);color:#fff;border-color:var(--t-gold3)}
.th-wr #subInfo{color:#aaa}
.th-wr .btn-shoot,.th-wr .btn-keeper{clip-path:none;border:0;border-radius:29px;font-family:"Oswald",sans-serif;font-weight:700;letter-spacing:.14em;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35)}
.th-wr .btn-shoot{background:radial-gradient(circle at 50% 30%,#ff7b6e,#c8102e 60%,#7d0a1b)}
.th-wr .btn-shoot:active,.th-wr .btn-keeper:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.55)}
.th-wr .btn-shoot.armed{background:radial-gradient(circle at 50% 30%,#fff3b0,#f2c14e 60%,#b8892c);color:#2a1d00}
.th-wr .btn-keeper{background:radial-gradient(circle at 50% 30%,#7fb2ff,#1d5fbf 60%,#0f3473)}
.th-wr .btn-keeper.on{background:radial-gradient(circle at 50% 30%,#fff3b0,#f2c14e 60%,#b8892c);color:#2a1d00;box-shadow:0 5px 0 #6e4f0e,0 0 14px rgba(242,193,78,.8)}
.th-wr #hud .spd{background:var(--t-black);color:#fff;border:0;font-family:"Oswald",sans-serif;font-weight:700;letter-spacing:.06em}

/* ---- 育成の見える化と選手の言葉 ---- */
#club .sq-links .soon{stroke:rgba(255,255,255,.75);stroke-width:1;stroke-dasharray:2 3}
#club .lklg i.soon{border-top:1px dashed #6b8f78}
#club .sd-row .sgn{padding:0 5px;background:var(--t-gold);color:#fff;font-weight:900;font-size:10.5px}
#club .voice{margin:0 0 6px;padding:8px 10px;background:var(--t-paper2);border-left:3px solid var(--t-gold);font-size:12.5px;line-height:1.5}
#club .voice b{margin-right:4px}
#club .voice small{display:block;font-size:10.5px;color:var(--t-mute)}
#club .tr.rest{border-style:dashed}

/* SQUAD の各部は縮めない(中身が増えてもピッチがつぶれないように) */
#club .cl-main.tab-squad>*{flex-shrink:0}

/* SQUAD のカードを試合の盤面のカードと同じ作りに: 上の帯 = ポジションの色、役割の文字の色 = 適性(白 得意 / 黄 同じ系統 / 赤み 不向き) */
#club .sqc{height:50px;border-top:0;grid-template-columns:1fr;grid-template-rows:15px 19px 1fr}
#club .sqc.gk{--pc:#c48a12} #club .sqc.df{--pc:#1d5fbf} #club .sqc.mf{--pc:#1f8a4c} #club .sqc.fw{--pc:#c8102e}
#club .sqc .rl{grid-row:1;grid-column:1;justify-self:stretch;margin:0;padding:0;height:15px;line-height:15px;border-radius:2px 2px 0 0;
  text-align:center;background:var(--pc);color:#fff;letter-spacing:.06em}
#club .sqc .rl.a0{background:var(--pc);color:#fff} #club .sqc .rl.a1{background:var(--pc);color:#ffe28a} #club .sqc .rl.a2{background:var(--pc);color:#ffb0b0}
#club .sqc .no{grid-row:2;grid-column:1;padding:0;text-align:center;line-height:19px;font-size:16px}
#club .sqc .nm{grid-row:3;grid-column:1}
#club .sd-top .rlx.gk{background:#c48a12} #club .sd-top .rlx.df{background:#1d5fbf} #club .sd-top .rlx.mf{background:#1f8a4c} #club .sd-top .rlx.fw{background:#c8102e}
#club .sd-top .rlx.a0{color:#fff} #club .sd-top .rlx.a1{color:#ffe28a} #club .sd-top .rlx.a2{color:#ffb0b0}
/* 練習の強度: 休憩を加えて4つ */
#club .ints.i4{grid-template-columns:repeat(4,1fr)}
#club .ints .tab.rest.on{background:#1d5fbf;border-color:#1d5fbf;color:#fff}

/* ---- カードの表記(→docs/06): 合計値・背番号・カードNo.・ポジションの色 ---- */
.kc .k-pos.gk{background:#c48a12} .kc .k-pos.df{background:#1d5fbf} .kc .k-pos.mf{background:#1f8a4c} .kc .k-pos.fw{background:#c8102e}
.kc .k-name small .k-num{margin-left:5px;padding:0 3px;font-style:normal;font-family:"Oswald",sans-serif;font-weight:700;
  background:rgba(0,0,0,.55);color:#fff;border-radius:1px}
.kc .k-cno{position:absolute;right:5%;bottom:2.5%;z-index:4;font-style:normal;font-family:"Oswald",sans-serif;font-size:7px;
  letter-spacing:.06em;color:rgba(0,0,0,.45)}
.kc.r-L .k-cno{color:rgba(243,207,106,.7)}
.kc-s .k-cno{font-size:6px}
.kc-m .k-cno{font-size:9px}
#club .kmeta{margin:0 0 6px;font-size:11.5px;color:var(--t-ink2)}
#club .kmeta b{font-family:"Oswald",sans-serif}
#club .tabs.sorts{margin-top:4px}

/* ---- レアリティは台紙と枠と箔で見分ける(→docs/06・docs/08 §8.10) ----
 * REGULAR 白い紙・灰の細い枠 / SPECIAL 黒い紙・銀の枠 / WORLD CLASS 虹色の紙・虹の太い枠・流れる箔 / LEGENDS 金の紙・金の二重枠・光の筋 */
.kc.r-W::after{border:1.5px solid #b8b2a6}
.kc.r-B::after{inset:2px;border:2px solid transparent;border-image:linear-gradient(135deg,#f4f4f4,#8a8a8a 30%,#e6e6e6 55%,#7a7a7a 80%,#f4f4f4) 1}
.kc.r-K{background:linear-gradient(135deg,#ffe9f5 0%,#e6f4ff 30%,#fffbe0 55%,#e8ffef 75%,#f1e8ff 100%);color:#1c1430}
.kc.r-K::after{inset:2px;border:3px solid transparent;border-image:linear-gradient(135deg,#ff7ac8,#79d8ff,#ffe36e,#8cffaa,#c69bff,#ff7ac8) 1}
.kc.r-K .k-foil{mix-blend-mode:normal;opacity:.75}
.kc.r-K .k-st b{color:#2a1a4a} .kc.r-K .k-st i,.kc.r-K .k-sk em{color:#6f5a9a} .kc.r-K .k-sk{color:#2a1a4a}
.kc.r-K .k-name{background:linear-gradient(90deg,#c8102e,#d6336c 60%,#8a5cd6)}
.kc.r-L::after{inset:2px;border:3px double #7d5a14}
.kc.r-L{box-shadow:0 0 0 1px #b8892c,0 3px 10px rgba(120,80,10,.45)}

/* =========================================================================
   試合のあと(→docs/07 §7.12): 結果(チームの数字・採点)/ ロッカールーム / 優勝の撮影
   ========================================================================= */
.th-wr .sc-res .res-word,.sc-res .res-word{font-size:74px}
.sc-res{gap:7px!important;padding-top:calc(env(safe-area-inset-top) + 14px)!important;padding-bottom:34px!important;overflow-y:auto!important}
.sc-res .res-score .rn{font-size:48px}
.res-st{width:100%;max-width:360px;display:flex;flex-direction:column;gap:3px;padding:6px 10px;background:rgba(0,0,0,.28);
  font-size:12px;animation:fadeIn .4s 1.1s both}
.res-st>div{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.res-st b{font-family:"Oswald",sans-serif;font-size:15px;font-weight:700;text-align:center}
.res-st span{display:flex;flex-direction:column;align-items:center;gap:2px}
.res-st span i{font-style:normal;font-size:10px;opacity:.85}
.res-st span em{display:block;width:100%;height:4px;background:rgba(255,255,255,.25);position:relative}
.res-st span em::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--t-gold2,#ffe28a)}
.res-rt{width:100%;max-width:360px;display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;animation:fadeIn .4s 1.3s both}
.res-rt span{display:grid;grid-template-columns:24px 1fr 30px;align-items:center;gap:4px;padding:2px 4px;
  background:rgba(255,255,255,.92);color:#121212;font-size:11px}
.res-rt span.mvp{box-shadow:inset 0 0 0 2px var(--t-gold,#b8892c)}
.res-rt .pos{font-style:normal;font-size:8.5px;font-weight:700;color:#fff;text-align:center;padding:1px 0;font-family:"Oswald",sans-serif}
.res-rt .pos.gk{background:#c48a12} .res-rt .pos.df{background:#1d5fbf} .res-rt .pos.mf{background:#1f8a4c} .res-rt .pos.fw{background:#c8102e}
.res-rt b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-rt b u{text-decoration:none;font-size:8px;margin-left:2px}
.res-rt em{font-style:normal;font-family:"Oswald",sans-serif;font-weight:700;font-size:14px;text-align:right}
.res-rt em.hi{color:#b8892c} .res-rt em.lo{color:#1d5fbf}
.res-mvp em{font-style:normal;font-family:"Oswald",sans-serif;font-size:16px;font-weight:700;color:var(--t-gold,#b8892c)}
.th-wr .res-mvp{animation-delay:1.5s}

/* ロッカールーム: 木のロッカーが並ぶ壁と床 */
.sc-lock{justify-content:flex-start!important;gap:10px;padding-top:calc(env(safe-area-inset-top) + 16px)!important;
  padding-bottom:34px!important;overflow-y:auto!important;color:#f4efe6;
  background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55) 60%,#120c06 100%),
    repeating-linear-gradient(90deg,#5a3d22 0 58px,#3c2814 58px 61px),#4a321b}
.sc-lock::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 22px,rgba(0,0,0,.25) 22px 24px);opacity:.5}
.lk-head{position:relative;text-align:center;animation:fadeIn .4s .2s both}
.lk-head b{display:block;font-family:"Oswald",sans-serif;font-size:30px;font-weight:700;letter-spacing:.18em;color:#ffe9a8}
.lk-head small{font-size:11px;opacity:.85}
.lk-sec{position:relative;width:100%;max-width:360px;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;
  background:rgba(255,255,255,.95);color:#121212;border-left:5px solid #c8102e;animation:fadeIn .4s .3s both}
.lk-sec .sec-ic{flex:none;font-style:normal;font-size:9px;font-weight:900;padding:2px 5px;background:#121212;color:#e9c76b;font-family:"Oswald",sans-serif}
.lk-sec p{margin:0;font-size:12.5px;font-weight:700}
.lk-sec ul{margin:4px 0 0;padding:0 0 0 14px;font-size:11px;line-height:1.55;color:#3a3a3a}
.lk-pl{position:relative;width:100%;max-width:360px;display:flex;gap:10px;align-items:center;animation:fromL .45s cubic-bezier(.2,1.2,.4,1) both}
.lk-card{flex:none;width:74px}
.lk-say{flex:1;min-width:0;position:relative;padding:8px 10px;background:#fffdf7;color:#121212;border-radius:8px}
.lk-say::before{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-right-color:#fffdf7;border-left:0}
.lk-say b{font-size:11px;color:#c8102e}
.lk-say p{margin:2px 0 0;font-size:13px;font-weight:700;line-height:1.45}
.lk-say em{display:block;margin-top:4px;font-style:normal;font-size:10.5px;color:#7d766b}
.lk-say em.hi{color:#b8892c;font-weight:900}
.lk-grow{position:relative;list-style:none;margin:0;padding:6px 10px;width:100%;max-width:360px;background:rgba(0,0,0,.45);
  border-left:3px solid #e9c76b;font-size:11.5px;line-height:1.6}
.lk-grow li{animation:fadeIn .35s both} .lk-grow li.hi{color:#ffe28a;font-weight:900}

/* 優勝の撮影: スポットライトとトロフィー、フラッシュが2回 */
.sc-trophy{justify-content:flex-start!important;gap:8px;padding-top:calc(env(safe-area-inset-top) + 22px)!important;padding-bottom:34px!important;
  background:radial-gradient(ellipse at 50% 38%,#fff6d6 0%,#e9c76b 18%,#7a1020 52%,#1a0508 100%)}
.tr-head{text-align:center;animation:fadeIn .4s .2s both}
.tr-head small{display:block;font-size:13px;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.tr-head b{display:block;font-family:"Oswald",sans-serif;font-size:50px;font-weight:700;letter-spacing:.06em;line-height:1;
  color:#fff;text-shadow:3px 3px 0 #7a1020,0 0 18px rgba(255,233,168,.8)}
.tr-stage{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center}
.tr-cup{width:150px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:cupUp .8s .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cupUp{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.tr-team{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 4px;margin-top:8px;animation:fadeIn .5s .9s both}
.tr-team span{font-size:10.5px;font-weight:700;padding:2px 6px;background:rgba(255,255,255,.92);color:#121212;transform:skewX(-8deg)}
.tr-club{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;font-style:italic;animation:fadeIn .4s 1.1s both}
.sc-trophy .flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none;animation:flash2 1.4s .6s both}
@keyframes flash2{0%,100%{opacity:0}6%{opacity:.95}20%{opacity:0}38%{opacity:0}44%{opacity:.9}58%{opacity:0}}
/* 文字色: .th-wr #scene(濃い文字)より強く指定する。暗い背景の場面は白 */
.th-wr #scene.sc-res.r-win,.th-wr #scene.sc-res.r-lose{color:#fff}
.th-wr #scene.sc-lock{color:#f4efe6}
.th-wr #scene.sc-trophy{color:#fff}

/* ---- めくる前の予兆(→docs/07 §7.12): 裏の後ろの光 ---- */
.pk-aura{position:absolute;inset:-18px;z-index:1;border-radius:24px;pointer-events:none;opacity:0;transition:opacity .4s}
.om-B .pk-aura{opacity:1;background:radial-gradient(ellipse,rgba(235,240,250,.9) 30%,rgba(180,190,210,.0) 72%);animation:auraP 1.6s ease-in-out infinite}
.om-K .pk-aura{opacity:1;inset:-14px;filter:blur(10px);
  background:conic-gradient(from 0deg,#ff7ac8,#79d8ff,#ffe36e,#8cffaa,#c69bff,#ff7ac8);animation:spin 2.4s linear infinite}
.om-L .pk-aura{opacity:1;inset:-24px;filter:blur(6px);
  background:radial-gradient(ellipse,#fff3c4 20%,#f2c14e 45%,rgba(184,137,44,0) 72%);animation:auraP .7s ease-in-out infinite}
.om-L .pk-card:not(.open){animation:cardOut .7s cubic-bezier(.2,1.2,.4,1) both,shake .18s .8s linear infinite}
@keyframes auraP{50%{transform:scale(1.06);opacity:.65}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-2px 1px}75%{translate:2px -1px}}
.promo .pk-aura{animation-name:auraP,promoIn;animation-duration:1s,.5s;animation-iteration-count:infinite,1}
.om-K.promo .pk-aura{animation:spin 2.4s linear infinite,promoIn .5s 1}
@keyframes promoIn{from{transform:scale(1.8);opacity:0}}
/* 明るい紙の背景でも見えるように(白×赤のテーマ) */
.om-B .pk-aura{background:radial-gradient(ellipse,rgba(110,130,165,.75) 35%,rgba(110,130,165,0) 72%)}
.om-L .pk-aura{inset:-34px;filter:none;
  background:radial-gradient(ellipse,rgba(255,214,90,1) 40%,rgba(242,170,30,.85) 55%,rgba(242,170,30,0) 74%),
    repeating-conic-gradient(from 0deg,rgba(242,170,30,.55) 0 8deg,transparent 8deg 20deg)}
.om-L .pk-aura{-webkit-mask:radial-gradient(closest-side,#000 82%,transparent 100%);mask:radial-gradient(closest-side,#000 82%,transparent 100%)}

/* CARDS の一覧: 登録中のカードの印 */
.kc.insq .k-top::after{content:"登録中";margin-top:3px;padding:1px 4px;font-family:system-ui,sans-serif;font-size:7.5px;font-weight:900;
  letter-spacing:.04em;color:#fff;background:#121212;box-shadow:0 0 0 1px rgba(255,255,255,.7)}

/* ケガをした盤面のカード(→docs/08 §8.8): 赤十字の札と、少し沈んだ色 */
.cd.inj{filter:saturate(.6) brightness(.92)}
.cd.inj::after{content:"+";position:absolute;right:-4px;top:-6px;z-index:5;width:15px;height:15px;border-radius:50%;
  background:#c8102e;color:#fff;font:900 13px/15px system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px #fff}

/* ラウンジ: 連携が付きやすくなる理由(→docs/08 §8.6) */
#club .bonus{margin:4px 0;font-size:11.5px;color:var(--t-ink2)}
#club .bonus b{display:inline-block;margin-right:4px;padding:1px 6px;font-size:10.5px;background:var(--t-gold2);color:#201400;border-radius:2px}

/* ---- 秘書(→docs/08 §8.7) ---- */
#club .sec .sec-nm,.lk-sec .sec-nm{display:block;font-size:10.5px;color:var(--t-sub,#c8102e);margin-bottom:1px}
#club .sec-ev{border-left:4px solid var(--t-gold)}
#club .sec-ch{display:flex;flex-direction:column;gap:5px;margin-top:6px}
#club .sec-ch .btn{padding:7px 10px;font-size:12.5px}
#club .secpick .sp{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;background:var(--t-card);color:var(--t-ink);
  border:1px solid var(--t-rule);border-left:4px solid var(--t-rule);cursor:pointer}
#club .secpick .sp.on{border-left-color:var(--t-sub);box-shadow:0 0 0 1px var(--t-sub)}
#club .secpick .sp b{font-size:14px} #club .secpick .sp small{margin-left:8px;font-size:11px;color:var(--t-mute)}
#club .secpick .sp i{display:block;margin-top:3px;font-style:normal;font-size:11.5px;color:var(--t-ink2)}

/* ---- スタジアムと施設(→docs/05 §5.13) ---- */
#club .stad-svg{display:block;width:100%;height:auto;margin:6px 0;border:1px solid var(--t-rule)}
#club .stad-offer{border-left:4px solid var(--t-sub)}
#club .stad p b,#club .facs b{font-family:"Oswald",sans-serif}
#club .facs .fac{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--t-rule)}
#club .facs .fac b{font-size:13px} #club .facs .fac b i{font-style:normal;font-size:11px;color:var(--t-sub);margin-left:4px}
#club .facs .fac small{display:block;font-size:10.5px;color:var(--t-mute)}
#club .facs .fac .btn{flex:none;padding:6px 10px;font-size:11.5px}
#club .facs .fac>div{flex:1;min-width:0}
#club .facs .fac .btn{width:auto;margin:0}

/* ---- スポンサー(→docs/05 §5.14) ---- */
#club .msn{list-style:none;margin:6px 0 4px;padding:0}
#club .msn li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:4px 0;border-top:1px dashed var(--t-rule);font-size:11.5px}
#club .msn li b{font-weight:700} #club .msn li span{color:var(--t-gold);font-weight:700;text-align:right}
#club .msn li em{grid-column:1/3;font-style:normal;font-size:10.5px;color:var(--t-mute)}
#club .msn li.ok b{color:#1f8a4c} #club .msn li.ok em{color:#1f8a4c;font-weight:700} #club .msn li.ng{opacity:.5}
#club .sppick .spo{margin:8px 0;padding:8px 10px;border:1px solid var(--t-rule);border-left:4px solid #8a8a8a;background:var(--t-card)}
#club .sppick .spo.t1{border-left-color:#1d5fbf} #club .sppick .spo.t2{border-left-color:var(--t-gold)}
#club .spo-h b{font-size:14px} #club .spo-h i{font-style:normal;font-size:10px;margin-left:6px;padding:0 5px;background:var(--t-black);color:#fff}
#club .spo-h small{display:block;font-size:11px;color:var(--t-mute)}
#club .sppick .spo .btn{margin-top:4px}
#club .sptile h3 .logo{display:inline-block;padding:2px 8px;margin-right:6px;font-size:12px;font-weight:900;letter-spacing:.04em;
  background:#fff;color:var(--t-ink);border:2px solid var(--t-ink);transform:skewX(-8deg)}
#club .sptile h3 .logo.t2{background:var(--t-gold2)}
#club .sptile .boost{margin:4px 0 0;font-size:11px;font-weight:700;color:#1d5fbf}
.vs-sp{display:inline-block;margin-top:3px;padding:1px 8px;font-size:11px;font-weight:900;letter-spacing:.04em;background:#fff;color:#121212;transform:skewX(-8deg)}

/* スポンサーのマスタ(業種 × ☆) */
#club .spo.r1,#club .spo.r2{border-left-color:#8a8a8a} #club .spo.r3{border-left-color:#1d5fbf} #club .spo.r4,#club .spo.r5{border-left-color:var(--t-gold)}
#club .spo-h .st{margin-left:6px;font-size:11px;color:var(--t-gold);letter-spacing:.05em}
#club .spo .rw{margin:4px 0 2px;font-size:11.5px;line-height:1.5} #club .spo .rw b{color:var(--t-sub)} #club .spo .rw u{text-decoration:none;font-weight:700}
#club .sptile .spo{border:0;padding:0;background:none}
#club .sptile h3 .logo.r4,#club .sptile h3 .logo.r5{background:var(--t-gold2)}

/* 対戦カード: 画面の高さの中央にそろえる */
.sc-vs{justify-content:center!important;gap:16px}

/* ---- ブラッシュアップ会議 第1弾(→docs/09) ---- */
/* カードの文字が重ならないように: レア名は右端の細い帯、能力の列は少し下へ、スキル名はカードNo. の手前まで */
.kc .k-rar{right:2.5%;letter-spacing:.04em;font-size:7px}
.kc-m .k-rar{font-size:9px}
.kc-m .k-st{top:36%;right:12%}
.kc .k-sk{right:24%}
/* 十字: 消えているボタンは暗い黄色(ランプが消えた色)、点いたら明るく光らせる。中央(プレス)も同じ決まり */
.th-wr #pad .tac{background:linear-gradient(180deg,#a8923f,#7d6a24 60%,#5e4f17);color:#1d1600;box-shadow:0 4px 0 #3b3008,inset 0 1px 0 rgba(255,255,255,.25)}
.th-wr #pad .tac.md{background:radial-gradient(circle at 50% 35%,#a84a43,#7a1622 65%,#560d17);color:#f3d6d6}
.th-wr #pad .tac.on{color:#2a1d00;background:linear-gradient(180deg,#fff6c2,#ffd84a 55%,#f2b822);
  box-shadow:0 4px 0 #8a5c06,0 0 16px rgba(255,216,74,.95),inset 0 1px 0 #fff}
.th-wr #pad .tac.md.on{color:#fff;background:radial-gradient(circle at 50% 35%,#ffb3a8,#ff3b30 55%,#c8102e);box-shadow:0 4px 0 #5e0614,0 0 16px rgba(255,80,60,.95)}
.th-wr #pad .tac.on::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
.th-wr #pad .tac{position:relative}
/* 準備: コミュニケーションが残っている間の「試合へ」は控えめ */
#club .prep-bot .go-soft{background:transparent;color:var(--t-sub);border:2px solid var(--t-sub);font-size:13px}
/* CARDS: 登録中の印は角の小さい札に */
.kc.insq .k-top::after{content:none}
.kc.insq::before{content:"登録";position:absolute;left:6%;bottom:27%;z-index:7;padding:0 4px;font-size:7px;font-weight:900;line-height:10px;color:#fff;background:rgba(18,18,18,.85)}
/* HOME: スポンサーの1行と、契約更新の帯 */
#club .sp-mini,#club .sp-bar{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;padding:9px 12px;border:1px solid var(--t-rule);background:var(--t-card);color:var(--t-ink)}
#club .sp-mini small{flex:1;min-width:0;font-size:11px;color:var(--t-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#club .sp-mini .logo{flex:none;padding:1px 7px;font-size:11.5px;font-weight:900;border:2px solid var(--t-ink);transform:skewX(-8deg)}
#club .sp-mini .logo.r4,#club .sp-mini .logo.r5{background:var(--t-gold2)}
#club .sp-bar{border-left:4px solid var(--t-gold);font-size:12.5px;font-weight:700}
#club .sp-mini b,#club .sp-bar b{margin-left:auto;color:var(--t-sub);font-size:16px}

/* ---- 育った分を盤面で見せる(→docs/09 第2弾) ---- */
#club .sqc .gs{position:absolute;left:-4px;top:-8px;font-style:normal;font-size:8.5px;font-weight:900;line-height:12px;padding:0 3px;
  color:#2a1d00;background:#ffe28a;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.35)}
#club .sqc .gs.aw{background:linear-gradient(90deg,#ff7ac8,#79d8ff,#ffe36e);color:#1c1430}
.cd .gsm{position:absolute;left:-6px;top:-7px;z-index:3;font-size:7.5px;font-weight:900;line-height:10px;padding:0 2px;color:#2a1d00;background:#ffe28a;border-radius:2px}
.cd .gsm.aw{background:linear-gradient(90deg,#ff7ac8,#79d8ff,#ffe36e)}
.cd .mtm{position:absolute;right:2px;top:16px;width:6px;height:6px;border-radius:50%;background:#999;box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.cd .mtm.m0{background:#555} .cd .mtm.m1{background:#c8102e} .cd .mtm.m2{background:#e0a21b} .cd .mtm.m3{background:#4b9be0} .cd .mtm.m4{background:#1f8a4c}
#club .chd .num.pw b i{color:#1f8a4c;font-size:10px}
/* ★の札をカードの外側に出す(枠の外を描く)。役割の帯は上の角を丸める */
#board .cd,#bench .cd{overflow:visible}
.cd .rl{border-radius:5px 5px 0 0}

/* =========================================================================
   ブラッシュアップ会議 第3弾(→docs/09)
   ========================================================================= */
/* 準備: コミュニケーションの相手を選ぶ盤面 */
#club .cm-board{margin:6px 0 4px}
#club .cm-pitch{aspect-ratio:100/118}
#club .cmt{position:absolute;width:62px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;padding:0 0 3px;
  border:0;border-radius:4px;background:#fff;color:#121212;box-shadow:0 2px 5px rgba(0,0,0,.35);cursor:pointer;line-height:1.1;overflow:visible}
#club .cm-bench{display:flex;gap:5px;justify-content:center;margin-top:6px}
#club .cm-bench .cmt{position:relative;transform:none;flex:0 0 62px}
#club .cmt .rl{width:100%;font-size:9px;font-weight:800;color:#fff;background:#1f8a4c;border-radius:4px 4px 0 0;padding:1px 0}
#club .cmt.gk .rl{background:#c48a12} #club .cmt.df .rl{background:#1d5fbf} #club .cmt.fw .rl{background:#c8102e}
#club .cmt .no{font-style:normal;font-family:"Oswald",sans-serif;font-size:15px;font-weight:700}
#club .cmt .nm{font-size:8.5px;max-width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#club .cmt small{font-size:8px;color:#1d5fbf;font-weight:700;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}
#club .cmt.on{outline:3px solid var(--t-gold2);outline-offset:1px;box-shadow:0 0 12px rgba(242,193,78,.9)}
#club .cmt.inj{opacity:.75} #club .cmt.inj .no::after{content:"+";color:#c8102e;margin-left:2px}
#club .cmt .sg{position:absolute;right:-6px;top:-7px;font-style:normal;font-size:10px;font-weight:900;width:15px;height:15px;line-height:15px;border-radius:50%;background:var(--t-sub);color:#fff}
#club .cmt .gs{position:absolute;left:-6px;top:-7px;font-style:normal;font-size:8px;font-weight:900;padding:0 3px;line-height:12px;background:#ffe28a;color:#2a1d00;border-radius:2px}
#club .cmt .gs.aw{background:linear-gradient(90deg,#ff7ac8,#79d8ff,#ffe36e)}

/* カード: ポーズの絵・クラブの色の帯・エンブレム */
.kc .k-pose{position:absolute;left:8%;right:8%;bottom:0;width:84%;height:96%}
.kc.r-B .k-pose .hd,.kc.r-B .k-pose .lg{stroke:#d8d8d8;fill:#d8d8d8}
.kc.r-B .k-pose .lg{fill:none}
.kc .k-name{background:color-mix(in srgb,var(--tc) 72%,#000)}
.kc .k-emb{position:absolute;right:13%;top:4%;z-index:3;line-height:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.kc-m .k-emb{right:12%;top:4%}
.kc.r-L .k-name{background:#121212}

/* 排出: 暗い店内の地に、下の払い出し口からカードがせり上がる */
.th-wr .sc-card,.sc-card{background:radial-gradient(ellipse at 50% 38%,#2a3350 0%,#10152a 55%,#05070d 100%)}
.th-wr .pk-head b{color:#ffe28a} .th-wr .pk-head small{color:#bcd2f2}
.th-wr .pk-msg{color:#eef1f6} .th-wr .pk-msg small{color:#ffe28a}
.th-wr .pk-msg .rar.r-B{color:#e8ebf2} .th-wr .pk-msg .rar.r-W{color:#bcd2f2}
.pk-mouth{position:relative;z-index:3;width:250px;height:26px;margin-top:-6px;border-radius:6px;
  background:linear-gradient(180deg,#3a3f4c,#14161c);box-shadow:0 6px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.pk-mouth i{position:absolute;left:12%;right:12%;top:9px;height:6px;border-radius:3px;background:#000;box-shadow:inset 0 2px 3px rgba(0,0,0,.9)}
.pk-card{animation:cardRise .9s cubic-bezier(.2,1.1,.4,1) both}
@keyframes cardRise{from{transform:translateY(70%);clip-path:inset(0 0 70% 0)}to{transform:none;clip-path:inset(0 0 0 0)}}
.om-L .pk-card:not(.open){animation:cardRise .9s cubic-bezier(.2,1.1,.4,1) both,shake .18s 1s linear infinite}
/* 中サイズのカードは、絵を左に寄せて右の能力の列と重ならないように */
.kc-m .k-pose{left:2%;right:auto;width:70%}
.kc.r-K .k-name{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 72%,#000) 55%,#8a5cd6)}
/* 準備の盤面は少し低く(GK と控えまで画面に収める) */
#club .cm-pitch{aspect-ratio:100/96}
#club .cm-pitch .cmt{padding-bottom:2px}

/* 重なったカードの効き目(→docs/08 §8.12) */
#club .kdet .dup{margin:4px 0 0;font-size:11.5px;font-weight:700;color:#1d5fbf}

/* ---- 第4弾(→docs/09) ---- */
#club .road p{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}
#club .road p b{flex:none} #club .road p span{flex:1;min-width:0;font-size:10.5px;color:var(--t-mute);text-align:right}
#club .road p.ok span{color:#1f8a4c;font-weight:700}
/* SHOOT: 指示が生きている間は光る */
.th-wr .btn-shoot.armed,.btn-shoot.armed{box-shadow:0 0 0 3px #fff,0 0 22px 6px rgba(255,90,70,.95);animation:shootGlow .6s ease-in-out infinite alternate}
@keyframes shootGlow{to{box-shadow:0 0 0 3px #ffe28a,0 0 30px 10px rgba(255,140,60,.95)}}
#flash.sh b{font-size:30px}

/* ---- 監督ライセンス・監督契約(→docs/10 §10.2 A) ---- */
#club .lic label,#club .contract label{display:block;margin:8px 0;font-size:12px;font-weight:700;color:var(--t-ink2)}
#club .lic input,#club .contract input{display:block;width:100%;margin-top:3px;padding:8px 10px;font-size:15px;border:1px solid var(--t-rule);border-radius:4px;background:#fff;color:var(--t-ink)}
#club .ce-prev{display:flex;align-items:center;gap:12px;padding:8px;background:var(--t-paper2);border-radius:6px}
#club .ce-prev b{display:block;font-size:17px} #club .ce-prev small{display:block;font-size:11px;color:var(--t-mute)}
#club .ce-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0}
#club .ce-row i{flex:0 0 100%;font-style:normal;font-size:11px;font-weight:700;color:var(--t-mute)}
#club .ce{padding:4px 8px;font-size:11.5px;border:1px solid var(--t-rule);border-radius:3px;background:#fff;color:var(--t-ink);cursor:pointer}
#club .ce.on{background:var(--t-sub);border-color:var(--t-sub);color:#fff}
#club .ce.sw{width:26px;height:26px;padding:0;background:var(--sw);border-radius:50%}
#club .ce.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--t-sub)}
#club .contract h4{margin:12px 0 2px;font-size:13px}
#club .ce-acts{display:flex;gap:8px;margin-top:10px} #club .ce-acts .btn{flex:1}

/* 称号のセット(→docs/10 §10.2 B) */
#club .tset .sp{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;background:var(--t-card);color:var(--t-ink);border:1px solid var(--t-rule);border-left:4px solid var(--t-gold);cursor:pointer}
#club .tset .sp b{font-size:14px} #club .tset .sp i{display:block;margin-top:2px;font-style:normal;font-size:11.5px;color:var(--t-ink2)}

/* 監督能力(→docs/10 §10.2 C) */
#club .mabs .mab{display:grid;grid-template-columns:1fr auto;gap:0 6px;width:100%;text-align:left;margin:4px 0;padding:7px 10px;background:var(--t-card);color:var(--t-ink);border:1px solid var(--t-rule);border-radius:4px;cursor:pointer}
#club .mabs .mab b{font-size:13px} #club .mabs .mab i{font-style:normal;font-family:"Oswald",sans-serif;font-size:12px;color:var(--t-gold)}
#club .mabs .mab small{grid-column:1/3;font-size:10.5px;color:var(--t-mute)}
#club .mabs .mab.on{border-color:var(--t-sub);box-shadow:inset 4px 0 0 var(--t-sub)}
</style>

<script>
// 起動の確認(tools/publish.py が見る): 起動中のエラーを html の data-boot に残す
window.addEventListener("error",e=>{ document.documentElement.dataset.boot="err: "+(e.message||"?"); });
</script>
<script>
"use strict";
/* =========================================================================
   wcc_f — データと数値
   確率・係数・閾値はすべて TUNING に置く(ロジックに直書きしない)。
   座標系は「自軍フレーム」: h = 0(自陣ゴール) 〜 1(敵陣ゴール) / x = 0〜100(左右)
   ========================================================================= */

const STAT_MAX=20;
const STATS=["off","def","tec","pow","spd","sta"];
// 能力の表記は本家に合わせた略号(→docs/06)
const STAT_LABEL={ off:"OFE", def:"DEF", tec:"TEC", pow:"POW", spd:"SPE", sta:"STA" };

const TUNING={
  // 判定の揺らぎ。攻守それぞれに独立して乗る(0.6〜1.4)
  rng:{ min:0.6, span:0.8 },
  // 時計。1ステップ = 1アクション。前後半それぞれ stepsPerHalf + アディショナル
  clock:{ stepsPerHalf:110, at1:[1,5], at2:[3,9] },
  // カードの位置 → 役割(→docs/02 §2.3)
  zone:{ dfH:0.36, fwH:0.68, wide:27, dmfH:0.47, omfH:0.58 },
  // 役割の適性。own=得意な役割 / group=同じポジション / near=隣 / far=DF↔FW / gk=GKとフィールドの取り違え
  apt:{ own:1.0, group:0.90, near:0.76, far:0.62, gk:0.35 },
  // 盤面でカードを置ける範囲
  board:{ minH:0.14, maxH:0.94, minX:5, maxX:95, gkH:0.05 },
  // GK(→docs/02 §2.3a)。ペナルティエリアの中だけ動かせる。

/**
 * カタカナ → ラテン文字(→docs/10 §3.54)。**頭の1音だけ**を引く。
 * クラブ名は日本語なので、そのまま盾に入れるとカタカナが窮屈に収まる。
 * 実在クラブの紋章にならって、**2文字のモノグラム**にする。
 */
const EMB_ROMA={
  ア:"A",イ:"I",ウ:"U",エ:"E",オ:"O",
  カ:"K",キ:"K",ク:"K",ケ:"K",コ:"K",ガ:"G",ギ:"G",グ:"G",ゲ:"G",ゴ:"G",
  サ:"S",シ:"S",ス:"S",セ:"S",ソ:"S",ザ:"Z",ジ:"J",ズ:"Z",ゼ:"Z",ゾ:"Z",
  タ:"T",チ:"C",ツ:"T",テ:"T",ト:"T",ダ:"D",ヂ:"D",ヅ:"D",デ:"D",ド:"D",
  ナ:"N",ニ:"N",ヌ:"N",ネ:"N",ノ:"N",
  ハ:"H",ヒ:"H",フ:"F",ヘ:"H",ホ:"H",バ:"B",ビ:"B",ブ:"B",ベ:"B",ボ:"B",
  パ:"P",ピ:"P",プ:"P",ペ:"P",ポ:"P",
  マ:"M",ミ:"M",ム:"M",メ:"M",モ:"M",
  ヤ:"Y",ユ:"Y",ヨ:"Y",
  ラ:"R",リ:"R",ル:"R",レ:"R",ロ:"R",
  ワ:"W",ヲ:"O",ン:"N",ヴ:"V",
};
/** 1文字ぶんのラテン。引けない字(長音・小書きなど)は null。 */
const embLetter=ch=>EMB_ROMA[ch]||null;
/**
 * 音節ぶんのローマ字(→docs/10 §3.54e)。EMB_ROMA は1文字＝1子音なので
 * 「バルサローナ」が BRS になり読めない。**綴りとして読める略号**を出すには
 * 音節ごとのローマ字が要る(ba+ru+sa → barusa → BAR)。
 */
const EMB_SYL={
  ア:"a",イ:"i",ウ:"u",エ:"e",オ:"o",
  カ:"ka",キ:"ki",ク:"ku",ケ:"ke",コ:"ko",ガ:"ga",ギ:"gi",グ:"gu",ゲ:"ge",ゴ:"go",
  サ:"sa",シ:"shi",ス:"su",セ:"se",ソ:"so",ザ:"za",ジ:"ji",ズ:"zu",ゼ:"ze",ゾ:"zo",
  タ:"ta",チ:"chi",ツ:"tsu",テ:"te",ト:"to",ダ:"da",ヂ:"ji",ヅ:"zu",デ:"de",ド:"do",
  ナ:"na",ニ:"ni",ヌ:"nu",ネ:"ne",ノ:"no",
  ハ:"ha",ヒ:"hi",フ:"fu",ヘ:"he",ホ:"ho",バ:"ba",ビ:"bi",ブ:"bu",ベ:"be",ボ:"bo",
  パ:"pa",ピ:"pi",プ:"pu",ペ:"pe",ポ:"po",
  マ:"ma",ミ:"mi",ム:"mu",メ:"me",モ:"mo",
  ヤ:"ya",ユ:"yu",ヨ:"yo",
  ラ:"ra",リ:"ri",ル:"ru",レ:"re",ロ:"ro",
  ワ:"wa",ヲ:"o",ン:"n",ヴ:"v",
};
// 小書き。**直前の音節の母音を差し替える**(キ+ャ → kya)
const EMB_SMALL={ ャ:"ya",ュ:"yu",ョ:"yo",ァ:"a",ィ:"i",ゥ:"u",ェ:"e",ォ:"o" };
/** カタカナの語を綴りに開く。長音(ー)と促音(ッ)は落とす。 */
function embRomaji(word){
  let out="";
  for(const ch of String(word||"")){
    const sm=EMB_SMALL[ch];
    if(sm){                                          // 拗音・外来音は前の音とくっつける
      out=out.replace(/[aiueo]$/,"")+sm;
      continue;
    }
    const sy=EMB_SYL[ch];
    if(sy){ out+=sy; continue; }
    if(/[A-Za-z]/.test(ch))out+=ch.toLowerCase();    // ラテン名がそのまま来た場合
    // ー(長音)・ッ(促音)・その他は落とす
  }
  return out;
}
/**
 * クラブの**3文字の略号**(→docs/10 §3.54e)。頭の語を綴りに開いて頭3文字を採る。
 * 「バルサローナ・ブラウグラナ」→ BAR ／「マドリード・ブランコス」→ MAD。
 *
 * ヘッダーの左は紋章＋この略号だけにする。正式名称(最大120px)を置くと
 * **画面の見出しが右へ押し出されて中央に来ない**(→docs/06)。
 * 同じ都市のクラブは同じ略号になりうるが、ヘッダーに出るのは自分のクラブだけなので
 * ここでは重ならないことより**読めること**を採る。
 */
function clubAbbr(name){
  const head=String(name||"").split(/[・\s]+/).filter(Boolean)[0]||"";
  const r=embRomaji(head).toUpperCase();
  if(r.length>=3)return r.slice(0,3);
  // 3文字に満たない短い語は、次の語から足す(「シティ・…」など)
  const all=embRomaji(String(name||"").replace(/[・\s]+/g,"")).toUpperCase();
  return (all.slice(0,3)||embMonogram(name)).padEnd(3,"C").slice(0,3);
}
/**
 * クラブ名のモノグラム。**「・」で区切られた語の頭**を1文字ずつ拾う。
 * 「マンチェスター・レッズ」→ MR。語が1つなら頭の2音から2文字取る。
 */
function embMonogram(name){
  const parts=String(name||"").split(/[・\s]+/).filter(Boolean);
  const out=[];
  for(const w of parts){
    for(const ch of w){ const c=embLetter(ch); if(c){ out.push(c); break; } }
    if(out.length>=2)break;
  }
  if(out.length<2&&parts.length){
    // 語が1つしかない。頭の2音から取る(「ロドリ」→ RD)
    for(const ch of parts[0]){ const c=embLetter(ch); if(c&&out.length<2)out.push(c); }
  }
  if(!out.length){                                   // ラテン名がそのまま来た場合
    const s=String(name||"").replace(/[^A-Za-z]/g,"");
    return (s.slice(0,2)||"FC").toUpperCase();
  }
  return out.slice(0,2).join("");
}

/**
 * 紋章(→docs/10 §3.54)。**紋章学の意匠に寄せる**。
 *
 * 丸みのある塊で描くと、どうしても可愛らしく子供っぽくなる。実在の紋章は
 *   ・輪郭が**角ばっていて、切り込みが深い**(羽・鬣・王冠の刻み)
 *   ・**内側の抜き**で立体を出す(目・口・面の割り)
 *   ・盾いっぱいに大きく置く
 * の3点で「本物らしさ」が決まる。曲線を減らし、直線と鋭角で組み直してある。
 */
/**
 * モノグラムの並べ方(→docs/10 §3.54c)。**横・縦・斜めの3通り**。
 * 紋章を持たないクラブは3分の2あるので、文字の置き方だけで顔が変わると効きが大きい。
 *
 * 縦と斜めは**1文字ずつ置く**。`<text>` に改行は無く、`textLength` で潰すと字が歪む。
 */
function embTextPath(lay,text,ink,edge){
  const t=String(text||"");
  const font=' font-family="Georgia,&apos;Times New Roman&apos;,serif" font-weight="700"'
    +' text-anchor="middle" fill="'+ink+'" stroke="'+edge+'"'
    +' stroke-width="5" paint-order="stroke"';
  const one=(ch,x,y,sz,rot)=>'<text x="'+x+'" y="'+y+'" font-size="'+sz+'"'
    +(rot?' transform="rotate('+rot+' '+x+' '+y+')"':"")+font+'>'+embEsc(ch)+'</text>';
  if(lay==="col")
    // 縦積み。**字を少し小さく**しないと、盾のすぼまりに肩が当たる
    return one(t[0]||"",50,45,34)+one(t[1]||"",50,81,34);
  if(lay==="diag")
    // 斜め。**たすき(sash)と同じ向き**に流すので、地の柄と喧嘩しない
    return one(t[0]||"",34,44,34,-30)+one(t[1]||"",66,74,34,-30);
  return '<text x="50" y="65" font-size="40" letter-spacing="-2"'+font+'>'+embEsc(t)+'</text>';
}
function embCrestPath(kind,ink,edge){
  const st=' fill="'+ink+'" stroke="'+edge+'" stroke-width="2.2" paint-order="stroke"';
  const cut=' fill="'+edge+'"';
  // **描いた意匠が先**(→docs/10 §3.54b)。生き物や兜のように輪郭で語る形は、
  // 手で座標を置くと必ずどこか可愛くなる。輪郭追跡したパスをそのまま使う。
  // ベクターなので**クラブの2色がそのまま乗る**。穴は evenodd に任せる
  const art=(typeof EMB_ART!=="undefined")&&EMB_ART[kind];
  if(art)return '<path fill-rule="evenodd" d="'+art+'"'+st+'/>';
  // ここから下は**幾何で組んだほうが綺麗なもの**。星や剣は直線と角度で決まるので、
  // 描いた絵を追跡するとかえって辺が揺れる
  switch(kind){
    // 星(マレット)。**5つの尖りを細長く**。太いと漫画の星になる
    case "star":  return '<path d="M50 16 L57.5 41 L84 41 L62.5 56.5 L70.5 82 L50 66.5'
                        +' L29.5 82 L37.5 56.5 L16 41 L42.5 41 Z"'+st+'/>';
    default:      return "";
  }
}
/**
 * 外装(→docs/10 §3.54)。**盾の外**に付ける。
 * 盾の中の紋章とは役割が違い、こちらは「格」を語る飾り。
 * 盾を縮めず、viewBox を外へ広げて描くので、付けても中身は小さくならない。
 */
const EMB_ORNS=["none","crown","laurel","ribbon","wreath"];
/** その外装がはみ出す量(上・下)。viewBox を広げるのに使う。 */
function embOrnPad(kind){
  switch(kind){
    case "crown":  return { t:58, b:0,  x:4 };
    case "ribbon": return { t:0,  b:30, x:12 };
    case "wreath": return { t:52, b:30, x:27 };
    default:       return { t:0,  b:0,  x:0 };
  }
}
function embOrnPath(kind,gold,dark){
  const st=' fill="'+gold+'" stroke="'+dark+'" stroke-width="2.2" paint-order="stroke"';
  const crown='<g transform="translate(15,-62) scale(0.7)">'
    +'<path fill-rule="evenodd" d="'+EMB_ART.crown+'" fill="'+gold+'"'
    +' stroke="'+dark+'" stroke-width="3.2" paint-order="stroke"/></g>';
  // 月桂樹。**葉を1枚ずつ置く**(束で描くと草の塊になる)
  const leaf=(cx,cy,rot,sc)=>'<path transform="translate('+cx+','+cy+') rotate('+rot+') scale('+sc+')"'
    +' d="M0 0 C6 -5 14 -4 17 2 C12 8 4 7 0 0 Z"'+st+'/>';
  /**
   * 月桂樹の枝。**中心(50,52)・半径44の円弧を素直になぞる**。
   * 以前は「縦線を中央でくぼませる」式で置いていたが、それは真ん中が一番内側に
   * 入る砂時計の形で、円のラインにならなかった。
   *
   * 葉の向きは**接線と外向き法線の中間**。φ を上からの角度とすると
   * 接線 = φ-180、法線 = φ-90 なので、葉 = φ-135 で出る。
   */
  const bough=side=>{
    const CX=50, CY=52, R=44, A0=32, A1=166, N=10;
    const rad=d=>d*Math.PI/180;
    const P=phi=>[CX+side*R*Math.sin(rad(phi)), CY-R*Math.cos(rad(phi))];
    let stem="M";
    for(let i=0;i<=16;i++){
      const q=P(A0+(A1-A0)*i/16);
      stem+=(i?" L":"")+q[0].toFixed(1)+" "+q[1].toFixed(1);
    }
    let g='<path d="'+stem+'" fill="none" stroke="'+gold+'" stroke-width="4.4"'
         +' stroke-linecap="round"/>'
         +'<path d="'+stem+'" fill="none" stroke="'+dark+'" stroke-width="1.4"'
         +' stroke-linecap="round"/>';
    for(let i=0;i<N;i++){
      const t=i/(N-1), phi=A0+(A1-A0)*t, q=P(phi);
      const sc=0.94-Math.abs(t-0.5)*0.42;
      const r0=phi-135;                       // 外側(大きい葉)
      // 左側は鏡像。葉のもとの形が +x を向いているので 180 から引く
      g+=leaf(q[0],q[1], side>0?r0:(180-r0), sc);
      g+=leaf(q[0],q[1], side>0?(r0-30):(210-r0), sc*0.7);
    }
    return g;
  };
  switch(kind){
    // **盾の中と同じ意匠を縮めて載せる**(→docs/10 §3.54b)。
    // 別に描くと、紋章の王冠と外装の王冠が食い違う
    case "crown": return '<g transform="translate(10,-70) scale(0.8)">'
                        +'<path fill-rule="evenodd" d="'+EMB_ART.crown+'" fill="'+gold+'"'
                        +' stroke="'+dark+'" stroke-width="3" paint-order="stroke"/></g>';
    case "laurel": return bough(-1)+bough(1);
    case "ribbon": return ""
      // 折り返した端(奥に回る面)。**先に暗い面を敷く**と紙が巻いて見える
      +'<path d="M4 96 L22 100 L22 116 L12 122 L16 112 L2 110 Z" fill="'+dark+'"/>'
      +'<path d="M96 96 L78 100 L78 116 L88 122 L84 112 L98 110 Z" fill="'+dark+'"/>'
      // 本体。中央がたわむ帯
      +'<path d="M22 98 Q50 112 78 98 L78 116 Q50 130 22 116 Z"'+st+'/>'
      +'<path d="M22 98 V116" stroke="'+dark+'" stroke-width="2" fill="none"/>'
      +'<path d="M78 98 V116" stroke="'+dark+'" stroke-width="2" fill="none"/>';
    case "wreath": return bough(-1)+bough(1)+crown
      +'<path d="M10 98 L26 102 L26 116 L16 122 L20 112 L8 110 Z" fill="'+dark+'"/>'
      +'<path d="M90 98 L74 102 L74 116 L84 122 L80 112 L92 110 Z" fill="'+dark+'"/>'
      +'<path d="M26 100 Q50 112 74 100 L74 116 Q50 128 26 116 Z"'+st+'/>';
    default:       return "";
  }
}
/** 地の柄。2色目(b)で描く。 */
function embFieldPath(kind,b){
  switch(kind){
    case "stripe": return [22,44,66].map(x=>'<rect x="'+x+'" y="0" width="11" height="100" fill="'+b+'"/>').join("");
    case "half":   return '<rect x="50" y="0" width="50" height="100" fill="'+b+'"/>';
    case "quarter":return '<rect x="50" y="0" width="50" height="50" fill="'+b+'"/>'
                         +'<rect x="0" y="50" width="50" height="50" fill="'+b+'"/>';
    case "sash":   return '<path d="M0 78 L78 0 H100 L0 100 Z" fill="'+b+'"/>';
    case "hoop":   return '<rect x="0" y="30" width="100" height="16" fill="'+b+'"/>'
                         +'<rect x="0" y="60" width="100" height="16" fill="'+b+'"/>';
    case "chevron":return '<path d="M0 42 L50 14 L100 42 V62 L50 34 L0 62 Z" fill="'+b+'"/>';
    // 十字。**縦を少し細く**しないと、盾の中で横棒だけが目立つ
    case "cross":  return '<rect x="39" y="0" width="22" height="100" fill="'+b+'"/>'
                         +'<rect x="0" y="36" width="100" height="22" fill="'+b+'"/>';
    // ななめ十字(セント・アンドリュー)。盾の外まで伸ばして端で断つ
    case "saltire":return '<path d="M-10 6 L6 -10 L110 94 L94 110 Z" fill="'+b+'"/>'
                         +'<path d="M94 -10 L110 6 L6 110 L-10 94 Z" fill="'+b+'"/>';
    default:       return "";
  }
}

/**
 * そのクラブの意匠(→docs/10 §3.54)。**IDから決まる**ので毎回同じ顔になる。
 * 自分のクラブに `S.club.emblem` があればそれを優先する(CLUB画面で組み替えた形)。
 */
function embDesign(clubId,name,mine,color){
  // mine … 自分で組み替えた形(無ければ id と名前から決める)/ color … クラブの色(#rrggbb。名前が色を名乗っていなければ地の色にする)
  // **符号なしでずらす**。hashStr は 32bit いっぱいを返すので、`>>` だと
  // 負になって配列の外(undefined)を引く。実際に地の柄が消えた
  const h=hashStr("emb:"+clubId);
  const w=embWordOf(name);                           // 名前が名乗っている顔(→§3.54d)
  const d={
    shape:EMB_SHAPES[h%EMB_SHAPES.length],
    field:EMB_FIELDS[(h>>>5)%EMB_FIELDS.length],
    // **既定は文字**。紋章は3回に1回くらい出る(全部が紋章だと名前が読めない)。
    // ただし**名前が紋章を名乗っていれば必ずそれを出す**(→§3.54d)
    // 紋章は3段階(→§3.54d)。
    //   語が意匠を名乗る    → それを出す(レオン → 獅子)
    //   語が別の生き物を名乗る → **何も出さない**("" 印。カナリーズに獅子は付けない)
    //   どちらでもない      → 3回に1回くらいハッシュで出す
    crest:(w&&w[3])?w[3]
      :(w&&w[3]==="")?"none"
      :((h>>>9)%3===0)?EMB_CRESTS[1+((h>>>11)%(EMB_CRESTS.length-1))]:"none",
    // 外装も3回に1回くらい。**全部に王冠を載せると格が語れなくなる**
    orn:((h>>>15)%3===0)?EMB_ORNS[1+((h>>>17)%(EMB_ORNS.length-1))]:"none",
    // 文字の並べ方(→§3.54c)。横・縦・斜めの3通り
    lay:EMB_LAYS[(h>>>21)%EMB_LAYS.length],
    text:embMonogram(name),
    // **色も名前から引く**(→§3.54d)。名乗っていなければサッカーで使う13色から、
    // クラブIDで決まる1色を当てる(並び順ではないので、クラブを足してもずれない)
    home:(w&&w[1])||color||EMB_CLASSIC[(h>>>25)%EMB_CLASSIC.length],
  };
  d.away=(w&&w[2])||embMate(d.home);
  const out=mine?{ ...d, ...mine, text:mine.text||d.text }:d;
  // **一覧から消えた指定は既定へ戻す**(→§3.54c)。紋章を廃止したとき、
  // 昔の保存が指したままだと、紋章も文字も出ない空の盾になる
  if(!EMB_CRESTS.includes(out.crest))out.crest=d.crest;
  if(!EMB_ORNS.includes(out.orn))out.orn=d.orn;
  if(!EMB_LAYS.includes(out.lay))out.lay=d.lay;
  return out;
}

/**
 * ★(→docs/10 §3.54)。**ワールドクラブチャンピオンカップを獲った数**。
 * 3つで打ち止め。エンブレムの上に載る。
 */
function embStars(){ return 0; }                    // wcc_f では★を出さない

/**
 * エンブレムのSVG。**画像を持たない**ので、どの大きさでも輪郭が出る。
 *   size … 一辺のピクセル
 *   opts.stars … ★を出すか(既定は出す)
 * 色は clubHue と同じ色相から取る(→docs/06 §6.13 の色の決まりに合わせる)。
 */
function embSvg(clubId,name,size,opts){
  const o=opts||{};
  const d=embDesign(clubId,name,o.design||null,o.color||null);
  const i=-1;
  const h2=hashStr("emb2:"+clubId);
  // **選んだ色があればそれを使う**(ホーム=地 / アウェイ=柄 →docs/10 §3.54)
  const ph=embHueById(d.home), pa=embHueById(d.away);
  const hue=ph&&ph.h!=null?ph.h:(i>=0?((i*137.5+20)%360):(hashStr("hue:"+clubId)%360));
  const hue2=pa&&pa.h!=null?pa.h:(hue+((h2%2)?150:40))%360;
  // 選んだ色は hex をそのまま使い、選んでいなければ色相から作る
  const a=ph?ph.hex:"oklch(0.72 0.22 "+hue.toFixed(1)+")";
  const b=pa?pa.hex:"oklch(0.38 0.14 "+hue2.toFixed(1)+")";
  // **地が明るいときは字を暗く**。レモンや白の上に白字を置くと消える
  const la=ph?embLum(ph.hex):0.62;
  const ink=la>=0.62?"#1A1A1E":"#FFFFFF";
  const rim=ph?embShade(ph.hex,la>=0.62?0.55:1.35):"oklch(0.93 0.06 "+hue.toFixed(1)+")";
  const path=EMB_PATH[d.shape]||EMB_PATH.shield;
  // **idはクラブごとに変える**。同じ画面に2つ出したとき clipPath がぶつかる
  const cid="ec"+String(clubId).replace(/[^A-Za-z0-9]/g,"")+(o.tag||"");
  const stars=o.stars===false?0:embStars(clubId);
  // ★も外装も**盾の外へ足す**。盾を縮めないので、付いた瞬間に中身が小さくならない
  const orn=(d.orn&&d.orn!=="none")?d.orn:null;
  const op=embOrnPad(orn);
  const top=(stars?18:0)+op.t, bot=op.b, side=op.x;
  const vb=(-side)+" "+(-top)+" "+(100+side*2)+" "+(100+top+bot);
  const gold="oklch(0.82 0.14 88)", dark="oklch(0.34 0.08 78)";
  const starRow=!stars?"":'<g>'+Array.from({length:stars},(_,k)=>{
      const x=50+(k-(stars-1)/2)*20;
      return '<path class="emb-star" transform="translate('+x+',-9) scale(0.34)" '
        +'d="M0 -22 L6.5 -7 L23 -7 L10 3 L15 19 L0 9 L-15 19 L-10 3 L-23 -7 L-6.5 -7 Z" '
        +'fill="oklch(0.88 0.16 92)" stroke="oklch(0.42 0.10 80)" stroke-width="4" '
        +'paint-order="stroke"/>';
    }).join("")+'</g>';
  return '<svg class="emb-svg" viewBox="'+vb+'" width="'+size+'" height="'+size+'" '
    +'role="img" aria-label="'+embEsc(name||"")+'">'
    +'<defs><clipPath id="'+cid+'"><path d="'+path+'"/></clipPath></defs>'
    // 月桂冠は**盾の後ろ**に回す(前に出すと盾の柄が隠れる)
    +(orn==="laurel"||orn==="wreath"?embOrnPath(orn==="wreath"?"laurel":"laurel",gold,dark):"")
    +'<g clip-path="url(#'+cid+')"><rect x="0" y="0" width="100" height="100" fill="'+a+'"/>'
    +embFieldPath(d.field,b)+'</g>'
    +'<path d="'+path+'" fill="none" stroke="'+rim+'" stroke-width="4"/>'
    +(d.crest&&d.crest!=="none"
      ? embCrestPath(d.crest,ink,b)
      : embTextPath(d.lay,d.text,ink,b))
    // 王冠とリボンは**盾の前**(重なっても手前に出す)
    +(orn==="crown"?embOrnPath("crown",gold,dark)
      :orn==="ribbon"?embOrnPath("ribbon",gold,dark)
      :orn==="wreath"?embOrnPath("crown",gold,dark)
        +embOrnPath("ribbon",gold,dark):"")
    +starRow
  +'</svg>';
}

/* =========================================================================
   wcc_f — 試合映像(上のモニター)。エンジンが解いた結果を読むだけで、何も書き戻さない。
   画面座標は u(0=左のゴール 〜 1=右のゴール) / v(0=奥のタッチライン 〜 1=手前)。ホームは右へ攻める。
   見え方(→docs/07 §7.11): テレビ中継のように**斜め上の横から見た立体**。奥ほど狭く小さい(遠近)。
   選手は紙の板が地面に立つように描き(ペーパークラフト風)、足元に影。奥から順に描くので手前の選手が重なる。
   奥にはスタンドと観客(高さはスタジアムの段 →club.js の S.biz.stad)。
   ========================================================================= */

const RV={ cv:null, ctx:null, w:0, h:0, vis:new Map(), ball:[0.5,0.5], lift:0, crowd:null, bg:null, bgKey:"" };

const scrOf=(side,h,x)=>side==="H"?[h,x/100]:[1-h,1-x/100];
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function initView(){
  RV.cv=document.getElementById("view");
  RV.ctx=RV.cv.getContext("2d");
  resizeView();
  window.addEventListener("resize",resizeView);
}
function resizeView(){
  const r=RV.cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,3);
  RV.w=r.width; RV.h=r.height;
  RV.cv.width=Math.round(r.width*dpr); RV.cv.height=Math.round(r.height*dpr);
  RV.ctx.setTransform(dpr,0,0,dpr,0,0);
  RV.crowd=null;                               // 観客の点は大きさが変わったら作り直す
}
/* ---- 遠近(数値は TUNING.view)---- */
/** 奥行き v(0〜1)での縮み(奥のタッチラインで far、手前で 1) */
function depthS(v){ const f=TUNING.view.far; return 1/(1+(1-v)*(1/f-1)); }
/** 地面の点 (u,v) → 画面 [x, y, 縮み] */
function proj(u,v){
  const V=TUNING.view, s=depthS(v), W=RV.w, H=RV.h;
  const yFar=H*V.farY, yNear=H*V.nearY;
  return [W/2+(u-0.5)*W*V.nearW*s, yFar+(s-V.far)/(1-V.far)*(yNear-yFar), s];
}
const pxOf=(u,v)=>{ const p=proj(u,v); return [p[0],p[1]]; };
function quad(c,pts){ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); }
function gline(c,a,b){ const p=proj(a[0],a[1]), q=proj(b[0],b[1]); c.beginPath(); c.moveTo(p[0],p[1]); c.lineTo(q[0],q[1]); c.stroke(); }
function grect(c,u0,v0,u1,v1){ quad(c,[proj(u0,v0),proj(u1,v0),proj(u1,v1),proj(u0,v1)]); c.stroke(); }

/** 奥のスタンドと観客。段が上がるほど高く、屋根が付く */
function drawStands(c,W,H){
  const V=TUNING.view, lv=(typeof CL!=="undefined"&&CL.S&&CL.S.biz)?CL.S.biz.stad:1;
  const yFar=H*V.farY, top=Math.max(2,yFar-H*V.standH[lv-1]);
  const sky=c.createLinearGradient(0,0,0,yFar); sky.addColorStop(0,"#16233d"); sky.addColorStop(1,"#2c3f63");
  c.fillStyle=sky; c.fillRect(0,0,W,yFar);
  c.fillStyle="#3a2430"; c.fillRect(0,top,W,yFar-top);
  // 観客の点(毎回同じ並び)
  if(!RV.crowd||RV.crowd.lv!==lv){
    const r=mulberry32(77+lv), pts=[];
    for(let i=0;i<Math.floor(W*(yFar-top)/14);i++)pts.push([r()*W,top+r()*(yFar-top-3),r()]);
    RV.crowd={ lv, pts };
  }
  for(const [x,y,k] of RV.crowd.pts){ c.fillStyle=k<0.33?"#c8102e":k<0.66?"#e9e2d0":"#5a6a8a"; c.fillRect(x,y,1.6,1.6); }
  // 段の境目と屋根
  c.fillStyle="rgba(0,0,0,.35)"; for(let y=top+6;y<yFar;y+=7)c.fillRect(0,y,W,1);
  if(lv>=5){ c.fillStyle="#9aa4b2"; c.fillRect(0,top-4,W,4); }
  // 広告の看板
  c.fillStyle="#0b0f1a"; c.fillRect(0,yFar-5,W,5);
  c.fillStyle="#ffe28a"; c.font="700 "+Math.max(6,H*0.03)+"px system-ui,sans-serif"; c.textAlign="center"; c.textBaseline="middle";
  const sp=(typeof CL!=="undefined"&&CL.S&&CL.S.biz&&CL.S.biz.sp)?CL.S.biz.sp.name:"wcc_f";
  for(let i=0;i<4;i++)c.fillText(sp,W*(0.125+i*0.25),yFar-2.5);
}
/** 芝・ライン・スタンドは変わらないので、裏のキャンバスに描いておき毎フレーム貼るだけにする(大きさ・スタジアム・スポンサーが変わったら描き直す) */
function drawPitch(){
  const W=RV.w, H=RV.h, dpr=RV.cv.width/W;
  const lv=(typeof CL!=="undefined"&&CL.S&&CL.S.biz)?CL.S.biz.stad:1, sp=(typeof CL!=="undefined"&&CL.S&&CL.S.biz&&CL.S.biz.sp)?CL.S.biz.sp.name:"";
  const key=RV.cv.width+"x"+RV.cv.height+":"+lv+":"+sp;
  if(RV.bgKey!==key){
    const off=RV.bg||(RV.bg=document.createElement("canvas"));
    off.width=RV.cv.width; off.height=RV.cv.height;
    const oc=off.getContext("2d"); oc.setTransform(dpr,0,0,dpr,0,0);
    drawPitchTo(oc,W,H); RV.bgKey=key;
  }
  RV.ctx.save(); RV.ctx.setTransform(1,0,0,1,0,0); RV.ctx.drawImage(RV.bg,0,0); RV.ctx.restore();
}
function drawPitchTo(c,W,H){
  // 毎回、画面全体を塗り直す(遠近で芝が届かない左右の外側に、前の場面のボールや選手が残らないように)
  c.fillStyle="#17603a"; c.fillRect(0,0,W,H);
  drawStands(c,W,H);
  // 芝(縦の縞を遠近つきで)
  const ext=0.03;
  for(let i=0;i<10;i++){
    const u0=-ext+i*(1+2*ext)/10, u1=u0+(1+2*ext)/10;
    c.fillStyle=i%2?"#1b6e3c":"#1f7a43";
    quad(c,[proj(u0,-0.04),proj(u1,-0.04),proj(u1,1.06),proj(u0,1.06)]); c.fill();
  }
  c.strokeStyle="rgba(255,255,255,.7)"; c.lineWidth=1.4;
  grect(c,0,0,1,1);
  gline(c,[0.5,0],[0.5,1]);
  // センターサークル
  c.beginPath();
  for(let i=0;i<=36;i++){ const a=i/36*Math.PI*2, p=proj(0.5+Math.cos(a)*0.087,0.5+Math.sin(a)*0.135); i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); }
  c.stroke();
  const bx=1-TUNING.rule.boxH, bw=TUNING.rule.boxX*2/100;
  grect(c,0,0.5-bw/2,bx,0.5+bw/2); grect(c,1-bx,0.5-bw/2,1,0.5+bw/2);
  grect(c,0,0.5-0.135,0.052,0.5+0.135); grect(c,1-0.052,0.5-0.135,1,0.5+0.135);
}
/** ゴール(枠に高さを付ける)。奥の柱から描く */
function drawGoal(c,u){
  const gh=TUNING.view.goalH, d=u<0.5?-0.025:0.025;
  const a=proj(u,0.445), b=proj(u,0.555), a2=proj(u+d,0.445), b2=proj(u+d,0.555);
  c.fillStyle="rgba(255,255,255,.18)";
  quad(c,[[a2[0],a2[1]-gh*a2[2]*RV.h],[b2[0],b2[1]-gh*b2[2]*RV.h],[b2[0],b2[1]],[a2[0],a2[1]]]); c.fill();
  c.strokeStyle="#fff"; c.lineWidth=2;
  c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(a[0],a[1]-gh*a[2]*RV.h); c.lineTo(b[0],b[1]-gh*b[2]*RV.h); c.lineTo(b[0],b[1]); c.stroke();
}

/** いま映すべき場面を G(main.js の状態)から組み立てて描く */
function drawFrame(G,dt){
  const c=RV.ctx, M=G.M;
  if(!M||!RV.w)return;
  drawPitch();

  // ---- ボールの位置 ----
  const ev=G.cur;
  const pin=new Map();                       // この場面で位置が決まっている選手
  let target, lift=0, holderId=null;
  if(ev&&ev.from){
    const t=ease(clamp(G.curT/ev.dur,0,1));
    const a=scrOf(ev.side,ev.from[0],ev.from[1]), b=scrOf(ev.side,ev.dest[0],ev.dest[1]);
    target=[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
    RV.ball=target;
    const far=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(ev.type==="pass"||ev.type==="shot"||ev.type==="cross"||ev.type==="offside")lift=Math.sin(Math.PI*t)*far*0.9;
    if(ev.type==="carry"||ev.type==="kickoff"){ pin.set(ev.by,target); holderId=ev.by; }
    else{
      pin.set(ev.by,a);
      if(ev.to&&ev.ok)pin.set(ev.to,b);
    }
    if(ev.vs){                               // 競った相手は競った場所へ寄る
      const cpt=ev.type==="pass"||ev.type==="cross"?b:a;
      pin.set(ev.vs,[lerp(cpt[0],target[0],0.3)+(ev.side==="H"?0.022:-0.022),cpt[1]]);
    }
  }else if(M.ball){
    target=scrOf(M.ball.side,M.ball.h,M.ball.x);
    const k=1-Math.exp(-dt/90);
    RV.ball=[lerp(RV.ball[0],target[0],k),lerp(RV.ball[1],target[1],k)];
    holderId=M.ball.holder.id;
    pin.set(holderId,RV.ball);
  }else{
    const k=1-Math.exp(-dt/200);
    RV.ball=[lerp(RV.ball[0],0.5,k),lerp(RV.ball[1],0.5,k)];
  }

  // ---- 選手の位置(見た目だけ、ゆっくり追う) ----
  const k=1-Math.exp(-dt/170), seen=new Set(), list=[];
  for(const T of [M.home,M.away]){
    const bu=RV.ball[0], bh=T.side==="H"?bu:1-bu;
    const bx=(T.side==="H"?RV.ball[1]:1-RV.ball[1])*100;
    for(const p of T.players){
      seen.add(p.id);
      let goal=pin.get(p.id);
      if(!goal)goal=scrOf(T.side,blockH(p,bh),p.gk?p.x:p.x+(bx-p.x)*0.14);
      let v=RV.vis.get(p.id);
      if(!v){ v=goal.slice(); RV.vis.set(p.id,v); }
      v[0]=lerp(v[0],goal[0],k); v[1]=lerp(v[1],goal[1],k);
      list.push({ p, T, u:v[0], v:v[1] });
    }
  }
  for(const id of RV.vis.keys())if(!seen.has(id))RV.vis.delete(id);

  // ---- 奥から順に: ゴール・選手・ボール ----
  const V=TUNING.view, unit=RV.h*V.manH;    // 手前での選手の高さ
  const items=list.map(o=>({ v:o.v, draw:()=>drawMan(c,o,unit,holderId) }));
  items.push({ v:RV.ball[1]+0.001, draw:()=>drawBall(c,unit,lift) });
  items.push({ v:0.5, draw:()=>{ drawGoal(c,0); drawGoal(c,1); } });
  items.sort((a,b)=>a.v-b.v).forEach(o=>o.draw());
}
/** 選手 = 地面に立つ紙の板(チームの色・背番号)。縁に厚み、足元に影 */
function drawMan(c,o,unit,holderId){
  const { p, T }=o, [x,y,s]=proj(o.u,o.v), h=unit*s, w=h*0.62;
  c.fillStyle="rgba(0,0,0,.28)"; c.beginPath(); c.ellipse(x+w*0.18,y,w*0.62,h*0.12,0,0,Math.PI*2); c.fill();
  const col=p.gk?"#d9a521":T.color, top=y-h;
  // 厚み(右の縁を暗く)→ 表の板
  c.fillStyle="rgba(0,0,0,.45)"; c.fillRect(x-w/2+1.5,top+1,w,h);
  c.fillStyle=col; c.fillRect(x-w/2,top,w,h);
  c.fillStyle="rgba(255,255,255,.18)"; c.fillRect(x-w/2,top,w,h*0.22);  // 肩の光
  c.lineWidth=p.id===holderId?2.2:1;
  c.strokeStyle=p.id===holderId?"#f2c14e":"rgba(255,255,255,.9)"; c.strokeRect(x-w/2,top,w,h);
  c.fillStyle="#fff"; c.font="800 "+Math.max(7,Math.round(h*0.5))+"px system-ui,sans-serif";
  c.textAlign="center"; c.textBaseline="middle"; c.fillText(p.c.no,x,top+h*0.55);
  if(p.kp){ c.fillStyle="#f2c14e"; c.font="900 "+Math.round(h*0.45)+"px system-ui,sans-serif"; c.fillText("★",x+w*0.55,top-h*0.05); }
  if(p.stam<TUNING.stam.tiredAt){ c.fillStyle="#ff7a6b"; c.fillRect(x-w/2,y+2,w*p.stam/TUNING.stam.tiredAt,2); }
  if(p.yc){ c.fillStyle="#ffd84a"; c.fillRect(x-w/2-w*0.35,top,w*0.28,h*0.36); }
  if(p.inj){ c.fillStyle="#c8102e"; c.fillRect(x+w/2-w*0.3,top-w*0.3,w*0.3,w*0.3); }
}
/** ボール。影は地面に、球は浮いた高さに */
function drawBall(c,unit,lift){
  const [x,y,s]=proj(RV.ball[0],RV.ball[1]), r=Math.max(2.2,unit*0.16*s), up=lift*RV.h*0.6*s;
  c.fillStyle="rgba(0,0,0,.35)"; c.beginPath(); c.ellipse(x,y,r*1.1,r*0.45,0,0,Math.PI*2); c.fill();
  c.fillStyle="#fff"; c.beginPath(); c.arc(x,y-r-up,r,0,Math.PI*2); c.fill();
  c.lineWidth=0.8; c.strokeStyle="#222"; c.stroke();
}

/* =========================================================================
   wcc_f — カード盤面(下半分)。筐体のフラットパネルにあたる。
   カードを動かすと orderMatch に積まれ、次のステップから試合に効く。
   盤面は筐体と同じ縦向き(下=自陣ゴール / 上=敵陣ゴール。左サイドが左)。映像(モニター)は横向きのまま。
   **長押しでカードの裏(詳細)が盤面の上に開く**。タップは KP を選ぶときだけ使う。
   動かしているカードは指の少し上に出す(指で隠れないように)。
   ========================================================================= */

const BD={ cards:null, bench:null, board:null, map:new Map(), drag:null, pendingIn:new Set(), kp:null };
const TAP_PX=7;                              // これ未満の動きはタップとみなす
const LONG_MS=420;                           // これだけ動かさずに押していたら長押し
const LIFT_PX=34;                            // ドラッグ中、カードを指より上に出す量

// 盤面の % 座標 [左, 上]。端のカードが切れないよう内側に寄せる(SQUAD の盤面と同じ考え方 →clubui.js sqPos)
const bdPos=(h,x)=>[9+x*0.82, 93-h*86];
function bdInv(cx,cy){
  const r=BD.board.getBoundingClientRect();
  return { x:((cx-r.left)/r.width*100-9)/0.82, h:(93-(cy-r.top)/r.height*100)/86 };
}
const aptClass=a=>a>=TUNING.apt.own?"a0":a>=TUNING.apt.group?"a1":"a2";

function mkCard(card){
  const el=document.createElement("div");
  el.className="cd "+card.pos.toLowerCase();
  el.dataset.id=card.id;
  el.innerHTML='<i class="rl">'+card.pos+'</i><i class="no">'+card.no+'</i>'+
    '<u class="nm">'+nameOf(card)+'</u><s class="stm"><em style="width:100%"></em></s>'+
    '<b class="kpm">KP</b><b class="ycm"></b>'+
    (card.gs?'<b class="gsm'+(card.gs>=5?' aw':'')+'">★'+card.gs+'</b>':'')+(card.gm!=null?'<b class="mtm m'+card.gm+'"></b>':'');
  return el;
}

function initBoard(){
  BD.board=document.getElementById("board");
  BD.cards=document.getElementById("cards");
  BD.bench=document.getElementById("bench");
  // ペナルティエリアを判定と同じ値から引く(自陣 h≦1-boxH / 敵陣 h≧boxH / 左右は中央 ±boxX)
  const O=TUNING.rule, lf=bdPos(0,50-O.boxX)[0], rt=100-bdPos(0,50+O.boxX)[0];
  const depth=100-bdPos(1-O.boxH,0)[1];       // 自陣のエリアの奥行き(下の端から)
  for(const id of ["paOwn","paOpp"]){
    const el=document.getElementById(id);
    el.style.left=lf+"%"; el.style.right=rt+"%";
    el.style.height="calc("+depth+"% - 6px)";
  }
  fitBoard();
  window.addEventListener("resize",fitBoard);
}

/** 画面の大きさに合わせて、盤面と控えのカードの倍率(--k)を決める。盤面の高さが基準より低いほど小さく */
function fitBoard(){
  const P=TUNING.play, deck=document.getElementById("deck");
  if(!BD.board||!deck)return;
  const dh=deck.clientHeight, dw=deck.clientWidth; if(!dh||!dw)return;
  // ピッチは縦長の比率を保つ(筐体の盤面と同じ)。幅が余れば、控えの列と合わせて中央に寄せる
  const bw=BD.bench?BD.bench.offsetWidth:52, w=Math.min(dw-bw,Math.round(dh*P.boardAspect));
  BD.board.style.flex="0 0 "+w+"px";
  const k=clamp(Math.min(dh/P.cardRef,w/(P.cardRef*P.boardAspect)),P.cardMin,P.cardMax);
  deck.style.setProperty("--k",k.toFixed(3));
}
function buildBoard(M){
  BD.cards.textContent=""; BD.bench.textContent=""; BD.map.clear(); BD.drag=null;
  for(const p of M.home.players){
    const el=mkCard(p.c);
    bindFieldDrag(el,p.id,p.gk);
    BD.cards.appendChild(el); BD.map.set(p.id,el);
  }
  const lbl=document.createElement("span"); lbl.className="lbl"; lbl.textContent="控え";
  BD.bench.appendChild(lbl);
  for(const card of M.home.bench){
    const el=mkCard(card);
    el.querySelector(".stm").remove();
    if(BD.pendingIn.has(card.id))el.classList.add("used");
    bindBenchDrag(el,card.id);
    BD.bench.appendChild(el);
  }
  syncBoard(M);
  fitBoard();
}

/** 連携の線を引き直す。段が高いほど太く、金色に近い */
function drawLinks(M){
  const svg=document.getElementById("links"), NS="http://www.w3.org/2000/svg";
  svg.textContent="";
  const at=id=>{ const el=BD.map.get(id); return el?[parseFloat(el.style.left),parseFloat(el.style.top)]:null; };
  for(const l of M.home.links){
    const a=at(l[0]), b=at(l[1]);
    if(!a||!b)continue;
    const ln=document.createElementNS(NS,"line");
    ln.setAttribute("x1",a[0]+"%"); ln.setAttribute("y1",a[1]+"%");
    ln.setAttribute("x2",b[0]+"%"); ln.setAttribute("y2",b[1]+"%");
    ln.setAttribute("class","lk lk"+l[2]);
    svg.appendChild(ln);
  }
}
function setCardLook(el,role,apt){
  const rl=el.firstChild;
  rl.textContent=role; rl.className="rl "+aptClass(apt);
}
function syncBoard(M){
  const hold=M.ball&&M.ball.side==="H"?M.ball.holder.id:null;
  const kp=BD.kp||M.home.kp;
  for(const p of M.home.players){
    const el=BD.map.get(p.id);
    if(!el)continue;
    if(!(BD.drag&&BD.drag.id===p.id&&!BD.drag.bench)){
      const [l,t]=bdPos(p.h,p.x);
      el.style.left=l+"%"; el.style.top=t+"%";
      setCardLook(el,p.role,p.apt);
    }
    const em=el.querySelector(".stm em");
    em.style.width=Math.round(p.stam*100)+"%";
    em.className=p.stam<TUNING.stam.tiredAt?"low":p.stam<0.6?"midv":"";
    el.classList.toggle("tired",p.stam<TUNING.stam.tiredAt);
    el.classList.toggle("hasball",p.id===hold);
    el.classList.toggle("iskp",p.id===kp);
    el.classList.toggle("booked",p.yc>0);
    el.classList.toggle("inj",!!p.inj);
  }
  drawLinks(M);
}

/* ---- 盤面のカードを動かす ---- */
function bindFieldDrag(el,id,gk){
  el.addEventListener("pointerdown",e=>{
    if(BD.drag)return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const d=BD.drag={ id, el, pid:e.pointerId, x0:e.clientX, y0:e.clientY, moved:false, long:false };
    d.timer=setTimeout(()=>{ if(BD.drag===d&&!d.moved){ d.long=true; el.classList.remove("drag"); showInfo(id); } },LONG_MS);
    el.classList.add("drag");
  });
  el.addEventListener("pointermove",e=>{
    const d=BD.drag;
    if(!d||d.id!==id||d.pid!==e.pointerId||d.bench||d.long)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<TAP_PX)return;
    if(!d.moved){ d.moved=true; clearTimeout(d.timer); hideInfo(); }
    const raw=bdInv(e.clientX,e.clientY-LIFT_PX), q=clampPos(gk,raw.h,raw.x), h=q.h, x=q.x;
    const [l,t]=bdPos(h,x);
    el.style.left=l+"%"; el.style.top=t+"%";
    const role=gk?"GK":roleAt(h,x);
    setCardLook(el,role,aptOf(CARDS[id],role));
    drawLinks(G.M);
    orderMatch(G.M,"H",{ type:"move", id, h, x });
  });
  const end=e=>{
    const d=BD.drag;
    if(!d||d.id!==id||d.pid!==e.pointerId)return;
    clearTimeout(d.timer);
    el.classList.remove("drag"); BD.drag=null;
    if(!d.moved&&!d.long&&e.type==="pointerup")tapCard(id);
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}

/* ---- 控えを盤面のカードに重ねて交代 ---- */
function fieldCardAt(cx,cy,except){
  for(const n of document.elementsFromPoint(cx,cy)){
    if(n===except)continue;
    const c=n.closest&&n.closest("#cards .cd");
    if(c)return c;
  }
  return null;
}
function bindBenchDrag(el,id){
  const ghostAt=(g,cx,cy)=>{ g.style.left=cx+"px"; g.style.top=(cy-LIFT_PX)+"px"; };
  el.addEventListener("pointerdown",e=>{
    if(BD.drag)return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const can=!G.M.over&&!BD.pendingIn.has(id)&&G.M.home.subs+BD.pendingIn.size<TUNING.squad.subMax;
    const d=BD.drag={ id, el, pid:e.pointerId, bench:true, x0:e.clientX, y0:e.clientY, over:null, moved:false, can, long:false, ghost:null };
    d.timer=setTimeout(()=>{ if(BD.drag===d&&!d.moved){ d.long=true; showInfo(id); } },LONG_MS);
  });
  el.addEventListener("pointermove",e=>{
    const d=BD.drag;
    if(!d||d.id!==id||d.pid!==e.pointerId||d.long)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<TAP_PX)return;
    if(!d.moved){
      d.moved=true; clearTimeout(d.timer); hideInfo();
      if(!d.can){ say(G.M.home.subs+BD.pendingIn.size>=TUNING.squad.subMax?"交代はもう使い切った":"この選手は交代できない"); return; }
      // 盤面の上を自由に動けるよう、控えの列の外(画面の一番上)に浮かせる
      d.ghost=el.cloneNode(true); d.ghost.className=el.className+" ghost"; document.body.appendChild(d.ghost);
      el.classList.add("lifted");
      document.getElementById("board").classList.add("subbing");
    }
    if(!d.can||!d.ghost)return;
    ghostAt(d.ghost,e.clientX,e.clientY);
    // 重ねる相手は浮いたカードの位置で探す(指ではなく、見えているカードの真下)
    const tgt=fieldCardAt(e.clientX,e.clientY-LIFT_PX,d.ghost);
    if(tgt!==d.over){
      if(d.over)d.over.classList.remove("drop");
      if(tgt){ tgt.classList.add("drop"); say("離すと交代: OUT "+nm(tgt.dataset.id)+" → IN "+nm(id)); }
      d.over=tgt;
    }
  });
  const end=e=>{
    const d=BD.drag;
    if(!d||d.id!==id||d.pid!==e.pointerId)return;
    clearTimeout(d.timer);
    if(d.ghost)d.ghost.remove();
    el.classList.remove("lifted");
    document.getElementById("board").classList.remove("subbing");
    BD.drag=null;
    if(d.over){
      d.over.classList.remove("drop");
      if(e.type==="pointerup")askSub(d.over.dataset.id,id);
    }
    if(!d.moved&&!d.long&&e.type==="pointerup")say("長押しでカードの裏を見る ・ 盤面の選手に重ねると交代");
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}
/** 交代の確認。確認している間は試合を止める(→docs/07 §7.11) */
function askSub(outId,inId){
  const wasPlaying=G.playing;
  if(wasPlaying)setPlaying(false);
  BD.ask={ outId, inId, wasPlaying };
  document.getElementById("subAskText").innerHTML='<small>交代</small><b class="out">OUT '+nm(outId)+'</b><i>→</i><b class="in">IN '+nm(inId)+'</b>';
  document.getElementById("subAsk").classList.add("on");
}
function answerSub(yes){
  const a=BD.ask; BD.ask=null;
  document.getElementById("subAsk").classList.remove("on");
  if(!a)return;
  if(yes&&!G.M.over){
    orderMatch(G.M,"H",{ type:"sub", out:a.outId, in:a.inId });
    BD.pendingIn.add(a.inId);
    const b=[...document.querySelectorAll("#bench .cd")].find(x=>x.dataset.id===a.inId);
    if(b)b.classList.add("used");
    onSubQueued(a.inId,a.outId);
  }else say("交代をやめた");
  if(a.wasPlaying)setPlaying(true);
}

/* =========================================================================
   wcc_f — クラブハウス(試合の外の画面)。中身の計算は club.js / grow.js、ここは見せるだけ。
   流れ: チーム練習 → コミュニケーション(最大3回)→ 試合 → 結果を反映して保存 → …
   ========================================================================= */

/**
 * 監督室の状態(→docs/07 §7.9)
 *   tab  … 下のタブ(home / squad / cards / season / club)
 *   flow … 準備の手順を開いているか(null / "prep")。開いている間はタブを出さない
 *   msg=育成で起きたこと / comm=開いている場所 / pick=指名中の選手 / int=練習の強度(0 軽め / 1 普通 / 2 ハード)
 *   cf=コレクションの絞り込み / sel=選んだカード / sqSel=並べ替えで選んだ登録選手 / set=設定を開いている
 */
const CL={ alert:"", S:null, W:null, fx:null, store:null, armReset:false,
  tab:"home", flow:null,
  msg:[], comm:null, pick:[], int:1,
  cf:"ALL", sel:null, sqSel:null,
  set:false, setMsg:"", copyText:"" };          // set=設定・データを開いている(→settings.js)            // cf=コレクションの絞り込み / sel=選んだカード / sqSel=並べ替えで選んだ登録選手                // msg=育成で起きたこと / comm=開いている場所 / pick=指名中の選手

/** localStorage が使えない環境(プライベートブラウズなど)では、その場かぎりの入れ物で動かす */
function careerStore(){
  try{
    localStorage.setItem("wcc_f.probe","1"); localStorage.removeItem("wcc_f.probe");
    return localStorage;
  }catch(e){
    CL.alert="この端末では保存できません(プライベートブラウズなど)。閉じると進み具合が消えます";
    return memStore();
  }
}
function initCareer(seed){
  CL.store=careerStore();
  let S=loadCareer(CL.store);
  if(S&&S.fromPrev){
    // 最新のセーブが読めず、1つ前の世代から戻した。読めなかった方は退避しておく
    delete S.fromPrev; const raw=rawSave(CL.store); if(raw)backupSave(CL.store,raw);
    CL.alert="最新のセーブを読めなかったので、1試合前のセーブから戻しました(読めなかった方は退避してあります)";
  }
  if(!S){
    // 読めないセーブ(壊れた・新しい版で作られた)は上書きしない。退避してから新しく始める
    const raw=rawSave(CL.store);
    if(raw){
      if(backupSave(CL.store,raw))CL.alert="前のセーブを読めなかったので、消さずに退避しました。CLUB の「設定・データ」から書き出せます";
      else{ CL.store=memStore(); CL.alert="前のセーブを読めず、退避もできませんでした。前のセーブを守るため、この任期は保存しません"; }
    }
    S=newCareer(seed);
  }
  CL.S=S; CL.W=worldOf(S);
  persist(S);
  // iPhone はしばらく開かないとサイトのデータを消すことがある。消さないよう頼む(断られても動く)
  try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{}); }catch(e){}
  showClub();
}
/** 保存する。失敗したら秘書が知らせる */
function persist(S){
  const ok=saveCareer(CL.store,S||CL.S);
  if(!ok)CL.alert="保存できませんでした(空き容量やブラウザの設定を確認してください)。CLUB の「設定・データ」から書き出しておくと安全です";
  return ok;
}
function showClub(keepScroll){
  const el=document.getElementById("club"), old=el.querySelector(".cl-main"), y=old?old.scrollTop:0;
  CL.fx=nextFixture(CL.S,CL.W);
  el.innerHTML=clubHtml();
  el.classList.add("on");
  const main=el.querySelector(".cl-main");
  if(main)main.scrollTop=keepScroll?y:0;
  const pitch=document.getElementById("sqPitch");
  if(pitch)sqBind(pitch);
}
function hideClub(){ document.getElementById("club").classList.remove("on"); }

const clubName=id=>id==="me"?myTeam(CL.S).name:teamNameOf(TEAMS[id]);
const clubShort=id=>id==="me"?myTeam(CL.S).short:TEAMS[id].short;
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const gradeTag=g=>g==="-"?"":'<b class="gr gr'+g+'">'+g+'</b>';
const cname=id=>nameOf(CARDS[id]);
/** 国籍と動物(→docs/08 §8.6)。例: イタリア ・ 🦈鮫(海) */
const natTxt=c=>NAT_NAME[c.nat]||c.nat||"";
const aniTxt=c=>{ const a=ANIMALS[c.ani]; return a?ANI_ICON[c.ani]+a.name+"("+ANI_GROUP[a.g]+")":""; };
const BONUS_LABEL={ nat:"同じ国籍", club:"同じクラブ", ani:"同じ動物" };

/* ---- 育成の札 ---- */

/** 選手を指名するための札の並び。on = 選択中。info = 札の下段に出す情報。act = 押したときの動き */
function chipsHtml(ids,on,info,act){
  const S=CL.S;
  return '<div class="chips">'+ids.map(id=>{
    const c=CARDS[id];
    return '<button class="chipb '+c.pos.toLowerCase()+(on.includes(id)?' on':'')+'" data-act="'+(act||"pick")+'" data-id="'+id+'">'+
      '<i>'+c.no+'</i>'+nameOf(c)+(hasSign(S,id)?'<b class="sign">！</b>':'')+
      '<small>'+info(S.g.pl[id],id)+'</small></button>'; }).join("")+'</div>';
}
/**
 * コミュニケーションの相手を選ぶ盤面(本家と同じくフォーメーションのまま。→docs/08 §8.12)。
 * 先発は SQUAD の既定の位置、控えは下の列。駒には次の★までの進みなど(info)を添える
 */
function commBoardHtml(ids,on,info){
  const S=CL.S, xi=S.sq.slice(0,11), L=fillLayout(S);
  const tok=(id,st)=>{ const c=CARDS[id], g=S.g.pl[id];

/* ---- SQUAD: 既定の陣形(→docs/07 §7.10) ----
 * 縦のピッチ(自陣が下)に先発11人を置く。ここでの並びと KP が毎試合の初期配置になる。
 * ドラッグで動かす / 2枚タップで入れ替え(控えとも)/ 陣形の選択で一括で並べ直す */
const SQ_FORMS=Object.keys(FORMS);
/** 盤面の座標 h(0=自ゴール…1)・x(0…100) ⇔ ピッチ上の % */
const sqPos=(h,x)=>({ l:7+x*0.86, t:95-h*90 });
const sqInv=(l,t)=>({ x:(l-7)/0.86, h:(95-t)/90 });
const APT_MARK=a=>a>=TUNING.apt.own?"◎":a>=TUNING.apt.group?"○":a>=TUNING.apt.near?"△":"×";
/** 位置での役割と適性 */
function sqRole(id,i,h,x){
  const role=i===0?"GK":roleAt(h,x), a=aptOf(CARDS[id],role);
  return { role, a, cls:aptClass(a), mark:APT_MARK(a) };
}
function sqTokenHtml(id,i,on){
  const S=CL.S, c=CARDS[id], g=S.g.pl[id], col=cardColor(c);
  let pos="", rl=null;
  if(on){ const l=S.layout[id], p=sqPos(l[0],l[1]); rl=sqRole(id,i,l[0],l[1]);
    pos=' style="left:'+p.l.toFixed(2)+'%;top:'+p.t.toFixed(2)+'%;--cc:'+col+'"'; }
  else pos=' style="--cc:'+col+'"';
  const sign=g&&(g.q||g.sq||spReady(S,id));
  return '<div class="sqc '+c.pos.toLowerCase()+' r-'+(c.rar||"B")+(CL.sqSel===id?' sel':'')+(on?'':' bn')+(S.kp===id&&on?' kp':'')+
    (g&&g.fat>=TUNING.grow.int.tiredSign?' tired':'')+'" data-id="'+id+'" data-i="'+i+'"'+(on?'':' data-act="sqpick"')+pos+'>'+
    '<i class="no">'+c.no+'</i>'+
    (rl?'<b class="rl '+rl.cls+'">'+rl.role+'</b>':'<b class="rl">'+c.pos+'</b>')+
    '<span class="nm">'+nameOf(c)+'</span>'+
    (g?'<em class="mt m'+g.mot+'"></em>':'')+
    (g&&g.is?'<i class="gs'+(g.is>=5?' aw':'')+'">★'+g.is+'</i>':'')+
    (S.kp===id&&on?'<i class="kpb">KP</i>':'')+(sign?'<i class="sg">兆</i>':'')+'</div>';
}
/** 連携の線(薄線・太線・黄金線。黄金線の兆しは点線を重ねる) */
function sqLinksSvg(){
  const S=CL.S, on=S.sq.slice(0,11);
  let h='<svg class="sq-links" viewBox="0 0 100 100" preserveAspectRatio="none">';
  for(const k of Object.keys(S.g.links)){
    const l=S.g.links[k], p=k.split("|");
    if(l.lv<1||!on.includes(p[0])||!on.includes(p[1]))continue;
    const a=S.layout[p[0]], b=S.layout[p[1]], A=sqPos(a[0],a[1]), B=sqPos(b[0],b[1]);
    const ln=cls=>'<line class="'+cls+'" data-a="'+p[0]+'" data-b="'+p[1]+'" x1="'+A.l.toFixed(2)+'" y1="'+A.t.toFixed(2)+
      '" x2="'+B.l.toFixed(2)+'" y2="'+B.t.toFixed(2)+'" vector-effect="non-scaling-stroke"/>';
    h+=ln("lk l"+l.lv)+(l.gold&&l.lv===2?ln("lk omen"):"");
  }
  // 選んだ選手について、次の段が近い相手(線なし・薄線で、経験が soon を超えたもの)を細い点線で(→docs/05 §5.3 見える化)
  for(let i=0;i<on.length;i++)for(let j=i+1;j<on.length;j++){
    const a=on[i], b=on[j], l=linkOf(S,a,b);
    if(CL.sqSel!==a&&CL.sqSel!==b)continue;
    if(l.lv>=2||linkProgress(S,a,b)<TUNING.grow.soon)continue;
    const A=sqPos(S.layout[a][0],S.layout[a][1]), B=sqPos(S.layout[b][0],S.layout[b][1]);
    h+='<line class="lk soon" data-a="'+a+'" data-b="'+b+'" x1="'+A.l.toFixed(2)+'" y1="'+A.t.toFixed(2)+'" x2="'+B.l.toFixed(2)+
      '" y2="'+B.t.toFixed(2)+'" vector-effect="non-scaling-stroke"/>';
  }
  return h+'</svg>';
}

/** 選手を選ぶ。2人目で入れ替え(→pool.js moveSquad) */
function sqPick(id){
  const S=CL.S;
  if(!CL.sqSel)CL.sqSel=id;
  else if(CL.sqSel===id)CL.sqSel=null;
  else{
    const a=CL.sqSel;
    moveSquad(S,a,id);
    // KP が控えに下がったら、代わりに入った人が KP を引き継ぐ
    if(S.kp===a&&S.sq.indexOf(a)>=11)S.kp=id; else if(S.kp===id&&S.sq.indexOf(id)>=11)S.kp=a;
    fillLayout(S); CL.sqSel=null; persist(S);
  }
  showClub(true);
}
/** ピッチのカードをドラッグで動かす。動かさずに離したらタップ(選ぶ・入れ替え) */
function sqBind(pitch){
  let d=null;
  const at=e=>{ const r=pitch.getBoundingClientRect();
    const q=sqInv((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);
    return clampPos(d.i===0,q.h,q.x); };
  pitch.addEventListener("pointerdown",e=>{
    const el=e.target.closest(".sqc"); if(!el)return;
    d={ el, id:el.dataset.id, i:+el.dataset.i, x0:e.clientX, y0:e.clientY, moved:false, pid:e.pointerId };
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  });
  pitch.addEventListener("pointermove",e=>{
    if(!d||e.pointerId!==d.pid)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<7)return;
    d.moved=true; d.el.classList.add("drag");
    const q=at(e), p=sqPos(q.h,q.x); d.q=q;
    d.el.style.left=p.l+"%"; d.el.style.top=p.t+"%";
    const rl=sqRole(d.id,d.i,q.h,q.x), b=d.el.querySelector(".rl");
    b.className="rl "+rl.cls; b.textContent=rl.role;
    pitch.querySelectorAll('line[data-a="'+d.id+'"]').forEach(l=>{ l.setAttribute("x1",p.l); l.setAttribute("y1",p.t); });
    pitch.querySelectorAll('line[data-b="'+d.id+'"]').forEach(l=>{ l.setAttribute("x2",p.l); l.setAttribute("y2",p.t); });
  });
  const end=e=>{
    if(!d||e.pointerId!==d.pid)return;
    const dd=d; d=null;
    if(dd.moved&&dd.q){ CL.S.layout[dd.id]=[r2(dd.q.h),r2(dd.q.x)]; persist(CL.S); showClub(true); }
    else if(!dd.moved&&e.type==="pointerup")sqPick(dd.id);
  };
  pitch.addEventListener("pointerup",end);
  pitch.addEventListener("pointercancel",end);
}

const TABS=[["home","HOME","⌂"],["squad","SQUAD","◫"],["cards","CARDS","▤"],["season","SEASON","☰"],["club","CLUB","◎"]];

/** 秘書の一言。次に何をするとよいかを、状況から1つ選ぶ。言葉はいまの秘書の口調(→grow.js の secSay) */
function secLine(S){
  const fx=CL.fx, g=S.g, pl=Object.values(g.pl);
  if(CL.alert)return CL.alert;                 // 保存の異常は何より先に知らせる
  if(S.termOver)return secSay(S,"termOver");
  const sign=Object.keys(g.pl).filter(id=>hasSign(S,id)).length;
  const omen=pl.filter(p=>p.q||p.sq).length+Object.values(g.links).filter(l=>l.gold).length;
  // ケガをした先発がいれば、入れ替えかケアを勧める(→docs/08 §8.8)
  const hurt=S.sq.slice(0,11).filter(id=>g.pl[id]&&g.pl[id].mot===0);
  if(hurt.length&&g.step!=="ready")return secSay(S,"hurt",{ n:hurt.map(cname).join("・") });
  if(fx.kind==="friendly"&&omen)return secSay(S,"omen");
  if(g.step!=="train"&&commLeft(S))return secSay(S,"comm",{ n:commLeft(S) });
  if(teamFatigue(S)>=TUNING.grow.int.tiredSign)return secSay(S,"tired");
  if(sign)return secSay(S,"sign",{ n:sign });
  if(fx.ko&&/決勝/.test(fx.label))return secSay(S,"final",{ c:COMPS[fx.comp].name });
  if(S.played===0)return secSay(S,"welcome");
  return secSay(S,"next");
}
/** 次の試合の煽り(同じ試合なら毎回同じ文) */
function hypeOf(S,fx){
  const t=tierOf(fx.opp), me=S.grade+1;
  if(fx.kind==="friendly")return "腕試しの一戦。";
  if(fx.agg)return "第1試合の結果を背負って、勝負の第2戦。";
  if(/決勝/.test(fx.label))return "頂点まで、あと一つ。";
  if(fx.kind==="league"&&S.league.done===13)return "リーグ最終節。";
  if(t>=me+2)return "格上への挑戦。番狂わせを起こせ。";
  if(t<=me-1)return "取りこぼしは許されない。";
  return fx.kind==="cup"?"負ければ終わりの一戦。":"勝ち点3を積み上げる。";
}

  return '<nav class="tabbar">'+TABS.map(([k,l,ic])=>'<button class="'+(CL.tab===k?'on':'')+'" data-act="tab" data-v="'+k+'">'+
    '<i>'+ic+'</i><span>'+l+'</span>'+(k==="squad"&&sign?'<b class="dot"></b>':'')+'</button>').join("")+'</nav>';

function clubHtml(){
  if(CL.flow==="prep"&&!CL.S.termOver)return prepHtml();
  const body=CL.tab==="squad"?squadHtml():CL.tab==="cards"?collectionHtml():CL.tab==="season"?seasonHtml()
    :CL.tab==="club"?clubTabHtml():homeHtml();
  return '<div class="cl-main tab-'+CL.tab+'">'+body+'</div>'+tabbarHtml();
}

/** 試合を始める。配置は前の試合の最後のまま */
function startFixture(){
  skipComm(CL.S);                              // 残りのコミュニケーションは使わない
  CL.flow=null; CL.tab="home";
  const fx=CL.fx, m=fixtureMatch(CL.S,fx), comp=COMPS[fx.comp];
  CL.msg=[]; CL.comm=null; CL.pick=[];
  sceneMatchup(fx,()=>{
    sceneHide(); hideClub();
    newMatch(m.home,m.away,m.seed,m.opts,{ title:comp.name+(fx.label?" "+fx.label:""), career:true,
      starters:m.home.xi.map(x=>x.card.id) });
  });
}
/** 試合が終わったら呼ぶ。結果を反映して保存し、クラブハウスへ戻る */
function finishFixture(M){
  // 並びと KP は SQUAD で決めた既定のまま。試合中に動かしたぶんはその試合だけ(→docs/07 §7.10)
  const onPitch=M.home.players.map(p=>p.id);
  const played=[...new Set((G.meta.starters||[]).concat(onPitch))];
  const inj=M.events.filter(e=>e.type==="injury"&&e.side==="H").map(e=>e.by);
  applyResult(CL.S,CL.W,CL.fx,{ hg:M.home.score, ag:M.away.score, pso:M.pso, layout:null, kp:null, played, onPitch, inj,
    starters:G.meta.starters||[], subs:M.home.subs,
    kpCh:M.events.filter(e=>e.type==="kp"&&e.side==="H").length });
  persist(CL.S);
  const L=CL.S.last;
  // 結果 → ロッカールーム(大会の優勝なら撮影)→ カード(→docs/07 §7.12)
  sceneResult(M,L,RT=>{
    const done=()=>{ sceneHide(); showClub(); };
    const card=()=>{ if(L&&L.card)sceneCard(L.card,L.cardNew,done); else done(); };
    if(L&&L.lines.some(x=>/^🏆 /.test(x)))sceneTrophy(M,L,card); else sceneLocker(M,L,RT,card);
  });
}
function onClubClick(e){
  const b=e.target.closest("[data-act]");
  if(!b||b.disabled)return;
  const act=b.dataset.act, S=CL.S, save=()=>persist(S);
  if(act!=="reset")CL.armReset=false;
  if(onSettingsClick(act,b))return;
  if(act==="tab"){ CL.tab=b.dataset.v; CL.sel=null; CL.sqSel=null; CL.secOpen=false; showClub(); return; }
  if(act==="secpick"){ chooseSec(S,b.dataset.v); CL.secOpen=false; CL.msg=[secOf(S).name+"「"+SEC_LINES[secOf(S).id].hello+"」"]; save(); showClub(true); return; }
  if(act==="secopen"){ CL.secOpen=true; showClub(true); return; }
  if(act==="mab"){ if(!toggleMab(S,b.dataset.v))CL.msg=["監督能力は "+TUNING.mab.max+" つまで"]; save(); showClub(true); return; }
  if(act==="mabopen"){ CL.mabOpen=!CL.mabOpen; showClub(true); return; }
  if(act==="tset"){ setTitle(S,b.dataset.v||null); CL.msg=S.tset?["称号「"+titleOf(S.tset).name+"」をセットした("+TITLE_FX[S.tset].desc+")"]:[]; save(); showClub(true); return; }
  if(act==="license"){ const d=CL.draft||{}; if(registerManager(S,d.mname,d.birth)){ CL.draft=null; save(); } else CL.msg=["監督名を入れてください"]; showClub(true); return; }
  if(act==="ctown"||act==="ccolor"){ const c=CL.draft.c; if(act==="ctown")c.town=b.dataset.v; else{ c.color=b.dataset.v; c.emb=Object.assign({},c.emb,{ home:b.dataset.v }); } showClub(true); return; }   // 選んだ色はエンブレムの地の色にも(名前の色の言葉より優先)
  if(act==="emb"){ const c=CL.draft.c; c.emb=Object.assign({},c.emb,{ [b.dataset.k]:b.dataset.v }); showClub(true); return; }
  if(act==="embauto"){ const c=CL.draft.c; c.emb={}; showClub(true); return; }
  if(act==="contract"){ const c=CL.draft&&CL.draft.c;
    if(c&&signClub(S,{ name:c.name, short:c.short, town:c.town, color:c.color,
      emblem:Object.keys(c.emb).length?Object.assign(embDesign("azr",c.name,c.emb,c.color),{ text:undefined }):null })){ CL.draft=null; save(); }
    else CL.msg=["クラブ名を入れてください"]; showClub(true); return; }
  if(act==="stad"){ const r=answerStadium(S,b.dataset.v==="1"); if(r)CL.msg=[r.ok?"スタジアムを改修した: 「"+stadOf(S).name+"」(収容 "+(stadOf(S).cap/10000).toFixed(1)+"万人)":"改修を見送った"]; save(); showClub(true); return; }
  if(act==="spopen"){ CL.spOpen=true; showClub(true); return; }
  if(act==="spsign"||act==="spkeep"){ CL.spOpen=false; }
  if(act==="spsign"||act==="spkeep"){ if(signSponsor(S,+b.dataset.i,act==="spkeep"))CL.msg=[S.biz.sp.name+" と契約した(ユニフォームの胸に "+S.biz.sp.name+")"]; save(); showClub(true); return; }
  if(act==="fac"){ const k=b.dataset.v; if(buildFac(S,k))CL.msg=[FAC_INFO[k].name+" を Lv"+S.biz.fac[k]+" にした("+facEffTxt(k,S.biz.fac[k])+")"]; save(); showClub(true); return; }
  if(act==="secev"){ const r=answerSecEvent(S,+b.dataset.i); if(r){ CL.msg=[r.line].concat(r.up?[r.up]:[]); save(); } showClub(true); return; }
  if(act==="go"){ CL.flow="prep"; CL.comm=null; CL.pick=[]; showClub(); return; }
  if(act==="home"){ CL.flow=null; CL.tab="home"; showClub(); return; }
  if(act==="play")startFixture();
  else if(act==="decline"){ declineCup(S,CL.fx.comp); CL.msg=["棄権した。この枠はフレンドリーマッチになる"]; save(); showClub(true); }
  else if(act==="term"){ startNextTerm(S,CL.W); CL.msg=[]; save(); showClub(); }
  else if(act==="train"){
    const o=trainOptions(S)[+b.dataset.i];
    CL.msg=["練習: "+trainLabel(o)+"("+INT_LABEL[CL.int]+")"].concat(doTraining(S,+b.dataset.i,CL.int));
    CL.comm=null; CL.pick=[]; save(); showClub();
  }
  else if(act==="int"){ CL.int=+b.dataset.i; showClub(true); }
  else if(act==="rest"){ CL.msg=doRest(S); CL.comm=null; CL.pick=[]; CL.int=1; save(); showClub(); }
  else if(act==="cf"){ CL.cf=b.dataset.v; CL.sel=null; showClub(true); }
  else if(act==="cs"){ CL.cs=b.dataset.v; showClub(true); }
  else if(act==="card"){ CL.sel=CL.sel===b.dataset.id?null:b.dataset.id; showClub(true); }
  else if(act==="swap"&&CL.sel){
    const out=b.dataset.id, inn=CL.sel;
    if(swapSquad(S,out,inn)){ CL.msg=["登録: "+cname(out)+" → "+cname(inn)+"(次の試合から使える)"]; CL.sel=null; save(); }
    showClub(true);
  }
  else if(act==="sqpick")sqPick(b.dataset.id);
  else if(act==="sqform"){ setForm(S,b.dataset.v); CL.sqSel=null; save(); showClub(true); }
  else if(act==="sqkp"){ S.kp=b.dataset.id; save(); showClub(true); }
  else if(act==="comm"){ CL.comm=b.dataset.v; CL.pick=[]; showClub(true); }
  else if(act==="ind"&&CL.pick.length===1){
    const id=CL.pick[0], r=doIndTrain(S,id); CL.msg=CL.msg.concat(["個人練習"],r.lines,[reactOf(S,id,"ind",r.res===1?1:0)]);
    CL.pick=[]; save(); showClub(true);
  }
  else if(act==="talk"&&CL.pick.length===1){
    const id=CL.pick[0], r=doTalk(S,id); CL.msg=CL.msg.concat(["ケア"],r.lines,[reactOf(S,id,"talk",0)]);
    CL.pick=[]; save(); showClub(true);
  }
  else if(act==="pick"){
    const id=b.dataset.id, max=COMM_UI[CL.comm]?COMM_UI[CL.comm].n:1, i=CL.pick.indexOf(id);
    if(i>=0)CL.pick.splice(i,1); else{ if(CL.pick.length>=max)CL.pick.shift(); CL.pick.push(id); }
    showClub(true);
  }
  else if(act==="lounge"&&CL.pick.length===2){
    const r=doLounge(S,CL.pick[0],CL.pick[1],+b.dataset.i);
    CL.msg=CL.msg.concat(["ラウンジ: "+cname(CL.pick[0])+" と "+cname(CL.pick[1])],r.lines,r.res>=0?[reactOf(S,CL.pick[0],"lounge",r.res)]:[]);
    CL.pick=[]; save(); showClub(true);
  }
  else if(act==="meet"&&CL.pick.length===1){
    const r=doMeeting(S,CL.pick[0],+b.dataset.i);
    CL.msg=CL.msg.concat(["ミーティング: "+cname(CL.pick[0])],r.lines,r.res>=0?[reactOf(S,CL.pick[0],"meet",r.res)]:[]);
    CL.pick=[]; save(); showClub(true);
  }
  else if(act==="reset"){
    if(!CL.armReset){ CL.armReset=true; showClub(true); return; }
    CL.armReset=false; clearCareer(CL.store); CL.msg=[];
    CL.S=newCareer(Date.now()&0x7fffffff); CL.W=worldOf(CL.S);
    persist(CL.S); showClub();
  }
}

/* =========================================================================
   wcc_f — 設定とデータ(→docs/01 §1.4・§1.5)
   ・実名パック: JSON ファイルを選んで読み込む。**その端末の中だけ**に保存し、表示名を差し替える
     (本体には実名を入れない。fetch で取りに行かない)
   ・セーブの書き出し / 読み込み: 機種変更やブラウザのデータ消去に備える
   ========================================================================= */

const PACK_KEY="wcc_f.pack.v1";
/** テーマ(→docs/07 §7.8)。色は theme.css のトークンで決まる。ここは名前と体のクラスだけ */
const THEMES={ wr:"ホワイト × レッド", navy:"ネイビー × ゴールド" };
const THEME_KEY="wcc_f.theme";
function applyTheme(id){
  if(!THEMES[id])id="wr";
  Object.keys(THEMES).forEach(k=>document.body.classList.toggle("th-"+k,k===id));
  try{ localStorage.setItem(THEME_KEY,id); }catch(e){}
  return id;
}
function storedTheme(){ try{ return localStorage.getItem(THEME_KEY)||"wr"; }catch(e){ return "wr"; } }

/** 実名パックの形を確かめる。{ names:{カードid:名前}, teams:{クラブid:{name}} } */
function checkPack(d){
  if(!d||typeof d!=="object"||typeof d.names!=="object"||typeof d.teams!=="object")return "形が違う(names と teams が要る)";
  const n=Object.keys(d.names).filter(id=>CARDS[id]&&typeof d.names[id]==="string").length;
  if(!n)return "このゲームのカードに当てはまる名前が1つも無い";
  return null;
}
/** パックを PACK に流し込む(前のパックの名前は消す) */
function applyPack(d){
  for(const k of Object.keys(PACK.names))delete PACK.names[k];
  for(const k of Object.keys(PACK.teams))delete PACK.teams[k];
  if(!d)return 0;
  let n=0;
  for(const id in d.names)if(CARDS[id]&&typeof d.names[id]==="string"){ PACK.names[id]=d.names[id]; n++; }
  for(const id in d.teams)if(TEAMS[id]&&d.teams[id]&&typeof d.teams[id].name==="string")PACK.teams[id]={ name:d.teams[id].name };
  return n;
}
/** 起動時: 端末に保存したパックがあれば流し込む */
function loadStoredPack(){
  try{
    const t=localStorage.getItem(PACK_KEY);
    if(!t)return 0;
    const d=JSON.parse(t);
    return checkPack(d)?0:applyPack(d);
  }catch(e){ return 0; }
}
const packActive=()=>Object.keys(PACK.names).length>0;

/** ファイルを文字列で読む(file:// でも動く。fetch は使わない) */
function readFileText(file){
  return new Promise((ok,ng)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>ng(r.error); r.readAsText(file); });
}
/** 文字列をファイルとして保存させる。保存できない端末(古い iOS など)では、画面に出してコピーしてもらう */
function saveText(name,text){
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{ type:"application/json" }));
    a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return true;
  }catch(e){ return false; }
}

/* ---- 画面(クラブハウスの下の「設定・データ」) ---- */

    '<p class="dim">第'+S.term+'任期 '+S.played+'試合目 ・ カード '+Object.keys(S.coll).length+'種 ・ '+kb+' KB。'+
      'ブラウザのデータを消すとセーブも消える。機種変更の前は書き出しておく</p>'+
    '<button class="btn btn-sub" data-act="export">セーブを書き出す(ファイル)</button>'+
    '<button class="btn btn-sub" data-act="copy">セーブをコピーする(テキスト)</button>'+
    '<label class="btn btn-sub file">セーブを読み込む(ファイル)<input type="file" accept=".json,application/json,text/plain" data-file="save"></label>'+
    (CL.setMsg?'<p class="hint">'+CL.setMsg+'</p>':'')+
    (CL.copyText?'<textarea class="cp" readonly>'+CL.copyText.replace(/</g,"&lt;")+'</textarea>':'')+
    (rawBad()?'<h4>退避したセーブ</h4><p class="dim">読めなかった前のセーブを、消さずに取ってある。書き出して保管するか、要らなければ消す</p>'+
      '<button class="btn btn-sub" data-act="exbad">退避したセーブを書き出す</button>'+
      '<button class="btn btn-sub" data-act="rmbad">退避したセーブを消す</button>':'')+
    '<h4>最初から</h4>'+

}
function rawBad(){ try{ return CL.store.getItem(SAVE_BAD_KEY); }catch(e){ return null; } }
function settingsMsg(t){ CL.setMsg=t; showClub(true); }
function onSettingsClick(act,b){
  const S=CL.S;
  if(act==="theme"){ applyTheme(b.dataset.v); showClub(true); return true; }
  if(act==="exbad"){
    settingsMsg(saveText("wcc_f-save-unreadable.json",rawBad()||"")?"書き出した: wcc_f-save-unreadable.json":"この端末ではファイルにできなかった");
    return true;
  }
  if(act==="rmbad"){ try{ [SAVE_BAD_KEY,SAVE_BAD_KEY+".1",SAVE_BAD_KEY+".2"].forEach(k=>CL.store.removeItem(k)); }catch(e){} settingsMsg("退避したセーブを消した"); return true; }
  if(act==="set"){ CL.alert=""; CL.set=!CL.set; CL.setMsg=""; CL.copyText=""; showClub(true); return true; }
  if(act==="unpack"){
    try{ localStorage.removeItem(PACK_KEY); }catch(e){}
    applyPack(null); settingsMsg("パックを外した(偽名に戻した)"); return true;
  }
  if(act==="export"){
    const name="wcc_f-save-t"+S.term+"-"+S.played+".json";
    settingsMsg(saveText(name,JSON.stringify(S))?"書き出した: "+name:"この端末ではファイルにできなかった。「コピーする」を使う");
    return true;
  }
  if(act==="copy"){
    const t=JSON.stringify(S);
    CL.copyText=t;
    settingsMsg("下の欄の文字がセーブ。メモ帳などに貼って保存する");   // 先に欄を出す(許可待ちで止まらない)
    try{ navigator.clipboard.writeText(t).then(()=>settingsMsg("コピーした。メモ帳などに貼って保存する"),
      ()=>settingsMsg("下の欄を長押しして全部選び、コピーする")); }
    catch(e){ settingsMsg("下の欄を長押しして全部選び、コピーする"); }
    return true;
  }
  return false;
}
/** ファイルが選ばれたとき(パック / セーブ) */
async function onSettingsFile(input){
  const f=input.files&&input.files[0], kind=input.dataset.file;
  if(!f)return;
  let text="";
  try{ text=await readFileText(f); }catch(e){ settingsMsg("ファイルを読めなかった"); return; }
  if(kind==="pack"){
    let d=null; try{ d=JSON.parse(text); }catch(e){}
    const bad=checkPack(d);
    if(bad){ settingsMsg("パックを読み込めなかった: "+bad); return; }
    try{ localStorage.setItem(PACK_KEY,JSON.stringify(d)); }catch(e){}
    settingsMsg("パックを読み込んだ("+applyPack(d)+"人を実名で表示)");
  }else{
    const box={ v:text, getItem(){ return this.v; }, setItem(){}, removeItem(){} };
    const L=loadCareer(box);
    if(!L){ settingsMsg("セーブを読み込めなかった(形が違うか、壊れている)"); return; }
    CL.S=L; CL.W=worldOf(L); CL.msg=[]; CL.sel=null;
    persist(L);
    settingsMsg("セーブを読み込んだ(第"+L.term+"任期 "+L.played+"試合目)");
  }
}

/* =========================================================================
   wcc_f — 音(→docs/07 §7.5)。**音声ファイルを持たず、Web Audio でその場で合成する**
   (単一ファイル・オフラインのまま)。スマホは最初のタップまで鳴らせないので、タイトルで unlock する。
   ========================================================================= */

const SND={ ctx:null, master:null, crowd:null, crowdGain:null, on:true, crowdLv:0, noise:null };
const SND_KEY="wcc_f.sound";
try{ SND.on=localStorage.getItem(SND_KEY)!=="off"; }catch(e){}

/** 最初のタップで呼ぶ。以降、音が鳴らせるようになる */
function sndUnlock(){
  if(SND.ctx){ if(SND.ctx.state!=="running"&&!SND.hidden)SND.ctx.resume().catch(()=>{}); return; }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  SND.ctx=new AC();
  SND.master=SND.ctx.createGain(); SND.master.gain.value=SND.on?0.9:0;
  SND.master.connect(SND.ctx.destination);
  // 2秒ぶんの雑音(歓声・笛の息・めくる音の素)
  const n=SND.ctx.sampleRate*2, buf=SND.ctx.createBuffer(1,n,SND.ctx.sampleRate), d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<n;i++){                       // ピンクノイズ寄り(耳に痛くない)
    const w=Math.random()*2-1;
    b0=0.997*b0+w*0.029; b1=0.985*b1+w*0.032; b2=0.95*b2+w*0.048;
    d[i]=(b0+b1+b2+w*0.02)*0.9;
  }
  SND.noise=buf;
}
/** 裏に回ったら止める(電池と、iPhone の割り込みのあとに戻すため) */
function sndSuspend(hidden){
  SND.hidden=hidden;
  if(!SND.ctx)return;
  try{ if(hidden)SND.ctx.suspend().catch(()=>{}); else if(SND.ctx.state!=="running")SND.ctx.resume().catch(()=>{}); }catch(e){}
}
function sndSetOn(v){
  SND.on=v;
  try{ localStorage.setItem(SND_KEY,v?"on":"off"); }catch(e){}
  if(SND.master)SND.master.gain.value=v?0.9:0;
}
const sndOk=()=>SND.ctx&&SND.on;
const now=()=>SND.ctx.currentTime;

function env(g,t,a,peak,hold,rel){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.setValueAtTime(peak,t+a+hold);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel);
}
function tone(type,freq,t,dur,peak,to){
  const o=SND.ctx.createOscillator(), g=SND.ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  env(g,t,0.008,peak,dur*0.4,dur*0.6);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t+dur+0.05);
}
function noiseBurst(t,dur,peak,filt,f0,f1,q){
  const s=SND.ctx.createBufferSource(), f=SND.ctx.createBiquadFilter(), g=SND.ctx.createGain();
  s.buffer=SND.noise; s.loop=true;
  f.type=filt; f.Q.value=q||0.8; f.frequency.setValueAtTime(f0,t);
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,Math.min(0.3,dur*0.25),peak,dur*0.3,dur*0.45);
  s.connect(f); f.connect(g); g.connect(SND.master);
  s.start(t,Math.random()); s.stop(t+dur+0.1);
}

/** 笛。n 回(試合開始 1 / 前半終了 2 / 試合終了 3)。long で長く */
function sndWhistle(n,long){
  if(!sndOk())return;
  let t=now()+0.02;
  for(let i=0;i<(n||1);i++){
    const dur=long||i===n-1?0.55:0.22;
    for(const f of [2950,3120]){
      const o=SND.ctx.createOscillator(), g=SND.ctx.createGain(), lfo=SND.ctx.createOscillator(), lg=SND.ctx.createGain();
      o.type="sine"; o.frequency.value=f;
      lfo.frequency.value=28; lg.gain.value=60; lfo.connect(lg); lg.connect(o.frequency);   // 笛の玉が震える
      env(g,t,0.015,0.10,dur,0.06);
      o.connect(g); g.connect(SND.master); o.start(t); lfo.start(t); o.stop(t+dur+0.1); lfo.stop(t+dur+0.1);
    }
    noiseBurst(t,dur,0.05,"bandpass",3000,null,4);                                          // 息
    t+=dur+0.12;
  }
}
/** ボタン。kind: tap(軽い)/ ok(決定)/ ng(取り消し) */
function sndUi(kind){
  if(!sndOk())return;
  const t=now();
  if(kind==="ok"){ tone("triangle",880,t,0.08,0.18); tone("triangle",1320,t+0.07,0.12,0.18); }
  else if(kind==="ng")tone("square",300,t,0.12,0.06,180);
  else tone("square",1400,t,0.035,0.05);
}
/** 歓声の地の音。lv 0〜1 で大きさ(攻め込むと上がる) */
function sndCrowd(on){
  if(!SND.ctx)return;
  if(on&&!SND.crowd){
    const s=SND.ctx.createBufferSource(), f=SND.ctx.createBiquadFilter(), g=SND.ctx.createGain();
    s.buffer=SND.noise; s.loop=true; f.type="bandpass"; f.frequency.value=700; f.Q.value=0.5;
    g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(0.06,now()+1.2);
    s.connect(f); f.connect(g); g.connect(SND.master); s.start();
    SND.crowd=s; SND.crowdGain=g; SND.crowdLv=0;
  }else if(!on&&SND.crowd){
    const s=SND.crowd, g=SND.crowdGain;
    g.gain.cancelScheduledValues(now()); g.gain.setTargetAtTime(0.0001,now(),0.4);
    setTimeout(()=>{ try{ s.stop(); }catch(e){} },1500);
    SND.crowd=null; SND.crowdGain=null;
  }
}
function sndCrowdLevel(lv){
  if(!SND.crowdGain)return;
  lv=Math.max(0,Math.min(1,lv));
  if(Math.abs(lv-SND.crowdLv)<0.05)return;
  SND.crowdLv=lv;
  SND.crowdGain.gain.setTargetAtTime(0.05+lv*0.09,now(),0.5);
}
/** ゴールの歓声(どっと沸いて、長く残る) */
function sndGoal(mine){
  if(!sndOk())return;
  const t=now();
  noiseBurst(t,2.8,mine?0.55:0.35,"bandpass",450,1300,0.6);
  noiseBurst(t+0.05,2.2,mine?0.3:0.2,"highpass",1800,3000,0.5);
  if(mine){ [523,659,784,1047].forEach((f,i)=>tone("triangle",f,t+0.15+i*0.09,0.28,0.12)); }
}
/** 惜しい(枠外・セーブ)。ため息 */
function sndAww(){
  if(!sndOk())return;
  noiseBurst(now(),1.1,0.18,"lowpass",1400,400,0.7);
}
/** ボールを蹴る音(シュート) */
function sndKick(){
  if(!sndOk())return;
  const t=now();

/** カードをめくる */
function sndFlip(){

/** キラキラ(キラ・レジェンドのカード、覚醒) */
function sndShimmer(big){
  if(!sndOk())return;
  const t=now(), base=big?[1568,1976,2349,2637,3136,3951]:[1318,1760,2093,2637];

/** ファンファーレ(勝利・レジェンド・称号) */
function sndFanfare(){

  [[523,0],[659,0.12],[784,0.24],[1047,0.36]].forEach(([f,d])=>tone("triangle",f,t+d,0.22,0.16));

/* =========================================================================
   wcc_f — 場面(→docs/07 §7.2)。全画面の場面を順に進む。
     タイトル → (監督室) → 対戦カード → 試合 → 結果 → ロッカールーム(優勝なら撮影) → カード排出 → 監督室
   場面は #scene に描く。進むときは帯が横切る。押せば必ず音が返る。
   ========================================================================= */

const SC={ el:null, timer:0, next:null, busy:false };

function sceneInit(){
  SC.el=document.getElementById("scene");
  SC.el.addEventListener("click",e=>{
    const b=e.target.closest("[data-sc]");
    if(b){ e.stopPropagation(); sceneAct(b.dataset.sc,b); return; }
    if(SC.next&&!SC.busy){ sndUi("tap"); const f=SC.next; SC.next=null; clearTimeout(SC.timer); f(); }
  });
}
/** 場面を出す。tapNext=画面のどこを押しても次へ / auto=自動で次へ(ミリ秒) */
function sceneShow(cls,html,opt){
  opt=opt||{};
  clearTimeout(SC.timer);
  SC.el.className="on "+cls;
  SC.el.innerHTML='<div class="wipe"></div><div class="dots"></div><div class="slab s1"></div><div class="slab s2"></div>'+html;
  SC.next=opt.next||null;
  SC.busy=!!opt.lock;
  if(opt.lock)setTimeout(()=>{ SC.busy=false; },opt.lock);
  if(opt.auto&&opt.next)SC.timer=setTimeout(()=>{ if(SC.next){ const f=SC.next; SC.next=null; f(); } },opt.auto);
}
function sceneHide(){ clearTimeout(SC.timer); SC.next=null; SC.el.className=""; SC.el.innerHTML=""; }

/* ---- 結果(→docs/07 §7.12): スコア・得点者・チームの数字・採点・MVP ---- */
function goalsOf(M,side){

}
const POS_ORD={ GK:0, DF:1, MF:2, FW:3 };
/** 採点の色: 7.5 以上は金、5.5 以下は青 */
const rateCls=r=>r>=7.5?"hi":r<=5.5?"lo":"";
const rateTxt=r=>r.toFixed(1);
const resOf=M=>{ const d=M.pso?M.pso[0]-M.pso[1]:M.home.score-M.away.score; return d>0?"WIN":d<0?"LOSE":"DRAW"; };
function sceneResult(M,last,go){
  const H=M.home, A=M.away, pso=M.pso, res=resOf(M), RT=matchRatings(M), ST=matchStats(M);

  const mine=RT.list.filter(x=>x.side==="H").sort((x,y)=>POS_ORD[CARDS[x.id].pos]-POS_ORD[CARDS[y.id].pos]||y.r-x.r);
  const rtHtml='<div class="res-rt">'+mine.map(x=>{ const c=CARDS[x.id];
    return '<span class="'+(x.id===RT.mvp?'mvp':'')+'"><i class="pos '+c.pos.toLowerCase()+'">'+c.pos+'</i><b>'+nameOf(c)+
      (x.g?'<u>'+"⚽".repeat(Math.min(3,x.g))+'</u>':'')+'</b><em class="'+rateCls(x.r)+'">'+rateTxt(x.r)+'</em></span>'; }).join("")+'</div>';
  sceneShow("sc-res r-"+res.toLowerCase(),
    '<div class="res-word">'+res+'</div>'+

      '<div class="rs">'+emblemSvg(H,40)+'<b>'+H.short+'</b></div>'+

    '<div class="touch sm">TOUCH</div>',

    const tick=()=>{ el.textContent=i; if(i<v){ i++; setTimeout(tick,260); } };

/* ---- ロッカールーム(→docs/07 §7.12・docs/08 §8.11): 秘書のまとめ + 目立った選手1〜2人の一言 + 成長 ---- */
const LOCKER_VOICE={
  awake: ["体の奥から力が湧いてくる……これが本当の自分です！","監督、見ていてくれましたか。何かが目覚めました！"],
  star5: ["自分のプレーの型が、ついに完成しました。","もう迷いはありません。この形で戦います。"],
  gold:  ["あいつとは目を合わせるだけで分かるんです。","最高のコンビになれました！"],
  q:     ["何かが変わりそうな予感がします。次のフレンドリーマッチで試させてください。","体が軽いんです。何かが起きそうです。"],
  star:  ["練習の成果が出てきました！","少しずつ上手くなっているのが分かります。"],
  link:  ["あいつとの呼吸が合ってきました。","だんだん息が合ってきた気がします。"],
  mvpW:  ["今日は最高の気分です！","チームのみんなのおかげです。"],
  mvpL:  ["……いい出来でも、勝てなきゃ意味がない。","次は必ず勝ちます。"],
  mvpD:  ["勝ちきれなかったのが悔しいです。","次こそ決めます。"]
};
const NEWS_ORD=["awake","star5","gold","q","star","link"];
/** 話す選手(最大2人)。知らせの重い順。足りなければ自チームでいちばん採点が高い選手 */
function lockerSpeakers(last,RT){
  const S=CL.S, out=[], seen=new Set();
  const news=(last&&last.news||[]).slice().sort((a,b)=>NEWS_ORD.indexOf(a.kind)-NEWS_ORD.indexOf(b.kind));
  for(const n of news){
    const id=n.ids.find(x=>!seen.has(x)&&S.g.pl[x]);
    if(!id)continue;
    seen.add(id); out.push({ id, kind:n.kind, line:n.line });
    if(out.length>=2)return out;
  }
  if(RT){
    const best=RT.list.filter(x=>x.side==="H"&&!seen.has(x.id)&&CARDS[x.id]).sort((a,b)=>b.r-a.r)[0];
    if(best)out.push({ id:best.id, kind:"mvp", r:best.r });
  }
  return out;
}
function lockerSay(sp,res){
  const k=sp.kind==="mvp"?(res==="WIN"?"mvpW":res==="LOSE"?"mvpL":"mvpD"):sp.kind;
  const list=LOCKER_VOICE[k]||LOCKER_VOICE.mvpD, S=CL.S;
  return list[hashStr("lk:"+S.term+":"+S.played+":"+sp.id)%list.length];
}
function sceneLocker(M,last,RT,go){
  const H=M.home, A=M.away, pso=M.pso, res=resOf(M);
  const gl0=last&&last.gl||[], gset=new Set(gl0);
  const rl=(last&&last.lines||[]).filter(x=>!/^カード:/.test(x)&&!gset.has(x));
  const sps=lockerSpeakers(last,RT), said=new Set(sps.map(sp=>sp.line));
  const gl=gl0.filter(x=>!said.has(x));                // 吹き出しで話した知らせは繰り返さない
  sceneShow("sc-lock",
    '<div class="lk-head"><b>LOCKER ROOM</b><small>'+H.short+' '+H.score+' - '+A.score+' '+A.short+(pso?' (PK '+pso[0]+'-'+pso[1]+')':'')+'</small></div>'+
    '<div class="lk-sec"><i class="sec-ic">SEC</i><div><b class="sec-nm">'+secOf(CL.S).name+'</b><p>'+secSay(CL.S,res.toLowerCase())+'</p>'+
      (rl.length?'<ul>'+rl.map(x=>'<li>'+x+'</li>').join("")+'</ul>':'')+'</div></div>'+
    sps.map((sp,i)=>'<div class="lk-pl" style="animation-delay:'+(0.4+i*0.45)+'s">'+
      '<div class="lk-card">'+cardHtml(sp.id,"s")+'</div>'+
      '<div class="lk-say"><b>'+nameOf(CARDS[sp.id])+'</b><p>「'+lockerSay(sp,res)+'」</p>'+
        (sp.line?'<em class="hi">'+sp.line+'</em>':sp.r!=null?'<em>採点 '+rateTxt(sp.r)+'</em>':'')+'</div></div>').join("")+
    (gl.length?'<ul class="lk-grow">'+gl.map((x,i)=>'<li style="animation-delay:'+(1.2+i*0.12)+'s"'+
      (/覚醒|黄金|★5/.test(x)?' class="hi"':'')+'>'+x+'</li>').join("")+'</ul>':'')+
    '<div class="touch sm">TOUCH</div>',
    { next:go, lock:900 });
  setTimeout(()=>sndUi("ok"),200);
  if(gl0.some(x=>/覚醒|黄金|★5/.test(x)))setTimeout(()=>sndShimmer(true),900);
}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="wcc_f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>wcc_f</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="mu"><small id="hudComp"></small></div>
    <div class="sb"><i id="hudHc" class="em"></i><b id="hudH" class="tn">HOME</b><span id="hudScore">0 - 0</span><b id="hudA" class="tn">AWAY</b><i id="hudAc" class="em"></i></div>
    <div class="clk"><span id="hudClock">0'</span><button id="btnSpeed" class="btn spd">×1</button></div>
  </header>
  <div id="viewWrap"><canvas id="view"></canvas><div id="flash"></div><div id="cap"></div><button id="replay" class="replay"><b>REPLAY</b><small>タッチでスキップ ▶▶</small></button>
  </div>
  <div id="stylebar"><span id="styH"></span><span id="styA"></span></div>
  <div id="ticker">&nbsp;</div>
  <div id="deck">
    <div id="insTags"><i data-k="kp"></i><i data-k="center">中央突破</i><i data-k="counter">カウンター</i><i data-k="side"></i><i data-k="press">プレッシング</i><i data-k="keeper">GKハイポジション</i><i data-k="shoot">シュートを狙え！</i></div>
    <div id="board"><div id="boardLines"></div><div id="paOwn" class="pa"></div><div id="paOpp" class="pa"></div><svg id="links"></svg><div id="cards"></div></div>
    <div id="bench"></div>
    <div id="info"><div id="infoBody"></div>
      <div class="row"><button id="infoKp" class="btn"></button><button id="infoClose" class="btn xb" aria-label="閉じる">×</button></div>
    </div>
    <div id="subAsk"><p id="subAskText"></p>
      <div class="row"><button id="subYes" class="btn btn-main">交代する</button><button id="subNo" class="btn">やめる</button></div>
    </div>
  </div>
  <div id="pad">
    <div class="cross">
      <button id="btnCenter" class="btn tac up">中央<br>突破</button>
      <button id="btnLeft" class="btn tac lf">左サイド</button>
      <button id="btnPress" class="btn tac md">プレス</button>
      <button id="btnRight" class="btn tac rt">右サイド</button>
      <button id="btnCounter" class="btn tac dn">カウン<br>ター</button>
    </div>
    <div class="mid">
      <button id="btnKp" class="btn btn-kp">KP</button>
      <span id="subInfo">交代 0/3</span>
    </div>
    <div class="act">
      <button id="btnShoot" class="btn btn-shoot">SHOOT</button>
      <button id="btnKeeper" class="btn btn-keeper">KEEPER</button>
    </div>
  </div>
  <div id="club"></div>
  <div id="scene"></div>
</div>
<script>
// 起動の確認(tools/publish.py が見る): 起動中のエラーを html の data-boot に残す
window.addEventListener("error",e=>{ document.documentElement.dataset.boot="err: "+(e.message||"?"); });
</script>
<script>
/*__JS__*/
</script>
</body>
</html>
